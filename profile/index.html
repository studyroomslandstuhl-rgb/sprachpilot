<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SprachPilot – Profil</title>
<link rel="stylesheet" href="../style.css">
<style>html:not([data-sp-profile-auth="ok"]){visibility:hidden!important}</style>
</head>
<body>
<div class="container">
<section class="hero">
  <a href="/index.html" style="text-decoration:none;color:inherit">
    <div class="logo-wrap"><img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo"></div>
    <h1>SprachPilot</h1>
  </a>
  <p class="subtitle">Profil bearbeiten</p>
</section>

<section class="card">
  <h2>Meine Daten</h2>
  <p class="small">Vorname, Nachname und Muttersprache kannst du ändern. E-Mail und Kurs gehören zu deiner sicheren Anmeldung und sind hier nicht änderbar.</p>

  <div class="two">
    <div><label>Vorname *</label><input id="fname"></div>
    <div><label>Nachname *</label><input id="lname"></div>
  </div>

  <label>E-Mail</label>
  <input id="email" type="email" disabled>

  <label>Muttersprache *</label>
  <select id="motherLanguage">
        <option value="">Bitte auswählen</option>
        <option>Albanisch</option><option>Amharisch</option><option>Arabisch</option><option>Armenisch</option><option>Aserbaidschanisch</option><option>Bengalisch</option><option>Bosnisch</option><option>Bulgarisch</option><option>Chinesisch</option><option>Dari</option><option>Deutsch</option><option>Englisch</option><option>Farsi/Persisch</option><option>Französisch</option><option>Georgisch</option><option>Griechisch</option><option>Hindi</option><option>Italienisch</option><option>Japanisch</option><option>Kasachisch</option><option>Kroatisch</option><option>Kurdisch</option><option>Paschtu</option><option>Polnisch</option><option>Portugiesisch</option><option>Rumänisch</option><option>Russisch</option><option>Serbisch</option><option>Somali</option><option>Spanisch</option><option>Tamil</option><option>Thai</option><option>Tigrinya</option><option>Tschechisch</option><option>Türkisch</option><option>Ukrainisch</option><option>Ungarisch</option><option>Urdu</option><option>Usbekisch</option><option>Vietnamesisch</option>
      </select>

  <label>Kurscode</label>
  <input id="course" disabled>

  <button class="success" onclick="saveProfile()">Speichern</button>
  <a class="btn secondary" href="/student-dashboard/">Zum Dashboard</a>
  <a class="btn secondary" href="../">Zur Startseite</a>
  <div id="result"></div>
</section>

<footer>© SprachPilot</footer>
</div>

<script type="module">
import '/js/session-restore.js?v=4';
import { db, doc, setDoc, serverTimestamp } from '/js/firebase.js';
import { verifySecureAccess } from '/js/secure-access-gate.js?v=1';
import { normalizeStudentIdentity } from '/js/student-identity.js?v=identity5';

const $=id=>document.getElementById(id);
const safeText=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const access=await verifySecureAccess({allowTeacher:false,redirect:true,mark:false});
if(!access?.ok||access.type!=='student')throw new Error('SECURE_STUDENT_PROFILE_ACCESS_REQUIRED');

let p=await normalizeStudentIdentity(access.profile,{silent:true})||access.profile;
if(String(p?.authUid||'')!==String(access.uid||''))throw new Error('PROFILE_UID_MISMATCH');

function canonicalId(profile={}){return String(profile.canonicalStudentId||profile.docId||profile.studentId||profile.userId||'').trim()}
function fill(profile){
  if(!profile)return;
  $('fname').value=profile.vorname||profile.firstName||'';
  $('lname').value=profile.nachname||profile.lastName||'';
  $('email').value=profile.authEmail||profile.email||'';
  $('motherLanguage').value=profile.muttersprache||profile.motherLanguage||'';
  $('course').value=profile.kurs||profile.courseCode||profile.kursnummer||'';
}
function persist(profile){
  const json=JSON.stringify(profile);
  localStorage.setItem('SP_USER_PROFILE',json);
  localStorage.setItem('SP_STUDENT_PROFILE',json);
}
fill(p);
document.documentElement.dataset.spProfileAuth='ok';

window.saveProfile=async function(){
  const result=$('result'),vorname=$('fname').value.trim(),nachname=$('lname').value.trim(),muttersprache=$('motherLanguage').value;
  if(!vorname||!nachname||!muttersprache){result.innerHTML='<div class="no">Bitte Vorname, Nachname und Muttersprache ausfüllen.</div>';return}
  result.innerHTML='<div class="ok">Profil wird gespeichert...</div>';
  try{
    const id=canonicalId(p);if(!id)throw new Error('STUDENT_ID_MISSING');
    if(String(p.authUid||'')!==String(access.uid||''))throw new Error('STUDENT_UID_MISMATCH');
    await setDoc(doc(db,'students',id),{vorname,nachname,muttersprache,updatedAt:serverTimestamp()},{merge:true});
    p={...p,vorname,nachname,muttersprache};persist(p);
    result.innerHTML='<div class="ok">Gespeichert.</div>';
  }catch(err){
    console.error(err);
    result.innerHTML='<div class="no">Profil konnte nicht gespeichert werden: '+safeText(err.message||err)+'</div>';
  }
}
</script>
<script src="/shared/sprachpilot-design-system.js"></script>
</body>
</html>
