<!DOCTYPE html>

<body>
<div class="shell">
<header class="topbar" id="topbar"></header>
<div class="dativ-download-bar"><button type="button" class="btn secondary" id="dativPdfDownload">PDF · Verben herunterladen</button></div>
<main id="app"><section class="card">Dativverben werden geladen …</section></main>
<footer>© SprachPilot</footer>
</div>
<script>
(()=>{
  try{
    const role=String(localStorage.getItem('SP_LOGIN_ROLE')||localStorage.getItem('SP_ACTIVE_ROLE')||'').toLowerCase();
    if(['teacher','lehrer','admin','owner'].includes(role)){
      let preview={};
      try{preview=JSON.parse(sessionStorage.getItem('SP_TEACHER_PREVIEW')||'{}')||{}}catch{}
      if(preview.teacherPreview!==true||preview.allAccess!==true){
        sessionStorage.setItem('SP_TEACHER_PREVIEW',JSON.stringify({...preview,teacherPreview:true,allAccess:true,courseCode:'ALLE',kurs:'ALLE'}));
      }
    }
  }catch(error){console.warn('Lehrer-Vorschau konnte nicht vorbereitet werden',error)}
})();
</script>
<script type="module" src="/js/account-progress-autostart.js?v=4"></script>
<script type="module" src="/js/progress.js?v=points-preserve3"></script>
<script type="module" src="app.js?v=3"></script>
<script type="module" src="access.js?v=2"></script>
<script type="module" src="pdf-download.js?v=1"></script>

</body>
</html>
