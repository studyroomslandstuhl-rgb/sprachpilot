<script>
(()=>{
  try{
    const role=String(localStorage.getItem('SP_LOGIN_ROLE')||localStorage.getItem('SP_ACTIVE_ROLE')||'').toLowerCase();
    if(['teacher','lehrer','admin','owner'].includes(role)){
      let preview={};
      try{preview=JSON.parse(sessionStorage.getItem('SP_TEACHER_PREVIEW')||'{}')||{}}catch{}
      if(preview.teacherPreview!==true||preview.allAccess!==true)sessionStorage.setItem('SP_TEACHER_PREVIEW',JSON.stringify({...preview,teacherPreview:true,allAccess:true,courseCode:'ALLE',kurs:'ALLE'}));
    }
  }catch(error){console.warn('Lehrer-Vorschau konnte nicht vorbereitet werden',error)}
})();
</script>
