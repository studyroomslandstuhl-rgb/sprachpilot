<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SprachPilot</title>
<link rel="stylesheet" href="style.css?v=20260822-cache2">
<style>
.sp-welcome{position:relative;overflow:hidden;padding:28px!important;background:linear-gradient(135deg,#fff 0%,#f0fbff 55%,#e5f8ff 100%)!important;border:1px solid #d9eef7!important}.sp-welcome:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-80px;background:rgba(132,227,255,.25)}.sp-welcome h2{font-size:clamp(28px,5vw,42px);margin:0 0 8px;color:#123047}.sp-welcome-copy{max-width:700px;color:#5f7180;font-size:17px;line-height:1.6;margin:0 0 18px}.sp-welcome .actions{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap}.sp-welcome .actions .btn{min-width:150px;text-align:center}.sp-home-teacher{border:1px solid #d9eef7!important;background:#fff!important;color:#123047!important}
@media(max-width:620px){.sp-welcome{padding:20px!important}.sp-welcome .actions{display:grid}.sp-welcome .actions .btn{width:100%}}
</style>
</head>
<body>
<div id="accountStrip" class="account-strip"></div>
<div class="container">
  <section class="hero"><a class="brand-logo" href="/index.html"><img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo"><h1>SprachPilot</h1></a><p class="subtitle">Deutsch lernen mit klaren Übungen, Bildern, Fragen und Wiederholung.</p></section>
  <section class="card sp-welcome"><h2>Willkommen</h2><p class="sp-welcome-copy">Lerne Schritt für Schritt, wiederhole schwierige Aufgaben und behalte deinen Fortschritt im Blick.</p><div id="loggedBox"></div><div id="guestBox" class="actions"><a class="btn success" href="/register/">Registrieren</a><a class="btn secondary" href="/login/">Anmelden</a><a class="btn secondary sp-home-teacher" href="/teacher/login.html">Lehrer-Anmeldung</a></div></section>
  <section class="modules" id="modules"></section><footer>© SprachPilot</footer>
</div>
<script src="/shared/sp-cache-epoch.js?v=20260831-global-progress-sync9"></script>
<script type="module" src="/js/account-progress-autostart.js?v=20260831-global9"></script>
<script type="module">
import { getActiveProfile, getActiveRole, dashboardHref, logout, safeText, renderAccountStrip } from "./js/auth.js?v=20260822-cache2";
import { loadCourseRelease, moduleOpen } from "./js/course-releases.js?v=20260822-cache2";
window.logout=logout;
const modulesEl=document.querySelector("#modules"),loggedBox=document.querySelector("#loggedBox"),guestBox=document.querySelector("#guestBox");
function normalizeAccountStrip(){const strip=document.getElementById('accountStrip');if(!strip)return;strip.querySelectorAll('a').forEach(a=>{if(/^login$/i.test(a.textContent.trim())||/^einloggen$/i.test(a.textContent.trim()))a.textContent='Anmelden'});const who=strip.querySelector('.who');if(who&&/^nicht eingeloggt$/i.test(who.textContent.trim()))who.textContent='Nicht angemeldet'}
function renderStrip(){try{renderAccountStrip();normalizeAccountStrip()}catch(e){}}
function isTeacherAllAccess(){if(getActiveRole()!=="teacher")return false;try{const p=JSON.parse(sessionStorage.getItem("SP_TEACHER_PREVIEW")||"null");return !!(p&&p.teacherPreview===true&&p.allAccess===true)}catch(e){return false}}
function moduleCard(title,href,desc,open){const locked=!open;return `<a class="module ${locked?'locked':''}" href="${open?href:'#'}" ${open?'':'onclick="return false;" aria-disabled="true"'}><div class="module-title">${safeText(title)}</div><p>${safeText(open?desc:'Für deinen Kurs noch nicht freigeschaltet.')}</p><span class="badge">${open?'Öffnen':'Gesperrt'}</span></a>`}
function renderModules(assignments={}){const teacherAll=isTeacherAllAccess(),fragen=teacherAll||moduleOpen(assignments,"Fragen A1"),wortschatz=teacherAll||moduleOpen(assignments,"Wortschatz"),verben=teacherAll||moduleOpen(assignments,"Verben"),irregular=teacherAll||moduleOpen(assignments,"Irreguläre Verben"),verbArea=verben||irregular;modulesEl.innerHTML=`${moduleCard('Fragen A1','/fragen-A1/','Wichtige Fragen und Antworten für Alltag, Kurs und Prüfung.',fragen)}${moduleCard('Wortschatz','/wortschatz/','Wörter nach Lektionen und Themen üben.',wortschatz)}${moduleCard('Verben','/verben-bereich/','Verben, irreguläre Verben und Perfekt in einem gemeinsamen Lernbereich.',verbArea)}`}
function renderLogged(profile,assignments=null){const p=profile||getActiveProfile();if(!p)return;const data=assignments||p.assignments||{};loggedBox.innerHTML=`<div class="ok"><strong>Angemeldet:</strong> ${safeText(p.vorname||p.firstName||'')} ${safeText(p.nachname||p.lastName||'')} · Kurs: ${safeText(p.kurs||p.courseCode||p.kursnummer||'')}<br><a class="btn secondary" href="${dashboardHref()}">Zum Dashboard</a> <button class="btn secondary" onclick="logout()">Abmelden</button></div>`;guestBox.classList.add("hidden");renderModules(data)}
async function init(){const role=getActiveRole(),profile=role==="student"?getActiveProfile():null;if(profile){renderLogged(profile);try{const assignments=await loadCourseRelease(profile),next={...profile,assignments:assignments||profile.assignments||{}};renderLogged(next,assignments)}catch(e){console.warn("Kursfreigaben konnten nicht geladen werden",e)}}else if(role==="teacher"){loggedBox.innerHTML=`<div class="ok"><strong>Lehrerzugang:</strong> Du bist als Lehrkraft angemeldet.<br><a class="btn secondary" href="${dashboardHref()}">Zum Dashboard</a> <button class="btn secondary" onclick="logout()">Abmelden</button></div>`;guestBox.classList.add("hidden");renderModules({releaseMode:"all",defaultLocked:false})}else{loggedBox.innerHTML='<p>Registriere dich oder melde dich an.</p>';guestBox.classList.remove("hidden");renderModules({})}renderStrip()}
window.addEventListener("SP_PROFILE_SYNCED",e=>{const p=e.detail&&e.detail.profile;if(p)renderLogged(p);renderStrip()});
init().catch(e=>{console.error("Startseite konnte nicht geladen werden",e);loggedBox.innerHTML='<p>Registriere dich oder melde dich an.</p>';guestBox.classList.remove("hidden");renderModules({});renderStrip()});
</script>
<script defer src="js/performance-boot.js?v=20260822-cache2"></script><script src="/shared/sprachpilot-design-system.js?v=20260822-cache2"></script>
</body>
</html>
