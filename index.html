<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SprachPilot</title>
<link rel="stylesheet" href="style.css?v=verben-bereich1">
<style>
.sp-home-nav{max-width:1180px;margin:14px auto 0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.88);border:1px solid #d9eef7;border-radius:18px;box-shadow:0 8px 26px rgba(18,48,71,.08);backdrop-filter:blur(8px)}
.sp-home-nav a{text-decoration:none}.sp-home-lang,.sp-home-auth{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp-home-lang a{padding:8px 11px;border-radius:999px;color:#123047;font-weight:800}.sp-home-lang a.active{background:#e8f8ff;color:#2f7f96}.sp-home-auth a{padding:9px 14px;border-radius:12px;font-weight:900}.sp-home-auth .login{color:#2f7f96;border:1px solid #cbe8f2;background:#fff}.sp-home-auth .register{color:#fff;background:linear-gradient(135deg,#47abc6,#2f7f96)}.sp-home-auth.hidden{display:none!important}
.sp-welcome{position:relative;overflow:hidden;padding:28px!important;background:linear-gradient(135deg,#fff 0%,#f0fbff 55%,#e5f8ff 100%)!important;border:1px solid #d9eef7!important}.sp-welcome:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-80px;background:rgba(132,227,255,.25)}.sp-welcome h2{font-size:clamp(28px,5vw,42px);margin:0 0 8px;color:#123047}.sp-welcome-copy{max-width:700px;color:#5f7180;font-size:17px;line-height:1.6;margin:0 0 18px}.sp-welcome .actions{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap}.sp-welcome .actions .btn{min-width:150px;text-align:center}.sp-home-teacher{border:1px solid #d9eef7!important;background:#fff!important;color:#123047!important}
@media(max-width:620px){.sp-home-nav{margin:8px 8px 0}.sp-home-auth{width:100%}.sp-home-auth a{flex:1;text-align:center}.sp-welcome{padding:20px!important}.sp-welcome .actions{display:grid}.sp-welcome .actions .btn{width:100%}}
</style>
</head>
<body>
<header class="sp-home-nav" aria-label="Startnavigation">
  <div class="sp-home-lang"><a class="active" href="/index.html" data-home-language="de">Deutsch</a><span>oder</span><a href="/finnisch/" data-home-language="fi">Finnisch</a></div>
  <div class="sp-home-auth"><a class="login" href="/login/">Anmelden</a><a class="register" href="/register/">Registrieren</a></div>
</header>
<div id="accountStrip" class="account-strip"></div>
<div class="container">
  <section class="hero"><a class="brand-logo" href="/index.html"><img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo"><h1>SprachPilot</h1></a><p class="subtitle">Deutsch lernen mit klaren Übungen, Bildern, Fragen und Wiederholung.</p></section>
  <section class="card sp-welcome"><h2>Willkommen</h2><p class="sp-welcome-copy">Lerne Schritt für Schritt, wiederhole schwierige Aufgaben und behalte deinen Fortschritt im Blick.</p><div id="loggedBox"></div><div id="guestBox" class="actions"><a class="btn success" href="/register/">Registrieren</a><a class="btn secondary" href="/login/">Anmelden</a><a class="btn secondary sp-home-teacher" href="/teacher/login.html">Lehrer-Anmeldung</a></div></section>
  <section class="modules" id="modules"></section><footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/account-progress-autostart.js?v=1"></script>
<script type="module">
import { getActiveProfile, getActiveRole, dashboardHref, logout, safeText, renderAccountStrip } from "./js/auth.js?v=login-main-4";
import { loadCourseRelease, moduleOpen } from "./js/course-releases.js?v=verb-groups-2";
window.logout=logout;
document.querySelectorAll('[data-home-language]').forEach(link=>link.addEventListener('click',()=>{try{localStorage.setItem('SP_LEARNING_LANGUAGE',link.dataset.homeLanguage==='fi'?'fi':'de')}catch(e){}}));
const modulesEl=document.querySelector("#modules"),loggedBox=document.querySelector("#loggedBox"),guestBox=document.querySelector("#guestBox"),homeAuth=document.querySelector('.sp-home-auth');
function normalizeAccountStrip(){const strip=document.getElementById('accountStrip');if(!strip)return;strip.querySelectorAll('a').forEach(a=>{if(/^login$/i.test(a.textContent.trim())||/^einloggen$/i.test(a.textContent.trim()))a.textContent='Anmelden'});const who=strip.querySelector('.who');if(who&&/^nicht eingeloggt$/i.test(who.textContent.trim()))who.textContent='Nicht angemeldet'}
function renderStrip(){try{renderAccountStrip();normalizeAccountStrip()}catch(e){}}
function syncHomeAuth(){const role=getActiveRole(),profile=role==='student'?getActiveProfile():null;const logged=role==='teacher'||!!profile;homeAuth?.classList.toggle('hidden',logged)}
function isTeacherAllAccess(){if(getActiveRole()!=="teacher")return false;try{const p=JSON.parse(sessionStorage.getItem("SP_TEACHER_PREVIEW")||"null");return !!(p&&p.teacherPreview===true&&p.allAccess===true)}catch(e){return false}}
function moduleCard(title,href,desc,open){const locked=!open;return `<a class="module ${locked?'locked':''}" href="${open?href:'#'}" ${open?'':'onclick="return false;" aria-disabled="true"'}><div class="module-title">${safeText(title)}</div><p>${safeText(open?desc:'Für deinen Kurs noch nicht freigeschaltet.')}</p><span class="badge">${open?'Öffnen':'Gesperrt'}</span></a>`}
function renderModules(assignments={}){const teacherAll=isTeacherAllAccess(),fragen=teacherAll||moduleOpen(assignments,"Fragen A1"),wortschatz=teacherAll||moduleOpen(assignments,"Wortschatz"),verben=teacherAll||moduleOpen(assignments,"Verben"),irregular=teacherAll||moduleOpen(assignments,"Irreguläre Verben"),verbArea=verben||irregular;modulesEl.innerHTML=`${moduleCard('Fragen A1','/fragen-A1/','Wichtige Fragen und Antworten für Alltag, Kurs und Prüfung.',fragen)}${moduleCard('Wortschatz','/wortschatz/','Wörter nach Lektionen und Themen üben.',wortschatz)}${moduleCard('Verben','/verben-bereich/','Verben, irreguläre Verben und Perfekt in einem gemeinsamen Lernbereich.',verbArea)}`}
function renderLogged(profile,assignments=null){const p=profile||getActiveProfile();if(!p)return;const data=assignments||p.assignments||{};loggedBox.innerHTML=`<div class="ok"><strong>Angemeldet:</strong> ${safeText(p.vorname||p.firstName||'')} ${safeText(p.nachname||p.lastName||'')} · Kurs: ${safeText(p.kurs||p.courseCode||p.kursnummer||'')}<br><a class="btn secondary" href="${dashboardHref()}">Zum Dashboard</a> <button class="btn secondary" onclick="logout()">Abmelden</button></div>`;guestBox.classList.add("hidden");renderModules(data)}
async function init(){const role=getActiveRole(),profile=role==="student"?getActiveProfile():null;syncHomeAuth();if(profile){renderLogged(profile);try{const assignments=await loadCourseRelease(profile),next={...profile,assignments:assignments||profile.assignments||{}};renderLogged(next,assignments)}catch(e){console.warn("Kursfreigaben konnten nicht geladen werden",e)}}else if(role==="teacher"){loggedBox.innerHTML=`<div class="ok"><strong>Lehrerzugang:</strong> Du bist als Lehrkraft angemeldet.<br><a class="btn secondary" href="${dashboardHref()}">Zum Dashboard</a> <button class="btn secondary" onclick="logout()">Abmelden</button></div>`;guestBox.classList.add("hidden");renderModules({releaseMode:"all",defaultLocked:false})}else{loggedBox.innerHTML='<p>Registriere dich oder melde dich an.</p>';guestBox.classList.remove("hidden");renderModules({})}renderStrip()}
window.addEventListener("SP_PROFILE_SYNCED",e=>{const p=e.detail&&e.detail.profile;if(p)renderLogged(p);syncHomeAuth();renderStrip()});
init().catch(e=>{console.error("Startseite konnte nicht geladen werden",e);loggedBox.innerHTML='<p>Registriere dich oder melde dich an.</p>';guestBox.classList.remove("hidden");renderModules({});syncHomeAuth();renderStrip()});
</script>
<script defer src="js/performance-boot.js?v=20260709b"></script><script src="/shared/sprachpilot-design-system.js"></script>
</body>
</html>
