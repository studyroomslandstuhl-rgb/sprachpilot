<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SprachPilot</title>
<link rel="stylesheet" href="style.css?v=login-main-2">
</head>
<body>
<div id="accountStrip" class="account-strip"></div>
<div class="container">
  <section class="hero">
    <a class="brand-logo" href="/index.html">
      <img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo">
      <h1>SprachPilot</h1>
    </a>
    <p class="subtitle">Deutsch lernen mit klaren Übungen, Bildern, Fragen und Wiederholung.</p>
  </section>

  <section class="card">
    <h2>Willkommen</h2>
    <div id="loggedBox"></div>
    <div id="guestBox" class="actions">
      <a class="btn success" href="/register/">Als Schüler registrieren</a>
      <a class="btn secondary" href="/login/">Schüler-Login</a>
      <a class="btn secondary" href="/teacher/login.html">Lehrer-Login</a>
    </div>
  </section>

  <section class="modules" id="modules"></section>
  <footer>© SprachPilot</footer>
</div>

<script type="module">
import { getActiveProfile, getActiveRole, dashboardHref, logout, safeText, renderAccountStrip } from "./js/auth.js?v=login-main-2";
import { loadCourseRelease, moduleOpen } from "./js/course-releases.js?v=login-main-2";
window.logout=logout;

const modulesEl=document.querySelector("#modules");
const loggedBox=document.querySelector("#loggedBox");
const guestBox=document.querySelector("#guestBox");

function isTeacherAllAccess(){
  if(getActiveRole()!=="teacher") return false;
  try{
    const p=JSON.parse(sessionStorage.getItem("SP_TEACHER_PREVIEW")||"null");
    return !!(p && p.teacherPreview===true && p.allAccess===true);
  }catch(e){return false;}
}

function moduleCard(title,href,desc,open){
  const locked=!open;
  return `<a class="module ${locked?'locked':''}" href="${open?href:'#'}" ${open?'':'onclick="return false;" aria-disabled="true"'}>
    <div class="module-title">${safeText(title)}</div>
    <p>${safeText(open?desc:'Für deinen Kurs noch nicht freigeschaltet.')}</p>
    <span class="badge">${open?'Öffnen':'Gesperrt'}</span>
  </a>`;
}

function renderModules(assignments={}){
  const teacherAll=isTeacherAllAccess();
  const fragen=teacherAll || moduleOpen(assignments,"Fragen A1");
  const wortschatz=teacherAll || moduleOpen(assignments,"Wortschatz");
  const verben=teacherAll || moduleOpen(assignments,"Verben A1");
  modulesEl.innerHTML=`
    ${moduleCard('Fragen A1','/fragen-A1/','Wichtige Fragen und Antworten für Alltag, Kurs und Prüfung.',fragen)}
    ${moduleCard('Wortschatz','/wortschatz/','Wörter nach Lektionen und Themen üben.',wortschatz)}
    ${moduleCard('Verben A1','/verben-A1/','Verben einschätzen, wählen und üben.',verben)}
  `;
}

function renderLogged(profile,assignments=null){
  const p=profile||getActiveProfile();
  if(!p) return;
  const data=assignments||p.assignments||{};
  loggedBox.innerHTML=`<div class="ok"><strong>Eingeloggt:</strong> ${safeText(p.vorname||p.firstName||'')} ${safeText(p.nachname||p.lastName||'')} · Kurs: ${safeText(p.kurs||p.courseCode||p.kursnummer||'')}<br><a class="btn secondary" href="${dashboardHref()}">Zum Dashboard</a> <button class="btn secondary" onclick="logout()">Abmelden</button></div>`;
  guestBox.classList.add("hidden");
  renderModules(data);
}

async function init(){
  const role=getActiveRole();
  const profile=role==="student" ? getActiveProfile() : null;

  if(profile){
    renderLogged(profile);
    try{
      const assignments=await loadCourseRelease(profile);
      const next={...profile,assignments:assignments||profile.assignments||{}};
      renderLogged(next,assignments);
    }catch(e){
      console.warn("Kursfreigaben konnten nicht geladen werden",e);
    }
  }else if(role==="teacher"){
    loggedBox.innerHTML=`<div class="ok"><strong>Lehrerzugang:</strong> Du bist als Lehrkraft eingeloggt.<br><a class="btn secondary" href="${dashboardHref()}">Zum Dashboard</a> <button class="btn secondary" onclick="logout()">Abmelden</button></div>`;
    guestBox.classList.add("hidden");
    renderModules({releaseMode:"all",defaultLocked:false});
  }else{
    loggedBox.innerHTML='<p>Registriere dich oder logge dich mit deinem Kurscode ein.</p>';
    guestBox.classList.remove("hidden");
    renderModules({});
  }

  try{renderAccountStrip()}catch(e){}
}

window.addEventListener("SP_PROFILE_SYNCED",e=>{
  const p=e.detail&&e.detail.profile;
  if(p) renderLogged(p);
  try{renderAccountStrip()}catch(x){}
});

init().catch(e=>{
  console.error("Startseite konnte nicht geladen werden",e);
  loggedBox.innerHTML='<p>Registriere dich oder logge dich mit deinem Kurscode ein.</p>';
  guestBox.classList.remove("hidden");
  renderModules({});
});
</script>
<script defer src="js/performance-boot.js?v=20260709b"></script>
<script src="/shared/sprachpilot-design-system.js"></script>
</body>
</html>
