<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SprachPilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="accountStrip" class="account-strip"></div>
<div class="container">
  <section class="hero">
    <a class="brand-logo" href="/index.html">
      <img src="https://sprachpilot.b-cdn.net/sprachpilot-logo.webp" alt="SprachPilot Logo">
      <h1>SprachPilot</h1>
    </a>
    <p class="subtitle">Deutsch lernen mit klaren Übungen, Bildern, Fragen und Wiederholung.</p>
  </section>

  <section class="card">
    <h2>Willkommen</h2>
    <div id="loggedBox"></div>
    <div id="guestBox" class="actions">
      <a class="btn success" href="register/">Als Schüler registrieren</a>
      <a class="btn secondary" href="login/">Schüler-Login</a>
      <a class="btn secondary" href="teacher/login.html">Lehrer-Login</a>
    </div>
  </section>

  <section class="modules" id="modules"></section>
  <footer>© SprachPilot</footer>
</div>

<script type="module">
import { getActiveProfile, getActiveRole, dashboardHref, logout, safeText, renderAccountStrip } from "./js/auth.js?v=release-core-20260701b";
import { loadCourseRelease, moduleOpen } from "./js/course-releases.js?v=release-core-20260701b";
window.logout=logout;

function isTeacherAllAccess(){
  if(getActiveRole()!=="teacher") return false;
  try{
    const p=JSON.parse(sessionStorage.getItem("SP_TEACHER_PREVIEW")||"null");
    return !!(p && p.teacherPreview===true && p.allAccess===true);
  }catch(e){return false;}
}
function renderModules(p){
  const teacherAll=isTeacherAllAccess();
  const c=p?.assignments||{};
  const verben=teacherAll || moduleOpen(c,"Verben A1");
  const fragen=teacherAll || moduleOpen(c,"Fragen A1");
  const wortschatz=teacherAll || moduleOpen(c,"Wortschatz");
  document.querySelector("#modules").innerHTML=`
    <a class="module" href="${fragen?'fragen-A1/':'#'}" ${fragen?'':'onclick="return false;" style="opacity:.55"'}>
      <div class="module-title">Fragen A1</div><p>${fragen?'Wichtige Fragen und Antworten für Alltag, Kurs und Prüfung.':'Für deinen Kurs noch nicht freigeschaltet.'}</p><span class="badge">${fragen?'
`;
}

function renderLogged(p){
  const box=document.querySelector("#loggedBox");
  const guest=document.querySelector("#guestBox");
  if(p){
    box.innerHTML=`<div class="ok"><strong>Eingeloggt:</strong> ${safeText(p.vorname)} ${safeText(p.nachname)} | Kurs: ${safeText(p.kurs)} | Muttersprache: ${safeText(p.muttersprache)}<br><a class`
    guest.classList.add("hidden");
    renderModules(p);
  }
}

function idle(fn){
  const run=()=>setTimeout(fn,0);
  if("requestIdleCallback" in window)requestIdleCallback(fn,{timeout:2500});
  else if(document.readyState==="complete")run();
  else window.addEventListener("load",run,{once:true});
}

async function refreshStudentInBackground(currentProfile){
  try{
    const sync=await import("./js/global-sync.js?v=3");
    const synced=await sync.startGlobalSync();
    const next=synced||getActiveProfile()||currentProfile;
    renderLogged(next);
    renderAccountStrip();
    const assignments=await loadCourseRelease(next);
    renderLogged({...next,assignments:assignments||next.assignments||{}});
  }catch(e){
    console.warn("SprachPilot Hintergrund-Sync übersprungen",e);
  }
}

const role=getActiveRole();
let p=role==="student" ? getActiveProfile() : null;
const box=document.querySelector("#loggedBox");
const guest=document.querySelector("#guestBox");
if(p){
  renderLogged(p);
  loadCourseRelease(p).then(assignments=>{
    p={...p,assignments:assignments||p.assignments||{}};
    renderLogged(p);
  }).catch(()=>renderModules(p));
  idle(()=>refreshStudentInBackground(p));
}else if(role==="teacher"){
  box.innerHTML=`<div class="ok"><strong>Lehrerzugang:</strong> Du siehst SprachPilot im Testmodus. Es werden keine Schülerpunkte gespeichert.<br><a class="btn secondary" href="${dashboardHref()[0]||"/index.html"}">Zum Dashboard</a></div>`;
  guest.classList.add("hidden");
  renderModules({assignments:{releaseMode:"all",defaultLocked:false}});
}else{
  box.innerHTML='<p>Registriere dich oder logge dich mit deinem Kurscode ein.</p>';
  renderModules({assignments:{}});
}
window.addEventListener("SP_PROFILE_SYNCED",e=>{p=e.detail.profile;renderLogged(p);renderAccountStrip();});
renderAccountStrip();
</script>
<script defer src="js/performance-boot.js?v=20260709b"></script>
<script src="/shared/sprachpilot-design-system.js"></script>
</body>
</html>
