name: Fix Perfekt hören audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perfekt-hoeren-audio-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect hat gehört audio and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('perfekt/app-stable.js')
          text = app.read_text(encoding='utf-8')
          old = "const RECORDED_AUDIO_SPECIAL={'hat bekommen':'hat_bekommen.mp3','hat begraben':'hat_begraben.mp3','hat gefallen':'hat_gefallen.mp3','ist gefallen':'ist_gefallen.mp3','hat vergessen':'hat_vergessen.mp3'};"
          new = "const RECORDED_AUDIO_SPECIAL={'hat bekommen':'hat_bekommen.mp3','hat begraben':'hat_begraben.mp3','hat gehört':'hat_gehoert.mp3','hat gefallen':'hat_gefallen.mp3','ist gefallen':'ist_gefallen.mp3','hat vergessen':'hat_vergessen.mp3'};"
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected RECORDED_AUDIO_SPECIAL mapping not found')
              app.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('perfekt/index.html')
          html = index.read_text(encoding='utf-8')
          if 'perfekt-fix7' in html:
              index.write_text(html.replace('perfekt-fix7', 'perfekt-fix8'), encoding='utf-8')
          elif 'perfekt-fix8' not in html:
              raise SystemExit('Expected Perfekt cache version not found')
          PY
      - name: Commit active Perfekt audio fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfekt/app-stable.js perfekt/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix hören audio in Perfekt group"
            git push
          fi
