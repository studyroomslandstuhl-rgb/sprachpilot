name: Audit Perfekt Bunny audio

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Audit Bunny audio and build manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
          git pull --rebase origin "$TARGET_BRANCH"
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');

          const read=path=>fs.readFileSync(path,'utf8');
          const context={window:{}};
          context.window.window=context.window;
          for(const file of ['verben/data.js','verben/verb-additions.js','perfekt/filter-verbs.js']){
            vm.runInNewContext(read(file),context,{filename:file});
          }
          const verbs=[...(context.window.SP_VERB_GROUP_DATA?.verbs||[])];
          if(!verbs.length)throw new Error('No Perfekt verbs found');

          let app=read('perfekt/app-stable.js');
          const algorithmStart=app.indexOf('const SPECIAL=');
          const algorithmEnd=app.indexOf('function imageUrl',algorithmStart);
          if(algorithmStart<0||algorithmEnd<0)throw new Error('Perfekt algorithm block not found');
          const algorithmContext={};
          vm.runInNewContext(
            `const BASE={groupLabel:()=>''};\n${app.slice(algorithmStart,algorithmEnd)}\nthis.__perfect=perfect;this.__norm=norm;`,
            algorithmContext,
            {filename:'perfekt-algorithm.js'}
          );
          const perfect=algorithmContext.__perfect;
          const norm=algorithmContext.__norm;
          if(typeof perfect!=='function'||typeof norm!=='function')throw new Error('Perfekt functions unavailable');

          const audioSlug=value=>String(value||'')
            .toLowerCase().trim()
            .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
            .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
            .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
          const base='https://sprachpilot.b-cdn.net/audio/';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function request(url,method,headers={}){
            for(let attempt=1;attempt<=2;attempt++){
              try{
                const response=await fetch(url,{method,headers,redirect:'follow',cache:'no-store',signal:AbortSignal.timeout(8000)});
                if(response.body&&method!=='HEAD')await response.body.cancel().catch(()=>{});
                if(response.status===429||response.status>=500){
                  if(attempt<2){await sleep(600*attempt);continue;}
                }
                return response.status;
              }catch(error){
                if(attempt===2)return 0;
                await sleep(600*attempt);
              }
            }
            return 0;
          }

          async function exists(file){
            const url=base+encodeURIComponent(file)+'?perfekt-audit=1';
            let status=await request(url,'HEAD');
            if(status>=200&&status<400)return{ok:true,status};
            if(status===404)return{ok:false,status};
            status=await request(url,'GET',{Range:'bytes=0-0'});
            return{ok:status>=200&&status<400,status};
          }

          const rows=verbs.map(verb=>{
            const form=perfect(verb);
            const file=audioSlug(form)+'.mp3';
            return{verb,perfect:form,key:norm(form),file};
          });
          let cursor=0;
          const workers=Array.from({length:20},async()=>{
            while(true){
              const index=cursor++;
              if(index>=rows.length)return;
              rows[index].check=await exists(rows[index].file);
              if((index+1)%25===0)console.log(`Checked ${index+1}/${rows.length}`);
            }
          });
          await Promise.all(workers);

          const available=rows.filter(row=>row.check.ok);
          const missing=rows.filter(row=>!row.check.ok);
          const map={};
          for(const row of available)map[row.key]=row.file;
          const generatedAt=new Date().toISOString();
          const manifest=`(function(){\n'use strict';\nwindow.SP_PERFEKT_AUDIO_FILES=Object.freeze(${JSON.stringify(map,null,2)});\nwindow.SP_PERFEKT_AUDIO_MISSING=Object.freeze(${JSON.stringify(missing.map(({verb,perfect,file,check})=>({verb,perfect,file,status:check.status})),null,2)});\nwindow.SP_PERFEKT_AUDIO_AUDIT=Object.freeze(${JSON.stringify({generatedAt,total:rows.length,available:available.length,missing:missing.length,base},null,2)});\n})();\n`;
          fs.writeFileSync('perfekt/audio-manifest.js',manifest);

          const table=missing.length
            ?missing.map(row=>`| ${row.verb.replace(/\|/g,'\\|')} | ${row.perfect.replace(/\|/g,'\\|')} | \`${row.file}\` | ${row.check.status||'Netzwerkfehler'} |`).join('\n')
            :'Keine fehlenden Audiodateien.';
          const report=`# Fehlende Perfekt-Audiodateien\n\nStand: ${generatedAt}\n\nGeprüft wurden ${rows.length} vorhandene Perfekt-Verben. Erwartetes Bunny-Schema: \`${base}<Perfektform>.mp3\`.\n\nVorhanden: **${available.length}**  \nFehlend: **${missing.length}**\n\n${missing.length?'| Verb | Perfektform | Erwartete Datei | HTTP-Status |\n|---|---|---|---:|\n'+table:table}\n`;
          fs.writeFileSync('perfekt/audio-missing.md',report);

          const audioStart=app.indexOf("const RECORDED_AUDIO_BASE=");
          const speakStart=app.indexOf('function speak(',audioStart);
          if(audioStart<0||speakStart<0)throw new Error('Existing audio block not found');
          const audioBlock=`const RECORDED_AUDIO_BASE='https://sprachpilot.b-cdn.net/audio/';\nconst RECORDED_AUDIO_FILES=window.SP_PERFEKT_AUDIO_FILES||Object.create(null);\nconst RECORDED_AUDIO_MISSING=window.SP_PERFEKT_AUDIO_MISSING||[];\nlet activeRecordedAudio=null;\nfunction computerSpeak(text,slow=false){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=slow?.55:.92;speechSynthesis.speak(u)}\nfunction recordedAudioFile(text){const raw=String(text||'').trim();if(!raw)return'';return RECORDED_AUDIO_FILES[norm(raw)]||''}\n`;
          app=app.slice(0,audioStart)+audioBlock+app.slice(speakStart);
          fs.writeFileSync('perfekt/app-stable.js',app);

          let html=read('perfekt/index.html');
          const version='perfekt-audio-all-1';
          html=html.replace(/perfekt-fix\d+|perfekt-audio-all-\d+/g,version);
          const manifestTag=`<script src="audio-manifest.js?v=${version}"></script>`;
          if(!html.includes('audio-manifest.js')){
            html=html.replace(/(<script type="module" src="app-stable\.js\?v=[^"]+"><\/script>)/,manifestTag+'\n$1');
          }else{
            html=html.replace(/<script src="audio-manifest\.js\?v=[^"]+"><\/script>/,manifestTag);
          }
          if(!html.includes('audio-manifest.js'))throw new Error('Audio manifest script was not inserted');
          fs.writeFileSync('perfekt/index.html',html);

          console.log(JSON.stringify({total:rows.length,available:available.length,missing:missing.length},null,2));
          NODE
          rm -f .github/workflows/perfekt-audio-audit.yml
          git add perfekt/app-stable.js perfekt/index.html perfekt/audio-manifest.js perfekt/audio-missing.md .github/workflows/perfekt-audio-audit.yml
          git commit -m "Connect all Perfekt audio to Bunny Storage"
          git push origin "HEAD:$TARGET_BRANCH"
