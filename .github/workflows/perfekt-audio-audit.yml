name: Audit Perfekt Bunny audio

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Audit Bunny audio and build manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
          git pull --rebase origin "$TARGET_BRANCH"
          node .github/scripts/perfekt-audio-audit.cjs
          rm -f .github/workflows/perfekt-audio-audit.yml
          rm -f .github/scripts/perfekt-audio-audit.cjs
          rm -f .github/perfekt-audio-audit-trigger.txt
          git add -A perfekt .github/workflows/perfekt-audio-audit.yml .github/scripts/perfekt-audio-audit.cjs .github/perfekt-audio-audit-trigger.txt
          git commit -m "Connect all Perfekt audio to Bunny Storage"
          git push origin "HEAD:$TARGET_BRANCH"
