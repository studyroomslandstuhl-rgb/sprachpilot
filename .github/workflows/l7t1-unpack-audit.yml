name: Unpack L7T1 source

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Decode active L7T1 bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node <<'NODE'
          const fs=require('fs');
          const zlib=require('zlib');
          const dir='wortschatz/A1-Lektion-7/Thema-1';
          const files=[
            'l7t1-rev5-part-01.js',
            'l7t1-rev5-part-02.js',
            'l7t1-rev5-part-03a.js',
            'l7t1-rev5-part-03b.js',
            'l7t1-rev5-part-04.js',
            'l7t1-rev5-part-05.js'
          ];
          const payload=files.map(file=>{
            const text=fs.readFileSync(`${dir}/${file}`,'utf8');
            const match=text.match(/\[(?:\d+)\]='([^']*)';?$/);
            if(!match)throw new Error(`Payload not found in ${file}`);
            return match[1];
          }).join('');
          const source=zlib.gunzipSync(Buffer.from(payload,'base64')).toString('utf8');
          fs.writeFileSync(`${dir}/l7t1-decoded-audit.js`,source);
          console.log(`Decoded ${source.length} characters`);
          NODE
          rm -f .github/workflows/l7t1-unpack-audit.yml
          git add wortschatz/A1-Lektion-7/Thema-1/l7t1-decoded-audit.js .github/workflows/l7t1-unpack-audit.yml
          git commit -m "Decode active L7T1 source for flashcard update"
          git push origin HEAD:${GITHUB_HEAD_REF}
