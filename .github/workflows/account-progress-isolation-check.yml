name: Validate account progress isolation

on:
  pull_request:
    paths:
      - 'js/account-progress-owner-isolation.js'
      - 'js/account-progress-sync.js'
      - 'js/account-progress-autostart.js'
      - 'js/student-identity.js'
      - 'login/index.html'
      - 'register/index.html'
      - 'scripts/test-account-progress-owner-isolation.mjs'
      - '.github/workflows/account-progress-isolation-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check js/account-progress-owner-isolation.js
          node --check js/account-progress-sync.js
          node --check js/account-progress-autostart.js
          node --check js/student-identity.js
          node --check scripts/test-account-progress-owner-isolation.mjs

      - name: Simulate student account switches
        run: node scripts/test-account-progress-owner-isolation.mjs
