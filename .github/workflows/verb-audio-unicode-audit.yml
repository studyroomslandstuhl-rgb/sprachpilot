name: Audit Unicode verb Bunny audio

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref || github.ref_name }}
          sparse-checkout: |
            verben/audio-manifest.js
            verben/audio-missing.md
            .github/workflows/verb-audio-unicode-audit.yml
          sparse-checkout-cone-mode: false

      - name: Check original German Bunny filenames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"

          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');

          (async()=>{
          const context={window:{}};
          context.window.window=context.window;
          vm.runInNewContext(fs.readFileSync('verben/audio-manifest.js','utf8'),context,{filename:'verben/audio-manifest.js'});

          const files={...(context.window.SP_VERB_AUDIO_FILES||{})};
          const previousMissing=[...(context.window.SP_VERB_AUDIO_MISSING||[])];
          const previousAudit=context.window.SP_VERB_AUDIO_AUDIT||{};
          const bases=['https://sprachpilot.b-cdn.net/audio/','https://sprachpilot.b-cdn.net/Audio/'];
          const normalize=value=>String(value||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[.,!?;:“”„"'`()]/g,'').replace(/\s+/g,' ');
          const unicodeSlug=(value,separator='_')=>String(value||'').toLowerCase().trim().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu,separator).replace(new RegExp('^'+separator+'+|'+separator+'+$','g'),'');
          const unique=list=>[...new Set(list.filter(Boolean))];
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function request(url,method,headers={}){
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const response=await fetch(url,{method,headers,redirect:'follow',cache:'no-store',signal:AbortSignal.timeout(10000)});
                if(response.body&&method!=='HEAD')await response.body.cancel().catch(()=>{});
                if((response.status===429||response.status>=500)&&attempt<3){await sleep(700*attempt);continue;}
                return response.status;
              }catch(error){if(attempt===3)return 0;await sleep(700*attempt);}
            }
            return 0;
          }

          async function exists(url){
            const checked=url+(url.includes('?')?'&':'?')+'verb-unicode-audit=1';
            let status=await request(checked,'HEAD');
            if(status>=200&&status<400)return{ok:true,status};
            if(status===404)return{ok:false,status};
            status=await request(checked,'GET',{Range:'bytes=0-0'});
            return{ok:status>=200&&status<400,status};
          }

          function candidates(verb){
            const names=unique([
              unicodeSlug(verb,'_'),
              unicodeSlug(verb,'-'),
              String(verb||'').toLowerCase().trim().normalize('NFC')
            ]);
            return bases.flatMap(base=>names.map(name=>base+encodeURIComponent(name)+'.mp3'));
          }

          const unresolved=[];
          for(const item of previousMissing){
            const attempts=[];
            let found='';
            for(const url of candidates(item.verb)){
              const check=await exists(url);
              attempts.push({url,status:check.status});
              if(check.ok){found=url;break;}
            }
            if(found)files[normalize(item.verb)]=found;
            else unresolved.push({verb:item.verb,candidates:[...(item.candidates||[]),...attempts]});
          }

          const generatedAt=new Date().toISOString();
          const total=Number(previousAudit.total)||Object.keys(files).length+unresolved.length;
          const audit={generatedAt,total,available:Object.keys(files).length,missing:unresolved.length,bases};
          const manifest=`(function(){\n'use strict';\nwindow.SP_VERB_AUDIO_FILES=Object.freeze(${JSON.stringify(files,null,2)});\nwindow.SP_VERB_AUDIO_MISSING=Object.freeze(${JSON.stringify(unresolved,null,2)});\nwindow.SP_VERB_AUDIO_AUDIT=Object.freeze(${JSON.stringify(audit,null,2)});\n})();\n`;
          fs.writeFileSync('verben/audio-manifest.js',manifest);

          const table=unresolved.length?unresolved.map(row=>`| ${row.verb.replace(/\|/g,'\\|')} | ${row.candidates.map(item=>`\`${item.url}\` (${item.status||'Netzwerkfehler'})`).join('<br>')} |`).join('\n'):'Keine fehlenden Audiodateien.';
          const report=`# Fehlende Infinitiv-Audiodateien\n\nStand: ${generatedAt}\n\nGeprüfte Verben: **${total}**  \nMit Bunny-Aufnahme verbunden: **${audit.available}**  \nFehlend: **${audit.missing}**\n\n${unresolved.length?'| Verb | geprüfte Bunny-Adressen |\n|---|---|\n'+table:table}\n`;
          fs.writeFileSync('verben/audio-missing.md',report);
          console.log(JSON.stringify(audit,null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

          rm -f .github/workflows/verb-audio-unicode-audit.yml
          git add verben/audio-manifest.js verben/audio-missing.md .github/workflows/verb-audio-unicode-audit.yml
          git commit -m "Resolve German verb audio filenames in Bunny Storage"
          git push origin "HEAD:$TARGET_BRANCH"
