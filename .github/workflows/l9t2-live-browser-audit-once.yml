name: L9T2 live browser audit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/l9t2-live-browser-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Syntax-check every L9T2 JavaScript file
        shell: bash
        run: |
          set +e
          failed=0
          for f in wortschatz/A1-Lektion-9/Thema-2/*.js; do
            echo "CHECK|$f"
            node --check "$f" || failed=1
          done
          echo "SYNTAX_FAILED=$failed"
          exit 0
      - name: Inspect published L9T2 parser errors
        shell: bash
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable)
          mkdir -p /tmp/l9t2-browser && cd /tmp/l9t2-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          cat > audit.cjs <<'JS'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            page.on('pageerror',e=>console.log('PAGEERROR_STACK|'+(e.stack||e.message)));
            page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR|'+m.text())});
            page.on('requestfailed',r=>console.log('REQFAIL|'+r.url()+'|'+(r.failure()?.errorText||'')));
            page.on('response',r=>{const u=r.url();if(u.includes('/Thema-2/l9t2-'))console.log('SCRIPTRESP|'+r.status()+'|'+u)});
            await page.goto('https://www.sprachpilot.org/wortschatz/A1-Lektion-9/Thema-2/task.html?task=karteikarten&syntaxaudit=2',{waitUntil:'domcontentloaded',timeout:30000}).catch(e=>console.log('GOTOERR|'+e.message));
            await page.waitForTimeout(3500);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME="$CHROME" node audit.cjs
