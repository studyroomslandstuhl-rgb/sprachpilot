name: L9T2 live browser audit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/l9t2-live-browser-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify complete live L9T2 Bunny media flow
        shell: bash
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable)
          mkdir -p /tmp/l9t2-browser && cd /tmp/l9t2-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const tests=[
            {name:'cards',url:'https://www.sprachpilot.org/wortschatz/A1-Lektion-9/Thema-2/task.html?task=karteikarten&bunnyverify=6',audio:true,act:async p=>{await p.locator('#l8FlipCard').click();await p.waitForTimeout(550);await p.locator('#cardListen').click()}},
            {name:'bild-wort',url:'https://www.sprachpilot.org/wortschatz/A1-Lektion-9/Thema-2/task.html?task=bild-wort&bunnyverify=6'},
            {name:'bild-hoeren',url:'https://www.sprachpilot.org/wortschatz/A1-Lektion-9/Thema-2/task.html?task=bild-hoeren&bunnyverify=6',audio:true,act:async p=>{await p.locator('[data-audio]').first().click()}},
            {name:'memory',url:'https://www.sprachpilot.org/wortschatz/A1-Lektion-9/Thema-2/task.html?task=memory&bunnyverify=6'},
            {name:'overview',url:'https://www.sprachpilot.org/wortschatz/A1-Lektion-9/Thema-2/uebersicht.html?bunnyverify=6',audio:true,act:async p=>{await p.locator('[data-sp-vocab-audio]').first().click()}}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const context=await browser.newContext();
            await context.addInitScript(()=>{
              try{
                localStorage.setItem('SP_LOGIN_ROLE','student');localStorage.setItem('SP_ACTIVE_ROLE','student');
                localStorage.setItem('SP_USER_PROFILE',JSON.stringify({studentId:'audit',motherLanguageCode:'en'}));
                for(const id of ['karteikarten','bild-wort','bild-hoeren','memory'])localStorage.removeItem(`SP_L9_audit_T2_${id}`);
              }catch(e){}
              document.addEventListener('DOMContentLoaded',()=>{if(!document.querySelector('.sp-header')){const h=document.createElement('header');h.className='sp-header';h.innerHTML='<div class="sp-header__subtitle"></div>';document.body.prepend(h)}},{once:true});
            });
            await context.route('**/js/guard.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:'// auth bypass only for isolated live media verification'}));
            let failures=0;
            for(const t of tests){
              const page=await context.newPage(),responses=[],failed=[],errors=[];
              page.on('response',r=>{if(r.url().includes('sprachpilot.b-cdn.net'))responses.push({status:r.status(),type:r.headers()['content-type']||'',url:r.url()})});
              page.on('requestfailed',r=>{if(r.url().includes('sprachpilot.b-cdn.net'))failed.push({url:r.url(),error:r.failure()?.errorText||''})});
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto(t.url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(t.name==='overview'?2200:1400);
              const before=await page.evaluate(()=>({hasL9T2:!!window.L9T2,hasBunny:!!window.L9T2BunnyMedia,images:[...document.images].filter(x=>x.src.includes('sprachpilot.b-cdn.net')).map(x=>({src:x.currentSrc||x.src,w:x.naturalWidth,h:x.naturalHeight})).slice(0,16)}));
              if(t.act){try{await t.act(page);await page.waitForTimeout(1800)}catch(e){errors.push('interaction: '+e.message)}}
              const imageOk=before.images.some(x=>x.w>0&&x.h>0);
              const imageResponse=responses.some(x=>(x.status===200||x.status===206)&&x.type.includes('image/'));
              const audioResponse=t.audio?responses.some(x=>(x.status===200||x.status===206)&&x.type.includes('audio/')):true;
              const ok=before.hasL9T2&&before.hasBunny&&imageOk&&imageResponse&&audioResponse&&failed.length===0&&errors.length===0;
              console.log('STATE|'+t.name+'|'+JSON.stringify(before));
              console.log('BUNNY|'+t.name+'|'+JSON.stringify(responses.filter(x=>x.type.includes('image/')||x.type.includes('audio/')).slice(0,24)));
              console.log('FAILED|'+t.name+'|'+JSON.stringify(failed));console.log('ERRORS|'+t.name+'|'+JSON.stringify(errors));
              console.log('RESULT|'+t.name+'|'+(ok?'PASS':'FAIL'));if(!ok)failures++;
              await page.close();
            }
            await browser.close();if(failures)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME="$CHROME" node verify.cjs
