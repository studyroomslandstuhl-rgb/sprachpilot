name: Verben Test Check

on:
  push:
    paths:
      - 'verben-test/**'
      - '.github/workflows/verben-test-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check verben-test/app.js
      - name: Required files and no old layers
        run: |
          test -f verben-test/index.html
          test -f verben-test/styles.css
          test -f verben-test/app.js
          test -f verben-test/LOGIK.md
          test ! -f verben-test/l6-card-pattern.js
          test ! -f verben-test/boot.js
          test ! -f verben-test/app-clean.js
          test ! -f verben-test/choose-filter.js
          grep -q 'Verben Test' verben-test/index.html
          grep -q 'styles.css?v=7' verben-test/index.html
          grep -q 'app.js?v=5' verben-test/index.html
          ! grep -qE 'l6-card-pattern|boot\.js|app-clean\.js|choose-filter\.js|state\.js|progress\.js|cloud-progress-sync|firebase-progress-sync|package-progress-v2|task-route-stable|back-flow-fix' verben-test/index.html
      - name: L3 structure with blue colors
        run: |
          grep -q -- '--lesson-main:#48b6d7' verben-test/styles.css
          grep -q -- '--lesson-main-dark:#12617a' verben-test/styles.css
          grep -q -- '--lesson-main-light:#c9f1fb' verben-test/styles.css
          grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))' verben-test/styles.css
          grep -q 'min-height:270px' verben-test/styles.css
          grep -q 'translateY(-4px)' verben-test/styles.css
          grep -q 'module.locked' verben-test/styles.css
      - name: Assessment like Verben A1
        run: |
          grep -q 'var ASSESSMENT_FAST_SECONDS=7' verben-test/app.js
          grep -q 'function renderAssess' verben-test/app.js
          grep -q 'function markAssessment' verben-test/app.js
          grep -q 'function checkAssessmentAnswer' verben-test/app.js
          grep -q 'function revealAssessmentVerb' verben-test/app.js
          grep -q 'Schnell + richtig = kann ich' verben-test/app.js
          grep -q 'data-assessment-input' verben-test/app.js
          grep -q "markAssessment(fast?'known':'unsure')" verben-test/app.js
          grep -q "data-assessment-mark=\"unknown\"" verben-test/app.js
          grep -q 'Du hast bereits' verben-test/app.js
      - name: Pattern rules from L5 L6
        run: |
          grep -q 'function normalizeTask' verben-test/app.js
          grep -q 'function nextVerb' verben-test/app.js
          grep -q 'function markWrong' verben-test/app.js
          grep -q 'function markRight' verben-test/app.js
          grep -q 'function help3' verben-test/app.js
          grep -q 'function renderFlashcards' verben-test/app.js
          grep -q 'function renderImageToVerb' verben-test/app.js
          grep -q 'function renderVerbToImage' verben-test/app.js
          grep -q 'function renderListenWrite' verben-test/app.js
          grep -q 'function renderSentenceBuild' verben-test/app.js
          grep -q 'function renderConjugation' verben-test/app.js
          grep -q 'function allTasksDone' verben-test/app.js
          grep -q 'function renderExam' verben-test/app.js
          grep -q 'function finishExam' verben-test/app.js
          grep -q 'function startMic' verben-test/app.js
      - name: Points package and exam rules
        run: |
          grep -q 'var PACKAGE_SIZE=20' verben-test/app.js
          grep -q 'var TASK_POINTS=\[5,10,15\]' verben-test/app.js
          grep -q 'var EXAM_POINTS=\[100,200,300\]' verben-test/app.js
          grep -q 'state.learned=uniq(state.learned.concat(learnedNow))' verben-test/app.js
          grep -q 'if(!allTasksDone())' verben-test/app.js
      - name: L6T2 flashcard pattern
        run: |
          grep -q 'data-flip-card' verben-test/app.js
          grep -q 'card-listen-btn' verben-test/app.js
          grep -q 'data-mic' verben-test/app.js
          grep -q 'data-show-input' verben-test/app.js
          grep -q 'flip-wrap' verben-test/styles.css
          grep -q 'flip-card' verben-test/styles.css
          grep -q 'flip-back' verben-test/styles.css
      - name: Chooser filters and images
        run: |
          grep -q 'data-filter' verben-test/app.js
          grep -q 'regular' verben-test/app.js
          grep -q 'irregular' verben-test/app.js
          grep -q 'modal' verben-test/app.js
          grep -q 'separable' verben-test/app.js
          grep -q 'reflexive' verben-test/app.js
          grep -q 'sich_vorstellen.webp' verben-test/app.js
          grep -q 'sich_kaemmen.webp' verben-test/app.js
          grep -q 'koennen.webp' verben-test/app.js
          grep -q "var BUNNY='https://sprachpilot.b-cdn.net/'" verben-test/app.js
          ! grep -q "sprachpilot.b-cdn.net/verben-A1/bilder" verben-test/app.js
      - name: Visible German text uses umlauts
        run: |
          grep -q 'Was möchtest du machen' verben-test/app.js
          grep -q 'Verben wählen' verben-test/app.js
          grep -q 'Verben einschätzen' verben-test/app.js
          grep -q 'Aufgabenübersicht' verben-test/app.js
          grep -q 'Prüfung' verben-test/app.js
          grep -q 'Lösung' verben-test/app.js
      - name: Direct links and routes
        run: |
          grep -q 'function routeHref' verben-test/app.js
          grep -q 'function backTarget' verben-test/app.js
          grep -q 'function routeFromUrl' verben-test/app.js
          grep -q 'history.pushState' verben-test/app.js
          grep -q 'popstate' verben-test/app.js
          grep -q 'view=overview' verben-test/app.js
          grep -q 'view=assessment' verben-test/app.js
          grep -q 'task=pruefung' verben-test/app.js
          grep -q 'data-task' verben-test/app.js
      - name: Conjugation accepts pronouns and nouns
        run: |
          grep -q 'CONJ_SUBJECTS' verben-test/app.js
          grep -q 'function conjugateVerb' verben-test/app.js
          grep -q 'function conjugationPrompt' verben-test/app.js
          grep -q 'die Lehrerin' verben-test/app.js
          grep -q 'der Schüler' verben-test/app.js
          grep -q 'split.*||' verben-test/app.js
