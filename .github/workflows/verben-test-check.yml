name: Verben Test Check

on:
  push:
    paths:
      - 'verben-test/**'
      - '.github/workflows/verben-test-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check verben-test/app.js
      - name: Required files and no old layers
        run: |
          test -f verben-test/index.html
          test -f verben-test/styles.css
          test -f verben-test/app.js
          test ! -f verben-test/boot.js
          test ! -f verben-test/app-clean.js
          test ! -f verben-test/choose-filter.js
          grep -q 'Verben Test' verben-test/index.html
          grep -q 'styles.css?v=4' verben-test/index.html
          grep -q 'app.js?v=1' verben-test/index.html
          ! grep -qE 'boot\.js|app-clean\.js|choose-filter\.js|state\.js|progress\.js|cloud-progress-sync|firebase-progress-sync|package-progress-v2|task-route-stable|back-flow-fix' verben-test/index.html
      - name: Core rules
        run: |
          grep -q 'var PACKAGE_SIZE=20' verben-test/app.js
          grep -q 'var TASK_POINTS=\[5,10,15\]' verben-test/app.js
          grep -q 'var EXAM_POINTS=\[100,200,300\]' verben-test/app.js
          grep -q 'function startPackage' verben-test/app.js
          grep -q 'function repeatPackage' verben-test/app.js
          grep -q 'function finishPackage' verben-test/app.js
          grep -q 'function allTasksDone' verben-test/app.js
          grep -q 'function renderExam' verben-test/app.js
          grep -q 'function wrongFeedback' verben-test/app.js
          grep -q 'function startMic' verben-test/app.js
      - name: Chooser filters and images
        run: |
          grep -q 'data-filter' verben-test/app.js
          grep -q 'regular' verben-test/app.js
          grep -q 'irregular' verben-test/app.js
          grep -q 'modal' verben-test/app.js
          grep -q 'separable' verben-test/app.js
          grep -q 'reflexive' verben-test/app.js
          grep -q 'sich_vorstellen.webp' verben-test/app.js
          grep -q 'sich_kaemmen.webp' verben-test/app.js
          grep -q 'koennen.webp' verben-test/app.js
