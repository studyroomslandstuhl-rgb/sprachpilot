name: Verben Test Check

on:
  push:
    paths:
      - 'verben-test/**'
      - 'index.html'
      - 'js/course-releases.js'
      - 'teacher/verben-test-release.js'
      - 'teacher/index.html'
      - '.github/workflows/verben-test-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check verben-test/app-clean.js
          node --check verben-test/boot.js
          node --check teacher/verben-test-release.js
      - name: Required files and isolation
        run: |
          test -f verben-test/index.html
          test -f verben-test/styles.css
          test -f verben-test/app-clean.js
          test -f verben-test/boot.js
          grep -q 'Verben Test' verben-test/index.html
          grep -q 'boot.js?v=10' verben-test/index.html
          grep -q './app-clean.js?v=1' verben-test/boot.js
          ! grep -qE 'state\.js|progress\.js|cloud-progress-sync|firebase-progress-sync|package-progress-v2|task-route-stable|back-flow-fix' verben-test/index.html
      - name: Clean package and scoring rules
        run: |
          grep -q 'const PACKAGE_SIZE=20' verben-test/app-clean.js
          grep -q 'const VERSION=1' verben-test/app-clean.js
          grep -q 'verbenTestClean' verben-test/app-clean.js
          grep -q 'taskPoints\[taskId\]=5' verben-test/app-clean.js
          grep -q 'examBest' verben-test/app-clean.js
          grep -q 'allTasksDone' verben-test/app-clean.js
          grep -q 'finishPackage' verben-test/app-clean.js
      - name: Course release integration
        run: |
          grep -q 'moduleOpen(assignments,"Verben Test")' index.html
          grep -q "title:'Verben Test'" teacher/verben-test-release.js
          grep -q 'verben-test-release.js?v=1' teacher/index.html
          grep -q 'low==="verben-test"' js/course-releases.js
      - name: Exact Bunny image mappings
        run: |
          for file in sich_vorstellen.webp sich_kaemmen.webp sich_rasieren.webp sich_schminken.webp sich_bewegen.webp koennen.webp; do
            grep -q "$file" verben-test/app-clean.js
          done
