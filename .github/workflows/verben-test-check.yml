name: Verben Test Check

on:
  push:
    paths:
      - 'verben-test/**'
      - 'js/course-releases.js'
      - 'teacher/verben-test-release.js'
      - '.github/workflows/verben-test-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check verben-test/core.js
          node --check verben-test/storage.js
          node --check verben-test/images.js
          node --check verben-test/integrity.js
          node --check verben-test/views.js
          node --check verben-test/tasks.js
          node --check verben-test/task-context.js
          node --check verben-test/integrity-start.js
          node --check verben-test/boot.js
          node --check teacher/verben-test-release.js
      - name: Required files and isolation
        run: |
          test -f verben-test/index.html
          test -f verben-test/styles.css
          grep -q 'Verben Test' verben-test/index.html
          grep -q 'boot.js?v=8' verben-test/index.html
          ! grep -qE 'state\.js|progress\.js|cloud-progress-sync|firebase-progress-sync|package-progress-v2|task-route-stable|back-flow-fix' verben-test/index.html
      - name: Fixed package and scoring rules
        run: |
          grep -q 'const PACKAGE_SIZE=20' verben-test/core.js
          grep -q 'TASKS.length!==10' verben-test/integrity.js
          grep -q 'pkg.taskPoints\[task.id\]=5' verben-test/core.js
          grep -q 'packagePoints()>150' verben-test/integrity.js
          grep -q 'allTasksComplete()' verben-test/tasks.js
          grep -q 'usableTranslation' verben-test/task-context.js
      - name: Exact Bunny image mappings
        run: |
          for file in sich_vorstellen.webp sich_kaemmen.webp sich_rasieren.webp sich_schminken.webp sich_bewegen.webp wandern.webp meinen.webp grillen.webp wecken.webp ueben.webp trainieren.webp losfahren.webp dabeihaben.webp leidtun.webp leiden.webp opfern.webp reissen.webp koennen.webp; do
            grep -q "$file" verben-test/core.js
          done
