name: Fix Perfekt hat bekommen audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perfekt-hat-bekommen-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect hat bekommen audio and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('perfekt/app-stable.js')
          text = app.read_text(encoding='utf-8')
          old = "const RECORDED_AUDIO_SPECIAL={'hat gefallen':'hat_gefallen.mp3','ist gefallen':'ist_gefallen.mp3','hat vergessen':'hat_vergessen.mp3'};"
          new = "const RECORDED_AUDIO_SPECIAL={'hat bekommen':'hat_bekommen.mp3','hat gefallen':'hat_gefallen.mp3','ist gefallen':'ist_gefallen.mp3','hat vergessen':'hat_vergessen.mp3'};"
          if old not in text:
              raise SystemExit('Expected RECORDED_AUDIO_SPECIAL mapping not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('perfekt/index.html')
          html = index.read_text(encoding='utf-8')
          if 'perfekt-fix2' not in html:
              raise SystemExit('Expected Perfekt cache version not found')
          index.write_text(html.replace('perfekt-fix2', 'perfekt-fix3'), encoding='utf-8')
          PY
      - name: Commit active Perfekt audio fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfekt/app-stable.js perfekt/index.html
          git commit -m "Connect hat bekommen to recorded audio"
          git push
