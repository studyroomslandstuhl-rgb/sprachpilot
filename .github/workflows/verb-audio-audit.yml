name: Audit verb Bunny audio

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Audit Bunny infinitive audio and build manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
          git pull --rebase origin "$TARGET_BRANCH"

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const source = fs.readFileSync('verben/data.js', 'utf8');
          const context = { window: {} };
          context.window.window = context.window;
          vm.runInNewContext(source, context, { filename: 'verben/data.js' });

          const verbs = [...new Set(context.window.SP_VERB_GROUP_DATA?.verbs || [])];
          if (!verbs.length) throw new Error('No verbs found in verben/data.js');

          const normalize = value => String(value || '')
            .toLowerCase().trim().normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/ß/g, 'ss')
            .replace(/[.,!?;:“”„"'`()]/g, '')
            .replace(/\s+/g, ' ');

          const slug = (value, separator = '_') => String(value || '')
            .toLowerCase().trim()
            .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, separator)
            .replace(new RegExp('^' + separator + '+|' + separator + '+$', 'g'), '');

          const bases = [
            'https://sprachpilot.b-cdn.net/audio/',
            'https://sprachpilot.b-cdn.net/Audio/'
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function request(url, method, headers = {}) {
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(url, {
                  method,
                  headers,
                  redirect: 'follow',
                  cache: 'no-store',
                  signal: AbortSignal.timeout(10000)
                });
                if (response.body && method !== 'HEAD') await response.body.cancel().catch(() => {});
                if ((response.status === 429 || response.status >= 500) && attempt < 3) {
                  await sleep(700 * attempt);
                  continue;
                }
                return response.status;
              } catch (error) {
                if (attempt === 3) return 0;
                await sleep(700 * attempt);
              }
            }
            return 0;
          }

          async function exists(url) {
            const checkedUrl = url + (url.includes('?') ? '&' : '?') + 'verb-audit=1';
            let status = await request(checkedUrl, 'HEAD');
            if (status >= 200 && status < 400) return { ok: true, status };
            if (status === 404) return { ok: false, status };
            status = await request(checkedUrl, 'GET', { Range: 'bytes=0-0' });
            return { ok: status >= 200 && status < 400, status };
          }

          function candidates(verb) {
            const names = [...new Set([slug(verb, '_'), slug(verb, '-')].filter(Boolean))];
            return bases.flatMap(base => names.map(name => ({
              url: base + encodeURIComponent(name) + '.mp3',
              file: name + '.mp3',
              folder: base.endsWith('/Audio/') ? 'Audio' : 'audio'
            })));
          }

          const rows = verbs.map(verb => ({ verb, key: normalize(verb), candidates: candidates(verb) }));
          let cursor = 0;
          const workers = Array.from({ length: 20 }, async () => {
            while (true) {
              const index = cursor++;
              if (index >= rows.length) return;
              const row = rows[index];
              row.attempts = [];
              for (const candidate of row.candidates) {
                const check = await exists(candidate.url);
                row.attempts.push({ ...candidate, status: check.status });
                if (check.ok) {
                  row.found = candidate;
                  row.status = check.status;
                  break;
                }
              }
              if (!row.found) row.status = row.attempts.at(-1)?.status || 0;
              if ((index + 1) % 25 === 0) console.log(`Checked ${index + 1}/${rows.length}`);
            }
          });
          await Promise.all(workers);

          const available = rows.filter(row => row.found);
          const missing = rows.filter(row => !row.found);
          const map = Object.fromEntries(available.map(row => [row.key, row.found.url]));
          const generatedAt = new Date().toISOString();

          const manifest = `(function(){\n'use strict';\nwindow.SP_VERB_AUDIO_FILES=Object.freeze(${JSON.stringify(map, null, 2)});\nwindow.SP_VERB_AUDIO_MISSING=Object.freeze(${JSON.stringify(missing.map(row => ({
            verb: row.verb,
            candidates: row.attempts.map(item => ({ url: item.url, status: item.status }))
          })), null, 2)});\nwindow.SP_VERB_AUDIO_AUDIT=Object.freeze(${JSON.stringify({
            generatedAt,
            total: rows.length,
            available: available.length,
            missing: missing.length,
            bases
          }, null, 2)});\n})();\n`;
          fs.writeFileSync('verben/audio-manifest.js', manifest);

          const table = missing.length
            ? missing.map(row => `| ${row.verb.replace(/\|/g, '\\|')} | ${row.attempts.map(item => `\`${item.url}\` (${item.status || 'Netzwerkfehler'})`).join('<br>')} |`).join('\n')
            : 'Keine fehlenden Audiodateien.';
          const report = `# Fehlende Infinitiv-Audiodateien\n\nStand: ${generatedAt}\n\nGeprüfte Verben: **${rows.length}**  \nMit Bunny-Aufnahme verbunden: **${available.length}**  \nFehlend: **${missing.length}**\n\n${missing.length ? '| Verb | geprüfte Bunny-Adressen |\n|---|---|\n' + table : table}\n`;
          fs.writeFileSync('verben/audio-missing.md', report);

          console.log(JSON.stringify({ total: rows.length, available: available.length, missing: missing.length }, null, 2));
          NODE

          rm -f .github/workflows/verb-audio-audit.yml
          git add verben/audio-manifest.js verben/audio-missing.md .github/workflows/verb-audio-audit.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate verified Bunny audio manifest for verbs"
          git push origin "HEAD:$TARGET_BRANCH"
