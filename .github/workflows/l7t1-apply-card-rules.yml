name: Apply L7T1 flashcard rules

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Patch and rebuild L7T1 bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node <<'NODE'
          const fs=require('fs');
          const zlib=require('zlib');
          const vm=require('vm');
          const dir='wortschatz/A1-Lektion-7/Thema-1';
          const sourcePath=`${dir}/l7t1-decoded-audit.js`;
          let source=fs.readFileSync(sourcePath,'utf8');

          const styleMarker="})();\n(function(){\n'use strict';\nconst VERSION='l7t1-rev6';";
          const extraStyle=`})();
(function(){
 const s=document.createElement('style');
 s.id='l7t1-card-standard-style';
 s.textContent=\`
 .flip-card{height:500px}
 .card-back-grid{width:100%;display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
 .card-back-image{width:120px;height:120px;border:2px solid var(--lesson-line);border-radius:16px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
 .card-back-image img{width:100%;height:100%;object-fit:contain;display:block}
 .card-back-info{display:grid;gap:8px;min-width:0;width:100%}
 .card-example-box{width:100%;padding:10px;border-radius:13px;background:#fff}
 .card-example-box span{display:block;font-size:13px;color:var(--muted)}
 .card-example-box strong{display:block;margin-top:4px;font-size:17px;line-height:1.35}
 .card-answer-hint{max-width:690px;margin:12px auto 0}
 @media(max-width:760px){
  .flip-card{height:560px}
  .card-back-grid{grid-template-columns:1fr;gap:8px}
  .card-back-image{width:100px;height:100px;margin:0 auto}
 }
 \`;
 document.head.appendChild(s);
})();
(function(){
'use strict';
const VERSION='l7t1-cardrules1';`;
          if(!source.includes(styleMarker))throw new Error('Style/version marker not found');
          source=source.replace(styleMarker,extraStyle);

          const cardStart=source.indexOf(' function cardHtml(item){');
          const cardEnd=source.indexOf(' function orderHtml(item)',cardStart);
          if(cardStart<0||cardEnd<0)throw new Error('cardHtml block not found');
          const newCard=` function cardHtml(item){
   const example=item.example?\`<div class="card-example-box"><span>Beispiel</span><strong>\${esc(item.example)}</strong></div>\`:'';
   return \`<div class="flip-wrap"><div id="flipCard" class="flip-card \${cardFlipped?'flipped':''}" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="flip-face flip-front">\${mediaImage(item,item.word,'card-image',true)}<div class="card-translation-box"><span>Bedeutung</span><strong>\${esc(item.meaning||'')}</strong></div><div class="flip-note">Karte umdrehen</div></div><div class="flip-face flip-back"><div class="card-back-grid">\${mediaImage(item,item.word,'card-back-image',false)}<div class="card-back-info"><div class="flip-word">\${esc(item.word)}</div><div class="card-translation-box"><span>Bedeutung</span><strong>\${esc(item.meaning||'')}</strong></div>\${item.plural?\`<div class="card-details"><div><span>Plural</span><strong>\${esc(item.plural)}</strong></div></div>\`:''}\${example}\${audioButton(item,'Anhören','btn secondary card-listen-btn')}</div></div></div></div></div><div class="actions card-actions"><button class="btn" data-action="card-mic">🎤 Sprechen</button><button class="btn secondary" data-action="card-write">✍️ Schreiben</button></div>\${cardFlipped?'<div class="hint card-answer-hint">Sprich das Wort oder schreibe es. Erst eine richtige Antwort geht weiter.</div>':''}<div id="cardWrite" \${writeOpen?'':'hidden'}>\${inputHtml('Wort schreiben')}</div>\`;
  }
 `;
          source=source.slice(0,cardStart)+newCard+source.slice(cardEnd);

          source=source.replace(/\n  function cardNext\(\)\{[^\n]*\}/,'');
          source=source.replace("else if(action==='card-next')cardNext();",'');

          const keyMarker="  document.getElementById('answerInput')?.addEventListener('keydown',event=>{if(event.key==='Enter')check(event.target.value);});";
          const keyReplacement=`  const flip=document.getElementById('flipCard');
  flip?.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();revealCard();}});
  document.getElementById('answerInput')?.addEventListener('keydown',event=>{if(event.key==='Enter')check(event.target.value);});`;
          if(!source.includes(keyMarker))throw new Error('Keyboard marker not found');
          source=source.replace(keyMarker,keyReplacement);

          if(source.includes("data-action=\"card-next\"")||source.includes('function cardNext'))throw new Error('Card skip path still present');
          if(!source.includes('Erst eine richtige Antwort geht weiter.'))throw new Error('Required card hint missing');
          if(!source.includes('role="button" tabindex="0" aria-label="Karte umdrehen"'))throw new Error('Card accessibility attributes missing');
          new vm.Script(source);

          const payload=zlib.gzipSync(Buffer.from(source,'utf8'),{level:9}).toString('base64');
          const logical=[];
          for(let i=0;i<5;i++){
            const start=Math.floor(payload.length*i/5);
            const end=Math.floor(payload.length*(i+1)/5);
            logical.push(payload.slice(start,end));
          }
          const split=Math.floor(logical[2].length/2);
          const physical=[logical[0],logical[1],logical[2].slice(0,split),logical[2].slice(split),logical[3],logical[4]];
          const files=[
            ['l7t1-rev5-part-01.js',"window.L7T1_REV5_PARTS=window.L7T1_REV5_PARTS||[];window.L7T1_REV5_PARTS[0]='"+physical[0]+"';"],
            ['l7t1-rev5-part-02.js',"window.L7T1_REV5_PARTS[1]='"+physical[1]+"';"],
            ['l7t1-rev5-part-03a.js',"window.L7T1_REV5_PARTS[2]='"+physical[2]+"';"],
            ['l7t1-rev5-part-03b.js',"window.L7T1_REV5_PARTS[2]+='"+physical[3]+"';"],
            ['l7t1-rev5-part-04.js',"window.L7T1_REV5_PARTS[3]='"+physical[4]+"';"],
            ['l7t1-rev5-part-05.js',"window.L7T1_REV5_PARTS[4]='"+physical[5]+"';"]
          ];
          for(const [file,text] of files)fs.writeFileSync(`${dir}/${file}`,text);

          for(const file of ['index.html','task.html','uebersicht.html']){
            const path=`${dir}/${file}`;
            let html=fs.readFileSync(path,'utf8');
            html=html.replace(/v=l7t1-[^"']+/g,'v=l7t1-cardrules1');
            fs.writeFileSync(path,html);
          }
          NODE
          rm -f wortschatz/A1-Lektion-7/Thema-1/l7t1-decoded-audit.js
          rm -f .github/workflows/l7t1-apply-card-rules.yml
          git add wortschatz/A1-Lektion-7/Thema-1 .github/workflows/l7t1-apply-card-rules.yml
          git commit -m "Apply no-skip flashcard rules to L7T1"
          git push origin HEAD:${GITHUB_HEAD_REF}
