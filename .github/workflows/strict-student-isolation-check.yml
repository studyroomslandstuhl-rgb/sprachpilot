name: Validate strict student UID isolation

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'js/student-secure-auth.js'
      - 'js/student-identity.js'
      - 'js/session-restore.js'
      - 'js/account-progress-sync.js'
      - 'js/account-progress-sync-safe.js'
      - 'js/account-progress-autostart.js'
      - 'js/learning-auth-gate.js'
      - 'js/secure-access-gate.js'
      - 'js/guard.js'
      - 'teacher/student-security-lookup.js'
      - 'teacher/progress-security-alias-core.js'
      - 'teacher/progress-security-alias-migration.js'
      - 'teacher/progress-security-collision-diagnostics.js'
      - 'teacher/student-collision-repair-core.js'
      - 'teacher/student-collision-repair.js'
      - 'teacher/legacy-progress-resolution-core.js'
      - 'teacher/legacy-progress-resolution.js'
      - 'teacher/one-time-duplicate-incident-core.js'
      - 'teacher/one-time-duplicate-incident.js'
      - 'teacher/one-time-duplicate-incident-ui.js'
      - 'teacher/student-identity-guard.js'
      - 'teacher/index.html'
      - 'student-dashboard/dashboard-bootstrap.js'
      - 'student-dashboard/dashboard-lite.js'
      - 'student-dashboard/progress-alias-unifier.js'
      - 'student-dashboard/index.html'
      - 'profile/index.html'
      - 'login/index.html'
      - 'register/index.html'
      - 'scripts/inject-learning-auth-gate.py'
      - 'scripts/test-firestore-student-isolation.mjs'
      - 'scripts/test-firestore-archived-progress-isolation.mjs'
      - 'scripts/test-progress-security-alias-core.mjs'
      - 'scripts/test-progress-security-alias-reporting.mjs'
      - 'scripts/test-progress-security-collision-diagnostics.mjs'
      - 'scripts/test-student-collision-repair-core.mjs'
      - 'scripts/test-student-collision-backup-permissions.mjs'
      - 'scripts/test-legacy-progress-resolution-core.mjs'
      - 'scripts/test-archived-progress-resolver.mjs'
      - 'scripts/test-one-time-duplicate-incident-core.mjs'
      - 'scripts/test-one-time-duplicate-incident-safety.mjs'
      - 'scripts/test-one-time-incident-rollback-rules.mjs'
      - 'scripts/test-private-query-boundaries.mjs'
      - 'scripts/test-secure-access-gate.mjs'
      - '.github/workflows/strict-student-isolation-check.yml'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install isolated Firebase test dependencies
        run: npm install --no-save firebase@10.12.5 @firebase/rules-unit-testing@3.0.3 firebase-tools@13.15.1

      - name: Check JavaScript and Python syntax
        run: |
          node --check js/student-secure-auth.js
          node --check js/student-identity.js
          node --check js/session-restore.js
          node --check js/account-progress-sync.js
          node --check js/account-progress-sync-safe.js
          node --check js/account-progress-autostart.js
          node --check js/learning-auth-gate.js
          node --check js/secure-access-gate.js
          node --check js/guard.js
          node --check teacher/student-security-lookup.js
          node --check teacher/progress-security-alias-core.js
          node --check teacher/progress-security-alias-migration.js
          node --check teacher/progress-security-collision-diagnostics.js
          node --check teacher/student-collision-repair-core.js
          node --check teacher/student-collision-repair.js
          node --check teacher/legacy-progress-resolution-core.js
          node --check teacher/legacy-progress-resolution.js
          node --check teacher/one-time-duplicate-incident-core.js
          node --check teacher/one-time-duplicate-incident.js
          node --check teacher/one-time-duplicate-incident-ui.js
          node --check teacher/student-identity-guard.js
          node --check student-dashboard/dashboard-bootstrap.js
          node --check student-dashboard/dashboard-lite.js
          node --check student-dashboard/progress-alias-unifier.js
          node --check scripts/test-firestore-student-isolation.mjs
          node --check scripts/test-firestore-archived-progress-isolation.mjs
          node --check scripts/test-progress-security-alias-core.mjs
          node --check scripts/test-progress-security-alias-reporting.mjs
          node --check scripts/test-progress-security-collision-diagnostics.mjs
          node --check scripts/test-student-collision-repair-core.mjs
          node --check scripts/test-student-collision-backup-permissions.mjs
          node --check scripts/test-legacy-progress-resolution-core.mjs
          node --check scripts/test-archived-progress-resolver.mjs
          node --check scripts/test-one-time-duplicate-incident-core.mjs
          node --check scripts/test-one-time-duplicate-incident-safety.mjs
          node --check scripts/test-one-time-incident-rollback-rules.mjs
          node --check scripts/test-private-query-boundaries.mjs
          node --check scripts/test-secure-access-gate.mjs
          python3 -m py_compile scripts/inject-learning-auth-gate.py

      - name: Test progress ownership resolver
        run: node scripts/test-progress-security-alias-core.mjs

      - name: Test archived progress resolver behavior
        run: node scripts/test-archived-progress-resolver.mjs

      - name: Test progress migration error reporting
        run: node scripts/test-progress-security-alias-reporting.mjs

      - name: Test read-only progress collision diagnostics
        run: node scripts/test-progress-security-collision-diagnostics.mjs

      - name: Test targeted historical student collision repair
        run: node scripts/test-student-collision-repair-core.mjs

      - name: Test rollback-rules collision backup path
        run: node scripts/test-student-collision-backup-permissions.mjs

      - name: Test final legacy progress resolution plan
        run: node scripts/test-legacy-progress-resolution-core.mjs

      - name: Test one-time duplicate profile point consolidation
        run: node scripts/test-one-time-duplicate-incident-core.mjs

      - name: Test one-time duplicate profile safety contract
        run: node scripts/test-one-time-duplicate-incident-safety.mjs

      - name: Test private query boundaries
        run: node scripts/test-private-query-boundaries.mjs

      - name: Test secure access gate
        run: node scripts/test-secure-access-gate.mjs

      - name: Test Firestore UID isolation in emulator
        run: npx firebase emulators:exec --only firestore --project demo-sprachpilot-student-isolation "node scripts/test-firestore-student-isolation.mjs"

      - name: Test archived progress teacher-only isolation in emulator
        run: npx firebase emulators:exec --only firestore --project demo-sprachpilot-archived-progress "node scripts/test-firestore-archived-progress-isolation.mjs"

      - name: Test one-time incident against rollback production rules
        run: npx firebase emulators:exec --only firestore --project demo-one-time-rollback "node scripts/test-one-time-incident-rollback-rules.mjs"
