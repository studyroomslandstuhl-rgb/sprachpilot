name: Deploy SprachPilot Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          import re

          engine_path = Path('_site/verben/engine.js')
          engine = engine_path.read_text(encoding='utf-8')
          old_engine = "function rebuildGroups(){GROUPS=[];for(let i=0;i<VERBS.length;i+=GROUP_SIZE)GROUPS.push({id:GROUPS.length+1,verbs:VERBS.slice(i,i+GROUP_SIZE),signature:VERBS.slice(i,i+GROUP_SIZE).join('|')})}\nfunction setActiveVerbs(list){const allowed=new Set((list||[]).filter(v=>ALL.includes(v)));VERBS=ALL.filter(v=>allowed.has(v));rebuildGroups()}"
          new_engine = """function groupBare(v){return String(v||'').replace(/^sich\\s+/,'')}
          function groupBucket(v){
           const b=groupBare(v);
           if(Object.prototype.hasOwnProperty.call(SEPARABLE,v)||Object.prototype.hasOwnProperty.call(SEPARABLE,b))return'separable';
           if((b.endsWith('ieren')&&b!=='verlieren')||INSEPARABLE_RE.test(b))return'middle';
           if(IRREGULAR.has(v)||IRREGULAR.has(b)||MODALS.has(v)||MODALS.has(b))return'strong';
           return'regular'
          }
          function pedagogicalOrder(list){
           const buckets={regular:[],strong:[],middle:[],separable:[]};
           for(const v of list)buckets[groupBucket(v)].push(v);
           const first=buckets.regular.splice(0,80);
           while(first.length<80&&buckets.strong.length)first.push(buckets.strong.shift());
           const strongPhase=buckets.strong.splice(0,140);
           while(strongPhase.length<140&&buckets.regular.length)strongPhase.push(buckets.regular.shift());
           return first.concat(strongPhase,buckets.regular,buckets.strong,buckets.middle,buckets.separable)
          }
          function rebuildGroups(){GROUPS=[];for(let i=0;i<VERBS.length;i+=GROUP_SIZE){const verbs=VERBS.slice(i,i+GROUP_SIZE);GROUPS.push({id:GROUPS.length+1,verbs,signature:verbs.join('|')})}}
          function setActiveVerbs(list){const allowed=new Set((list||[]).filter(v=>ALL.includes(v)));VERBS=pedagogicalOrder(ALL.filter(v=>allowed.has(v)));rebuildGroups()}"""
          if old_engine in engine:
              engine_path.write_text(engine.replace(old_engine, new_engine), encoding='utf-8')
              print('Verben grouping patch applied.')
          elif 'function pedagogicalOrder(list)' in engine:
              print('Verben grouping patch already present.')
          else:
              print('WARNING: Verben grouping block changed; publishing unchanged source instead of stopping deployment.')

          perfekt_path = Path('_site/perfekt/app-stable.js')
          perfekt = perfekt_path.read_text(encoding='utf-8')
          old_participle = "function participle(v){if(SPECIAL[v])return SPECIAL[v];const b=bare(v);if(SPECIAL[b])return SPECIAL[b];if(b.endsWith('ieren'))return regularPart(b,false);if(INSEP.test(b)||NO_GE.has(v)||NO_GE.has(b)||/^(über|unter)/.test(b))return regularPart(b,false);return regularPart(b,true)}"
          new_participle = """const SEPARABLE_PREFIXES=['spazieren ','zurück','zusammen','dabei','kennen','hinzu','heraus','hinein','herüber','hinüber','weiter','wieder','vorbei','fest','statt','teil','fern','auf','aus','ein','an','ab','mit','vor','zu','um','los','hin','her','weg','über','unter','durch','leid'];
          function baseParticiple(v){if(SPECIAL[v])return SPECIAL[v];if(v.endsWith('ieren'))return regularPart(v,false);if(INSEP.test(v)||NO_GE.has(v)||/^(über|unter)/.test(v))return regularPart(v,false);return regularPart(v,true)}
          function participle(v){
           if(SPECIAL[v])return SPECIAL[v];
           const b=bare(v);
           if(SPECIAL[b])return SPECIAL[b];
           const label=BASE?.groupLabel?.(v)||BASE?.groupLabel?.(b);
           if(SEP.has(v)||SEP.has(b)||label==='Trennbar'){
            const prefix=SEPARABLE_PREFIXES.find(part=>b.startsWith(part)&&b.length>part.length);
            if(prefix)return prefix+baseParticiple(b.slice(prefix.length))
           }
           return baseParticiple(b)
          }"""
          if old_participle in perfekt:
              perfekt = perfekt.replace(old_participle, new_participle)
              print('Perfekt separable-participle patch applied.')
          elif 'const SEPARABLE_PREFIXES=' in perfekt:
              print('Perfekt separable-participle patch already present.')
          else:
              print('WARNING: Perfekt participle block changed; publishing unchanged participle source.')

          old_perfekt = "const CATEGORY_ORDER=[['reflexive','Reflexive Verben'],['separable','Trennbare Verben'],['strong','Starke / unregelmäßige Verben'],['ieren','Verben auf -ieren'],['inseparable','Nicht trennbare Verben'],['weak','Regelmäßige Verben']];"
          if old_perfekt in perfekt:
              perfekt = perfekt.replace(old_perfekt, "const CATEGORY_ORDER=[];")
          old_functions = "function category(v){if(v.startsWith('sich '))return'reflexive';const label=BASE?.groupLabel?.(v);if(SEP.has(v)||label==='Trennbar')return'separable';if(bare(v).endsWith('ieren')&&v!=='verlieren')return'ieren';if(label==='Unregelmäßig'||SPECIAL[v]&&['schaffen','trennen','teilen','schauen','senden','passieren'].indexOf(v)<0)return'strong';if(INSEP.test(bare(v))||NO_GE.has(v))return'inseparable';return'weak'}\nfunction rebuildGroups(){GROUPS=[];let id=1;for(const [key,title]of CATEGORY_ORDER){const list=VERBS.filter(v=>category(v)===key);for(let i=0;i<list.length;i+=20)GROUPS.push({id:id++,category:key,title,verbs:list.slice(i,i+20),signature:key+'|'+list.slice(i,i+20).join('|')})}}"
          new_functions = """function category(v){
           const b=bare(v),label=BASE?.groupLabel?.(v);
           if(SEP.has(v)||SEP.has(b)||label==='Trennbar')return'separable';
           if((b.endsWith('ieren')&&b!=='verlieren')||INSEP.test(b)||NO_GE.has(v)||NO_GE.has(b))return'middle';
           if(label==='Unregelmäßig'||SPECIAL[v]&&['schaffen','trennen','teilen','schauen','senden','passieren'].indexOf(v)<0||SPECIAL[b]&&['schaffen','trennen','teilen','schauen','senden','passieren'].indexOf(b)<0)return'strong';
           return'regular'
          }
          function orderedPerfektVerbs(){
           const buckets={regular:[],strong:[],middle:[],separable:[]};
           for(const v of VERBS)buckets[category(v)].push(v);
           const first=buckets.regular.splice(0,80);
           while(first.length<80&&buckets.strong.length)first.push(buckets.strong.shift());
           const strongPhase=buckets.strong.splice(0,140);
           while(strongPhase.length<140&&buckets.regular.length)strongPhase.push(buckets.regular.shift());
           return first.concat(strongPhase,buckets.regular,buckets.strong,buckets.middle,buckets.separable)
          }
          function rebuildGroups(){
           GROUPS=[];
           const ordered=orderedPerfektVerbs();
           for(let i=0;i<ordered.length;i+=20){
            const verbs=ordered.slice(i,i+20),number=GROUPS.length+1;
            let categoryKey='mixed',title='Regelmäßige und starke Verben';
            if(number<=4){categoryKey='regular';title='Regelmäßige Verben'}
            else if(number<=11){categoryKey='strong';title='Starke / unregelmäßige Verben'}
            else if(verbs.every(v=>category(v)==='separable')){categoryKey='separable';title='Trennbare Verben'}
            else if(verbs.every(v=>category(v)==='middle')){categoryKey='middle';title='Nicht trennbare Verben / Verben auf -ieren'}
            GROUPS.push({id:number,category:categoryKey,title,verbs,signature:categoryKey+'|'+verbs.join('|')})
           }
          }"""
          if old_functions in perfekt:
              perfekt = perfekt.replace(old_functions, new_functions)
              print('Perfekt grouping patch applied.')
          elif 'function orderedPerfektVerbs()' in perfekt:
              print('Perfekt grouping patch already present.')
          else:
              print('WARNING: Perfekt grouping block changed; publishing unchanged source instead of stopping deployment.')
          perfekt_path.write_text(perfekt, encoding='utf-8')

          l6t3_dir = Path('_site/wortschatz/A1-Lektion-6/Thema-3')
          performance_tag = '<script src="l6t3-performance.js?v=3"></script>'
          old_performance_pattern = re.compile(r'<script src="l6t3-performance\.js\?v=\d+"></script>')
          app_pattern = re.compile(r'(<script src="app\.js\?v=[^"]+"></script>)')
          guard_pattern = re.compile(r'<script type="module" src="/js/guard\.js\?v=[^"]+"></script>')
          guard_tag = '<script type="module" src="/js/guard.js?v=l6t3-performance4"></script>'
          for html_path in l6t3_dir.glob('*.html'):
              html = html_path.read_text(encoding='utf-8')
              html = guard_pattern.sub(guard_tag, html)
              html = old_performance_pattern.sub('', html)
              if performance_tag not in html:
                  if app_pattern.search(html):
                      html = app_pattern.sub(r'\1' + performance_tag, html, count=1)
                  elif '</body>' in html:
                      html = html.replace('</body>', performance_tag + '</body>')
                  else:
                      print(f'WARNING: L6T3 page has no app script or closing body tag: {html_path}')
              html_path.write_text(html, encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment status branch
        uses: actions/checkout@v6
        with:
          ref: deploy-status
          fetch-depth: 1

      - name: Write deployment result
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          result = {
              "result": os.environ.get("DEPLOY_RESULT", "unknown"),
              "source_sha": os.environ.get("SOURCE_SHA", ""),
              "page_url": os.environ.get("PAGE_URL", ""),
              "run_id": os.environ.get("RUN_ID", ""),
              "run_attempt": os.environ.get("RUN_ATTEMPT", ""),
              "run_url": f"https://github.com/{os.environ.get('REPOSITORY', '')}/actions/runs/{os.environ.get('RUN_ID', '')}",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("deployment-status.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)
              file.write("\n")
          PY

      - name: Publish deployment result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Pages deployment result for ${GITHUB_SHA}"
          git push origin HEAD:deploy-status
