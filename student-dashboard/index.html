<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schüler-Dashboard · SprachPilot</title><style>:root{--blue:#47ABC6;--dark:#123047;--line:#D9EEF7;--muted:#5F7180}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#E8FBFF,#fff);color:var(--dark)}.wrap{max-width:1160px;margin:0 auto;padding:16px}.top,.card,.topic{background:#fff;border:1px solid var(--line);box-shadow:0 14px 34px rgba(18,48,71,.12)}.top{border-radius:24px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand img{width:58px;height:58px;object-fit:contain;border-radius:16px}.brand h1{margin:0;font-size:25px}.sub,.small{font-size:14px;color:var(--muted)}.userbar{display:flex;gap:8px;flex-wrap:wrap}.navbtn,.openBtn{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#EFFAFF;color:var(--dark);font-weight:800;text-decoration:none;cursor:pointer}.logout{background:#FFE1E1;color:#8A1F11}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin:16px 0}.card{border-radius:22px;padding:18px}.progressHead{display:flex;align-items:center;gap:16px}.circle{width:96px;height:96px;border-radius:50%;background:conic-gradient(#16A34A calc(var(--p)*1%),#EFFAFF 0);display:grid;place-items:center;font-weight:900;font-size:24px}.bar{height:12px;background:#EFFAFF;border-radius:999px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#47ABC6,#84E3FF);border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#F0FBFF;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}.stat b{display:block;font-size:25px;color:#2F7F96}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.sectio
