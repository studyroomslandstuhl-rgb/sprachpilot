<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Schüler-Dashboard · SprachPilot</title>
<style>
html:not([data-sp-dashboard-auth="ok"]){visibility:hidden!important}
:root{--blue:#47ABC6;--dark:#123047;--line:#D9EEF7;--muted:#5F7180}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#E8FBFF,#fff);color:var(--dark)}.wrap{max-width:1160px;margin:0 auto;padding:16px}.top,.card{background:#fff;border:1px solid var(--line);box-shadow:0 14px 34px rgba(18,48,71,.12)}.top{border-radius:24px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand img{width:58px;height:58px;object-fit:contain;border-radius:16px}.brand h1{margin:0;font-size:25px}.sub,.small{font-size:14px;color:var(--muted)}.userbar{display:flex;gap:8px;flex-wrap:wrap}.navbtn{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#EFFAFF;color:var(--dark);font-weight:800;text-decoration:none;cursor:pointer}.logout{background:#FFE1E1;color:#8A1F11}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin:16px 0}.card{border-radius:22px;padding:18px}.progressHead{display:flex;align-items:center;gap:16px}.circle{width:96px;height:96px;border-radius:50%;background:conic-gradient(#16A34A calc(var(--p)*1%),#EFFAFF 0);display:grid;place-items:center;font-weight:900;font-size:24px;flex:0 0 96px}.bar{height:12px;background:#EFFAFF;border-radius:999px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#47ABC6,#84E3FF);border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:100%}.stat{background:#F0FBFF;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:92px}.stat b{display:block;font-size:25px;color:#2F7F96}.stat span{font-size:13px;font-weight:800;color:var(--muted)}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.sectionTitle h2{margin:0;font-size:22px;color:#2F7F96}.sectionActions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.live{background:#E8F9F0;color:#166534;border-radius:999px;padding:7px 10px;font-weight:800;font-size:12px}.leader{display:grid;gap:8px;min-height:90px}.rank{background:#F8FCFF;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}.rankNo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#84E3FF,#47ABC6);display:grid;place-items:center;font-weight:900}.points{text-align:right}.empty{padding:18px;border-radius:18px;background:#F8FCFF;border:1px dashed #9FB7C7}@media(max-width:800px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.rank{grid-template-columns:34px 1fr}.rank .points{grid-column:2;text-align:left}}@media(max-width:520px){.wrap{padding:10px}.progressHead{align-items:flex-start}.circle{width:82px;height:82px;flex-basis:82px;font-size:21px}.stats{grid-template-columns:1fr}.stat{min-height:72px}.sectionTitle{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap"><header class="top"><a class="brand" href="/index.html"><img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo"><div><h1>SprachPilot</h1><div class="sub">Schüler-Dashboard</div></div></a><div class="userbar"><span id="userPill" class="navbtn">Schüler/in · Kurs</span><a class="navbtn" href="/profile/index.html">Profil</a><a class="navbtn" href="/index.html">Start</a><button class="navbtn logout" id="logoutBtn">Abmelden</button></div></header><section class="hero"><div class="card"><div class="progressHead"><div class="circle" id="totalCircle" style="--p:0"><span>0%</span></div><div style="flex:1"><h2 style="margin:0">Dein Lernstand</h2><div class="small" id="summaryText">Dein Fortschritt wird aktualisiert.</div><div class="bar"><div class="fill" id="totalFill" style="width:0%"></div></div><div class="small" id="lastUpdated">Stand wird geladen …</div></div></div></div><div class="card"><div class="stats"><div class="stat"><b id="pointsTotal">0</b><span>Punkte</span></div><div class="stat"><b id="starsTotal">0</b><span>Sterne</span></div><div class="stat"><b id="doneTotal">0</b><span>Themen fertig</span></div></div></div></section><div class="sectionTitle"><h2>Rangliste im Kurs</h2><div class="sectionActions"><span class="live" id="rankingStatus">wird automatisch aktualisiert</span><button class="navbtn" id="rankingBtn" type="button">Jetzt aktualisieren</button></div></div><section class="card leader" id="leaderboard"><div class="empty">Rangliste wird geladen …</div></section></div>
<script src="/shared/sp-cache-epoch.js?v=20260831-global-progress-sync9"></script><script type="module" src="dashboard-bootstrap.js?v=20260902-fast-start1"></script>
</body></html>
