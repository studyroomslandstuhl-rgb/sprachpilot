<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schüler-Dashboard · SprachPilot</title>
<style>
:root{--blue:#47ABC6;--blue-dark:#2F7F96;--baby:#84E3FF;--green:#16A34A;--ink:#123047;--muted:#5F7180;--line:#D9EEF7;--shadow:0 14px 34px rgba(18,48,71,.12);--gold:#F59E0B;--red:#DC2626;--gray:#94A3B8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#E8FBFF,#F6FDFF 46%,#fff);color:var(--ink);min-height:100vh}.wrap{max-width:1160px;margin:0 auto;padding:16px}.top,.card,.module{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.top{border-radius:24px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand img{width:58px;height:58px;object-fit:contain;border-radius:16px}.brand h1{margin:0;font-size:25px}.sub,.small{font-size:14px;color:var(--muted)}.userbar{display:flex;gap:8px;flex-wrap:wrap}.navbtn,.openBtn{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#EFFAFF;color:var(--ink);font-weight:800;text-decoration:none;cursor:pointer}.logout{background:#FFE1E1;color:#8A1F11}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin:16px 0}.card{border-radius:22px;padding:18px}.progressHead{display:flex;align-items:center;gap:16px}.circle{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#EFFAFF 0);display:grid;place-items:center;font-weight:900;font-size:24px;position:relative;flex:0 0 auto}.circle:after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}.circle span{position:relative;z-index:2}.bar{height:12px;background:#EFFAFF;border-radius:999px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--baby));border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#F0FBFF;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}.stat b{display:block;font-size:25px;color:var(--blue-dark)}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.sectionTitle h2{margin:0;font-size:22px;color:var(--blue-dark)}.count,.chip,.badge{background:#E8F9F0;color:#166534;border-radius:999px;padding:6px 10px;font-weight:800;font-size:13px}.contentGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.topic{border-radius:22px;padding:15px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;position:relative;overflow:hidden}.topic h3{margin:0;font-size:17px}.topic .meta{display:flex;gap:6px;flex-wrap:wrap}.topic .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.topic .percent{font-size:24px;font-weight:900;color:var(--blue-dark)}.topic.neu{border-color:#FBBF24;background:linear-gradient(135deg,#FFFBEB,#fff);box-shadow:0 0 0 2px rgba(245,158,11,.22),var(--shadow)}.topic.neu .badge{background:#FEF3C7;color:#92400E}.topic.active .badge{background:#DBEAFE;color:#1E40AF}.topic.repeat{border-color:#FCA5A5;background:linear-gradient(135deg,#FFF1F2,#fff)}.topic.repeat .badge,.topic.repeat .openBtn{background:#FEE2E2;color:#991B1B}.topic.done{background:#F8FAFC;border-color:#CBD5E1;color:#64748B}.topic.done .fill{background:#CBD5E1}.topic.done .badge{background:#E2E8F0;color:#475569}.topic .openBtn{margin-top:auto;text-align:center}.leader{display:grid;gap:8px}.rank{background:#F8FCFF;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}.rankNo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--baby),var(--blue));display:grid;place-items:center;font-weight:900}.empty{padding:18px;border-radius:18px;background:#F8FCFF;border:1px dashed #9FB7C7;color:#263846}@media(max-width:800px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.circle{width:84px;height:84px;font-size:21px}.rank{grid-template-columns:34px 1fr}.rank .points{grid-column:2}.userbar .navbtn{flex:1;text-align:center}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="brand" href="/index.html"><img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo"><div><h1>SprachPilot</h1><div class="sub">Schüler-Dashboard</div></div></a><div class="userbar"><span id="userPill" class="navbtn">Schüler/in · Kurs</span><a class="navbtn" href="/profile/index.html">Profil</a><a class="navbtn" href="/index.html">Start</a><button class="navbtn logout" id="logoutBtn">Abmelden</button></div></header>
<section class="hero"><div class="card"><div class="progressHead"><div class="circle" id="totalCircle" style="--p:0"><span>0%</span></div><div style="flex:1"><h2 style="margin:0">Dein Lernstand</h2><div class="small" id="summaryText">Dein Fortschritt wird geladen.</div><div class="bar"><div class="fill" id="totalFill" style="width:0%"></div></div></div></div></div><div class="card"><div class="stats"><div class="stat"><b id="pointsTotal">0</b><span>Punkte</span></div><div class="stat"><b id="starsTotal">0</b><span>Sterne</span></div><div class="stat"><b id="doneTotal">0</b><span>fertig</span></div></div></div></section>
<div class="sectionTitle"><h2>Freigeschaltete Inhalte</h2><span class="count" id="contentCount">0 Inhalte</span></div><section class="contentGrid" id="contentGrid"></section>
<div class="sectionTitle"><h2>Rangliste im Kurs</h2><button class="navbtn" id="rankingBtn">Rangliste aktualisieren</button></div><section class="card leader" id="leaderboard"><div class="empty">Rangliste lädt …</div></section>
</div>
<script type="module" src="dashboard-strict-release.js?v=1"></script>
</body>
</html>
