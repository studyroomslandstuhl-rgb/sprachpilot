<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SprachPilot – Einloggen</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="container">
  <section class="hero">
    <a href="/index.html" style="text-decoration:none;color:inherit">
      <div class="logo-wrap"><img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo"></div>
      <h1>SprachPilot</h1>
    </a>
    <p class="subtitle">Deutsch lernen mit klaren Übungen, Bildern, Fragen und Wiederholung.</p>
  </section>

  <section class="card">
    <h2>Einloggen</h2>
    <p class="small">Melde dich mit deiner E-Mail und deinem Passwort an.</p>

    <label>E-Mail *</label>
    <input id="loginEmail" type="email" required autocomplete="email" placeholder="name@email.com">

    <label>Passwort *</label>
    <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Passwort">

    <button id="studentLoginButton" class="success" type="button">Einloggen</button>
    <button id="resetPasswordButton" class="btn secondary" type="button">Passwort vergessen</button>
    <a class="btn secondary" href="../register/">Noch kein Konto? Registrieren</a>
    <a class="btn secondary" href="../">Zur Startseite</a>
    <div id="loginResult"></div>
  </section>

  <footer>© SprachPilot</footer>
</div>

<script type="module">
import {
  loginStudentWithEmailPassword,
  loginStudentProfileWithEmailPassword,
  resetStudentPassword,
  $,
  safeText,
  getRedirectTarget
} from "../js/student-login-v2.js?v=3";

let loginInFlight=false;
let slowLoginTimer=null;

function show(html){
  const result=$("loginResult");
  if(result)result.innerHTML=html;
}
function setLoginBusy(busy){
  const button=$("studentLoginButton");
  if(button){
    button.disabled=!!busy;
    button.textContent=busy?'Wird eingeloggt …':'Einloggen';
  }
}
function startSlowLoginNotice(text='Die Verbindung ist langsam. Die Anmeldung läuft weiter – bitte nicht neu laden.'){
  clearTimeout(slowLoginTimer);
  slowLoginTimer=setTimeout(()=>{
    if(loginInFlight)show(`<div class="ok"><b>Anmeldung läuft noch.</b><br>${safeText(text)}</div>`);
  },15000);
}
function stopSlowLoginNotice(){clearTimeout(slowLoginTimer);slowLoginTimer=null;}
function goAfterLogin(){
  const target=getRedirectTarget("/index.html");
  location.href=target.includes("/teacher/")?"/index.html":target;
}

function showProfileChoices(error,email,password){
  const result=$("loginResult");
  if(!result)return;
  result.innerHTML='<div class="ok"><b>Mehrere Kursprofile gefunden.</b><br>Wähle den Kurs, den du öffnen möchtest.</div>';
  const wrap=document.createElement('div');
  wrap.style.display='grid';
  wrap.style.gap='8px';
  wrap.style.marginTop='10px';

  for(const profile of Array.isArray(error?.profiles)?error.profiles:[]){
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='btn secondary';
    btn.textContent=[profile.name,profile.course].filter(Boolean).join(' · ')||'Kursprofil';
    btn.onclick=async()=>{
      if(loginInFlight)return;
      loginInFlight=true;
      setLoginBusy(true);
      [...wrap.querySelectorAll('button')].forEach(b=>b.disabled=true);
      show('<div class="ok">Kurs wird geöffnet …</div>');
      startSlowLoginNotice('Der Kurs wird noch geladen. Bitte nicht erneut klicken oder die Seite neu laden.');
      try{
        await loginStudentProfileWithEmailPassword(email,password,profile.id);
        goAfterLogin();
      }catch(err){
        handleLoginError(err,email,password);
      }finally{
        stopSlowLoginNotice();
        loginInFlight=false;
        setLoginBusy(false);
        [...wrap.querySelectorAll('button')].forEach(b=>b.disabled=false);
      }
    };
    wrap.appendChild(btn);
  }
  result.appendChild(wrap);
}

function handleLoginError(err,email,password){
  console.error(err);
  const code=String(err?.code||"");
  const message=String(err?.message||"");

  if(message==="MULTIPLE_STUDENT_PROFILES"){
    showProfileChoices(err,email,password);
    return;
  }
  if(message==="EMAIL_NOT_VERIFIED")show('<div class="no"><b>Bitte bestätige zuerst deine E-Mail.</b><br>Wir haben dir eine neue Bestätigungs-E-Mail geschickt. Danach kannst du dich einloggen.</div>');
  else if(message==="STUDENT_NOT_FOUND")show('<div class="no"><b>Zu diesem Konto wurde noch kein Kursprofil gefunden.</b><br>Wenn du SprachPilot schon früher benutzt hast, gehe zu „Noch kein Konto? Registrieren“ und gib dort einmal deinen Kurscode ein.</div>');
  else if(message==="STUDENT_COURSE_MISSING")show('<div class="no"><b>Bei deinem Profil fehlt der Kurs.</b><br>Bitte wende dich an deine Lehrkraft.</div>');
  else if(message==="STUDENT_AUTH_OWNERSHIP_MISMATCH")show('<div class="no"><b>Dieses Profil ist bereits mit einem anderen Konto verbunden.</b><br>Bitte wende dich an deine Lehrkraft.</div>');
  else if(message==="LOCAL_PROGRESS_ISOLATION_FAILED")show('<div class="no"><b>Die Anmeldung konnte auf diesem Gerät nicht abgeschlossen werden.</b><br>Bitte lade die Seite neu und versuche es noch einmal.</div>');
  else if(code==="auth/invalid-credential"||code==="auth/user-not-found"||code==="auth/wrong-password")show('<div class="no"><b>E-Mail oder Passwort ist nicht korrekt.</b><br>Wenn du dein Passwort nicht kennst, nutze „Passwort vergessen“.</div>');
  else if(code==="auth/too-many-requests")show('<div class="no">Zu viele Loginversuche. Bitte warte etwas und versuche es später erneut oder nutze „Passwort vergessen“.</div>');
  else show(`<div class="no">Einloggen nicht möglich: ${safeText(message||code||"Unbekannter Fehler")}</div>`);
}

window.studentLogin=async function(){
  if(loginInFlight)return;
  const email=$("loginEmail").value.trim().toLowerCase();
  const password=$("loginPassword").value;
  if(!email||!password){show('<div class="no">Bitte E-Mail und Passwort eingeben.</div>');return;}

  loginInFlight=true;
  setLoginBusy(true);
  show('<div class="ok">Anmeldung wird geprüft …</div>');
  startSlowLoginNotice();
  try{
    await loginStudentWithEmailPassword(email,password);
    goAfterLogin();
  }catch(err){
    handleLoginError(err,email,password);
  }finally{
    stopSlowLoginNotice();
    loginInFlight=false;
    setLoginBusy(false);
  }
};

window.resetPassword=async function(){
  const email=$("loginEmail").value.trim().toLowerCase();
  if(!email){show('<div class="no">Bitte zuerst deine E-Mail eingeben.</div>');return;}
  try{
    await resetStudentPassword(email);
    show('<div class="ok">Wenn für diese E-Mail ein Konto existiert, wurde eine E-Mail zum Zurücksetzen des Passworts gesendet.</div>');
  }catch(err){
    console.error(err);
    show('<div class="no">Die Passwort-E-Mail konnte nicht gesendet werden.</div>');
  }
};

const loginButton=$("studentLoginButton");
const resetButton=$("resetPasswordButton");
if(loginButton)loginButton.addEventListener('click',()=>window.studentLogin());
if(resetButton)resetButton.addEventListener('click',()=>window.resetPassword());
</script>
<script src="/shared/sprachpilot-design-system.js"></script>
</body>
</html>
