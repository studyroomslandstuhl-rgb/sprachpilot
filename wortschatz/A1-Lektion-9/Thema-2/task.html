<style>.l8-flip-wrap{max-width:690px;margin:0 auto;perspective:1200px}.l8-flip-card{position:relative;width:100%;min-height:390px;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer}.l8-flip-card.flipped{transform:rotateY(180deg)}.l8-flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--lesson-line);border-radius:22px;background:#fff;padding:18px;overflow:auto}.l8-flip-front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}.l8-flip-back{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center}.l8-card-visual{width:300px;height:300px;max-width:78vw;max-height:42vh;margin:0 auto;border-radius:22px;overflow:hidden;background:#fff}.l8-card-visual img{display:block;width:100%;height:100%;object-fit:contain}.l8-card-translation{width:min(100%,520px);margin:0 auto;padding:10px 12px;border:2px solid var(--lesson-line);border-radius:14px;background:var(--lesson-soft);display:grid;gap:3px;text-align:center}.l8-card-translation span{font-size:12px;font-weight:900;color:var(--lesson-main-dark)}.l8-card-translation strong{font-size:19px;line-height:1.25}.l8-flip-back-grid{width:100%;display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}.l8-back-image,.l8-back-image .visual{width:120px;height:120px;border-radius:16px;overflow:hidden;background:#fff}.l8-back-image img{display:block;width:100%;height:100%;object-fit:contain}.l8-back-info{min-width:0;display:grid;gap:7px}.l8-flip-word{font-size:25px;line-height:1.15;text-align:center;color:var(--lesson-main-dark);font-weight:950}.card-details{display:grid;gap:7px}.l8-card-detail{padding:8px 9px;border:1px solid var(--lesson-line);border-radius:12px;background:#fff;display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px}.l8-card-detail span{font-weight:900;color:var(--lesson-main-dark)}.l8-card-actions{max-width:690px;margin:14px auto
