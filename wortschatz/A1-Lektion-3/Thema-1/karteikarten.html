<body>
<div class="container">
<header class="topbar"></header>
<section class="card" id="area"><p>Die Aufgabe wird geladen …</p></section>
<footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/guard.js?v=card-standard1"></script>
<script src="app.js?v=42"></script>
<script type="module" src="/js/scoring.js?v=6"></script>
<script src="/js/sp-card-standard.js?v=1"></script>
<script>
(function(){
const FILE='karteikarten.html';
const CARD_WORDS=activeWords();
let Q=queueFor(FILE,CARD_WORDS);
function imageFor(w){return String(w?.image||'').replace(/^\.\.\//,'../');}
SPCardStandard.mount({
 area:'#area',words:()=>CARD_WORDS,nextPage:'bild-wort.html',
 full:w=>full(w),word:w=>w.word,plural:w=>w.plural||'',example:w=>w.sentence||'',
 translation:w=>trans(w)||w.word,languageName:()=>typeof lang==='function'?lang():'Muttersprache',image:imageFor,
 normalize:v=>simple(v),audio:w=>typeof speak==='function'?speak(full(w)):null,
 state:{
  progress(){return{total:CARD_WORDS.length,done:Q.done.length,tries:Q.tries||0,hadWrong:!!Q.had}},
  current(){if(!Q.cur)Q.cur=nextItem(Q);return Q.cur},
  wrong(){wrong(Q);persist(Q);return Q.tries},
  right(){const item=Q.cur;right(Q,item);if(Q.done.length>=CARD_WORDS.length&&window.SprachPilotScoring?.awardTask)window.SprachPilotScoring.awardTask(FILE)}
 }
});
})();
</script>
</body>
</html>
