<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lektion 3 · Thema 1</title>
<link rel="stylesheet" href="/css/sp-header.css">
<link rel="stylesheet" href="/css/sp-theme-overview.css">
</head>
<body>
<div id="themeOverview"></div>

<script type="module" src="/js/guard.js"></script>
<script src="translations.js?v=40"></script>
<script src="app.js?v=41"></script>
<script type="module">
import { renderThemeOverview } from "/js/sp-theme-overview.js";

const tasks=[
  {file:"karteikarten.html",title:"Karteikarten",text:"Wörter sicher wiederholen.",iconKey:"karteikarten"},
  {file:"bild-wort.html",title:"Bild → Wort",text:"Bild ansehen und deutsches Wort schreiben.",iconKey:"schreiben"},
  {file:"wort-bild.html",title:"Wort → Bild",text:"Wort lesen und richtiges Bild wählen.",iconKey:"lesen"},
  {file:"hoeren.html",title:"Hören",text:"Deutsch hören und verstehen.",iconKey:"hoeren"},
  {file:"sprechen.html",title:"Sprechen",text:"Wörter auf Deutsch sprechen.",iconKey:"sprechen"},
  {file:"schreiben.html",title:"Schreiben",text:"Artikel und Nomen schreiben.",iconKey:"schreiben"},
  {file:"artikel.html",title:"Artikel",text:"der, die, das üben.",iconKey:"artikel"},
  {file:"drag-drop-artikel.html",title:"Artikel zuordnen",text:"Artikel den Wörtern zuordnen.",iconKey:"zuordnen"},
  {file:"plural.html",title:"Plural schreiben",text:"Pluralformen schreiben.",iconKey:"plural"},
  {file:"plural-drag-drop.html",title:"Pluralgruppen",text:"Pluralformen sortieren.",iconKey:"zuordnen"},
  {file:"memory.html",title:"Memory",text:"Paare finden und wiederholen.",iconKey:"memory"},
  {file:"ein-eine.html",title:"Das ist ...",text:"ein/eine richtig verwenden.",iconKey:"saetze"},
  {file:"kein-keine.html",title:"Nein, das ist ...",text:"kein/keine richtig verwenden.",iconKey:"saetze"},
  {file:"fragen-ohne-fragewort.html",title:"Fragen ohne Fragewort",text:"Ja/Nein-Fragen üben.",iconKey:"dialog"},
  {file:"fragen-mit-fragewort.html",title:"Fragen mit Fragewort",text:"Fragen mit W-Wörtern üben.",iconKey:"dialog"},
  {file:"pruefung.html",title:"Prüfung",text:"Teste dein Wissen.",iconKey:"pruefung",exam:true}
];

function currentProgress(){
  const progress={};
  if(typeof window.taskPercent==="function"){
    tasks.forEach(task=>{progress[task.file]=window.taskPercent(task.file)});
  }
  return progress;
}

function draw(){
  renderThemeOverview({
    title:"Thema 1: Lebensmittel & Getränke",
    tasks,
    progress:currentProgress()
  });
}

window.addEventListener("sp:reset-theme-progress",()=>{
  if(typeof window.resetThemeProgress==="function")window.resetThemeProgress();
  draw();
});

draw();
if(window.SprachPilotRelease)window.SprachPilotRelease.refresh().then(draw).catch(()=>{});
</script>
</body>
</html>
