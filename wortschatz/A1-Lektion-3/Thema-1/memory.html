<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Memory</title>
  <link rel="stylesheet" href="style.css?v=memory-img-fix">
</head>
<body>
<div id="accountStrip" class="account-strip"></div>
<script type="module" src="/js/guard.js"></script>
<div class="container">
  <section class="hero"></section>
  <div class="actions"><a class="btn secondary" href="index.html">← Zurück</a></div>
  <section class="card" id="area">
    <p class="small">Öffne zwei Karten und finde die Paare.</p>
    <div id="board" class="options"></div>
    <div id="fb" class="feedback"></div>
    <a id="nextGame" class="btn hidden" href="pruefung.html">Nächstes Spiel →</a>
  </section>
  <footer>© SprachPilot</footer>
</div>
<script src="app.js?v=41"></script>
<script src="../shared/lektion3-fix.js?v=5"></script>
<script>
header("Memory");
const CDN='https://sprachpilot.b-cdn.net/';
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function imgCandidates(w){
  const id=String(w.id||'').trim().toLowerCase();
  const local=String(w.image||'').trim();
  const list=[local,`../bilder/${id}.webp`,`../bilder/${id}.png`,`${CDN}${id}.webp`,`${CDN}${id}.png`,`${CDN}${id}.jpg`].filter(Boolean);
  return [...new Set(list)];
}
function memoryImg(w){
  const srcs=imgCandidates(w).map(esc).join('|');
  return `<div class="mem-img-holder"><img src="${esc(imgCandidates(w)[0]||'')}" data-srcs="${srcs}" data-word="${esc(w.word||w.full||w.id)}" onerror="spMemoryImgFallback(this)" alt="${esc(w.word||w.full||'Bild')}"></div>`;
}
window.spMemoryImgFallback=function(img){
  const srcs=String(img.dataset.srcs||'').split('|').filter(Boolean);
  const i=Number(img.dataset.i||0)+1;
  if(i<srcs.length){img.dataset.i=String(i);img.src=srcs[i];return;}
  const word=img.dataset.word||'Bild fehlt';
  const box=img.closest('.mem-img-holder')||img.parentElement;
  if(box)box.innerHTML='<div class="image-fallback">'+esc(word)+'</div>';
};
let pairs=shuffle(singularWords()).slice(0,8);
let cards=shuffle(pairs.flatMap(w=>[
  {id:w.id,html:memoryImg(w)},
  {id:w.id,html:`<div class="memory-word">${esc(full(w))}</div>`}
]));
let open=[],found=0;
board.innerHTML=cards.map((c,i)=>`<button class="opt memory-card back" data-id="${esc(c.id)}" data-html="${esc(c.html)}" onclick="pick(this)">?</button>`).join('');
function reveal(b){b.classList.remove('back');b.innerHTML=b.dataset.html}
function hide(b){b.classList.add('back');b.innerHTML='?'}
function pick(b){
  if(open.includes(b)||b.classList.contains('ok')||open.length>=2)return;
  reveal(b);open.push(b);
  if(open.length===2){
    if(open[0].dataset.id===open[1].dataset.id){
      open.forEach(x=>x.classList.add('ok'));open=[];found++;
      if(found===pairs.length){
        done('memory.html',singularWords().length);
        nextGame.classList.remove('hidden');
        fb.innerHTML='<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Aufgabe geschafft!</div><div class="big">100% erreicht.</div></div>';
      }
    }else setTimeout(()=>{open.forEach(hide);open=[]},900)
  }
}
</script>
</body>
</html>
