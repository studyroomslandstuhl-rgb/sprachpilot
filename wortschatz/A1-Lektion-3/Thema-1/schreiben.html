<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schreiben · Einkaufen</title><link rel="stylesheet" href="style.css"></head><body>
<div id="accountStrip" class="account-strip"></div><script type="module" src="/js/guard.js?v=l3t1stable3"></script>
<div class="container"><section class="hero"></section><div class="actions"><a class="btn secondary" href="index.html">← Zurück</a></div><section class="card" id="area"></section><footer>© SprachPilot</footer></div>
<script src="app.js?v=42"></script><script src="l3t1-stability.js?v=3"></script>
<script>
header('Schreiben: Im Geschäft');
const ITEMS=[
 {id:'tee',situation:'Du bist im Café und möchtest Tee.',prompt:'Schreibe eine höfliche Bestellung.',accepted:['Ich möchte einen Tee, bitte','Ich möchte Tee, bitte','Einen Tee, bitte'],solution:'Ich möchte einen Tee, bitte.'},
 {id:'brot',situation:'Du suchst Brot im Geschäft.',prompt:'Frage die Verkäuferin.',accepted:['Haben Sie Brot','Haben Sie Brot?'],solution:'Haben Sie Brot?'},
 {id:'tomate',situation:'Du möchtest Tomaten kaufen.',prompt:'Schreibe eine Bestellung.',accepted:['Ich möchte Tomaten, bitte','Tomaten, bitte'],solution:'Ich möchte Tomaten, bitte.'},
 {id:'milch',situation:'Zu Hause ist keine Milch mehr.',prompt:'Schreibe, was du brauchst.',accepted:['Ich brauche Milch','Ich brauche die Milch'],solution:'Ich brauche Milch.'},
 {id:'apfel',situation:'Du möchtest ein Kilo Äpfel.',prompt:'Schreibe den ganzen Satz.',accepted:['Ich möchte ein Kilo Äpfel, bitte','Ich möchte ein Kilo Äpfel','Ein Kilo Äpfel, bitte'],solution:'Ich möchte ein Kilo Äpfel, bitte.'},
 {id:'butter',situation:'Du brauchst keine Butter.',prompt:'Schreibe den Satz mit keine.',accepted:['Ich brauche keine Butter','Ich möchte keine Butter'],solution:'Ich brauche keine Butter.'},
 {id:'wasser',situation:'Du möchtest wissen, wie viel eine Flasche Wasser kostet.',prompt:'Schreibe die Frage.',accepted:['Was kostet eine Flasche Wasser','Was kostet eine Flasche Wasser?'],solution:'Was kostet eine Flasche Wasser?'},
 {id:'kaffee',situation:'Du möchtest Kaffee, aber keinen Tee.',prompt:'Schreibe einen ganzen Satz.',accepted:['Ich möchte Kaffee, aber keinen Tee','Ich möchte einen Kaffee, aber keinen Tee'],solution:'Ich möchte Kaffee, aber keinen Tee.'}
];
const clean=v=>String(v||'').normalize('NFC').trim().toLowerCase().replace(/[.,!?;:“”"'`´]/g,'').replace(/\s+/g,' ');
const ok=(v,item)=>item.accepted.some(x=>clean(x)===clean(v));
let Q=queueFor('schreiben.html',ITEMS);
function render(){Q.cur=nextItem(Q);if(!Q.cur){complete(area,'schreiben.html','sprechen.html');return}Q.tries=0;Q.had=false;area.innerHTML=prog(Q)+`<div class="hint"><b>Situation:</b> ${Q.cur.situation}</div><div class="question">${Q.cur.prompt}</div><textarea id="ans" rows="3" style="width:100%;box-sizing:border-box" placeholder="Schreibe einen ganzen Satz."></textarea><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`;ans.focus()}
function check(){if(ok(ans.value,Q.cur)){right(Q,Q.cur);fb.textContent='Richtig!';setTimeout(render,650);return}wrong(Q);if(Q.tries===1)fb.textContent='Noch nicht richtig. Lies die Situation noch einmal.';else if(Q.tries===2)fb.innerHTML='Noch nicht richtig.<div class="hint">Tipp: Schreibe einen vollständigen, höflichen A1-Satz.</div>';else fb.innerHTML=`Noch nicht richtig.<div class="hint">Beispiel: ${Q.cur.solution}<br>Schreibe den Satz jetzt selbst.</div>`}
render();
</script></body></html>
