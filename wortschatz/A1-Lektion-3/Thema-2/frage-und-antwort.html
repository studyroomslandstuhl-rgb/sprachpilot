<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frage & Antwort</title><link rel="stylesheet" href="style.css?v=qa2"></head><body><div id="accountStrip" class="account-strip"></div><script type="module" src="/js/guard.js"></script><div class="container"><section class="hero"></section><div class="actions"><a class="btn secondary" href="index.html">← Zurück</a></div><section class="card" id="area"><div class="question">Aufgabe wird geladen …</div></section><footer>© SprachPilot</footer></div><script src="app.js?v=16"></script><script>
header("Frage & Antwort");
const FILE="frage-und-antwort.html";
let currentIndex=null;
let phase="question";

function safeSimple(x){
  if(typeof simple==="function")return simple(x);
  return String(x||"").toLowerCase().trim().replace(/[.,!?€]/g,"").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/\s+/g," ");
}
function norm(x){return safeSimple(x)}
function wordsOfCombo(c){return norm(c&&c.text||"").split(" ").filter(Boolean)}
function hasComboWords(ans,c){
  const a=norm(ans);
  const ignored=new Set(["ein","eine","einen","zwei","drei","vier","fuenf","zehn","100","200","300","500","1","2","3","4","5","10"]);
  const parts=wordsOfCombo(c).filter(w=>!ignored.has(w));
  return parts.length===0||parts.some(w=>a.includes(w));
}
function priceVariants(price){
  const raw=String(price||"").replace("€","").trim();
  const parts=raw.split(/[,.]/);
  const euros=Number(parts[0]||0);
  const cents=Number((parts[1]||"").padEnd(2,"0").slice(0,2));
  const out=[raw,raw+" Euro",raw.replace(",","."),raw.replace(",","")];
  if(euros>0)out.push(`${euros} Euro`);
  if(cents>0){
    out.push(`${cents} Cent`);
    out.push(`${euros} Euro ${cents} Cent`);
    out.push(`${euros} Euro und ${cents} Cent`);
  }
  return [...new Set(out.map(norm).filter(Boolean))];
}
function hasPrice(ans,c){
  const a=norm(ans);
  return priceVariants(c&&c.price).some(p=>p&&a.includes(p));
}
function acceptableQuestion(ans,c){
  const a=norm(ans);
  if(!a)return false;
  if(c&&c.question&&a===norm(c.question))return true;
  const asksPrice=a.includes("was kostet")||a.includes("was kosten")||a.includes("wie viel kostet")||a.includes("wie viel kosten")||a.includes("wieviel kostet")||a.includes("wieviel kosten")||a.includes("preis");
  if(!asksPrice)return false;
  return hasComboWords(a,c)||a.includes("das")||a.includes("preis");
}
function acceptableAnswer(ans,c){
  const a=norm(ans);
  if(!a)return false;
  if(c&&c.answer&&a===norm(c.answer))return true;
  if(!hasPrice(a,c))return false;
  const saysCost=a.includes("kostet")||a.includes("kosten")||a.includes("macht")||a.includes("preis")||a.includes("euro")||a.includes("cent");
  if(!saysCost)return false;
  return hasComboWords(a,c)||a.includes("das")||a.includes("es")||a.includes("euro")||a.includes("cent");
}
function ensureState(){
  if(typeof COMBOS==="undefined"||!Array.isArray(COMBOS)||COMBOS.length===0){area.innerHTML='<div class="feedback">Fehler: Die Aufgaben wurden nicht geladen.</div>';return false}
  if(typeof spTaskStateKey!=="function")window.spTaskStateKey=file=>"SP_TASK_STATE_"+file;
  if(typeof spLoadTaskState!=="function")window.spLoadTaskState=function(file,total){try{const saved=JSON.parse(localStorage.getItem(spTaskStateKey(file))||"null");if(saved&&saved.total===total&&Array.isArray(saved.queue)&&Array.isArray(saved.done))return saved}catch(e){}const queue=[...Array(total).keys()].sort(()=>Math.random()-0.5);return{total,queue,done:[],current:null,tries:0}};
  if(typeof spSaveTaskState!=="function")window.spSaveTaskState=function(file,state){localStorage.setItem(spTaskStateKey(file),JSON.stringify(state))};
  if(typeof spNextIndex!=="function")window.spNextIndex=function(file,total){const state=spLoadTaskState(file,total);if(state.current===null||state.current===undefined){if(!state.queue.length&&state.done.length<total){state.queue=[...Array(total).keys()].filter(i=>!state.done.includes(i)).sort(()=>Math.random()-0.5)}state.current=state.queue.shift();state.tries=0;spSaveTaskState(file,state)}return state.current};
  if(typeof spProgressHtml!=="function")window.spProgressHtml=function(file,total){const state=spLoadTaskState(file,total);const done=state.done.length;const left=total-done;const percent=Math.round(done/total*100)||0;return `<div class="small">${done} richtig · ${left} übrig · ${percent}%</div><div class="progress"><div class="bar" style="width:${percent}%"></div></div>`};
  if(typeof spMarkRight!=="function")window.spMarkRight=function(file,total){const state=spLoadTaskState(file,total);if(state.current!==null&&!state.done.includes(state.current))state.done.push(state.current);state.current=null;state.tries=0;spSaveTaskState(file,state);return state.done.length>=total};
  window.spMarkWrong=function(file,total){const state=spLoadTaskState(file,total);state.tries=(state.tries||0)+1;spSaveTaskState(file,state);return state.tries};
  if(typeof byId!=="function")window.byId=(list,id)=>list.find(x=>x.id===id)||{};
  if(typeof comboImages!=="function")window.comboImages=function(c){const cont=byId(WORDS,c.container);const prod=byId(PRODUCTS,c.product);const amount=c.amount?`<div class="amount-badge">${c.amount}</div>`:"";return `<div class="combo-images"><div class="combo-part">${amount}<img src="${cont.image||""}" onerror="fixImg(this)" alt=""></div><div class="combo-plus">+</div><div class="combo-part"><img src="${prod.image||""}" onerror="fixImg(this)" alt=""></div></div>`};
  if(typeof fixImg!=="function")window.fixImg=img=>img.classList.add("missing");
  return true;
}
function currentCombo(){return COMBOS[currentIndex]}
function showWriteBox(){
  const box=document.getElementById("writeBox");
  if(box)box.classList.remove("hidden");
  const input=document.getElementById("answerInput");
  const checkBtn=document.getElementById("checkBtn");
  if(checkBtn)checkBtn.onclick=function(){if(phase==="question")checkQuestion(input.value);else checkAnswer(input.value)};
  if(input)setTimeout(()=>input.focus(),20);
}
function micFallback(message){
  const status=document.getElementById("micStatus");
  if(status)status.textContent=message||"Mikrofon funktioniert hier nicht. Bitte schreibe.";
  showWriteBox();
}
function listenGerman(callback,button){
  if(window.spStartMicSafe)return window.spStartMicSafe(button,function(text){callback(text)});
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){micFallback("Mikrofon wird hier nicht unterstützt. Bitte schreibe.");return}
  let rec;
  try{rec=new SpeechRecognition()}catch(e){micFallback();return}
  rec.lang="de-DE";rec.interimResults=false;rec.continuous=false;
  if(button)button.classList.add("active");
  const status=document.getElementById("micStatus");
  if(status)status.textContent="Ich höre zu …";
  rec.onresult=e=>{const text=e.results&&e.results[0]&&e.results[0][0]?e.results[0][0].transcript:"";if(text){if(status)status.textContent="Gehört: "+text;callback(text)}else micFallback("Ich konnte nichts erkennen. Bitte schreibe.")};
  rec.onerror=()=>micFallback("Mikrofon hat nicht funktioniert. Bitte schreibe.");
  rec.onend=()=>{if(button)button.classList.remove("active")};
  try{rec.start()}catch(e){micFallback()}
}
function feedback(html,kind="helped"){
  const fb=document.getElementById("fb");
  if(fb)fb.innerHTML=`<div class="${kind}">${html}</div>`;
}
function show(){
  if(!ensureState())return;
  const state=spLoadTaskState(FILE,COMBOS.length);
  if(state.done.length>=COMBOS.length){if(typeof complete==="function")complete(area,FILE,"index.html");else area.innerHTML='<div class="question">Fertig!</div>';return}
  currentIndex=spNextIndex(FILE,COMBOS.length);
  if(currentIndex===undefined||currentIndex===null||!COMBOS[currentIndex]){localStorage.removeItem(spTaskStateKey(FILE));currentIndex=spNextIndex(FILE,COMBOS.length)}
  const c=currentCombo();
  const isQuestion=phase==="question";
  area.innerHTML=`${spProgressHtml(FILE,COMBOS.length)}<div class="question">${isQuestion?'1. Frage nach dem Preis.':'2. Antworte auf die Frage.'}</div><div class="hint">${isQuestion?'Sprich oder schreibe die Frage.':'Sprich oder schreibe die Antwort.'}</div>${comboImages(c)}${isQuestion?'':`<div class="big">${c.price}</div>`}<div class="actions"><button id="speakBtn" class="btn mic-btn">🎤 ${isQuestion?'Frage':'Antwort'} sprechen</button></div><div id="micStatus" class="mic-status"></div><div id="writeBox"><input id="answerInput" placeholder="${isQuestion?'Schreibe hier deine Frage.':'Schreibe hier deine Antwort.'}"><button id="checkBtn" class="btn">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;
  document.getElementById("speakBtn").onclick=function(){listenGerman(text=>isQuestion?checkQuestion(text):checkAnswer(text),this)};
  showWriteBox();
}
function checkQuestion(text){
  try{
    const c=currentCombo();
    if(acceptableQuestion(text,c)){phase="answer";show();return}
    const tries=spMarkWrong(FILE,COMBOS.length);
    feedback(tries===1?"Noch nicht richtig. Frage zum Preis, zum Beispiel: <b>Was kostet das?</b>":tries===2?`Tipp: <b>${c.question}</b>`:`Richtige Frage:<br><b>${c.question}</b>`);
    phase="question";showWriteBox();
  }catch(e){micFallback("Die Eingabe konnte nicht geprüft werden. Bitte schreibe noch einmal.")}
}
function checkAnswer(text){
  try{
    const c=currentCombo();
    if(acceptableAnswer(text,c)){spMarkRight(FILE,COMBOS.length);phase="question";show();return}
    const tries=spMarkWrong(FILE,COMBOS.length);
    feedback(tries===1?"Noch nicht richtig. Schreibe den Preis, zum Beispiel mit Euro oder Cent.":tries===2?`Tipp: <b>${c.price}</b>`:`Richtige Antwort:<br><b>${c.answer}</b>`);
    phase="answer";showWriteBox();
  }catch(e){micFallback("Die Eingabe konnte nicht geprüft werden. Bitte schreibe noch einmal.")}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",show);else show();
</script></body></html>
