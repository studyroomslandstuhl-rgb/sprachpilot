<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frage & Antwort</title><link rel="stylesheet" href="style.css?v=qa3"></head><body><div id="accountStrip" class="account-strip"></div><div class="container"><section class="hero"></section><div class="actions"><a class="btn secondary" href="index.html">← Zurück</a></div><section class="card" id="area"><div class="question">Aufgabe wird geladen …</div></section><footer>© SprachPilot</footer></div><script src="app.js?v=16"></script><script src="l3t2-task-fix.js?v=3"></script><script>
header("Frage & Antwort");
const FILE="frage-und-antwort.html";
let currentIndex=null;
let phase="question";
function areaEl(){return document.getElementById("area")}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function qaNorm(x){return String(x||"").toLowerCase().trim().replace(/[.,!?€]/g," ").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/\s+/g," ").trim()}
function priceParts(price){
  const p=String(price||"").replace("€","").trim();
  const parts=p.split(",");
  return {euro:parseInt(parts[0]||"0",10),cent:parseInt((parts[1]||"00").padEnd(2,"0"),10),raw:p};
}
function priceVariants(price){
  const p=priceParts(price);
  const out=[p.raw,"das kostet "+p.raw,"das macht "+p.raw];
  if(p.euro===0){out.push(p.cent+" cent","das kostet "+p.cent+" cent","das macht "+p.cent+" cent");}
  else{
    const euroText=p.euro===1?"ein euro":p.euro+" euro";
    out.push(euroText+" "+p.cent+" cent",p.euro+" euro "+p.cent+" cent",p.euro+" euro "+p.cent,"das kostet "+euroText+" "+p.cent+" cent","das macht "+euroText+" "+p.cent+" cent");
  }
  return out.map(qaNorm);
}
function acceptsQuestion(txt,c){
  const a=qaNorm(txt);
  const verb=c.isPlural?"kosten":"kostet";
  const wrong=c.isPlural?"kostet":"kosten";
  if(a.includes(" "+wrong+" ")||a.endsWith(" "+wrong))return false;
  const starts=["was "+verb,"wie viel "+verb,"wieviel "+verb].map(qaNorm);
  return starts.some(s=>a.startsWith(s));
}
function acceptsAnswer(txt,c){
  const a=qaNorm(txt);
  const verb=c.isPlural?"kosten":"kostet";
  const wrong=c.isPlural?"kostet":"kosten";
  if(a.includes(" "+wrong+" ")||a.endsWith(" "+wrong))return false;
  const hasPrice=priceVariants(c.price).some(v=>a.includes(v));
  if(!hasPrice)return false;
  const starts=[qaNorm(c.text+" "+verb),qaNorm("das "+verb),qaNorm("es "+verb)];
  return starts.some(s=>a.startsWith(s))||a.startsWith("das kostet")||a.startsWith("das macht");
}
function byIdSafe(list,id){return (list||[]).find(x=>x.id===id)||{}}
function images(c){
  const cont=byIdSafe(WORDS,c.container);
  const prod=byIdSafe(PRODUCTS,c.product);
  const amount=c.amount?`<div class="amount-badge">${esc(c.amount)}</div>`:"";
  return `<div class="combo-images"><div class="combo-part">${amount}<img src="${esc(cont.image)}" onerror="fixImg(this)" alt=""></div><div class="combo-plus">+</div><div class="combo-part"><img src="${esc(prod.image)}" onerror="fixImg(this)" alt=""></div></div>`;
}
function currentCombo(){return COMBOS[currentIndex]||null}
function ensureIndex(){
  if(spLoadTaskState(FILE,COMBOS.length).done.length>=COMBOS.length)return false;
  currentIndex=spNextIndex(FILE,COMBOS.length);
  if(currentIndex===undefined||currentIndex===null||!COMBOS[currentIndex]){
    const st=spLoadTaskState(FILE,COMBOS.length);st.current=null;spSaveTaskState(FILE,st);currentIndex=spNextIndex(FILE,COMBOS.length);
  }
  return currentIndex!==undefined&&currentIndex!==null&&!!COMBOS[currentIndex];
}
function render(){
  const area=areaEl();
  if(!Array.isArray(COMBOS)||!COMBOS.length){area.innerHTML='<div class="feedback">Fehler: Aufgabe konnte nicht geladen werden.</div>';return}
  if(spLoadTaskState(FILE,COMBOS.length).done.length>=COMBOS.length){complete(area,FILE,"index.html");return}
  if(!ensureIndex()){area.innerHTML='<div class="feedback">Aufgabe konnte nicht geladen werden. Bitte neu laden.</div>';return}
  const c=currentCombo();
  const title=phase==="question"?"1. Frage nach dem Preis.":"2. Antworte auf die Frage.";
  const placeholder=phase==="question"?"z. B. Was kostet eine Flasche Wasser?":"z. B. Eine Flasche Wasser kostet 79 Cent.";
  const micLabel=phase==="question"?"🎤 Frage sprechen":"🎤 Antwort sprechen";
  const extra=phase==="answer"?`<div class="big">${esc(c.price)}</div>`:"";
  area.innerHTML=`${spProgressHtml(FILE,COMBOS.length)}<div class="question">${title}</div><div class="hint">Schreibe oder sprich. Kontrolliert wird erst, wenn du auf <b>Kontrollieren</b> klickst.</div>${images(c)}${extra}<div class="actions"><button id="micBtn" class="btn mic-btn">${micLabel}</button></div><div id="micStatus" class="mic-status"></div><input id="answerInput" placeholder="${placeholder}" autocomplete="off"><button id="checkBtn" class="btn">Kontrollieren</button><div id="fb" class="feedback"></div>`;
  document.getElementById("micBtn").onclick=function(){startMic(this,function(text){const input=document.getElementById("answerInput");if(input)input.value=text;});};
  document.getElementById("checkBtn").onclick=check;
  document.getElementById("answerInput").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
}
function showFeedback(html){const fb=document.getElementById("fb");if(fb)fb.innerHTML=html}
function check(){
  const input=document.getElementById("answerInput");
  const txt=input?input.value:"";
  const c=currentCombo();
  if(!c){render();return}
  if(phase==="question"){
    if(acceptsQuestion(txt,c)){phase="answer";render();return}
    const tries=spMarkWrong(FILE,COMBOS.length);
    showFeedback(spFeedbackForTry(tries,c.question,"Fragewort und kostet/kosten"));
    if(input)input.focus();
    return;
  }
  if(acceptsAnswer(txt,c)){
    spMarkRight(FILE,COMBOS.length);
    phase="question";
    render();
    return;
  }
  const tries=spMarkWrong(FILE,COMBOS.length);
  showFeedback(spFeedbackForTry(tries,c.answer,"Antwortsatz, Preis und kostet/kosten"));
  if(input)input.focus();
}
render();
</script><script type="module" src="/js/guard.js"></script></body></html>
