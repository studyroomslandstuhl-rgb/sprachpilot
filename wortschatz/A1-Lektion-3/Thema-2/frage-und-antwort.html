<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Frage & Antwort</title>
  <link rel="stylesheet" href="style.css?v=qa4">
</head>
<body>
<div id="accountStrip" class="account-strip"></div>
<script type="module" src="/js/guard.js"></script>
<div class="container">
  <section class="hero"></section>
  <div class="actions"><a class="btn secondary" href="index.html">← Zurück</a></div>
  <section class="card" id="area"><div class="question">Aufgabe wird geladen …</div></section>
  <footer>© SprachPilot</footer>
</div>
<script src="app.js?v=16"></script>
<script src="../shared/lektion3-fix.js?v=5"></script>
<script>
header("Frage & Antwort");
const FILE='frage-und-antwort.html';
const TOTAL=Array.isArray(COMBOS)?COMBOS.length:0;
let phase='question';
let current=null;
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function normalize(x){return String(x||'').toLowerCase().trim().replace(/€/g,' euro ').replace(/[.,!?]/g,' ').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+/g,' ')}
function stateKey(){return 'SP_TASK_STATE_'+FILE}
function loadState(){try{const s=JSON.parse(localStorage.getItem(stateKey())||'null');if(s&&s.total===TOTAL&&Array.isArray(s.queue)&&Array.isArray(s.done))return s}catch(e){}return {total:TOTAL,queue:[...Array(TOTAL).keys()].sort(()=>Math.random()-.5),done:[],current:null,tries:0}}
function saveState(s){localStorage.setItem(stateKey(),JSON.stringify(s))}
function nextIndex(){let s=loadState();if(s.done.length>=TOTAL)return null;if(s.current===null||s.current===undefined){if(!s.queue.length)s.queue=[...Array(TOTAL).keys()].filter(i=>!s.done.includes(i)).sort(()=>Math.random()-.5);s.current=s.queue.shift();s.tries=0;saveState(s)}return s.current}
function markWrong(){let s=loadState();s.tries=(s.tries||0)+1;saveState(s);return s.tries}
function markRight(){let s=loadState();if(s.current!==null&&!s.done.includes(s.current))s.done.push(s.current);s.current=null;s.tries=0;const complete=s.done.length>=TOTAL;saveState(s);if(complete){try{done(FILE,TOTAL)}catch(e){}}return complete}
function progressHtml(){let s=loadState();let doneCount=s.done.length;let pct=Math.round(doneCount/Math.max(1,TOTAL)*100)||0;return `<div class="small">${doneCount} richtig · ${TOTAL-doneCount} übrig · ${pct}%</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>`}
function byId(list,id){return (list||[]).find(x=>x.id===id)||{}}
function comboImages(c){const cont=byId(WORDS,c.container),prod=byId(PRODUCTS,c.product);return `<div class="combo-images"><div class="combo-part"><div class="amount-badge">${esc((c.text||'').split(' ')[0]||'')}</div><img src="${esc(cont.image||'')}" onerror="fixImg(this)" alt=""></div><div class="combo-plus">+</div><div class="combo-part"><img src="${esc(prod.image||'')}" onerror="fixImg(this)" alt=""></div></div>`}
function priceOk(ans,c){const a=normalize(ans);const p=String(c.price||'').replace('€','').trim();const parts=p.split(',');const euro=Number(parts[0]||0);const cent=Number((parts[1]||'00').padEnd(2,'0').slice(0,2));const variants=[p,p+' euro',euro+' euro '+cent,euro+' euro '+cent+' cent',euro+' '+cent];if(euro===0)variants.push(cent+' cent');return variants.map(normalize).some(v=>v&&a.includes(v))}
function wordsOk(ans,c){const a=normalize(ans);const words=normalize(c.text).split(' ').filter(w=>w&&!['ein','eine','einen','zwei','drei','vier','fuenf','zehn','2','3','4','5','10'].includes(w));return words.length===0||words.some(w=>a.includes(w))}
function acceptableQuestion(ans,c){const a=normalize(ans);if(!a)return false;if(c.question&&a===normalize(c.question))return true;return (a.includes('was kostet')||a.includes('wie viel kostet')||a.includes('wieviel kostet')||a.includes('was kosten')||a.includes('wie viel kosten')||a.includes('wieviel kosten')||a.includes('preis'))&&wordsOk(a,c)}
function acceptableAnswer(ans,c){const a=normalize(ans);if(!a)return false;if(c.answer&&a===normalize(c.answer))return true;if(!priceOk(a,c))return false;return a.includes('kostet')||a.includes('kosten')||a.includes('das macht')||a.includes('preis')||wordsOk(a,c)}
function feedback(tries,solution){if(tries===1)return 'Noch nicht richtig. Frage: „Was kostet …?“ Antwort: „… kostet … Euro/Cent.“';if(tries===2)return 'Tipp: Achte auf kostet/kosten und auf den Preis.';return 'Lösung: '+esc(solution)}
function showWriteBox(){const b=document.getElementById('writeBox');if(b)b.classList.remove('hidden');const i=document.getElementById('answerInput');if(i)i.focus()}
function listen(callback,button){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const status=document.getElementById('micStatus');if(!SR){if(status)status.textContent='Mikrofon wird hier nicht unterstützt. Bitte schreibe.';showWriteBox();return}try{const rec=new SR();rec.lang='de-DE';rec.interimResults=false;rec.continuous=false;if(button)button.classList.add('active');if(status)status.textContent='Ich höre zu …';rec.onresult=e=>{const txt=e.results&&e.results[0]&&e.results[0][0]?e.results[0][0].transcript:'';if(status)status.textContent='Gehört: '+txt;callback(txt)};rec.onerror=()=>{if(status)status.textContent='Mikrofon hat nicht funktioniert. Bitte schreibe.';showWriteBox()};rec.onend=()=>{if(button)button.classList.remove('active')};rec.start()}catch(e){if(status)status.textContent='Mikrofon konnte nicht starten. Bitte schreibe.';showWriteBox()}}
function render(){if(!TOTAL){area.innerHTML='<div class="no">Aufgaben wurden nicht geladen.</div>';return}let s=loadState();if(s.done.length>=TOTAL){area.innerHTML='<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Aufgabe geschafft!</div><div class="big">100% erreicht.</div><div class="actions finish-actions"><button class="btn" onclick="localStorage.removeItem(\''+stateKey()+'\');location.reload()">Nochmal üben</button><a class="btn green" href="index.html">Zurück zum Thema</a></div></div>';return}current=nextIndex();const c=COMBOS[current];const isQ=phase==='question';const title=isQ?'1. Frage nach dem Preis.':'2. Antworte auf die Frage.';const placeholder=isQ?'Was kostet …?':'… kostet … Euro.';area.innerHTML=`${progressHtml()}<div class="question">${title}</div><div class="hint">Sprich oder schreibe den Satz.</div>${comboImages(c)}${!isQ?`<div class="big">${esc(c.price)}</div><div class="small">${esc(c.question)}</div>`:''}<div class="actions"><button id="speakBtn" class="btn mic-btn">🎤 ${isQ?'Frage':'Antwort'} sprechen</button><button id="writeBtn" class="btn secondary">Ich kann nicht sprechen</button></div><div id="micStatus" class="mic-status"></div><div id="writeBox" class="hidden"><input id="answerInput" placeholder="${placeholder}"><button id="checkBtn" class="btn">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;document.getElementById('speakBtn').onclick=function(){listen(isQ?checkQuestion:checkAnswer,this)};document.getElementById('writeBtn').onclick=showWriteBox;document.getElementById('checkBtn').onclick=function(){const v=document.getElementById('answerInput').value;if(isQ)checkQuestion(v);else checkAnswer(v)}}
function checkQuestion(txt){const c=COMBOS[current];if(acceptableQuestion(txt,c)){phase='answer';render();return}const tries=markWrong();document.getElementById('fb').innerHTML='<div class="no">'+feedback(tries,c.question)+'</div>';showWriteBox()}
function checkAnswer(txt){const c=COMBOS[current];if(acceptableAnswer(txt,c)){markRight();phase='question';render();return}const tries=markWrong();document.getElementById('fb').innerHTML='<div class="no">'+feedback(tries,c.answer)+'</div>';showWriteBox()}
document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
