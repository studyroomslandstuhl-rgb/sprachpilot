<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">

<title>Karteikarten · L3T2</title>
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/style.css?v=l6t4-bunny-audio9">
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/l6t4-revision2.css?v=l6t4-bunny-audio9">
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/l6t4-user.css?v=l6t4-bunny-audio9">
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/l6t4-compact-v2.css?v=l6t4-bunny-audio9">

</head>
<body>
<div class="container">
<header class="topbar"></header>
<section class="card" id="area"><p>Die Aufgabe wird geladen …</p></section>
<footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/guard.js?v=card-standard1"></script>
<script src="app.js?v=15"></script>
<script src="../shared/lektion3-fix.js?v=2"></script>
<script src="l3t2-task-fix.js?v=2"></script>
<script src="/js/sp-card-standard.js?v=1"></script>
<script>
(function(){
const FILE='karteikarten.html';
function cardLang(){return typeof spL3PreferredLang==='function'?spL3PreferredLang():lang()}
function cardTranslation(w){const l=cardLang();return (w.translations&&(w.translations[l]||w.translations.Russisch||w.translations.Englisch))||w.word}
SPCardStandard.mount({
 area:'#area',words:()=>WORDS,nextPage:'bild-wort.html',full:w=>full(w),word:w=>w.word,
 plural:w=>w.plural||'',example:w=>w.sentence||'',translation:cardTranslation,languageName:cardLang,
 image:w=>w.image||'',normalize:v=>simple(v),
 state:{
  progress(){const st=spLoadTaskState(FILE,WORDS.length);return{total:WORDS.length,done:st.done.length,tries:st.tries||0,hadWrong:!!st.hadWrong}},
  current(){const index=spNextIndex(FILE,WORDS.length);return WORDS[index]},
  wrong(){return spMarkWrong(FILE,WORDS.length)},right(){spMarkRight(FILE,WORDS.length)},
  resetCurrent(){spResetTask(FILE)}
 }
});
})();
</script>
</body>
</html>
