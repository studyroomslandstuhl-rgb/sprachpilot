<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Lektion 11 · Thema 2</title><link rel="stylesheet" href="/css/sp-header.css?v=theme-standard4"><link rel="stylesheet" href="l11t2.css?v=20260916-1"></head><body data-theme="2" data-page="theme"><main id="app"><div class="l8-wrap"><section class="l8-card">Aufgaben werden geladen …</section></div></main><script type="module" src="/js/guard.js?v=20260916-l11t2"></script><script src="l11t2-data.js?v=20260916-1"></script><script src="l11t2-translations.js?v=20260916-1"></script><script type="module">import {renderSpHeader,bindSpHeader} from '/js/sp-header.js?v=theme-standard4';const D=window.L11T2||{tasks:[]};const root=document.getElementById('app');const practice=D.tasks.filter(t=>!t.exam),exam=D.tasks.find(t=>t.exam);const key=id=>'SP_L11_T2_'+id;const pct=id=>Number(localStorage.getItem(key(id))||0)||0;const done=practice.filter(t=>pct(t.id)>=100).length;const avg=Math.round(practice.reduce((s,t)=>s+pct(t.id),0)/Math.max(1,practice.length));const examOpen=practice.every(t=>pct(t.id)>=100);const card=(t,i)=>{const p=pct(t.id),locked=t.exam&&!examOpen;return locked?`<div class="l8-card l8-task-card locked"><div class="l8-task-number">${i+1}. ${t.title}</div><div class="emoji">${t.icon}</div><p>${t.cardText}</p><div class="l8-small">gesperrt</div><div class="l8-task-start">Prüfung gesperrt</div></div>`:`<a class="l8-card l8-task-card ${p>=100?'done':''}" href="task.html?task=${encodeURIComponent(t.id)}"><div class="l8-task-number">${i+1}. ${t.title}</div><div class="emoji">${t.icon}</div><p>${t.cardText}</p><div class="l8-progress"><div style="width:${p}%"></div></div><div class="l8-small">${p}%</div><div class="l8-task-start">${p>=100?'Fertig':'Starten'}</div></a>`};root.innerHTML=`<div class="l10-theme-page">${renderSpHeader({subtitle:'Verkehrsmittel · fahren mit / fahren zu · A1 Lektion 11 · Thema 2',color:{main:'#F6D78B',dark:'#A88633',soft:'#FDF8EC',line:'#F3E2B7'}})}<div class="l8-wrap"><section class="l8-card l8-progress-card"><div class="l8-progress-circle">${avg}%</div><div class="l8-progress-main"><h2>Dein Fortschritt</h2><p class="l8-small">${done} / ${practice.length} Aufgaben abgeschlossen</p><div class="l8-progress"><div style="width:${avg}%"></div></div><div class="l8-tags"><span class="l8-tag">9 Wörter</span><span class="l8-tag">fahren mit</span><span class="l8-tag">fahren zu</span></div></div></section><section class="l8-grid">${practice.map(card).join('')}</section>${exam?`<section class="l8-grid l8-exam-grid">${card(exam,practice.length)}</section>`:''}<footer>© SprachPilot</footer></div></div>`;bindSpHeader(root);document.querySelectorAll('.sp-header__nav-link').forEach(a=>{if(String(a.textContent||'').trim()==='Übersicht')a.href='uebersicht.html'});</script></body></html>
