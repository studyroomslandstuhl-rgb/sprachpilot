</head>
<body><div class="container dialog13-release"><header class="topbar" id="topbar"></header><section class="card" id="area"><p>Aufgabe 13 wird geladen …</p></section><footer>© SprachPilot</footer></div>
<script type="module" src="/js/guard.js?v=task13-20260819"></script>
<script>
(function(){
'use strict';
const FILE='task-dialog-abc',KEY='SP_L6_T4_V2_'+FILE,area=document.getElementById('area'),topbar=document.getElementById('topbar'),AUDIO='https://sprachpilot.b-cdn.net/audio/';
const DIALOGS=[
 {file:'l6t4-aufgabe13-dialog-01.mp3',questions:[['Was macht Omar am Vormittag?','Er arbeitet.',['Er fährt Fahrrad.','Er arbeitet.','Er spielt Backgammon.']],['Wo treffen sich Lea und Omar?','Am Bahnhof.',['Am See.','Am Bahnhof.','Vor Omars Arbeit.']],['Was machen sie bei Regen?','Sie gehen in ein Café und spielen.',['Sie fahren mit dem Fahrrad.','Sie gehen nach Hause.','Sie gehen in ein Café und spielen.']]]},
 {file:'l6t4-aufgabe13-dialog-02.mp3',questions:[['Warum sehen Mara und Tom nicht den Krimi?','Tom kann nicht pünktlich da sein.',['Mara mag keine Krimis.','Tom kann nicht pünktlich da sein.','Der Krimi beginnt erst um 21 Uhr.']],['Wer kauft die Kinokarten?','Mara.',['Mara.','Tom.','Paul.']],['Was machen Mara und Tom nach dem Film?','Sie besuchen ein Konzert.',['Sie gehen direkt nach Hause.','Sie fahren Fahrrad.','Sie besuchen ein Konzert.']]]},
 {file:'l6t4-aufgabe13-dialog-03.mp3',questions:[['Was macht Jonas vor dem Grillen?','Er geht schwimmen.',['Er geht schwimmen.','Er arbeitet.','Er trifft Mara im Café.']],['Was soll Jonas mitbringen?','Brot und Wasser.',['Fleisch und Kartoffeln.','Brot und Wasser.','Einen Salat und Kaffee.']],['Warum hat Nina auch viel Gemüse gekauft?','Ahmed isst kein Fleisch.',['Jonas mag kein Brot.','Mara möchte nur Salat.','Ahmed isst kein Fleisch.']]]},
 {file:'l6t4-aufgabe13-dialog-04.mp3',questions:[['Warum sucht Sofia ein neues Hobby?','Sie findet ihre Freizeit im Internet langweilig.',['Sie möchte weniger arbeiten.','Sie findet ihre Freizeit im Internet langweilig.','Sie möchte einen neuen Beruf finden.']],['Wann treffen sich Sofia und Paul?','Um 17:45 Uhr.',['Um 17:45 Uhr.','Um 17 Uhr.','Um 18:20 Uhr.']],['Was ist für Sofia beim ersten Besuch wichtig?','Sie hat Spaß.',['Sie kann schon gut tanzen.','Sie bringt 30 Euro mit.','Sie hat Spaß.']]]},
 {file:'l6t4-aufgabe13-dialog-05.mp3',questions:[['Wo haben Anna und Daniel zuletzt mit dem Würfel gespielt?','Im Café.',['Im Park.','Im Café.','Bei Daniel zu Hause.']],['Wo hat der Kellner den Würfel gefunden?','Unter einem Stuhl.',['Unter einem Stuhl.','In Annas Tasche.','Neben der Kasse.']],['Was machen Anna und Daniel danach?','Sie gehen zu Daniel und spielen weiter.',['Sie gehen wieder in den Park.','Sie fahren mit dem Fahrrad.','Sie gehen zu Daniel und spielen weiter.']]]}
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),normalize=v=>String(v||'').trim().toLowerCase();
function isPreview(){const role=String(localStorage.getItem('SP_LOGIN_ROLE')||localStorage.getItem('SP_ACTIVE_ROLE')||'').toLowerCase();if(role==='teacher')return true;try{return JSON.parse(sessionStorage.getItem('SP_TEACHER_PREVIEW')||'null')?.teacherPreview===true}catch(e){return false}}
const storage=()=>isPreview()?sessionStorage:localStorage,fresh=()=>({total:5,done:[],queue:[0,1,2,3,4],current:null,tries:0,needsRepeat:[]});
function normalizeState(value){
 const base=fresh(),done=[...new Set((Array.isArray(value?.done)?value.done:[]).map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<5))];
 let current=Number.isInteger(Number(value?.current))&&!done.includes(Number(value.current))&&Number(value.current)>=0&&Number(value.current)<5?Number(value.current):null;
 let queue=[...new Set((Array.isArray(value?.queue)?value.queue:[]).map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<5&&!done.includes(i)&&i!==current))];
 // Entscheidend: bei 20/40/60/80 % niemals aus einem alten completed/percent-Feld auf 100 % schließen.
 for(let i=0;i<5;i++)if(!done.includes(i)&&i!==current&&!queue.includes(i))queue.push(i);
 if(done.length<5&&current==null&&queue.length)current=queue.shift();
 return{...base,...value,total:5,done,queue,current,tries:Math.max(0,Number(value?.tries)||0),needsRepeat:[...new Set((Array.isArray(value?.needsRepeat)?value.needsRepeat:[]).map(Number).filter(i=>i>=0&&i<5&&!done.includes(i)))],completed:done.length===5,percent:done.length*20};
}
function load(){try{return normalizeState(JSON.parse(storage().getItem(KEY)||'null'))}catch(e){return fresh()}}
let state=load(),selections={};
function save(){state=normalizeState(state);if(!isPreview())storage().setItem(KEY,JSON.stringify(state))}
function currentIndex(){state=normalizeState(state);if(state.done.length>=5)return null;if(state.current==null){if(!state.queue.length)for(let i=0;i<5;i++)if(!state.done.includes(i))state.queue.push(i);state.current=state.queue.shift();state.tries=0;save()}return state.current}
function header(){let p={};try{p=JSON.parse(localStorage.getItem('SP_USER_PROFILE')||localStorage.getItem('SP_STUDENT_PROFILE')||'{}')||{}}catch(e){}const name=[p.vorname||p.firstName,p.nachname||p.lastName].filter(Boolean).join(' ')||'Schüler/in',role=String(localStorage.getItem('SP_LOGIN_ROLE')||localStorage.getItem('SP_ACTIVE_ROLE')||'').toLowerCase(),dashboard=role==='teacher'?'/teacher/index.html':'/student-dashboard/index.html';topbar.innerHTML='<div class="topbar-main"><a class="brand" href="/index.html"><div class="logo"><img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot"></div><div><h1>SprachPilot</h1><div class="subtitle">Dialoge · A1 Lektion 6 · Thema 4</div></div></a><div class="account-tools"><span class="account-pill">'+esc(name)+'</span><a class="account-link" href="'+dashboard+'">Dashboard</a><a class="account-link" href="/profile/index.html">Profil</a></div></div><nav class="nav"><a class="btn secondary" href="index.html">← Zur Übersicht</a></nav>'}
function progress(){const percent=state.done.length*20;return'<div class="task-progress-row"><span>'+state.done.length+' fehlerfrei · '+(5-state.done.length)+' übrig</span><strong>'+percent+'%</strong></div><div class="progress"><div class="bar" style="width:'+percent+'%"></div></div>'}
function feedback(){if(state.tries===1)return'<div class="feedback no">Noch nicht richtig. Höre den Dialog noch einmal und prüfe alle drei Antworten.</div>';if(state.tries===2)return'<div class="feedback hint"><strong>Hinweis:</strong> Achte auf Zeiten, Orte und Gründe.</div>';if(state.tries>=3){const d=DIALOGS[state.current];return'<div class="feedback no"><strong>Lösungen:</strong>'+d.questions.map((q,i)=>'<br>'+(i+1)+'. '+esc(q[1])).join('')+'<br>Gib die Antworten selbst noch einmal richtig ein.</div>'}return''}
function question(q,index){return'<section class="dialog13-question"><div class="dialog13-question-number">'+(index+1)+'</div><h2>'+esc(q[0])+'</h2><div class="dialog13-options">'+q[2].map((o,i)=>'<button type="button" class="option" data-question="'+index+'" data-value="'+esc(o)+'"><span class="abc-letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>').join('')+'</div></section>'}
function render(){state=normalizeState(state);save();if(state.done.length>=5){area.innerHTML='<div class="finish-box"><h2>Aufgabe 13 fertig</h2><p>Du hast alle fünf Dialoge fehlerfrei bearbeitet.</p><a class="btn" href="task.html?task=phrases">Weiter zu Aufgabe 14</a></div>';return}const index=currentIndex(),dialog=DIALOGS[index];if(index==null||!dialog){state=normalizeState(state);save();setTimeout(render,50);return}selections={};area.innerHTML='<div class="task-title-block"><span class="task-number">Aufgabe 13</span><h1>Dialoge</h1></div>'+progress()+'<div class="task-instruction">Höre den Dialog und beantworte alle drei Fragen.</div><div class="dialog13-page-label">Dialog '+(index+1)+' von 5</div><div class="audio-box dialog13-audio"><audio controls preload="metadata"><source src="'+esc(AUDIO+dialog.file)+'" type="audio/mpeg"></audio></div><div class="dialog13-question-list">'+dialog.questions.map(question).join('')+'</div><div class="actions"><button class="btn" id="check" type="button" disabled>Kontrollieren</button></div><div id="feedback">'+feedback()+'</div>'}
area.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.question!==undefined){const qi=Number(button.dataset.question);selections[qi]=button.dataset.value;area.querySelectorAll('[data-question="'+qi+'"]').forEach(x=>x.classList.toggle('selected',x===button));document.getElementById('check').disabled=Object.keys(selections).length<3;return}if(button.id!=='check')return;const dialog=DIALOGS[state.current];if(!dialog||Object.keys(selections).length<3)return;const correct=dialog.questions.every((q,i)=>normalize(selections[i])===normalize(q[1]));if(!correct){state.tries++;if(!state.needsRepeat.includes(state.current))state.needsRepeat.push(state.current);save();document.getElementById('feedback').innerHTML=feedback();return}if(state.needsRepeat.includes(state.current)){state.needsRepeat=state.needsRepeat.filter(i=>i!==state.current);if(!state.queue.includes(state.current))state.queue.push(state.current)}else if(!state.done.includes(state.current))state.done.push(state.current);state.current=null;state.tries=0;save();setTimeout(render,350)});
header();render();
})();
</script></body></html>
