<div class="container">

<section class="card progress-card"><div class="circle" id="totalCircle">0%</div><div><h2>Dein Fortschritt</h2><p class="small" id="totalText">0 Aufgaben abgeschlossen</p><div class="progress"><div class="bar" id="totalBar"></div></div><p class="small">Ziel: Freizeit-Wortschatz, Hobbys, Häufigkeit, Dialoge und Hörverstehen sicher benutzen.</p><div id="scoreSummary"></div></div></section>

<script>
L6T4ThemeScoreV3.initOverview();
l6t4MatchedHeader('Freizeit & Alltag',true);
l6t4MatchedMenu();
L6T4ThemeScoreV3.renderSummary();

(function(){
 const target='aufgabe13-dialoge-20260728.html';
 const matches=link=>{
  if(!link)return false;
  const number=String(link.querySelector('.num')?.textContent||'').trim();
  const href=String(link.getAttribute('href')||'');
  return /^13\./.test(number)||href.includes('task=dialog-abc')||href.includes('dialoge.html');
 };
 const enforce=()=>document.querySelectorAll('#taskGrid a').forEach(link=>{if(matches(link))link.setAttribute('href',target)});
 enforce();
 const grid=document.getElementById('taskGrid');
 if(grid)new MutationObserver(enforce).observe(grid,{childList:true,subtree:true,attributes:true,attributeFilter:['href']});
 document.addEventListener('click',event=>{
  const link=event.target.closest('#taskGrid a');
  if(!matches(link))return;
  event.preventDefault();
  event.stopImmediatePropagation();
  location.assign(target);
 },true);
})();
</script>
</body>
</html>
