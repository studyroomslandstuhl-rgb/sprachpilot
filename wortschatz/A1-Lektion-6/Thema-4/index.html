<script>
L6T4ThemeScoreV3.initOverview();
l6t4MatchedHeader('Freizeit & Alltag',true);
l6t4MatchedMenu();
(function(){
 const examUrl='pruefung-ohne-audio.html?v=202607292304';
 let running=false;
 const enforce=()=>{
  if(running)return;
  running=true;
  try{
   document.querySelectorAll('#taskGrid a').forEach(link=>{
    const text=(link.textContent||'').toLowerCase();
    const href=link.getAttribute('href')||'';
    if((text.includes('prüfung')||href.includes('task=exam'))&&href!==examUrl)link.setAttribute('href',examUrl);
   });
  }finally{
   running=false;
  }
 };
 enforce();
 const grid=document.getElementById('taskGrid');
 if(grid)new MutationObserver(enforce).observe(grid,{childList:true,subtree:true});
 document.addEventListener('click',event=>{
  const link=event.target.closest('#taskGrid a');
  if(!link)return;
  const text=(link.textContent||'').toLowerCase(),href=link.getAttribute('href')||'';
  if(!text.includes('prüfung')&&!href.includes('task=exam'))return;
  event.preventDefault();event.stopImmediatePropagation();location.assign(examUrl);
 },true);
})();
L6T4ThemeScoreV3.renderSummary();
</script>
</body>
