<script>
(function(){
 function start(attempt){
  try{
   if(window.L6T4ThemeScoreV3&&typeof L6T4ThemeScoreV3.initOverview==='function')L6T4ThemeScoreV3.initOverview();
   if(typeof l6t4MatchedHeader==='function')l6t4MatchedHeader('Übersicht');
   if(typeof l6t4MatchedVocabulary==='function')l6t4MatchedVocabulary(document.getElementById('wordList'));
   if(document.getElementById('wordList')?.children.length)return;
  }catch(e){console.warn('L6T4 vocabulary start',e)}
  if(attempt<12)setTimeout(()=>start(attempt+1),250);
 }
 start(0);
})();
</script>
