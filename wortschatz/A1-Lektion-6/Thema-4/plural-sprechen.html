<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plural sprechen · L6T4</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="container">
<header class="topbar"></header>
<section class="card" id="area"></section>
<footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/guard.js?v=l6t4-plural1"></script>
<script src="plural-data.js?v=1"></script>
<script src="app.js?v=1"></script>
<script>
const FILE='plural-sprechen.html';
const items=window.L6T4PluralItems||[];
const total=items.length;
const area=document.getElementById('area');
let currentIndex=0;
l6t4Header('Plural sprechen');
function accepted(item){
 if(item.noPlural)return ['kein Plural üblich','kein Plural','kein üblicher Plural','keine Pluralform','keine Pluralform üblich','hat keinen Plural'];
 const withoutArticle=String(item.plural).replace(/^die\s+/i,'');
 return [item.plural,withoutArticle];
}
function solution(item){return item.noPlural?'kein Plural üblich':item.plural}
function render(message='',showWriting=false){
 const state=l6t4Load(FILE,total);
 if(state.done.length>=total){l6t4Complete(area,'index.html');return}
 currentIndex=l6t4NextIndex(FILE,total);
 const item=items[currentIndex];
 area.innerHTML=`${l6t4Progress(FILE,total)}<div class="task-instruction">Sieh oder höre das Nomen und sprich die Pluralform mit Artikel. Bei Nomen ohne üblichen Plural sage: <b>kein Plural üblich</b>.</div><div class="plural-card"><span class="source-pill">Wiederholung aus ${item.source}</span><div class="singular">${item.singular}</div><div class="prompt">Wie lautet der Plural?</div><div class="actions" style="justify-content:center;margin-top:20px"><button class="btn secondary" type="button" onclick="l6t4Say('${item.singular.replace(/'/g,"\\'")}')">🔊 Singular hören</button><button id="micBtn" class="btn" type="button" onclick="startPluralMic(this)">🎤 Plural sprechen</button><button class="btn secondary" type="button" onclick="openWriting()">✍️ Stattdessen schreiben</button></div><div id="micStatus" class="mic-status"></div></div><div id="writeBox" class="write-box" style="display:${showWriting?'block':'none'}"><label for="pluralAnswer">Pluralform schreiben</label><input id="pluralAnswer" autocomplete="off" placeholder="z. B. die Bücher oder kein Plural üblich"><div class="actions" style="margin-top:10px"><button class="btn" type="button" onclick="checkWritten()">Kontrollieren</button></div></div><div id="feedback" class="feedback">${message}</div>`;
 if(showWriting)setTimeout(()=>document.getElementById('pluralAnswer')?.focus(),30);
 document.getElementById('pluralAnswer')?.addEventListener('keydown',event=>{if(event.key==='Enter')checkWritten()});
}
function openWriting(message=''){
 const previous=document.getElementById('feedback')?.innerHTML||'';
 render(message||previous,true);
}
function startPluralMic(button){
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){openWriting('<div class="hint">Das Mikrofon wird auf diesem Gerät nicht unterstützt. Bitte schreibe die Pluralform.</div>');return}
 let recognition,resultReceived=false,failed=false;
 try{recognition=new Recognition()}catch(error){openWriting('<div class="hint">Das Mikrofon konnte nicht gestartet werden. Bitte schreibe die Pluralform.</div>');return}
 recognition.lang='de-DE';recognition.interimResults=false;recognition.maxAlternatives=3;
 const oldText=button.textContent;button.disabled=true;button.textContent='Ich höre …';
 recognition.onresult=event=>{
  resultReceived=true;
  const alternatives=event.results&&event.results[0]?Array.from(event.results[0]).map(result=>result.transcript).filter(Boolean):[];
  checkSpoken(alternatives);
 };
 recognition.onerror=()=>{failed=true;openWriting('<div class="hint">Das Mikrofon ist blockiert oder hat nicht funktioniert. Bitte schreibe die Pluralform.</div>')};
 recognition.onnomatch=()=>{failed=true;openWriting('<div class="hint">Ich konnte nichts erkennen. Bitte schreibe die Pluralform.</div>')};
 recognition.onend=()=>{button.disabled=false;button.textContent=oldText;if(!resultReceived&&!failed)openWriting('<div class="hint">Ich konnte nichts erkennen. Bitte schreibe die Pluralform.</div>')};
 try{recognition.start()}catch(error){failed=true;button.disabled=false;button.textContent=oldText;openWriting('<div class="hint">Das Mikrofon konnte nicht gestartet werden. Bitte schreibe die Pluralform.</div>')}
}
function checkSpoken(alternatives){
 const item=items[currentIndex],isCorrect=(alternatives||[]).some(value=>l6t4Exact(value,accepted(item)));
 if(isCorrect){correct('<div class="ok">Richtig gesprochen: '+solution(item)+'</div>');return}
 const tries=l6t4Wrong(FILE,total),message=tries>=3?`<div class="no">Noch nicht richtig. Lösung: <b>${solution(item)}</b><br>Schreibe die Lösung. Das Wort erscheint später erneut.</div>`:'<div class="no">Noch nicht richtig erkannt. Versuche es erneut oder schreibe die Pluralform. Das Wort erscheint später erneut.</div>';
 openWriting(message);
}
function checkWritten(){
 const input=document.getElementById('pluralAnswer'),item=items[currentIndex];
 if(!input)return;
 if(l6t4Exact(input.value,accepted(item))){correct('<div class="ok">Richtig geschrieben: '+solution(item)+'</div>');return}
 const tries=l6t4Wrong(FILE,total);
 document.getElementById('feedback').innerHTML=tries>=3?`<div class="no">Lösung: <b>${solution(item)}</b></div>`:'<div class="no">Noch nicht richtig. Prüfe Artikel, Umlaut und Endung.</div>';
 input.focus();
}
function correct(message){
 document.getElementById('feedback').innerHTML=message;
 l6t4Right(FILE,total);
 setTimeout(()=>render(),800);
}
render();
</script>
</body>
</html>
