<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bild → Wort</title><link rel="stylesheet" href="style.css?v=12"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-stable2"></script><script src="app.js?v=14"></script><script src="l6t2-postkarte.js?v=15"></script><script src="l6t2-images.js?v=5"></script><script src="l6t2-stability.js?v=2"></script><script>
const area=document.getElementById('area');header('Bild → Wort');const FILE='bild-wort.html';let items=words(),i=0;
function show(){items=words();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'hoeren-bild.html?v=l6t2-stable2');return}i=spNextIndex(FILE,items.length);const w=items[i],opts=shuffle([w,...shuffle(items.filter(x=>x.id!==w.id)).slice(0,3)]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Welches Wort passt zum Bild?')}${visual(w)}<div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${o.id}')">${full(o)}</button>`).join('')}</div><div id="fb" class="feedback"></div>`;if(window.l6t2ConnectImages)l6t2ConnectImages(area)}
function check(btn,id){const w=items[i],feedback=document.getElementById('fb');if(id===w.id){btn.classList.add('ok');feedback.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,450)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);feedback.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Achten Sie genau auf das Bild und den Artikel.',full(w))}}
show();
</script></body></html>
