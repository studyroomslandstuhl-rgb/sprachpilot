<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören → Bild</title><link rel="stylesheet" href="style.css?v=12"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-stable2"></script><script src="app.js?v=14"></script><script src="l6t2-postkarte.js?v=15"></script><script src="l6t2-images.js?v=5"></script><script src="l6t2-stability.js?v=2"></script><script>
const area=document.getElementById('area');header('Hören → Bild');
const FILE='hoeren-bild.html';let items=words(),i=0,heard=false;
function show(){items=words();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'kategorien-drag.html?v=l6t2-stable2');return}i=spNextIndex(FILE,items.length);heard=false;const w=items[i],opts=shuffle([w,...shuffle(items.filter(x=>x.id!==w.id)).slice(0,3)]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie zuerst das Wort. Wählen Sie dann das richtige Bild.')}<div class="actions"><button class="btn" onclick="listen()">Wort hören</button></div><div id="imageOptions" class="image-choice-grid hidden">${opts.map(o=>{const file=String(o.image||o.id+'.webp').split('/').pop();return `<button class="image-choice" onclick="check(this,'${o.id}')"><img src="${img(o)}" data-l6t2-image="${file}" data-l6t2-connected="1" loading="eager" decoding="async" alt="${full(o)}"></button>`}).join('')}</div><div id="fb" class="feedback"></div>`;if(window.l6t2ConnectImages)l6t2ConnectImages(area)}
function listen(){say(full(items[i]));heard=true;document.getElementById('imageOptions').classList.remove('hidden')}
function check(btn,id){if(!heard)return;const w=items[i],feedback=document.getElementById('fb');if(id===w.id){btn.classList.add('ok');feedback.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,450)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);feedback.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Hören Sie das Wort noch einmal und vergleichen Sie die Bilder.',full(w))}}
show();
</script></body></html>
