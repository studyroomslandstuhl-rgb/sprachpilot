<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören → Bild</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=4"></script><script src="l6t2-postkarte.js?v=3"></script><script src="l6t2-extra-tasks.js?v=5"></script><script>
header('Hören → Bild');
const FILE='hoeren-bild.html';let items=words(),i=0,heard=false;
function show(){items=words();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'kategorien-drag.html');return}i=spNextIndex(FILE,items.length);heard=false;const w=items[i],opts=shuffle([w,...shuffle(items.filter(x=>x.id!==w.id)).slice(0,3)]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie zuerst das Wort. Wählen Sie dann das richtige Bild.')}<div class="actions"><button class="btn" onclick="listen()">Wort hören</button></div><div id="imageOptions" class="image-choice-grid hidden">${opts.map(o=>`<button class="image-choice" onclick="check(this,'${o.id}')"><img src="${img(o)}" alt="" onerror="this.closest('button').disabled=true"></button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function listen(){say(full(items[i]));heard=true;imageOptions.classList.remove('hidden')}
function check(btn,id){if(!heard)return;const w=items[i];if(id===w.id){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');spMarkWrong(FILE,items.length);fb.innerHTML='<div class="no">Noch nicht richtig.</div>'}}
show();
</script></body></html>
