<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Präpositionen zuordnen · 2 Teile</title><link rel="stylesheet" href="style.css?v=12"><style>.sort-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:3px solid var(--lesson-main-dark);border-radius:20px;overflow:hidden;margin:16px 0;background:#fff}.sort-grid .dropzone{min-height:175px;padding:14px;background:#fff}.sort-grid .dropzone:not(:nth-child(3n)){border-right:3px solid var(--lesson-line)}.sort-grid .dropzone:nth-child(-n+3){border-bottom:3px solid var(--lesson-line)}.sort-grid .dropzone h2{text-align:center;border-bottom:2px solid var(--lesson-main-dark);padding-bottom:10px;margin:0 0 12px}@media(max-width:760px){.sort-grid{grid-template-columns:1fr}.sort-grid .dropzone,.sort-grid .dropzone:not(:nth-child(3n)),.sort-grid .dropzone:nth-child(-n+3){border-right:0;border-bottom:3px solid var(--lesson-line)}.sort-grid .dropzone:last-child{border-bottom:0}}</style></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-stable2"></script><script src="app.js?v=14"></script><script src="l6t2-stability.js?v=2"></script><script>
const area=document.getElementById('area');header('Präpositionen zuordnen · 2 Teile');
const FILE='praepositionen-drag.html';
const GROUPS=['in','in der','in den','am','um','im'];
const ITEMS=[
{word:'Japan',a:'in'},{word:'Deutschland',a:'in'},{word:'Vietnam',a:'in'},{word:'Polen',a:'in'},{word:'Frankreich',a:'in'},{word:'Rumänien',a:'in'},{word:'Schweiz',a:'in der'},{word:'Türkei',a:'in der'},{word:'Ukraine',a:'in der'},{word:'USA',a:'in den'},{word:'Montag',a:'am'},{word:'Morgen',a:'am'},{word:'Abend',a:'am'},{word:'10 Uhr',a:'um'},{word:'8 Uhr',a:'um'},{word:'Herbst',a:'im'},{word:'Norden',a:'im'},{word:'Winter',a:'im'}
];
const STRUCTURE_KEY=CFG.key+'_praep_drag_split_v3';
if(localStorage.getItem(STRUCTURE_KEY)!=='1')localStorage.setItem(STRUCTURE_KEY,'1');
const ORDER_KEY=CFG.key+'_praep_drag_order_v3';
let order=[];try{order=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]')}catch(e){}
if(order.length!==ITEMS.length||order.some(n=>!Number.isInteger(n)||n<0||n>=ITEMS.length)){order=shuffle([...Array(ITEMS.length).keys()]);localStorage.setItem(ORDER_KEY,JSON.stringify(order))}
const ALL=order.map(sourceIndex=>({...ITEMS[sourceIndex],sourceIndex}));
const cut=Math.ceil(ALL.length/2);
const PARTS=[ALL.slice(0,cut),ALL.slice(cut)];
let part=loadTask(FILE,ALL.length).done.length>=cut?1:0,selected=null;
function currentItems(){return PARTS[part]}
function show(){if(loadTask(FILE,ALL.length).done.length>=ALL.length){complete(area,FILE,'fehler-finden.html?v=l6t2-stable2');return}const items=currentItems();selected=null;area.innerHTML=`${progress(FILE,ALL.length)}${instruction('Ordnen Sie die Wörter der richtigen Präposition zu.')}<div class="part-label">Teil ${part+1} von 2</div><div id="chips" class="drag-bank">${items.map(x=>`<span class="chip" data-id="${x.sourceIndex}">${x.word}</span>`).join('')}</div><div class="drop-grid sort-grid">${GROUPS.map(g=>`<div class="dropzone" data-a="${g}"><h2>${g}</h2></div>`).join('')}</div><div class="actions"><button class="btn" onclick="control()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;bind()}
function clearSelection(){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));selected=null}
function bind(){document.querySelectorAll('.chip').forEach(c=>c.onclick=e=>{e.stopPropagation();clearSelection();selected=c;c.classList.add('selected')});document.querySelectorAll('.dropzone').forEach(z=>z.onclick=e=>{if(e.target.closest('.chip')||!selected)return;selected.classList.remove('selected','no');z.appendChild(selected);selected=null;bind()})}
function control(){document.querySelectorAll('.correction').forEach(x=>x.remove());let ok=0;const wrong=[];document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected','ok','no'));document.querySelectorAll('.dropzone').forEach(z=>z.querySelectorAll('.chip').forEach(c=>{const x=ITEMS[Number(c.dataset.id)];if(x&&z.dataset.a===x.a){c.classList.add('ok');ok++}else if(x){c.classList.add('no');wrong.push({c,x})}}));[...document.querySelectorAll('#chips .chip')].forEach(c=>{const x=ITEMS[Number(c.dataset.id)];if(x)wrong.push({c,x})});bind();const items=currentItems();if(ok===items.length){if(part===0){saveTask(FILE,{total:ALL.length,done:[...Array(cut).keys()],queue:[...Array(ALL.length-cut).keys()].map(n=>n+cut),current:null,tries:0,hadWrong:false});part=1;show();return}markTaskDone(FILE,ALL.length);complete(area,FILE,'fehler-finden.html?v=l6t2-stable2');return}const t=spMarkWrong(FILE,ALL.length);if(t>=3)wrong.forEach(({c,x})=>{const note=document.createElement('span');note.className='correction';note.textContent='richtig: '+x.a;c.after(note)});document.getElementById('fb').innerHTML=help3(t,'Noch nicht richtig.','Tipp: Länder ohne Artikel → in; Länder mit die → in der; USA → in den; Tage/Tageszeiten → am; Uhrzeiten → um; Jahreszeiten/Himmelsrichtungen → im.',wrong.map(({x})=>x.word+' → '+x.a).join(' · '))}
show();
</script></body></html>
