<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Präpositionen · Drag & Drop</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script src="l6t2-extra-tasks.js?v=1"></script><script>
header('Präpositionen · Drag & Drop');const FILE='praepositionen-drag.html';let items=PREP_DRAG_ITEMS,i=0,current=null;
function show(){items=PREP_DRAG_ITEMS;if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'fehler-finden.html');return}i=spNextIndex(FILE,items.length);current=items[i];const opts=shuffle(current.opts);area.innerHTML=`${progress(FILE,items.length)}${instruction('Ziehen Sie die passende Präposition in die Lücke.')}<div class="question">${current.sentence.replace('___','<span class="drop-zone" id="gap" ondragover="event.preventDefault();this.classList.add(\'active\')" ondragleave="this.classList.remove(\'active\')" ondrop="dropPrep(event)">___</span>')}</div><div>${opts.map(o=>`<span class="drag-token" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${encodeURIComponent(o)}')">${o}</span>`).join('')}</div><div class="example-box"><b>Präpositionen:</b> am · um · im · in · in der · aus · aus dem · aus der</div><div id="fb" class="feedback"></div>`}
function dropPrep(ev){ev.preventDefault();gap.classList.remove('active');const val=decodeURIComponent(ev.dataTransfer.getData('text/plain')||'');gap.textContent=val;if(val===current.a){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+current.tip,current.a)}}
show();</script></body></html>
