<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Präpositionen zuordnen · 2 Teile</title><link rel="stylesheet" href="style.css?v=10"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-open2"></script><script src="app.js?v=10"></script><script src="l6t2-extra-tasks.js?v=17"></script><script>
const area=document.getElementById('area');header('Präpositionen zuordnen · 2 Teile');
const FILE='praepositionen-drag.html';
const STRUCTURE_KEY=CFG.key+'_praep_drag_split_v2';
if(localStorage.getItem(STRUCTURE_KEY)!=='1'){localStorage.removeItem(taskKey(FILE));localStorage.setItem(STRUCTURE_KEY,'1')}
const GROUPS=['in','in der','in den','am','um','im'];
const ORDER_KEY=CFG.key+'_praep_drag_order_v2';
let order=[];try{order=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]')}catch(e){}
if(order.length!==PREP_DRAG_ITEMS.length||order.some(n=>!Number.isInteger(n)||n<0||n>=PREP_DRAG_ITEMS.length)){order=shuffle([...Array(PREP_DRAG_ITEMS.length).keys()]);localStorage.setItem(ORDER_KEY,JSON.stringify(order))}
const ALL=order.map(sourceIndex=>({...PREP_DRAG_ITEMS[sourceIndex],sourceIndex}));
const cut=Math.ceil(ALL.length/2);
const PARTS=[ALL.slice(0,cut),ALL.slice(cut)];
let part=loadTask(FILE,ALL.length).done.length>=cut?1:0,selected=null;
function currentItems(){return PARTS[part]}
function show(){
  if(loadTask(FILE,ALL.length).done.length>=ALL.length){complete(area,FILE,'fehler-finden.html?v=l6t2-open2');return}
  const items=currentItems();selected=null;
  area.innerHTML=`${progress(FILE,ALL.length)}${instruction('Ordnen Sie die Wörter der richtigen Präposition zu.')}<div class="part-label">Teil ${part+1} von 2</div><div id="chips" class="drag-bank">${items.map(x=>`<span class="chip" data-id="${x.sourceIndex}">${x.word}</span>`).join('')}</div><div class="drop-grid">${GROUPS.map(g=>`<div class="dropzone" data-a="${g}"><h2>${g}</h2></div>`).join('')}</div><div class="actions"><button class="btn" onclick="control()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;
  bind();
}
function clearSelection(){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));selected=null}
function bind(){
  document.querySelectorAll('.chip').forEach(c=>c.onclick=e=>{e.stopPropagation();clearSelection();selected=c;c.classList.add('selected')});
  document.querySelectorAll('.dropzone').forEach(z=>z.onclick=e=>{if(e.target.closest('.chip')||!selected)return;selected.classList.remove('selected','no');z.appendChild(selected);selected=null;bind()});
}
function control(){
  document.querySelectorAll('.correction').forEach(x=>x.remove());
  let ok=0;const wrong=[];
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected','ok','no'));
  document.querySelectorAll('.dropzone').forEach(z=>z.querySelectorAll('.chip').forEach(c=>{const x=PREP_DRAG_ITEMS[Number(c.dataset.id)];if(x&&z.dataset.a===x.a){c.classList.add('ok');ok++}else if(x){c.classList.add('no');wrong.push({c,x})}}));
  [...document.querySelectorAll('#chips .chip')].forEach(c=>{const x=PREP_DRAG_ITEMS[Number(c.dataset.id)];if(x)wrong.push({c,x})});
  bind();
  const items=currentItems();
  if(ok===items.length){
    if(part===0){saveTask(FILE,{total:ALL.length,done:[...Array(cut).keys()],queue:[...Array(ALL.length-cut).keys()].map(n=>n+cut),current:null,tries:0,hadWrong:false});part=1;show();return}
    markTaskDone(FILE,ALL.length);complete(area,FILE,'fehler-finden.html?v=l6t2-open2');return;
  }
  const t=spMarkWrong(FILE,ALL.length);
  if(t>=3)wrong.forEach(({c,x})=>{const note=document.createElement('span');note.className='correction';note.textContent='richtig: '+x.a;c.after(note)});
  const solution=wrong.map(({x})=>x.word+' → '+x.a).join(' · ');
  document.getElementById('fb').innerHTML=help3(t,'Noch nicht richtig.','Tipp: Länder ohne Artikel → in; Länder mit die → in der; USA → in den; Tage/Tageszeiten → am; Uhrzeiten → um; Jahreszeiten/Himmelsrichtungen → im.',solution);
}
show();
</script></body></html>
