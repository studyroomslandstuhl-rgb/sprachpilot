<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sätze bauen</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=4"></script><script>
header('Sätze bauen');const FILE='saetze-bauen.html';let items=SENTENCES,i=0,chosen=[];
function show(){items=SENTENCES;if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'pruefung.html');return}i=spNextIndex(FILE,items.length);chosen=[];render()}
function render(){const it=items[i],pool=shuffle(it.parts.filter(p=>!chosen.includes(p)));area.innerHTML=`${progress(FILE,items.length)}${instruction('Bauen Sie den Satz.')}<div class="example-box"><b>Beispiel:</b> Im · Norden · ist · es · kalt. → Im Norden ist es kalt.</div><div class="sentence-box" id="built">${chosen.join(' ')||'—'}</div><div class="choice-grid">${pool.map(p=>`<button class="choice" onclick="pick('${encodeURIComponent(p)}')">${p}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button><button class="btn secondary" onclick="chosen=[];render()">Neu</button></div><div id="fb" class="feedback"></div>`}
function pick(raw){chosen.push(decodeURIComponent(raw));render()}
function check(){const it=items[i],val=chosen.join(' ');if(exact(val,it.sol)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Achten Sie auf die Reihenfolge.',it.sol)}}
show();</script></body></html>
