<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=4"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2help2"></script><script src="app.js?v=4"></script><script src="l6t2-postkarte.js?v=6"></script><script src="l6t2-images.js?v=1"></script><script>
header('Karteikarten');const FILE='karteikarten.html';let items=words(),i=0;
function show(){items=words();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'bild-wort.html');return}i=spNextIndex(FILE,items.length);const w=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Schreiben oder sprechen Sie das Wort. Nomen mit Artikel, Länder so wie in der Übersicht.')}<div class="small">${w.group}</div>${visual(w)}<div class="hint">Übersetzung: <b>${tr(w)}</b></div><div class="actions"><button id="micBtn" class="btn" onclick="speakAns()">Sprechen</button><button class="btn secondary" onclick="document.getElementById('box').style.display='block'">Schreiben</button><button class="btn secondary" onclick="reveal()">Hilfe</button></div><div id="micStatus" class="small"></div><div id="box" style="display:none"><input id="ans" placeholder="Antwort schreiben"><button class="btn" onclick="check(document.getElementById('ans').value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function solution(w){return full(w)}
function reveal(){const w=items[i],t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Versuchen Sie es zuerst selbst.','Tipp: Nutzen Sie die Übersetzung und achten Sie bei Nomen auf den Artikel.',solution(w))}
function startMic(btn,callback){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('micStatus');if(!SR){if(status)status.textContent='Mikrofon wird hier nicht unterstützt. Bitte schreiben.';document.getElementById('box').style.display='block';return}const rec=new SR();rec.lang='de-DE';rec.onresult=e=>callback(e.results[0][0].transcript);rec.onerror=()=>{if(status)status.textContent='Mikrofon hat nicht funktioniert. Bitte schreiben.'};rec.onend=()=>{if(btn)btn.classList.remove('active')};if(btn)btn.classList.add('active');if(status)status.textContent='Ich höre zu …';rec.start()}
function speakAns(){startMic(document.getElementById('micBtn'),txt=>{document.getElementById('box').style.display='block';document.getElementById('ans').value=txt;check(txt)})}
function check(v){const w=items[i],sol=solution(w);if(exact(v,sol)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Schreiben Sie das ganze Wort. Bei Nomen mit Artikel.',sol)}}
show();
</script></body></html>
