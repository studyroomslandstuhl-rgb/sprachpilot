<script>
(function(){
const FILE='karteikarten.html';
function items(){return words()}
function migrate(){const list=items(),count=list.length,key=taskKey(FILE),marker=CFG.key+'_cards_word_only_v2';if(localStorage.getItem(marker)==='1')return;try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&Number(old.total)===count*2){const mapList=value=>[...new Set((Array.isArray(value)?value:[]).filter(n=>Number.isInteger(n)&&n>=0&&n<count*2&&n%2===0).map(n=>n/2))];const done=mapList(old.done),queue=mapList(old.queue).filter(n=>!done.includes(n));const current=Number.isInteger(old.current)&&old.current>=0&&old.current<count*2&&old.current%2===0?old.current/2:null;const used=new Set([...done,...queue,...(current===null?[]:[current])]);const missing=[...Array(count).keys()].filter(n=>!used.has(n));localStorage.setItem(key,JSON.stringify({total:count,done,queue:[...queue,...missing],current,tries:Number(old.tries||0),hadWrong:!!old.hadWrong}));if(typeof clearTaskCaches==='function')clearTaskCaches()}}catch(e){}localStorage.setItem(marker,'1')}
migrate();
SPCardStandard.mount({
 area:'#area',words:items,nextPage:'bild-wort.html?v=l6t2-stable2',full:w=>full(w),word:w=>w.word,
 plural:w=>w.plural||'',example:w=>w.sentence||'',translation:w=>tr(w),languageName:'Muttersprache',visual:w=>visual(w),normalize:v=>simple(v),accept:(w,value)=>exact(value,full(w)),audio:w=>say(full(w)),
 state:{progress(){const list=items(),st=loadTask(FILE,list.length);return{total:list.length,done:st.done.length,tries:st.tries||0,hadWrong:!!st.hadWrong}},current(){const list=items();return list[spNextIndex(FILE,list.length)]},wrong(){return spMarkWrong(FILE,items().length)},right(){spMarkRight(FILE,items().length)},resetCurrent(){localStorage.removeItem(taskKey(FILE))}}
});
})();
</script>
