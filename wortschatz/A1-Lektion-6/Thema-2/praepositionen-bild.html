<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bild → Präposition</title><link rel="stylesheet" href="style.css?v=4"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2help1"></script><script src="app.js?v=4"></script><script src="l6t2-postkarte.js?v=6"></script><script src="l6t2-extra-tasks.js?v=6"></script><script>
header('Bild → Präposition');
const FILE='praepositionen-bild.html';let items=PREP_IMAGE_ITEMS,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'praepositionen-drag.html');return}i=spNextIndex(FILE,items.length);const it=items[i],w=words().find(x=>x.id===it.id);area.innerHTML=`${progress(FILE,items.length)}${instruction('Sehen Sie das Bild. Wählen Sie die richtige Präposition.')}<div class="task-img-box"><img src="${img(w)}" alt="${full(w)}" onerror="this.parentElement.textContent='${full(w)}'"></div><div class="choice-grid">${L6T2_PREP_OPTIONS.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){const val=decodeURIComponent(raw),it=items[i],w=words().find(x=>x.id===it.id);if(val===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+it.hint,it.a+' '+full(w))}}
show();
</script></body></html>
