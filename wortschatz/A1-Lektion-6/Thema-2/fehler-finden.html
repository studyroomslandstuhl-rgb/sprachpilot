<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fehler finden und korrigieren</title><link rel="stylesheet" href="style.css?v=4"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2help1"></script><script src="app.js?v=4"></script><script src="l6t2-extra-tasks.js?v=6"></script><script>
header('Fehler finden und korrigieren');const FILE='fehler-finden.html';let items=PREP_ERROR_ITEMS,i=0,current=null,selected=-1;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'postkarte.html');return}i=spNextIndex(FILE,items.length);current=items[i];selected=-1;area.innerHTML=`${progress(FILE,items.length)}${instruction('Finde den Fehler und korrigiere.')}<p class="error-click-sentence" id="errorSentence">${current.tokens.map((t,n)=>`<span class="error-word" data-index="${n}" tabindex="0">${t}</span>`).join(' ')}</p><div id="correctionBox" class="hidden"><input id="ans" placeholder="Schreibe den ganzen Satz richtig."><div class="actions"><button class="btn" id="checkBtn">Kontrollieren</button></div></div><div id="fb" class="feedback"></div>`;bindWords()}
function bindWords(){document.querySelectorAll('.error-word').forEach(el=>{const run=()=>choose(Number(el.dataset.index),el);el.addEventListener('click',run);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run()}})});document.getElementById('checkBtn').addEventListener('click',check)}
function choose(n,el){document.querySelectorAll('.error-word').forEach(x=>x.classList.remove('selected','no'));selected=n;if(n===current.wrongIndex){el.classList.add('selected');document.getElementById('correctionBox').classList.remove('hidden');document.getElementById('ans').focus();document.getElementById('fb').innerHTML='';return}el.classList.add('no');const t=spMarkWrong(FILE,items.length);document.getElementById('fb').innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+current.hint,'Falsches Wort: '+current.tokens[current.wrongIndex])}
function check(){if(selected!==current.wrongIndex)return;const input=document.getElementById('ans');if(exact(input.value,current.right)){input.classList.add('is-ok');document.getElementById('fb').innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,800)}else{input.classList.remove('is-ok');input.classList.add('is-no');const t=spMarkWrong(FILE,items.length);document.getElementById('fb').innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+current.hint,current.right)}}
show();
</script></body></html>
