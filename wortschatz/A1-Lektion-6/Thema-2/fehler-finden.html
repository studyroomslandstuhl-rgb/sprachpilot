<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fehler finden</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t2-extra-tasks.js?v=2"></script><script>
header('Fehler finden');const FILE='fehler-finden.html';let items=PREP_ERROR_ITEMS,i=0,current=null;
function show(){items=PREP_ERROR_ITEMS;if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'saetze-bauen.html');return}i=spNextIndex(FILE,items.length);current=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Im Satz ist die Präposition falsch. Schreiben Sie die richtige Präposition.')}<div class="error-sentence">${current.wrong}</div><input id="ans" placeholder="richtige Präposition schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div class="example-box"><b>Gemischt:</b> Zeitpräpositionen aus Lektion 5 + neue Präpositionen aus Lektion 6.</div><div id="fb" class="feedback"></div>`}
function check(){const val=ans.value;if(exact(val,current.a)){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div><div class="hint">'+current.right+'</div>';spMarkRight(FILE,items.length);setTimeout(show,900)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+current.tip,current.a+' → '+current.right)}}
show();</script></body></html>
