<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fehler finden und korrigieren</title><link rel="stylesheet" href="style.css?v=12"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-stable1"></script><script src="app.js?v=14"></script><script src="l6t2-stability.js?v=1"></script><script>
const area=document.getElementById('area');header('Fehler finden und korrigieren');
const FILE='fehler-finden.html';
const items=[
{tokens:['Ich','lebe','im','Japan.'],wrongIndex:2,answer:'in',errorType:'Präposition'},{tokens:['In','Herbst','regnet','es','oft.'],wrongIndex:0,answer:'Im',errorType:'Präposition'},{tokens:['Ich','leben','in','Deutschland.'],wrongIndex:1,answer:'lebe',errorType:'Konjugation'},{tokens:['Am','zehn','Uhr','beginnt','der','Kurs.'],wrongIndex:0,answer:'Um',errorType:'Präposition'},{tokens:['Im','Süden','ist','es','heis.'],wrongIndex:4,answer:'heiß',errorType:'Rechtschreibung'},{tokens:['Die','Temperaturen','bleibt','angenehm.'],wrongIndex:2,answer:'bleiben',errorType:'Konjugation'},{tokens:['Ich','komme','aus','die','Türkei.'],wrongIndex:3,answer:'der',errorType:'Artikel'},{tokens:['Wir','leben','in','den','Schweiz.'],wrongIndex:3,answer:'der',errorType:'Artikel'},{tokens:['Um','Montag','habe','ich','Deutschkurs.'],wrongIndex:0,answer:'Am',errorType:'Präposition'},{tokens:['In','der','USA','lebt','meine','Tante.'],wrongIndex:1,answer:'den',errorType:'Artikel'},{tokens:['Der','Wind','kommen','aus','dem','Westen.'],wrongIndex:2,answer:'kommt',errorType:'Konjugation'},{tokens:['Im','Winter','schneien','es.'],wrongIndex:2,answer:'schneit',errorType:'Konjugation'},{tokens:['Ich','lebe','im','Deutschland.'],wrongIndex:2,answer:'in',errorType:'Präposition'},{tokens:['Die','Temperatur','sind','plus','zehn','Grad.'],wrongIndex:2,answer:'ist',errorType:'Konjugation'},{tokens:['Ich','lebe','in','Rumanien.'],wrongIndex:3,answer:'Rumänien',errorType:'Rechtschreibung'},{tokens:['Im','Norden','scheinen','die','Sonne.'],wrongIndex:2,answer:'scheint',errorType:'Konjugation'},{tokens:['Heute','ist','das','Wetter','angenehme.'],wrongIndex:4,answer:'angenehm',errorType:'Adjektivendung'},{tokens:['Ich','komme','aus','den','Ukraine.'],wrongIndex:3,answer:'der',errorType:'Artikel'},{tokens:['Im','Frühling','ist','die','Tage','länger.'],wrongIndex:2,answer:'sind',errorType:'Konjugation'},{tokens:['Im','Osten','scheint','der','Sonne.'],wrongIndex:3,answer:'die',errorType:'Artikel'}
];
let i=0,current=null,selected=-1;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'postkarte.html?v=l6t2-stable1');return}i=spNextIndex(FILE,items.length);current=items[i];selected=-1;area.innerHTML=`${progress(FILE,items.length)}${instruction('Finde den Fehler und korrigiere.')}<p class="error-click-sentence" id="errorSentence">${current.tokens.map((t,n)=>`<span class="error-word" data-index="${n}" tabindex="0">${t}</span>`).join(' ')}</p><div id="correctionBox" class="hidden"><input id="ans" autocomplete="off" placeholder="Schreibe nur das richtige Wort."><div class="actions"><button class="btn" id="checkBtn">Kontrollieren</button></div></div><div id="fb" class="feedback"></div>`;bindWords()}
function bindWords(){document.querySelectorAll('.error-word').forEach(el=>{const run=()=>choose(Number(el.dataset.index),el);el.addEventListener('click',run);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run()}})});document.getElementById('checkBtn').addEventListener('click',check);document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check()})}
function helpFor(t){return help3(t,'Falsch.','Fehlerart: '+current.errorType,current.answer)}
function choose(n,el){document.querySelectorAll('.error-word').forEach(x=>x.classList.remove('selected','no'));selected=n;if(n===current.wrongIndex){el.classList.add('selected');document.getElementById('correctionBox').classList.remove('hidden');document.getElementById('ans').focus();document.getElementById('fb').innerHTML='';return}el.classList.add('no');const t=spMarkWrong(FILE,items.length);document.getElementById('fb').innerHTML=helpFor(t)}
function check(){if(selected!==current.wrongIndex)return;const input=document.getElementById('ans');if(exact(input.value,current.answer)){input.classList.remove('is-no');input.classList.add('is-ok');document.getElementById('fb').innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,800);return}input.classList.remove('is-ok');input.classList.add('is-no');const t=spMarkWrong(FILE,items.length);document.getElementById('fb').innerHTML=helpFor(t)}
show();
</script></body></html>
