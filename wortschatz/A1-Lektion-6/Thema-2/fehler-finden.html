<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fehler finden und korrigieren</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=4"></script><script src="l6t2-extra-tasks.js?v=5"></script><script>
header('Fehler finden und korrigieren');const FILE='fehler-finden.html';let items=PREP_ERROR_ITEMS,i=0,current=null,selected=-1;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'postkarte.html');return}i=spNextIndex(FILE,items.length);current=items[i];selected=-1;area.innerHTML=`${progress(FILE,items.length)}${instruction('Finde den Fehler und korrigiere.')}<div class="error-token-row">${current.tokens.map((t,n)=>`<button class="error-token" onclick="choose(${n},this)">${t}</button>`).join(' ')}</div><div id="correctionBox" class="hidden"><input id="ans" placeholder="Schreibe den ganzen Satz richtig."><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div></div><div id="fb" class="feedback"></div>`}
function choose(n,btn){document.querySelectorAll('.error-token').forEach(x=>x.classList.remove('selected','no'));selected=n;if(n===current.wrongIndex){btn.classList.add('selected');correctionBox.classList.remove('hidden');ans.focus();fb.innerHTML=''}else{btn.classList.add('no');spMarkWrong(FILE,items.length);fb.innerHTML='<div class="no">Dieses Wort ist nicht der Fehler.</div>'}}
function check(){if(selected!==current.wrongIndex)return;if(exact(ans.value,current.right)){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,800)}else{ans.classList.add('is-no');spMarkWrong(FILE,items.length);fb.innerHTML='<div class="no">Noch nicht richtig.</div>'}}
show();
</script></body></html>
