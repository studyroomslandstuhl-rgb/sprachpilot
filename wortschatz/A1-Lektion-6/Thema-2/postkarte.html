<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postkarten ergänzen</title><link rel="stylesheet" href="style.css?v=4"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2post3"></script><script src="app.js?v=4"></script><script src="l6t2-postkarte.js?v=7"></script><script src="l6t2-images.js?v=2"></script><script src="l6t2-extra-tasks.js?v=9"></script><script>
header('Postkarten ergänzen');const FILE='postkarte.html';let stage=loadTask(FILE,2).done.includes(0)?1:0;
function imageGap(n){const g=POSTCARD_IMAGE_GAPS[n],src=l6t2ImageUrl({id:g.id,image:g.file});return `<span class="postcard-gap"><input data-answer="${g.a}" placeholder="Wort"><img class="postcard-mini" src="${src}" data-l6t2-image="${g.file}" alt="${g.a}" onerror="this.alt='Bild fehlt: ${g.file}'"></span>`}
function grammarGap(n){const g=POSTCARD_GRAMMAR_GAPS[n];return `<input class="postcard-part-input" data-answer="${g.a}" placeholder="Satzteil">`}
function show(){if(loadTask(FILE,2).done.length>=2){complete(area,FILE,'saetze-bauen.html');return}if(stage===0)showImageCard();else showGrammarCard()}
function showImageCard(){area.innerHTML=`${progress(FILE,2)}${instruction('Ergänzen Sie die Postkarte. Schreiben Sie das Wort zum Bild.')}<article class="postcard-large"><div class="postcard-stamp">POSTKARTE</div><p>Liebe Anna,</p><p>ich lebe jetzt in ${imageGap(0)}. Der ${imageGap(1)} sagt: Im ${imageGap(2)} ist das Wetter ${imageGap(3)}. Die ${imageGap(4)} ist angenehm. Es sind ${imageGap(5)} zwölf Grad.</p><p>Am Morgen ist es ${imageGap(6)} sonnig. Am Abend ${imageGap(7)} die Temperaturen angenehm.</p><p>Liebe Grüße<br>Sara</p></article><div class="actions"><button class="btn" onclick="checkImageCard()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;if(window.l6t2ConnectImages)l6t2ConnectImages()}
function checkImageCard(){let ok=true;const wrong=[];document.querySelectorAll('.postcard-gap input').forEach(input=>{const good=exact(input.value,input.dataset.answer);input.classList.toggle('is-ok',good);input.classList.toggle('is-no',!good);if(!good){ok=false;wrong.push(input.dataset.answer)}});if(!ok){const t=spMarkWrong(FILE,2);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Sehen Sie genau auf die kleinen Bilder und achten Sie auf die Schreibweise.',wrong.join(' · '));return}saveTask(FILE,{total:2,done:[0],queue:[1],current:null,tries:0,hadWrong:false});stage=1;showGrammarCard()}
function showGrammarCard(){area.innerHTML=`${progress(FILE,2)}${instruction('Ergänzen Sie die fehlenden Satzteile mit der richtigen Grammatik.')}<article class="postcard-large"><div class="postcard-stamp">POSTKARTE</div><p>Hallo Tom,</p><p>ich lebe jetzt ${grammarGap(0)}. ${grammarGap(1)} ist das Wetter hier angenehm. ${grammarGap(2)} scheint die Sonne, aber ${grammarGap(3)} regnet es leicht.</p><p>Die Temperatur ist ${grammarGap(4)}. Morgen bin ich ${grammarGap(5)}.</p><p>Viele Grüße<br>Mai</p></article><div class="actions"><button class="btn" onclick="checkGrammarCard()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function checkGrammarCard(){let ok=true;const wrong=[];document.querySelectorAll('.postcard-part-input').forEach(input=>{const good=exact(input.value,input.dataset.answer);input.classList.toggle('is-ok',good);input.classList.toggle('is-no',!good);if(!good){ok=false;wrong.push(input.dataset.answer)}});if(!ok){const t=spMarkWrong(FILE,2);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Achten Sie auf Präposition, Großschreibung und die vollständige Wortgruppe.',wrong.join(' · '));return}markTaskDone(FILE,2);complete(area,FILE,'saetze-bauen.html')}
show();
</script></body></html>
