<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postkarte fertig schreiben</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t2-postkarte.js?v=2"></script><script src="l6t2-extra-tasks.js?v=2"></script><script>
header('Postkarte fertig schreiben');const FILE='postkarte.html';let items=POSTCARD_ITEMS,i=0,current=null;
function show(){items=POSTCARD_ITEMS;if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'saetze-bauen.html');return}i=spNextIndex(FILE,items.length);current=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Schreiben Sie das passende Wort in die Lücke. Thema: Wetter und Land.')}<div class="postcard-box"><b>Postkarte</b><br>${current.blank.replace('___','<input id="ans" style="display:inline-block;width:210px;margin:0 6px" placeholder="Wort">')}</div><div class="word-bank">${POSTCARD_WORD_BANK.map(w=>`<span class="word-chip">${w}</span>`).join('')}</div><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function check(){const val=ans.value;if(exact(val,current.a)){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div><div class="hint">'+current.full+'</div>';spMarkRight(FILE,items.length);setTimeout(show,900)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Wählen Sie ein Wort aus der Wortbank.',current.a+' → '+current.full)}}
show();</script></body></html>
