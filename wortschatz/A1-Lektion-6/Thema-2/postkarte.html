<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postkarten ergänzen</title><link rel="stylesheet" href="style.css?v=12"><style>.postcard-order-line{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0}.postcard-order-line .postcard-part-input{flex:1 1 320px;margin:0}.postcard-cue{font-weight:800;color:#7a5400;background:#fff8dc;border:1px solid #facc15;border-radius:12px;padding:6px 9px}.postcard-example{background:#f0f9ff;border:1px solid #7dd3fc;border-radius:16px;padding:12px;margin:12px 0;color:#075985}@media(max-width:600px){.postcard-order-line{display:block}.postcard-order-line .postcard-part-input{display:block;width:100%;margin:7px 0}.postcard-cue{display:inline-block}}</style></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-stable2"></script><script src="app.js?v=14"></script><script src="l6t2-postkarte.js?v=15"></script><script src="l6t2-extra-tasks.js?v=17"></script><script src="l6t2-stability.js?v=2"></script><script>
const area=document.getElementById('area');header('Postkarten ergänzen');
const FILE='postkarte.html';
const POSTCARD_VERSION_KEY=CFG.key+'_postcard_content_v5';
if(localStorage.getItem(POSTCARD_VERSION_KEY)!=='1')localStorage.setItem(POSTCARD_VERSION_KEY,'1');
let stage=loadTask(FILE,2).done.includes(0)?1:0;
const POSTCARD_BUNNY='https://sprachpilot.b-cdn.net/';
function imageGap(n){
  const g=POSTCARD_IMAGE_GAPS[n];
  const file=String(g.file||g.id+'.webp').replace(/^.*\//,'').replace(/\.(png|jpe?g|gif|svg|webp)$/i,'')+'.webp';
  return `<span class="postcard-gap"><input data-answer="${g.a}" placeholder="Wort"><img class="postcard-mini" src="${POSTCARD_BUNNY+file}" alt="${g.a}" loading="eager" decoding="async" onerror="this.outerHTML='<span class=&quot;postcard-image-error&quot;>Bild fehlt: ${file}</span>'"></span>`;
}
function grammarLine(n){
  const g=POSTCARD_GRAMMAR_GAPS[n];
  return `<p class="postcard-order-line"><span>${g.prefix}</span><input class="postcard-part-input" data-answer="${g.a}" placeholder="Satzteil schreiben"><span class="postcard-cue">(${g.cue})</span><span>.</span></p>`;
}
function show(){if(loadTask(FILE,2).done.length>=2){complete(area,FILE,'saetze-bauen.html?v=l6t2-stable2');return}if(stage===0)showImageCard();else showGrammarCard()}
function showImageCard(){area.innerHTML=`${progress(FILE,2)}${instruction('Ergänzen Sie die Postkarte. Schreiben Sie das Wort zum Bild.')}<article class="postcard-large"><div class="postcard-stamp">POSTKARTE</div><p>Liebe Anna,</p><p>ich lebe jetzt in ${imageGap(0)}. Der ${imageGap(1)} sagt: Im ${imageGap(2)} ist das Wetter ${imageGap(3)}. Die ${imageGap(4)} liegt bei ${imageGap(5)} zwölf Grad.</p><p>Am Morgen scheint ${imageGap(6)} die Sonne. Am Abend ${imageGap(7)} die Temperaturen bei plus zehn Grad.</p><p>Liebe Grüße<br>Sara</p></article><div class="actions"><button class="btn" onclick="checkImageCard()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function checkImageCard(){let ok=true;const wrong=[];document.querySelectorAll('.postcard-gap input').forEach(input=>{const good=exact(input.value,input.dataset.answer);input.classList.toggle('is-ok',good);input.classList.toggle('is-no',!good);if(!good){ok=false;wrong.push(input.dataset.answer)}});const feedback=document.getElementById('fb');if(!ok){const t=spMarkWrong(FILE,2);feedback.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Sehen Sie genau auf die kleinen Bilder und achten Sie auf die Schreibweise.',wrong.join(' · '));return}saveTask(FILE,{total:2,done:[0],queue:[1],current:null,tries:0,hadWrong:false});stage=1;showGrammarCard()}
function showGrammarCard(){area.innerHTML=`${progress(FILE,2)}${instruction('Bringen Sie die Wörter in die richtige Reihenfolge und setzen Sie sie grammatisch richtig ein.')}<div class="postcard-example"><b>Beispiel:</b> Wir __________ (Schweiz – drei Wochen – sein) → Wir sind drei Wochen in der Schweiz.</div><article class="postcard-large"><div class="postcard-stamp">POSTKARTE</div><p>Hallo Tom,</p>${POSTCARD_GRAMMAR_GAPS.map((_,n)=>grammarLine(n)).join('')}<p>Viele Grüße<br>Mai</p></article><div class="actions"><button class="btn" onclick="checkGrammarCard()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function checkGrammarCard(){let ok=true;const wrong=[];document.querySelectorAll('.postcard-part-input').forEach(input=>{const good=exact(input.value,input.dataset.answer);input.classList.toggle('is-ok',good);input.classList.toggle('is-no',!good);if(!good){ok=false;wrong.push(input.dataset.answer)}});const feedback=document.getElementById('fb');if(!ok){const t=spMarkWrong(FILE,2);feedback.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Ordnen Sie die Wörter neu, konjugieren Sie das Verb und ergänzen Sie die richtige Präposition.',wrong.join(' · '));return}markTaskDone(FILE,2);complete(area,FILE,'saetze-bauen.html?v=l6t2-stable2')}
show();
</script></body></html>
