<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postkarten ergänzen</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2tasks1"></script><script src="app.js?v=4"></script><script src="l6t2-postkarte.js?v=5"></script><script src="l6t2-extra-tasks.js?v=5"></script><script>
header('Postkarten ergänzen');const FILE='postkarte.html';let stage=loadTask(FILE,2).done.includes(0)?1:0;
function imageGap(n){const g=POSTCARD_IMAGE_GAPS[n];return `<span class="postcard-gap"><input data-answer="${g.a}" placeholder="Wort"><img class="postcard-mini" src="${CDN+g.id+'.webp'}" alt=""></span>`}
function grammarGap(n){const g=POSTCARD_GRAMMAR_GAPS[n];return `<input class="postcard-part-input" data-answer="${g.a}" placeholder="Satzteil">`}
function show(){if(loadTask(FILE,2).done.length>=2){complete(area,FILE,'saetze-bauen.html');return}if(stage===0)showImageCard();else showGrammarCard()}
function showImageCard(){area.innerHTML=`${progress(FILE,2)}${instruction('Ergänzen Sie die Postkarte. Schreiben Sie das Wort zum Bild.')}<article class="postcard-large"><div class="postcard-stamp">POSTKARTE</div><p>Liebe Anna,</p><p>ich bin jetzt in ${imageGap(0)}. Der ${imageGap(1)} sagt: Im ${imageGap(2)} ist das Wetter ${imageGap(3)}. Die ${imageGap(4)} liegt bei ${imageGap(5)} zwölf Grad.</p><p>Am Morgen höre ich den Wetterbericht im ${imageGap(6)}. Am Abend lese ich ihn im ${imageGap(7)}.</p><p>Liebe Grüße<br>Sara</p></article><div class="actions"><button class="btn" onclick="checkImageCard()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function checkImageCard(){let ok=true;document.querySelectorAll('.postcard-gap input').forEach(input=>{const good=exact(input.value,input.dataset.answer);input.classList.toggle('is-ok',good);input.classList.toggle('is-no',!good);if(!good)ok=false});if(!ok){spMarkWrong(FILE,2);fb.innerHTML='<div class="no">Noch nicht richtig.</div>';return}saveTask(FILE,{total:2,done:[0],queue:[1],current:null,tries:0,hadWrong:false});stage=1;showGrammarCard()}
function showGrammarCard(){area.innerHTML=`${progress(FILE,2)}${instruction('Ergänzen Sie die fehlenden Satzteile mit der richtigen Grammatik.')}<article class="postcard-large"><div class="postcard-stamp">POSTKARTE</div><p>Hallo Tom,</p><p>ich bin jetzt ${grammarGap(0)}. ${grammarGap(1)} ist das Wetter hier angenehm. ${grammarGap(2)} scheint die Sonne, aber ${grammarGap(3)} regnet es leicht.</p><p>Die Temperatur bleibt ${grammarGap(4)}. Morgen bin ich ${grammarGap(5)}.</p><p>Viele Grüße<br>Mai</p></article><div class="actions"><button class="btn" onclick="checkGrammarCard()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function checkGrammarCard(){let ok=true;document.querySelectorAll('.postcard-part-input').forEach(input=>{const good=exact(input.value,input.dataset.answer);input.classList.toggle('is-ok',good);input.classList.toggle('is-no',!good);if(!good)ok=false});if(!ok){spMarkWrong(FILE,2);fb.innerHTML='<div class="no">Noch nicht richtig.</div>';return}markTaskDone(FILE,2);complete(area,FILE,'saetze-bauen.html')}
show();
</script></body></html>
