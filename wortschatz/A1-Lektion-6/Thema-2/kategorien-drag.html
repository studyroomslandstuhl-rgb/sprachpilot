<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategorien · Drag & Drop</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script src="l6t2-extra-tasks.js?v=1"></script><script>
header('Kategorien · Drag & Drop');const FILE='kategorien-drag.html';let items=words(),i=0,current=null,dragged='';
const cats=['Himmelsrichtungen','Länder','Jahreszeiten'];
function show(){items=words();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'praepositionen.html');return}i=spNextIndex(FILE,items.length);current=items[i];dragged=full(current);area.innerHTML=`${progress(FILE,items.length)}${instruction('Ziehen Sie das Wort in die richtige Kategorie.')}<div class="drag-token" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${current.id}')">${full(current)}</div><div class="drop-grid">${cats.map(c=>`<div class="drop-zone" ondragover="event.preventDefault();this.classList.add('active')" ondragleave="this.classList.remove('active')" ondrop="dropCat(event,'${c}')"><div class="drop-title">${c}</div><div class="small">Hier ablegen</div></div>`).join('')}</div><div id="fb" class="feedback"></div>`}
function dropCat(ev,cat){ev.preventDefault();ev.currentTarget.classList.remove('active');if(cat===current.group){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Ordnen Sie nach Bedeutung: Richtung, Land oder Jahreszeit.',current.group)}}
show();</script></body></html>
