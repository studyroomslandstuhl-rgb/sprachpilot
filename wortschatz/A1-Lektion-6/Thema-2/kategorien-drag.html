<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategorien · 2 Teile</title><link rel="stylesheet" href="style.css?v=12"><style>.sort-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:3px solid var(--lesson-main-dark);border-radius:20px;overflow:hidden;margin:16px 0;background:#fff}.sort-grid .dropzone{min-height:190px;padding:14px;background:#fff}.sort-grid .dropzone:not(:last-child){border-right:3px solid var(--lesson-line)}.sort-grid .dropzone h2{text-align:center;border-bottom:2px solid var(--lesson-main-dark);padding-bottom:10px;margin:0 0 12px}@media(max-width:760px){.sort-grid{grid-template-columns:1fr}.sort-grid .dropzone:not(:last-child){border-right:0;border-bottom:3px solid var(--lesson-line)}}</style></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-stable2"></script><script src="app.js?v=14"></script><script src="l6t2-postkarte.js?v=15"></script><script src="l6t2-stability.js?v=2"></script><script>
const area=document.getElementById('area');header('Kategorien · 2 Teile');
const FILE='kategorien-drag.html';
const GROUPS=['Himmelsrichtungen','Länder','Jahreszeiten'];
const SOURCE=words().filter(w=>GROUPS.includes(w.group));
const ORDER_KEY=CFG.key+'_kategorien_order';
let order=[];try{order=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]')}catch(e){}
const sourceIds=SOURCE.map(w=>w.id);
if(order.length!==sourceIds.length||order.some(id=>!sourceIds.includes(id))){order=shuffle(sourceIds);localStorage.setItem(ORDER_KEY,JSON.stringify(order))}
const ALL=order.map(id=>SOURCE.find(w=>w.id===id)).filter(Boolean);
const cut=Math.ceil(ALL.length/2);
const PARTS=[ALL.slice(0,cut),ALL.slice(cut)];
let part=loadTask(FILE,ALL.length).done.length>=cut?1:0,selected=null;
function currentItems(){return PARTS[part]}
function show(){if(!ALL.length){area.innerHTML='<div class="no">Aufgabendaten konnten nicht geladen werden. Bitte Seite neu laden.</div>';return}if(loadTask(FILE,ALL.length).done.length>=ALL.length){complete(area,FILE,'praepositionen.html?v=l6t2-stable2');return}const items=currentItems();area.innerHTML=`${progress(FILE,ALL.length)}${instruction('Ordnen Sie die Wörter zu.')}<div class="part-label">Teil ${part+1} von 2</div><div id="chips" class="drag-bank">${items.map(w=>`<span class="chip" data-id="${w.id}">${full(w)}</span>`).join('')}</div><div class="drop-grid sort-grid">${GROUPS.map(g=>`<div class="dropzone" data-a="${g}"><h2>${g}</h2></div>`).join('')}</div><div class="actions"><button class="btn" onclick="control()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;bind()}
function clearSelection(){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));selected=null}
function bind(){document.querySelectorAll('.chip').forEach(c=>c.onclick=e=>{e.stopPropagation();clearSelection();selected=c;c.classList.add('selected')});document.querySelectorAll('.dropzone').forEach(z=>z.onclick=e=>{if(e.target.closest('.chip')||!selected)return;selected.classList.remove('selected','no');z.appendChild(selected);selected=null;bind()})}
function control(){document.querySelectorAll('.correction').forEach(x=>x.remove());let ok=0;const wrong=[];const items=currentItems();document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected','ok','no'));document.querySelectorAll('.dropzone').forEach(z=>z.querySelectorAll('.chip').forEach(c=>{const w=items.find(x=>x.id===c.dataset.id);if(w&&z.dataset.a===w.group){c.classList.add('ok');ok++}else if(w){c.classList.add('no');wrong.push({c,w})}}));bind();[...document.querySelectorAll('#chips .chip')].forEach(c=>{const w=items.find(x=>x.id===c.dataset.id);if(w)wrong.push({c,w})});if(ok===items.length){if(part===0){saveTask(FILE,{total:ALL.length,done:[...Array(cut).keys()],queue:[...Array(ALL.length-cut).keys()].map(x=>x+cut),current:null,tries:0,hadWrong:false});part=1;selected=null;show()}else{markTaskDone(FILE,ALL.length);complete(area,FILE,'praepositionen.html?v=l6t2-stable2')}return}const t=spMarkWrong(FILE,ALL.length);if(t>=3)wrong.forEach(({c,w})=>{const note=document.createElement('span');note.className='correction';note.textContent='richtig: '+w.group;c.after(note)});document.getElementById('fb').innerHTML=help3(t,'Noch nicht richtig.','Tipp: Ordnen Sie nach Bedeutung: Himmelsrichtung, Land oder Jahreszeit.',wrong.map(({w})=>full(w)+' → '+w.group).join(' · '))}
show();
</script></body></html>
