<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategorien · Drag & Drop</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=4"></script><script src="l6t2-postkarte.js?v=3"></script><script src="l6t2-extra-tasks.js?v=4"></script><script>
header('Kategorien · Drag & Drop');
const FILE='kategorien-drag.html';
const GROUPS=['Himmelsrichtungen','Länder','Jahreszeiten'];
const ITEMS=words().filter(w=>GROUPS.includes(w.group));
let selected=null;
function show(){
 if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'praepositionen.html');return}
 area.innerHTML=`${progress(FILE,ITEMS.length)}${instruction('Tippen Sie zuerst auf ein Wort und danach auf die richtige Tabelle.')}<div id="chips" class="drag-bank"></div><div class="drop-grid">${GROUPS.map(g=>`<div class="dropzone" data-a="${g}"><h2>${g}</h2></div>`).join('')}</div><div class="actions"><button class="btn" onclick="control()">Kontrollieren</button><button class="btn secondary" onclick="clearSelection()">Auswahl lösen</button></div><div id="fb" class="feedback"></div>`;
 chips.innerHTML=ITEMS.map((w,i)=>`<span class="chip" data-id="${i}">${full(w)}</span>`).join('');
 bind();
}
function clearSelection(){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));selected=null}
function cleanChip(chip){chip.classList.remove('selected','no');let n=chip.nextElementSibling;while(n&&n.classList&&n.classList.contains('correction')){const next=n.nextElementSibling;n.remove();n=next}}
function moveChip(chip,zone){if(!chip||!zone)return;cleanChip(chip);zone.appendChild(chip);selected=null;bind()}
function bind(){
 document.querySelectorAll('.chip').forEach(c=>c.onclick=e=>{e.stopPropagation();if(c.classList.contains('ok'))return;clearSelection();selected=c;c.classList.add('selected')});
 document.querySelectorAll('.dropzone').forEach(z=>z.onclick=e=>{if(e.target.closest('.chip'))return;if(selected)moveChip(selected,z)});
}
function control(){
 document.querySelectorAll('.correction').forEach(x=>x.remove());
 let ok=0;
 document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected','ok','no'));
 document.querySelectorAll('.dropzone').forEach(z=>z.querySelectorAll('.chip').forEach(c=>{
   const w=ITEMS[Number(c.dataset.id)];
   if(w&&z.dataset.a===w.group){c.classList.add('ok');ok++}
   else if(w){c.classList.add('no');const note=document.createElement('span');note.className='correction';note.textContent='richtig: '+w.group;c.after(note)}
 }));
 bind();
 const unassigned=document.querySelectorAll('#chips .chip').length;
 if(ok===ITEMS.length){markTaskDone(FILE,ITEMS.length);complete(area,FILE,'praepositionen.html');return}
 fb.innerHTML=`<div class="no">${unassigned?unassigned+' Wörter sind noch nicht zugeordnet. ':''}Korrigieren Sie die roten Wörter.</div>`;
}
show();
</script></body></html>
