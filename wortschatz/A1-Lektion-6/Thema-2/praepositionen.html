<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Richtige Präposition</title><link rel="stylesheet" href="style.css?v=10"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-runtime3"></script><script src="app.js?v=10"></script><script>
const area=document.getElementById('area');header('Richtige Präposition');
const FILE='praepositionen.html';
const OPTIONS=['in','in der','in den','im','um','am'];
const items=[
{prompt:'Ich lebe ___ Deutschland.',a:'in',hint:'Länder ohne Artikel stehen mit in.'},{prompt:'Wir leben ___ Japan.',a:'in',hint:'Länder ohne Artikel stehen mit in.'},{prompt:'Ali lebt ___ Vietnam.',a:'in',hint:'Länder ohne Artikel stehen mit in.'},{prompt:'Meine Freundin lebt ___ Polen.',a:'in',hint:'Länder ohne Artikel stehen mit in.'},{prompt:'Sara lebt ___ Bulgarien.',a:'in',hint:'Länder ohne Artikel stehen mit in.'},{prompt:'Paul lebt ___ Frankreich.',a:'in',hint:'Länder ohne Artikel stehen mit in.'},{prompt:'Meine Familie lebt ___ Rumänien.',a:'in',hint:'Länder ohne Artikel stehen mit in.'},{prompt:'Ich lebe ___ Schweiz.',a:'in der',hint:'Länder mit dem Artikel die stehen mit in der.'},{prompt:'Wir leben ___ Türkei.',a:'in der',hint:'Länder mit dem Artikel die stehen mit in der.'},{prompt:'Oksana lebt ___ Ukraine.',a:'in der',hint:'Länder mit dem Artikel die stehen mit in der.'},{prompt:'Meine Tante lebt ___ USA.',a:'in den',hint:'Die USA stehen im Plural: in den USA.'},{prompt:'___ Norden ist es kalt.',a:'im',hint:'Himmelsrichtungen stehen mit im.'},{prompt:'___ Süden ist es warm.',a:'im',hint:'Himmelsrichtungen stehen mit im.'},{prompt:'___ Frühling scheint oft die Sonne.',a:'im',hint:'Jahreszeiten stehen mit im.'},{prompt:'___ Herbst regnet es oft.',a:'im',hint:'Jahreszeiten stehen mit im.'},{prompt:'Der Kurs beginnt ___ 10 Uhr.',a:'um',hint:'Vor einer Uhrzeit steht um.'},{prompt:'___ Montag habe ich Deutschkurs.',a:'am',hint:'Vor einem Wochentag steht am.'},{prompt:'___ Morgen höre ich den Wetterbericht.',a:'am',hint:'Vor einer Tageszeit steht am.'}
];
let i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'praepositionen-bild.html?v=l6t2-runtime3');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Wählen Sie die richtige Präposition.')}<div class="question">${it.prompt}</div><div class="choice-grid">${OPTIONS.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){const val=decodeURIComponent(raw),it=items[i],feedback=document.getElementById('fb');if(val===it.a){btn.classList.add('ok');feedback.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);feedback.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+it.hint,it.prompt.replace('___',it.a))}}
show();
</script></body></html>
