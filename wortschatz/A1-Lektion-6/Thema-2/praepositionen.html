<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Richtige Präposition</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=4"></script><script src="l6t2-extra-tasks.js?v=5"></script><script>
header('Richtige Präposition');const FILE='praepositionen.html';let items=PREP_ONLY_ITEMS,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'praepositionen-bild.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Wählen Sie die richtige Präposition.')}<div class="question">${it.prompt}</div><div class="choice-grid">${L6T2_PREP_OPTIONS.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){const val=decodeURIComponent(raw),it=items[i];if(val===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');spMarkWrong(FILE,items.length);fb.innerHTML='<div class="no">Noch nicht richtig.</div>'}}
show();
</script></body></html>
