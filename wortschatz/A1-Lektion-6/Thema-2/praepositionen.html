<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Präpositionen</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=3"></script><script src="l6t2-extra-tasks.js?v=3"></script><script>
header('Präpositionen');const FILE='praepositionen.html';let items=PREP_ONLY_ITEMS,i=0;
function show(){items=PREP_ONLY_ITEMS;if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'praepositionen-drag.html');return}i=spNextIndex(FILE,items.length);const it=items[i],opts=shuffle(it.opts);area.innerHTML=`${progress(FILE,items.length)}${instruction('Wählen Sie die richtige Präposition. Nur: im · in · um · am · von … bis …')}<div class="grammar-rule">${it.rule}</div><div class="question">${it.prompt}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){const it=items[i],val=decodeURIComponent(raw);if(val===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+it.tip,it.a)}}
show();</script></body></html>
