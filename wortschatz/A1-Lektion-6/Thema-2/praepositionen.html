<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Richtige Präposition</title><link rel="stylesheet" href="style.css?v=10"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t2-runtime2"></script><script src="app.js?v=10"></script><script src="l6t2-extra-tasks.js?v=19"></script><script>
const area=document.getElementById('area');header('Richtige Präposition');const FILE='praepositionen.html';let items=PREP_ONLY_ITEMS,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'praepositionen-bild.html?v=l6t2-runtime2');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Wählen Sie die richtige Präposition.')}<div class="question">${it.prompt}</div><div class="choice-grid">${L6T2_PREP_OPTIONS.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){const val=decodeURIComponent(raw),it=items[i],feedback=document.getElementById('fb');if(val===it.a){btn.classList.add('ok');feedback.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);feedback.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+it.hint,it.prompt.replace('___',it.a))}}
show();
</script></body></html>
