<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüfung</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script>
header('Prüfung');const FILE='pruefung.html';const prereq=taskTotals().filter(t=>t[0]!==FILE);const open=prereq.every(t=>pctFor(t[0],t[1])>=100);let q=[],i=0,score=0;
function build(){const ns=nouns();q=[{t:'write',p:'Schreiben Sie mit Artikel: '+ns[0].word,a:full(ns[0])},{t:'write',p:'Schreiben Sie den Satz zu: '+ns[1].full,a:sentenceSolutions(ns[1])},{t:'mc',p:'Welcher Satz passt zu „der Regen“?',a:'Es regnet.',opts:['Es regnet.','Es schneit.','Es ist windig.']},{t:'mc',p:'Welcher Artikel passt? ___ Schnee',a:'der',opts:['der','die','das']},{t:'write',p:'Mo. / 8 Uhr / Regen',a:'Am Montag um acht Uhr regnet es.'},{t:'mc',p:'Was passt zu „die Wolke“?',a:'Es ist bewölkt.',opts:['Es ist bewölkt.','Es ist heiß.','Es blitzt.']},{t:'write',p:'Schreiben Sie: Sonne → Satz',a:['Die Sonne scheint.','Es ist sonnig.']},{t:'write',p:'Schreiben Sie mit Artikel: '+ns[Math.min(2,ns.length-1)].word,a:full(ns[Math.min(2,ns.length-1)])},{t:'mc',p:'Was ist richtig?',a:'Es sind drei Grad unter Null.',opts:['Es sind drei Grad unter Null.','Es ist drei Uhr.','Es sind drei Wind.']},{t:'write',p:'Di. / 10 Uhr / Sonne',a:'Am Dienstag um zehn Uhr scheint die Sonne.'}];if(extraOn())q.push({t:'write',p:'Schreiben Sie den Satz zu: der Donner',a:'Es donnert.'},{t:'mc',p:'Was passt zu „der Hagel“?',a:'Es hagelt.',opts:['Es hagelt.','Es ist sonnig.','Es ist bewölkt.']});else q.push({t:'write',p:'Schreiben Sie den Satz zu: der Wind',a:'Es ist windig.'},{t:'mc',p:'Was passt zu „der Schnee“?',a:'Es schneit.',opts:['Es schneit.','Es regnet.','Es ist warm.']})}
function show(){if(!open){area.innerHTML='<div class="question">Prüfung noch gesperrt</div><div class="hint">Bearbeiten Sie zuerst alle Aufgaben.</div><div class="exam-lock">'+prereq.map(t=>'<a class="btn secondary" href="'+t[0]+'">'+t[2]+': '+pctFor(t[0],t[1])+'%</a>').join(' ')+'</div>';return}if(!q.length)build();if(i>=q.length){done();return}const it=q[i];area.innerHTML=`<div class="small">Aufgabe ${i+1} / ${q.length}</div><div class="question">${it.p}</div>${it.t==='mc'?`<div class="choice-grid">${shuffle(it.opts).map(o=>`<button class="choice" onclick="check('${encodeURIComponent(o)}')">${o}</button>`).join('')}</div>`:`<input id="ans" placeholder="Antwort"><div class="actions"><button class="btn" onclick="check(ans.value)">Weiter</button></div>`}<div id="fb" class="feedback"></div>`}
function check(v){const it=q[i],val=decodeURIComponent(v);if(exact(val,it.a))score++;i++;show()}
function done(){const percent=Math.round(score/q.length*100);markTaskDone(FILE,12);area.innerHTML=`<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Prüfung fertig</div><div class="hint">Ergebnis: ${score} / ${q.length} = ${percent}%</div><div class="actions"><a class="btn" href="index.html">Zum Thema</a></div></div>`}
show();</script></body></html>
