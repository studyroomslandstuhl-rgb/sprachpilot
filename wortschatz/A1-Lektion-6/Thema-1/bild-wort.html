<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bild/Wort</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script>
header('Bild/Wort');const FILE='bild-wort.html';let items=words(),i=0;
function label(w){return w.type==='noun'?full(w):w.word}
function show(){items=words();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'nomen-satz-a.html');return}i=spNextIndex(FILE,items.length);const w=items[i],opts=shuffle([w,...shuffle(items.filter(x=>x.id!==w.id)).slice(0,3)]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Sehen Sie die Karte. Wählen Sie das richtige Wort.')}<div>${visual(w)}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${o.id}')">${label(o)}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,id){const w=items[i];if(id===w.id){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Vergleichen Sie Karte und Wetterwort.',label(w))}}
show();</script></body></html>
