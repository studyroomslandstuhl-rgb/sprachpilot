<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 Sätze</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script>
header('20 Sätze');const FILE='wetter-saetze.html';let items=writingItems(),i=0;
function show(){items=writingItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'hoeren.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Schreiben oder sprechen Sie den Satz. Nutzen Sie: am + Tag, um + Uhrzeit.')}<div class="sentence-box"><b>${it.short}</b> · <b>${it.time}</b></div>${visual(it.w)}<div class="actions"><button id="micBtn" class="btn" onclick="speakAns()">Sprechen</button><button class="btn secondary" onclick="box.style.display='block'">Schreiben</button></div><div id="micStatus" class="small"></div><div id="box" style="display:none"><textarea id="ans" rows="3" placeholder="Satz schreiben"></textarea><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function speakAns(){startMic(micBtn,txt=>{box.style.display='block';ans.value=txt;check(txt)})}
function check(v){const it=items[i];if(exact(v,it.sol)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Beginnen Sie mit „Am … um …“.',it.sol)}}
show();</script></body></html>
