<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 Sätze</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('20 Sätze');const FILE='wetter-saetze.html';let items=writingItems(),i=0;
function show(){items=writingItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'hoeren.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Schreiben oder sprechen Sie den Satz. Nutzen Sie: am + Tag, um + Uhrzeit.')}<div class="sentence-box"><b>${it.short}</b> · <b>${it.time}</b></div>${visual(it.w)}<textarea id="ans" rows="3" placeholder="Satz schreiben"></textarea><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button><button class="btn secondary" onclick="say(items[i].sol)">Hören</button></div><div id="fb" class="feedback"></div>`}
function check(){const it=items[i];if(exact(ans.value,it.sol)){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Beginnen Sie mit „Am … um …“.',it.sol)}}
show();</script></body></html>
