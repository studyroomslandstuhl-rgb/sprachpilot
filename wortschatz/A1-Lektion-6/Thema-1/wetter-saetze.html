<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sätze schreiben</title><link rel="stylesheet" href="/css/sp-header.css"><link rel="stylesheet" href="style.css?v=5"><style>.topbar,#spHeader:empty{display:none!important;height:0!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}</style></head><body><div class="container"><div id="spHeader"></div><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module">import{installSpHeader}from'/js/sp-header.js';installSpHeader();</script><script src="app.js?v=3"></script><script src="l6t1-fix.js?v=10"></script><script src="l6t1-clean.js?v=1"></script><script src="l6t1-final-fix.js?v=2"></script><script src="l6t1-stability-fix.js?v=1"></script><script>
l6t1CleanWords();const FILE='wetter-saetze.html';let items=writingItems(),i=0;
function show(){items=writingItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'hoeren.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Schreiben Sie den Satz.')}<div class="example-box"><b>Beispiel:</b> Mo. · 8 Uhr · Regen → Am Montag um acht Uhr regnet es.</div><div class="sentence-box"><b>${it.short}</b> · <b>${it.time}</b></div>${visual(it.w)}<div class="actions"><button id="micBtn" class="btn" onclick="speakAns()">Sprechen</button><button class="btn secondary" onclick="box.style.display='block'">Schreiben</button></div><div id="micStatus" class="small"></div><div id="box" style="display:none"><textarea id="ans" rows="3" placeholder="Satz schreiben"></textarea><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function speakAns(){startMic(micBtn,txt=>{box.style.display='block';ans.value=txt;check(txt)})}
function check(v){const it=items[i];if(exact(v,it.sol)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Beginnen Sie mit „Am … um …“.',it.sol)}}
show();</script></body></html>
