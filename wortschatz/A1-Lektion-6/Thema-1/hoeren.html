<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t1-stable"></script><script src="app.js?v=3"></script><script src="l6t1-fix.js?v=10"></script><script src="l6t1-final-fix.js?v=2"></script><script src="l6t1-hoeren-aufgaben.js?v=1"></script><script src="l6t1-stability-fix.js?v=1"></script><script>
header('Hören');const FILE='hoeren.html';let items=listenItems(),i=0;
function show(){items=listenItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'pruefung.html');return}i=spNextIndex(FILE,items.length);const it=items[i],opts=shuffle(it.opts);area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie die Ansage. Wählen Sie die richtige Antwort.')}<div class="audio-box"><audio controls preload="metadata"><source src="${it.audio}" type="audio/mpeg"></audio></div><div class="small">Audio-Datei: ${it.audioName||''}</div><div class="question">${it.q}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){const it=items[i],val=decodeURIComponent(raw);if(val===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,800)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Hören Sie noch einmal und achten Sie genau auf die Frage.',it.a)}}
show();</script></body></html>
