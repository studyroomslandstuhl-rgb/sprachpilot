<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geräusch → Satz</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t1-fix.js?v=7"></script><script src="l6t1-final-fix.js?v=1"></script><script>
header('Geräusch → Satz');const FILE='geraeusche-satz.html';let items=soundWords(),i=0;
function show(){items=soundWords();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'wetter-saetze.html');return}i=spNextIndex(FILE,items.length);const w=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie das Geräusch. Schreiben Sie den Wettersatz.')}<div class="audio-box"><audio controls preload="metadata"><source src="${w.sound}" type="audio/mpeg"></audio></div><input id="ans" placeholder="Satz schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function check(){const w=items[i];if(exact(ans.value,sentenceSolutions(w))){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Schreiben Sie einen Satz mit „es“ oder „die Sonne“.',sentenceSolutions(w).join(' / '))}}
show();</script></body></html>
