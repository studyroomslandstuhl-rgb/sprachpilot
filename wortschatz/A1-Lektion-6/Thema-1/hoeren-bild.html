<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören/Karte</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=3"></script><script src="l6t1-fix.js?v=10"></script><script src="l6t1-final-fix.js?v=1"></script><script>
header('Hören/Karte');const FILE='hoeren-bild.html';let items=words(),i=0;
function show(){items=words();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'nomen-satz-a.html');return}i=spNextIndex(FILE,items.length);const w=items[i],opts=shuffle([w,...shuffle(items.filter(x=>x.id!==w.id)).slice(0,3)]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie den Wettersatz. Wählen Sie die passende Karte.')}<div class="actions"><button class="btn" onclick="say(items[i].sentence)">Hören</button></div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${o.id}')">${visual(o,true)}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,id){const w=items[i];if(id===w.id){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Hören Sie noch einmal und vergleichen Sie die Karten.',w.sentence)}}
show();</script></body></html>
