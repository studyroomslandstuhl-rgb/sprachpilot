<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nomen → Satz B</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script>
header('Nomen → Satz B');const FILE='nomen-satz-b.html';let items=sentenceItems(),i=0;
function show(){items=sentenceItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'satz-nomen.html');return}i=spNextIndex(FILE,items.length);const it=items[i],w=it.w;area.innerHTML=`${progress(FILE,items.length)}${instruction('Schreiben oder sprechen Sie den passenden Wettersatz.')}<div class="question">${full(w)}</div>${visual(w)}<div class="actions"><button id="micBtn" class="btn" onclick="speakAns()">Sprechen</button><button class="btn secondary" onclick="box.style.display='block'">Schreiben</button></div><div id="micStatus" class="small"></div><div id="box" style="display:none"><input id="ans" placeholder="Satz schreiben"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function speakAns(){startMic(micBtn,txt=>{box.style.display='block';ans.value=txt;check(txt)})}
function check(v){const it=items[i];if(exact(v,sentenceSolutions(it.w))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Schreiben Sie einen ganzen Satz mit Verb.',sentenceSolutions(it.w).join(' / '))}}
show();</script></body></html>
