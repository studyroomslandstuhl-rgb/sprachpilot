<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nomen → Satz B</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t1-fix.js?v=7"></script><script>
header('Nomen → Satz B');const FILE='nomen-satz-b.html';let items=sentenceItems(),i=0;
function show(){items=sentenceItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'geraeusche.html');return}i=spNextIndex(FILE,items.length);const it=items[i],w=it.w;area.innerHTML=`${progress(FILE,items.length)}${instruction('Schreiben Sie den passenden Wettersatz.')}<div class="question">${full(w)}</div>${visual(w)}<input id="ans" placeholder="Satz schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button><button class="btn secondary" onclick="say(items[i].w.sentence)">Hören</button></div><div id="fb" class="feedback"></div>`}
function check(){const it=items[i];if(exact(ans.value,sentenceSolutions(it.w))){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Schreiben Sie einen ganzen Satz mit Verb.',sentenceSolutions(it.w).join(' / '))}}
show();</script></body></html>
