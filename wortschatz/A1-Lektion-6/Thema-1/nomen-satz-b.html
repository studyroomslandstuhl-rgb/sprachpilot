<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satz hören → Wort</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t1-fix.js?v=7"></script><script src="l6t1-final-fix.js?v=1"></script><script>
header('Satz hören → Wort');const FILE='nomen-satz-b.html';let items=sentenceItems(),i=0;
function show(){items=sentenceItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'geraeusche.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie den Satz. Schreiben Sie das passende Wort. Nomen schreiben Sie mit Artikel.')}<div class="actions"><button class="btn" onclick="say(items[i].w.sentence)">Satz hören</button></div><input id="ans" placeholder="Wort schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;setTimeout(()=>say(items[i].w.sentence),250)}
function check(){const it=items[i],sol=full(it.w);if(exact(ans.value,sol)){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Schreiben Sie das Wort richtig. Bei Nomen brauchen Sie den Artikel.',sol)}}
show();</script></body></html>
