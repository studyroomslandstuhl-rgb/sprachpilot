<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören/Schreiben</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('Hören/Schreiben');const FILE='hoeren-schreiben.html';let items=cardItems(),i=0;
function audioText(it){return it.mode==='noun'?it.w.word:it.w.sentence}
function solution(it){return it.mode==='noun'?full(it.w):sentenceSolutions(it.w)}
function show(){items=cardItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'hoeren-bild.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie. Schreiben Sie richtig. Nomen schreiben Sie mit Artikel.')}<div class="actions"><button class="btn" onclick="say(audioText(items[i]))">Hören</button></div><input id="ans" placeholder="Antwort schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function check(){const it=items[i],sol=solution(it);if(exact(ans.value,sol)){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Bei Nomen muss der Artikel mitgeschrieben werden.',Array.isArray(sol)?sol.join(' / '):sol)}}
show();</script></body></html>
