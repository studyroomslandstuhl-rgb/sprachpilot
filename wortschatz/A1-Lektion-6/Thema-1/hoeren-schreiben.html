<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören/Schreiben</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=3"></script><script src="l6t1-fix.js?v=7"></script><script src="l6t1-final-fix.js?v=1"></script><script>
header('Hören/Schreiben');const FILE='hoeren-schreiben.html';let items=wordItems(),i=0;
function audioText(w){return w.word}
function solution(w){return w.type==='noun'?full(w):w.word}
function show(){items=wordItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'hoeren-bild.html');return}i=spNextIndex(FILE,items.length);const w=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie das Wort. Schreiben Sie richtig. Nomen schreiben Sie mit Artikel.')}<div class="actions"><button class="btn" onclick="say(audioText(items[i]))">Hören</button></div><input id="ans" placeholder="Antwort schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function check(){const w=items[i],sol=solution(w);if(exact(ans.value,sol)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Bei Nomen muss der Artikel mitgeschrieben werden.',sol)}}
show();</script></body></html>
