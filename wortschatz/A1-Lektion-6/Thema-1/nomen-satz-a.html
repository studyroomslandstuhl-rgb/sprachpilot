<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wort → Satz</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=3"></script><script src="l6t1-fix.js?v=10"></script><script src="l6t1-final-fix.js?v=1"></script><script>
header('Wort → Satz');const FILE='nomen-satz-a.html';let items=sentenceItems(),i=0;
function show(){items=sentenceItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'nomen-satz-b.html');return}i=spNextIndex(FILE,items.length);const it=items[i],w=it.w;area.innerHTML=`${progress(FILE,items.length)}${instruction('Das Wort ist vorgegeben. Sagen oder schreiben Sie den passenden Satz.')}<div class="question">${full(w)}</div>${visual(w)}<div class="actions"><button id="micBtn" class="btn" onclick="speakAns()">Sprechen</button><button class="btn secondary" onclick="box.style.display='block'">Schreiben</button></div><div id="micStatus" class="small"></div><div id="box" style="display:none"><input id="ans" placeholder="Satz schreiben"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function startMic(btn,callback){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('micStatus');if(!SR){if(status)status.textContent='Mikrofon wird hier nicht unterstützt. Bitte schreiben.';box.style.display='block';return}const rec=new SR();rec.lang='de-DE';rec.onresult=e=>callback(e.results[0][0].transcript);rec.onerror=()=>{if(status)status.textContent='Mikrofon hat nicht funktioniert. Bitte schreiben.'};rec.onend=()=>{if(btn)btn.classList.remove('active')};if(btn)btn.classList.add('active');if(status)status.textContent='Ich höre zu …';rec.start()}
function speakAns(){startMic(micBtn,txt=>{box.style.display='block';ans.value=txt;check(txt)})}
function check(v){const it=items[i];if(exact(v,sentenceSolutions(it.w))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Schreiben oder sprechen Sie einen ganzen Satz.',sentenceSolutions(it.w).join(' / '))}}
show();</script></body></html>
