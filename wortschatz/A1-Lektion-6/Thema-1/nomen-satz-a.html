<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nomen → Satz A</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t1-fix.js?v=7"></script><script>
header('Nomen → Satz A');const FILE='nomen-satz-a.html';let items=sentenceItems(),i=0;
function show(){items=sentenceItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'nomen-satz-b.html');return}i=spNextIndex(FILE,items.length);const it=items[i],w=it.w,opts=shuffle([w.sentence,...shuffle(items.filter(x=>x.w.id!==w.id).map(x=>x.w.sentence)).slice(0,3)]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Welcher Satz passt zum Nomen?')}<div class="question">${full(w)}</div>${visual(w)}<div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){const it=items[i],val=decodeURIComponent(raw);if(sentenceSolutions(it.w).includes(val)){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Denken Sie an den passenden Wettersatz.',sentenceSolutions(it.w).join(' / '))}}
show();</script></body></html>
