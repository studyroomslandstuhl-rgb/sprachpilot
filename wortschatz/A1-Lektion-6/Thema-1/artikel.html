<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t1-fix.js?v=7"></script><script>
header('Artikel');const FILE='artikel.html';let items=nouns(),i=0;
function show(){items=nouns();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'hoeren-schreiben.html');return}i=spNextIndex(FILE,items.length);const w=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Wählen Sie den richtigen Artikel.')}<div class="question">___ ${w.word}</div>${visual(w)}<div class="choice-grid">${shuffle(['der','die','das']).map(o=>`<button class="choice" onclick="check(this,'${o}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,val){const w=items[i];if(val===w.article){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Lernen Sie Wetter-Nomen immer mit Artikel.',full(w))}}
show();</script></body></html>
