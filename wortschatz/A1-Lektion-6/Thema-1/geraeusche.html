<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geräusche</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t1-fix.js?v=7"></script><script>
header('Geräusche');const FILE='geraeusche.html';let items=soundWords(),i=0;
function show(){items=soundWords();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'wetter-saetze.html');return}i=spNextIndex(FILE,items.length);const w=items[i],opts=shuffle([w,...shuffle(items.filter(x=>x.id!==w.id)).slice(0,3)]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Hören Sie das Geräusch. Was ist das?')}<div class="audio-box"><audio controls preload="metadata"><source src="${w.sound}" type="audio/mpeg"></audio></div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${o.id}')">${full(o)}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,id){const w=items[i];if(id===w.id){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Hören Sie das Geräusch noch einmal.',full(w))}}
show();</script></body></html>
