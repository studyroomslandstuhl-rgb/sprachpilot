<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satz → Nomen</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script>
header('Satz → Nomen');const FILE='satz-nomen.html';let items=sentenceItems(),i=0;
function show(){items=sentenceItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'geraeusche.html');return}i=spNextIndex(FILE,items.length);const it=items[i],w=it.w,opts=shuffle([w,...shuffle(items.filter(x=>x.w.id!==w.id).map(x=>x.w)).slice(0,3)]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Welches Nomen passt zum Satz?')}<div class="question">${w.sentence}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${o.id}')">${full(o)}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,id){const w=items[i].w;if(id===w.id){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Denken Sie an die Verbindung zwischen Nomen und Satz.',full(w))}}
show();</script></body></html>
