<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=2"></script><script src="l6t1-fix.js?v=7"></script><script>
header('Karteikarten');const FILE='karteikarten.html';let items=cardItems(),i=0;
function show(){items=cardItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'artikel.html');return}i=spNextIndex(FILE,items.length);const it=items[i],w=it.w;const sent=it.mode==='sentence';area.innerHTML=`${progress(FILE,items.length)}${instruction(sent?'Bild + Ergänzung „Satz“: Schreiben oder sprechen Sie den ganzen Satz.':'Nur Bild: Schreiben oder sprechen Sie das Wort. Nomen immer mit Artikel.')}<div class="small">${w.group}</div>${visual(w)}${sent?'<div class="sentence-label">Satz</div>':''}<div class="hint">Übersetzung: <b>${tr(w)}</b></div><div class="actions"><button id="micBtn" class="btn" onclick="speakAns()">Sprechen</button><button class="btn secondary" onclick="box.style.display='block'">Schreiben</button><button class="btn secondary" onclick="showSolution()">Lösung zeigen</button></div><div id="micStatus" class="small"></div><div id="box" style="display:none"><input id="ans" placeholder="Antwort schreiben"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function solution(it){return it.mode==='sentence'?sentenceSolutions(it.w):(it.w.type==='noun'?full(it.w):it.w.word)}
function startMic(btn,callback){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('micStatus');if(!SR){if(status)status.textContent='Mikrofon wird hier nicht unterstützt. Bitte schreiben.';box.style.display='block';return}const rec=new SR();rec.lang='de-DE';rec.onresult=e=>callback(e.results[0][0].transcript);rec.onerror=()=>{if(status)status.textContent='Mikrofon hat nicht funktioniert. Bitte schreiben.'};rec.onend=()=>{if(btn)btn.classList.remove('active')};if(btn)btn.classList.add('active');if(status)status.textContent='Ich höre zu …';rec.start()}
function speakAns(){startMic(micBtn,txt=>{box.style.display='block';ans.value=txt;check(txt)})}
function showSolution(){const it=items[i],sol=solution(it),t=spMarkWrong(FILE,items.length);box.style.display='block';ans.value=Array.isArray(sol)?sol[0]:sol;fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+(it.mode==='sentence'?'Schreiben Sie einen ganzen Wettersatz.':'Nomen brauchen den Artikel.'),Array.isArray(sol)?sol.join(' / '):sol)}
function check(v){const it=items[i],sol=solution(it);if(exact(v,sol)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+(it.mode==='sentence'?'Schreiben Sie einen ganzen Wettersatz.':'Nomen brauchen den Artikel.'),Array.isArray(sol)?sol.join(' / '):sol)}}
show();</script></body></html>
