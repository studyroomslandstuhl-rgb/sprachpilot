<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('Karteikarten');const FILE='karteikarten.html';let items=cardItems(),i=0;
function show(){items=cardItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'artikel.html');return}i=spNextIndex(FILE,items.length);const it=items[i],w=it.w;area.innerHTML=`${progress(FILE,items.length)}${instruction(it.mode==='noun'?'Schreiben Sie das Nomen mit Artikel.':'Schreiben Sie den Satz.')}<div class="small">${w.group}</div>${visual(w)}${it.mode==='sentence'?'<div class="sentence-label">Satz</div>':''}<div class="hint">Übersetzung: <b>${tr(w)}</b></div><input id="ans" placeholder="Antwort schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button><button class="btn secondary" onclick="say(it.mode==='noun'?w.word:w.sentence)">Hören</button></div><div id="fb" class="feedback"></div>`}
function check(){const it=items[i],w=it.w,sol=it.mode==='noun'?full(w):sentenceSolutions(w);if(exact(ans.value,sol)){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+(it.mode==='noun'?'Nomen brauchen den Artikel.':'Schreiben Sie einen ganzen Wettersatz.'),Array.isArray(sol)?sol.join(' / '):sol)}}
show();</script></body></html>
