<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="/css/sp-header.css"><link rel="stylesheet" href="style.css?v=5"><style>.topbar,#spHeader:empty{display:none!important;height:0!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}</style></head><body><div class="container"><div id="spHeader"></div><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module">import{installSpHeader}from'/js/sp-header.js';installSpHeader();</script><script src="app.js?v=2"></script><script src="l6t1-fix.js?v=9"></script><script src="l6t1-clean.js?v=1"></script><script>
l6t1CleanWords();const FILE='karteikarten.html';let items=cardItems(),i=0,revealed=false,solved=false;
function solution(it){return it.mode==='sentence'?sentenceSolutions(it.w):(it.w.type==='noun'?full(it.w):it.w.word)}
function backHtml(it){const sol=solution(it);return `<div class="flip-word">${Array.isArray(sol)?sol[0]:sol}</div>${it.w.plural?'<div class="flip-plural">Plural: <b>'+it.w.plural+'</b></div>':''}<button class="btn secondary" onclick="say('${encodeURIComponent(Array.isArray(sol)?sol[0]:sol)}');return false">Hören</button>`}
function show(){items=cardItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'artikel.html');return}i=spNextIndex(FILE,items.length);revealed=false;solved=false;const it=items[i],w=it.w,sent=it.mode==='sentence';area.innerHTML=`${progress(FILE,items.length)}${instruction(sent?'Bild + Satz: Drehen Sie die Karte oder schreiben/sprechen Sie den Satz.':'Bild: Drehen Sie die Karte oder schreiben/sprechen Sie das Wort mit Artikel.')}<div class="small">${w.group}</div><div class="flip-wrap"><div id="fcard" class="flip-card" onclick="reveal(true)"><div class="flip-face flip-front">${visual(w)}<div class="small">Klicken: Karte umdrehen</div></div><div class="flip-face flip-back">${backHtml(it)}</div></div></div><div class="hint">Übersetzung: <b>${tr(w)}</b></div><div class="actions"><button id="micBtn" class="btn" onclick="speakAns()">Sprechen</button><button class="btn secondary" onclick="writeBox()">Schreiben</button><button class="btn secondary" onclick="showSolution()">Lösung zeigen</button></div><div id="micStatus" class="small"></div><div id="box" style="display:none"><input id="ans" placeholder="Antwort schreiben"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div><div id="after" class="actions"></div>`}
function writeBox(){box.style.display='block'}
function reveal(help){if(solved)return;fcard.classList.add('flipped');if(help&&!revealed){revealed=true;const t=spMarkWrong(FILE,items.length);fb.innerHTML=t<3?'Die Karte wurde umgedreht. Dieses Wort kommt später noch einmal.':'Lösung: '+(Array.isArray(solution(items[i]))?solution(items[i]).join(' / '):solution(items[i]));after.innerHTML='<button class="btn" onclick="nextAfterHelp()">Weiter</button>'}}
function nextAfterHelp(){spMarkRight(FILE,items.length);show()}
function startMic(btn,callback){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('micStatus');if(!SR){if(status)status.textContent='Mikrofon wird hier nicht unterstützt. Bitte schreiben.';writeBox();return}const rec=new SR();rec.lang='de-DE';rec.onresult=e=>callback(e.results[0][0].transcript);rec.onerror=()=>{if(status)status.textContent='Mikrofon hat nicht funktioniert. Bitte schreiben.'};rec.onend=()=>{if(btn)btn.classList.remove('active')};if(btn)btn.classList.add('active');if(status)status.textContent='Ich höre zu …';rec.start()}
function speakAns(){startMic(micBtn,txt=>{writeBox();ans.value=txt;check(txt)})}
function showSolution(){reveal(true);writeBox();const sol=solution(items[i]);ans.value=Array.isArray(sol)?sol[0]:sol}
function check(v){const it=items[i],sol=solution(it);if(exact(v,sol)){solved=true;fcard.classList.add('flipped');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);after.innerHTML='<button class="btn" onclick="show()">Weiter</button>'}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: '+(it.mode==='sentence'?'Schreiben Sie einen ganzen Wettersatz.':'Nomen brauchen den Artikel.'),Array.isArray(sol)?sol.join(' / '):sol)}}
show();</script></body></html>
