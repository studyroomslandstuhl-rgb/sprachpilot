<body>
<div class="container">
<header class="topbar"></header>
<section class="card" id="area"><p>Die Aufgabe wird geladen …</p></section>
<footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/guard.js?v=card-standard1"></script>
<script src="app.js?v=3"></script>
<script src="l6t1-fix.js?v=10"></script>
<script src="l6t1-clean.js?v=1"></script>
<script src="l6t1-final-fix.js?v=2"></script>
<script src="l6t1-steigen-sinken.js?v=3"></script>
<script src="l6t1-stability-fix.js?v=1"></script>
<script src="/js/sp-card-standard.js?v=1"></script>
<script>
(function(){
l6t1CleanWords();
const FILE='karteikarten.html';
function items(){return cardItems()}
function solution(it){return it.mode==='sentence'?sentenceSolutions(it.w):(it.w.type==='noun'?full(it.w):it.w.word)}
function solutionText(it){const value=solution(it);return Array.isArray(value)?value[0]:value}
SPCardStandard.mount({
 area:'#area',words:items,nextPage:'artikel.html',full:solutionText,word:solutionText,
 plural:it=>it.w.plural||'',example:it=>it.w.sentence||'',translation:it=>tr(it.w),languageName:'Muttersprache',
 visual:(it)=>visual(it.w),answers:it=>Array.isArray(solution(it))?solution(it):[solution(it)],accept:(it,value)=>exact(value,solution(it)),audio:it=>typeof say==='function'?say(solutionText(it)):null,
 state:{progress(){const list=items(),st=loadTask(FILE,list.length);return{total:list.length,done:st.done.length,tries:st.tries||0,hadWrong:!!st.hadWrong}},current(){const list=items();return list[spNextIndex(FILE,list.length)]},wrong(){return spMarkWrong(FILE,items().length)},right(){spMarkRight(FILE,items().length)},resetCurrent(){localStorage.removeItem(taskKey(FILE))}}
});
})();
</script>
<script src="l6t1-card-type-label.js?v=1"></script>
</body>
</html>
