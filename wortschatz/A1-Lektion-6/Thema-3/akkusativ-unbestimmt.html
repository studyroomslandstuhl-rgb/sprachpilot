<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>einen · eine · ein</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('einen · eine · ein');const FILE='akkusativ-unbestimmt.html';let items=AKK_UNBEST,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'meinen-deinen.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Wählen Sie den richtigen Akkusativ.')}<div class="grammar-rule">Regel: ein → einen, eine → eine, ein → ein</div><div class="question">${it.q}</div><div class="choice-grid">${shuffle(it.opts).map(o=>`<button class="choice" onclick="check(this,'${o}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,v){const it=items[i];if(v===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Nur ein bei der-Wörtern wird einen.',it.sol)}}
show();</script></body></html>
