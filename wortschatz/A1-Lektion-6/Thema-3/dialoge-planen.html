<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialoge planen</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-revision2"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-revision-data.js?v=1"></script><script src="l6t3-revision.js?v=1"></script><script>
header('Dialoge planen');const FILE='dialoge-planen.html';const conversations=L6T3Revision.data.chatDialogs;const items=conversations.flatMap(c=>c.qs.map((q,n)=>({id:c.id+'-'+n,title:c.title,messages:c.messages,q:q[0],a:q[1]})));let i=0;
function chat(messages){return `<div class="chat-window">${messages.map(m=>`<div class="chat-row ${m.side}"><div class="chat-name">${m.name}</div><div class="chat-bubble">${m.text}</div></div>`).join('')}</div>`}
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}<h2>${it.title}</h2>${chat(it.messages)}<div class="question">${it.q}</div><div class="choice-grid"><button class="choice" type="button" onclick="check(this,true)">Richtig</button><button class="choice" type="button" onclick="check(this,false)">Falsch</button></div><div id="fb" class="feedback"></div>`}
function check(btn,value){const it=items[i];if(value===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,650)}else{btn.classList.add('no');const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries>=3?`<div class="no">Lösung: ${it.a?'Richtig':'Falsch'}</div>`:'<div class="no">Noch nicht richtig. Lies die Nachrichten noch einmal.</div>'}}
show();
</script></body></html>
