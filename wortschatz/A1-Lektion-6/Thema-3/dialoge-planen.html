<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialoge hören</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-review1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=4"></script><script>
header('Dialoge hören');
const FILE='dialoge-planen.html';
const conversations=L6T3Revision.data.chatDialogs;
const items=conversations.flatMap(c=>c.qs.map((q,n)=>({id:c.id+'-'+n,title:c.title,audio:c.audio,messages:c.messages,q:q[0],a:q[1]})));
let i=0,currentAudio=null;
function transcript(messages){return messages.map(m=>`${m.name}: ${m.text}`).join(' ')}
function audioUrl(file){return CDN+'audio/'+file}
function stopAudio(){try{if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function speakFallback(item,rate){
 stopAudio();
 if(!('speechSynthesis' in window)){document.getElementById('audioStatus').innerHTML='<div class="no">Audio ist noch nicht verfügbar.</div>';return}
 const u=new SpeechSynthesisUtterance(transcript(item.messages));u.lang='de-DE';u.rate=rate;u.onend=()=>{const s=document.getElementById('audioStatus');if(s)s.textContent=''};speechSynthesis.speak(u);
 const s=document.getElementById('audioStatus');if(s)s.innerHTML='<div class="hint">Vorläufige Computerstimme. Die MP3-Datei kann später hochgeladen werden.</div>';
}
function play(rate){
 const item=items[i];stopAudio();currentAudio=new Audio(audioUrl(item.audio));currentAudio.playbackRate=rate;currentAudio.preload='auto';
 const status=document.getElementById('audioStatus');if(status)status.textContent='Audio wird geladen …';
 currentAudio.onplaying=()=>{if(status)status.textContent=''};
 currentAudio.onerror=()=>speakFallback(item,rate);
 const p=currentAudio.play();if(p&&p.catch)p.catch(()=>speakFallback(item,rate));
}
function show(){
 stopAudio();
 if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}
 i=spNextIndex(FILE,items.length);const it=items[i];
 area.innerHTML=`${progress(FILE,items.length)}${instruction('Höre den Dialog und entscheide: richtig oder falsch.')}<h2>${it.title}</h2><div class="audio-task"><div class="audio-actions"><button class="btn" type="button" onclick="play(1)">🔊 Dialog hören</button><button class="btn secondary" type="button" onclick="play(.82)">🐢 Langsam</button></div><div id="audioStatus" class="small"></div></div><div class="question">${it.q}</div><div class="choice-grid"><button class="choice" type="button" onclick="check(this,true)">Richtig</button><button class="choice" type="button" onclick="check(this,false)">Falsch</button></div><div id="fb" class="feedback"></div>`;
}
function check(btn,value){
 const it=items[i];
 if(value===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,650)}
 else{btn.classList.add('no');const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries>=3?`<div class="no">Lösung: ${it.a?'Richtig':'Falsch'}</div>`:'<div class="no">Noch nicht richtig. Höre den Dialog noch einmal.</div>'}
}
window.addEventListener('beforeunload',stopAudio);
show();
</script></body></html>
