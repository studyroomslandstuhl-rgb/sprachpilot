<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialoge hören</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-audio2"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=5"></script><script>
header('Dialoge hören');
const FILE='dialoge-planen.html';
const conversations=L6T3Revision.data.chatDialogs.map((conversation,index)=>{
 const item={...conversation,audio:`a1-l6-t3-dialog-planen-${String(index+1).padStart(2,'0')}.mp3`,qs:conversation.qs.map(q=>[q[0],q[1]])};
 if(item.id==='cd03')item.qs[2]=['Der Kurs macht ein Picknick im Zoo.',false];
 if(item.id==='cd05')item.qs[1]=['Ben hat die Adresse.',false];
 return item;
});
const items=conversations;
let i=0,currentAudio=null,answers=[],locked=false;
function audioUrl(file){return CDN+'audio/'+file}
function stopAudio(){try{if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}}catch(e){}currentAudio=null}
function play(rate){
 const audio=document.getElementById('dialogAudio');
 const status=document.getElementById('audioStatus');
 if(!audio)return;
 currentAudio=audio;audio.playbackRate=rate;audio.currentTime=0;
 if(status)status.textContent='Audio wird geladen …';
 audio.onplaying=()=>{if(status)status.textContent=rate<1?'Langsame Wiedergabe':'Dialog läuft'};
 audio.onended=()=>{if(status)status.textContent='Audio beendet. Du kannst es noch einmal hören.'};
 audio.onerror=()=>{if(status)status.innerHTML='<div class="no">Die MP3-Datei konnte nicht geladen werden.</div>'};
 const p=audio.play();if(p&&p.catch)p.catch(()=>{if(status)status.innerHTML='<div class="no">Tippe erneut auf „Dialog hören“.</div>'});
}
function questionHtml(item,n){
 const selected=answers[n];
 return `<section class="hearing-question" id="question-${n}"><div class="hearing-question-text"><b>${n+1}.</b> ${item.qs[n][0]}</div><div class="choice-grid hearing-choice-grid"><button class="choice${selected===true?' selected':''}" type="button" data-q="${n}" data-value="true" onclick="choose(${n},true)">Richtig</button><button class="choice${selected===false?' selected':''}" type="button" data-q="${n}" data-value="false" onclick="choose(${n},false)">Falsch</button></div><div class="small hearing-solution" id="solution-${n}"></div></section>`;
}
function show(){
 stopAudio();
 if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}
 i=spNextIndex(FILE,items.length);const item=items[i];answers=Array(item.qs.length).fill(null);locked=false;
 area.innerHTML=`${progress(FILE,items.length)}${instruction('Höre den Dialog. Beantworte danach alle drei Fragen.')}<h2>${item.title}</h2><div class="audio-task"><audio id="dialogAudio" preload="metadata" src="${audioUrl(item.audio)}" controls></audio><div class="audio-actions"><button class="btn" type="button" onclick="play(1)">🔊 Dialog hören</button><button class="btn secondary" type="button" onclick="play(.82)">🐢 Langsam</button></div><div id="audioStatus" class="small"></div></div><div class="hearing-question-list">${item.qs.map((_,n)=>questionHtml(item,n)).join('')}</div><div class="actions"><button class="btn" id="checkAll" type="button" onclick="checkAll()">Alle Antworten kontrollieren</button></div><div id="fb" class="feedback"></div>`;
}
function choose(question,value){
 if(locked)return;answers[question]=value;
 document.querySelectorAll(`[data-q="${question}"]`).forEach(btn=>btn.classList.toggle('selected',btn.dataset.value===String(value)));
 const card=document.getElementById('question-'+question);if(card)card.classList.remove('is-ok','is-no');
 const solution=document.getElementById('solution-'+question);if(solution)solution.textContent='';
 fb.innerHTML='';
}
function checkAll(){
 if(locked)return;
 if(answers.some(value=>value===null)){fb.innerHTML='<div class="hint">Beantworte bitte alle drei Fragen.</div>';return}
 const item=items[i];let allCorrect=true;
 item.qs.forEach((q,n)=>{
  const correct=answers[n]===q[1];allCorrect=allCorrect&&correct;
  const card=document.getElementById('question-'+n);if(card){card.classList.remove('is-ok','is-no');card.classList.add(correct?'is-ok':'is-no')}
 });
 if(allCorrect){
  locked=true;document.querySelectorAll('.hearing-question button,#checkAll').forEach(button=>button.disabled=true);
  fb.innerHTML='<div class="ok">Alle drei Antworten sind richtig.</div>';spMarkRight(FILE,items.length);setTimeout(show,850);return;
 }
 const tries=spMarkWrong(FILE,items.length);
 if(tries>=3){item.qs.forEach((q,n)=>{const solution=document.getElementById('solution-'+n);if(solution)solution.textContent='Lösung: '+(q[1]?'Richtig':'Falsch')});fb.innerHTML='<div class="no">Prüfe die Lösungen und höre den Dialog noch einmal.</div>'}
 else fb.innerHTML='<div class="no">Noch nicht alles richtig. Höre den Dialog noch einmal und verbessere die roten Antworten.</div>';
}
window.addEventListener('beforeunload',stopAudio);
show();
</script></body></html>
