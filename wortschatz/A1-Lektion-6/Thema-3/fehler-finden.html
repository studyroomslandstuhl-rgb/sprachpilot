<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fehler finden</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-upgrade1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script>
header('Fehler finden');const FILE='fehler-finden.html';let items=ERRORS,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}<div class="sentence-box">${it.wrong}</div><input id="ans" autocomplete="off" placeholder="richtige Form schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;ans.addEventListener('keydown',e=>{if(e.key==='Enter')check()});ans.focus()}
function check(){const it=items[i];if(exact(ans.value,it.a)){fb.innerHTML='<div class="ok">Richtig!</div><div class="hint">'+it.right+'</div>';spMarkRight(FILE,items.length);setTimeout(show,850)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=t>=3?`<div class="no">Lösung: ${it.a} · ${it.right}</div>`:'<div class="no">Noch nicht richtig.</div>'}}
show();</script></body></html>
