<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fehler finden und korrigieren</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-review1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=4"></script><script>
const area=document.getElementById('area');header('Fehler finden und korrigieren');
const FILE='fehler-finden.html';
const items=[
{tokens:['Ich','esse','der','Hamburger.'],wrongIndex:2,answer:'den',errorType:'Artikel'},
{tokens:['Mila','bringt','ein','Salat','mit.'],wrongIndex:2,answer:'einen',errorType:'Artikel'},
{tokens:['Du','trinkst','deinen','Cola.'],wrongIndex:2,answer:'deine',errorType:'Possessivartikel'},
{tokens:['Das','Getränk','sind','kalt.'],wrongIndex:2,answer:'ist',errorType:'Verbform'},
{tokens:['Anna','kaufen','die','Speisekarte.'],wrongIndex:1,answer:'kauft',errorType:'Verbform'},
{tokens:['Wir','macht','am','Samstag','ein','Picknick.'],wrongIndex:1,answer:'machen',errorType:'Verbform'},
{tokens:['Tom','bringst','den','Ketchup','mit.'],wrongIndex:1,answer:'bringt',errorType:'Verbform'},
{tokens:['Der','Kellner','bringt','die','Getränk.'],wrongIndex:3,answer:'das',errorType:'Artikel'},
{tokens:['Ich','lese','den','Einladung.'],wrongIndex:2,answer:'die',errorType:'Artikel'},
{tokens:['Sara','lädt','ihre','Freund','ein.'],wrongIndex:3,answer:'Freunde',errorType:'Plural'},
{tokens:['Wir','kaufen','ein','Apfelsaft.'],wrongIndex:2,answer:'einen',errorType:'Artikel'},
{tokens:['Ben','nehme','einen','Hamburger.'],wrongIndex:1,answer:'nimmt',errorType:'Verbform'},
{tokens:['Die','Party','beginnt','an','Freitag.'],wrongIndex:3,answer:'am',errorType:'Präposition'},
{tokens:['Ich','bringe','eine','Käsebrot','mit.'],wrongIndex:2,answer:'ein',errorType:'Artikel'},
{tokens:['Der','Salat','steht','in','den','Küche.'],wrongIndex:4,answer:'der',errorType:'Artikel'},
{tokens:['Mila','macht','das','Fenster','aufen.'],wrongIndex:4,answer:'auf',errorType:'Trennbares Verb'},
{tokens:['Die','Lehrerin','schreibt','eine','Nachrichten.'],wrongIndex:4,answer:'Nachricht',errorType:'Singular'},
{tokens:['Anna','sagt','den','Termin','an.'],wrongIndex:4,answer:'ab',errorType:'Trennbares Verb'},
{tokens:['Wir','plant','einen','Ausflug.'],wrongIndex:1,answer:'planen',errorType:'Verbform'},
{tokens:['Das','Wohnungstür','ist','im','Flur.'],wrongIndex:0,answer:'Die',errorType:'Artikel'}
];
let i=0,current=null,selected=-1;
function show(){
 if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}
 i=spNextIndex(FILE,items.length);current=items[i];selected=-1;
 area.innerHTML=`${progress(FILE,items.length)}${instruction('Finde den Fehler und korrigiere.')}<p class="error-click-sentence" id="errorSentence">${current.tokens.map((t,n)=>`<span class="error-word" data-index="${n}" tabindex="0">${t}</span>`).join(' ')}</p><div id="correctionBox" class="hidden"><input id="ans" autocomplete="off" placeholder="Schreibe nur das richtige Wort."><div class="actions"><button class="btn" id="checkBtn">Kontrollieren</button></div></div><div id="fb" class="feedback"></div>`;
 bindWords();
}
function bindWords(){
 document.querySelectorAll('.error-word').forEach(el=>{const run=()=>choose(Number(el.dataset.index),el);el.addEventListener('click',run);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run()}})});
 document.getElementById('checkBtn').addEventListener('click',check);
 document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
}
function helpFor(t){return help3(t,'Falsch.','Fehlerart: '+current.errorType,current.answer)}
function choose(n,el){
 document.querySelectorAll('.error-word').forEach(x=>x.classList.remove('selected','no'));selected=n;
 if(n===current.wrongIndex){el.classList.add('selected');document.getElementById('correctionBox').classList.remove('hidden');document.getElementById('ans').focus();document.getElementById('fb').innerHTML='';return}
 el.classList.add('no');const t=spMarkWrong(FILE,items.length);document.getElementById('fb').innerHTML=helpFor(t);
}
function check(){
 if(selected!==current.wrongIndex)return;
 const input=document.getElementById('ans');
 if(exact(input.value,current.answer)){input.classList.remove('is-no');input.classList.add('is-ok');document.getElementById('fb').innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,800);return}
 input.classList.remove('is-ok');input.classList.add('is-no');const t=spMarkWrong(FILE,items.length);document.getElementById('fb').innerHTML=helpFor(t);
}
show();
</script></body></html>
