<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-imagefix1"></script><script src="app.js?v=1"></script><script src="l6t3-abstract-words.js?v=2"></script><script src="l6t3-upgrade.js?v=1"></script><script>
const area=document.getElementById('area');header('Karteikarten');
const FILE='karteikarten.html';let items=[],i=0,revealed=false,solved=false;
function solution(w){return full(w)}
function accepted(w){const list=[solution(w),w.word].concat(w.alt||[]);if(w.id==='ketchup')list.push('der Ketchup','das Ketchup','Ketchup');return list}
function backHtml(w){return `<div class="flip-word">${solution(w)}</div><div class="flip-note">Lösung</div><button type="button" class="btn secondary card-listen-btn" id="cardListenBtn">🔊 Anhören</button>`}
function show(){items=WORDS;if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);revealed=false;solved=false;const w=items[i];area.innerHTML=`${progress(FILE,items.length)}<div class="flip-wrap"><div id="fcard" class="flip-card" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="flip-face flip-front">${visual(w)}</div><div class="flip-face flip-back">${backHtml(w)}</div></div></div><div class="hint">Übersetzung: <b>${tr(w)}</b></div><div class="actions card-actions"><button id="micBtn" type="button" class="btn">Sprechen</button><button id="writeBtn" type="button" class="btn secondary">Schreiben</button></div><div id="micStatus" class="small"></div><div id="box" class="card-answer-box" style="display:none"><input id="ans" autocomplete="off" placeholder="Antwort schreiben"><button id="checkBtn" type="button" class="btn">Kontrollieren</button></div><div id="fb" class="feedback"></div><div id="after" class="actions card-actions"></div>`;const card=document.getElementById('fcard');card.addEventListener('click',()=>reveal(true));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal(true)}});document.getElementById('cardListenBtn').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();say(solution(w))});document.getElementById('micBtn').addEventListener('click',speakAnswer);document.getElementById('writeBtn').addEventListener('click',writeBox);document.getElementById('checkBtn').addEventListener('click',()=>check(document.getElementById('ans').value));document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check(e.target.value)})}
function writeBox(){box.style.display='block';ans.focus()}
function reveal(help){if(solved)return;fcard.classList.add('flipped');if(help&&!revealed){revealed=true;spMarkWrong(FILE,items.length);after.innerHTML='<button type="button" class="btn" id="nextHelpBtn">Weiter</button>';nextHelpBtn.addEventListener('click',()=>{spMarkRight(FILE,items.length);show()})}}
function startMic(btn,callback){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('micStatus');if(!SR){status.textContent='Mikrofon wird hier nicht unterstützt. Bitte schreiben.';writeBox();return}const rec=new SR();rec.lang='de-DE';rec.onresult=e=>callback(e.results[0][0].transcript);rec.onerror=()=>{status.textContent='Mikrofon hat nicht funktioniert. Bitte schreiben.'};rec.onend=()=>btn.classList.remove('active');btn.classList.add('active');status.textContent='Ich höre zu …';rec.start()}
function speakAnswer(){startMic(micBtn,value=>{writeBox();ans.value=value;check(value)})}
function check(value){const w=items[i];if(exact(value,accepted(w))){solved=true;fcard.classList.add('flipped');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);after.innerHTML='<button type="button" class="btn" id="nextBtn">Weiter</button>';nextBtn.addEventListener('click',show);return}const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries>=3?`<div class="no">Lösung: ${solution(w)}</div>`:'<div class="no">Noch nicht richtig.</div>'}
show();
</script></body></html>
