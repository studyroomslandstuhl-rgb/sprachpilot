<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('Karteikarten');const FILE='karteikarten.html';let items=WORDS,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'artikel.html');return}i=spNextIndex(FILE,items.length);const w=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Schreiben oder sprechen Sie das Wort. Nomen mit Artikel.')}<div class="small">${w.group}</div>${visual(w)}<div class="hint">Übersetzung: <b>${tr(w)}</b></div><div class="actions"><button class="btn" onclick="say(full(items[i]))">Hören</button><button class="btn secondary" onclick="box.style.display='block'">Schreiben</button><button class="btn secondary" onclick="reveal()">Lösung</button></div><div id="box" style="display:none"><input id="ans" placeholder="Antwort schreiben"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function reveal(){const w=items[i];const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Die Lösung wurde gezeigt. Dieses Wort kommt später noch einmal.','Tipp: Nomen brauchen den Artikel.',full(w))}
function check(v){const w=items[i],sol=[full(w),w.word].concat(w.alt||[]);if(exact(v,sol)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Schreiben Sie das ganze Wort.',full(w))}}
show();</script></body></html>
