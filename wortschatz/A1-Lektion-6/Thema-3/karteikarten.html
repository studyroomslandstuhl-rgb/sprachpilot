<body>
<div class="container">
<header class="topbar"></header>
<section class="card" id="area"><p>Die Aufgabe wird geladen …</p></section>
<footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/guard.js?v=card-standard1"></script>
<script src="app.js?v=1"></script>
<script src="l6t3-abstract-words.js?v=2"></script>
<script src="l6t3-upgrade.js?v=1"></script>
<script src="/js/sp-card-standard.js?v=1"></script>
<script>
(function(){
const FILE='karteikarten.html';
function answers(w){const list=[full(w),w.word].concat(w.alt||[]);if(w.id==='ketchup')list.push('der Ketchup','das Ketchup','Ketchup');return list}
SPCardStandard.mount({
 area:'#area',words:()=>WORDS,nextPage:window.L6T3?L6T3.nextFile(FILE):'artikel.html',full:w=>full(w),word:w=>w.word,
 plural:w=>w.plural||'',example:w=>w.sentence||'',translation:w=>tr(w),languageName:'Muttersprache',visual:w=>visual(w),answers:answers,accept:(w,value)=>exact(value,answers(w)),audio:w=>say(full(w)),
 state:{progress(){const st=loadTask(FILE,WORDS.length);return{total:WORDS.length,done:st.done.length,tries:st.tries||0,hadWrong:!!st.hadWrong}},current(){return WORDS[spNextIndex(FILE,WORDS.length)]},wrong(){return spMarkWrong(FILE,WORDS.length)},right(){spMarkRight(FILE,WORDS.length)},resetCurrent(){localStorage.removeItem(taskKey(FILE))}}
});
})();
</script>
</body>
