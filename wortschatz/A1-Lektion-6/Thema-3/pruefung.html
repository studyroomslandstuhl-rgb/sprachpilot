<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüfung</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-score1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-progress-mode.js?v=1"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=7"></script><script>
const area=document.getElementById('area'),FILE='pruefung.html',D=L6T3Revision.data;header('Prüfung');let q=[],i=0,score=0,answered=false;
function prereqDone(){return L6T3.activeTasks().filter(t=>t[0]!==FILE).every(t=>pctFor(t[0],t[1])>=100)}
function distract(correct,pool,count=3){return L6T3.fisher([correct,...L6T3.fisher(pool.filter(x=>x!==correct)).slice(0,count)])}
function build(){
 const nouns=L6T3.fisher(WORDS.filter(w=>w.type==='noun'&&['der','die','das'].includes(w.article))).slice(0,3);
 const compArticles=L6T3.fisher(D.compoundArticle).slice(0,2),compBuild=L6T3.fisher(D.compoundBuild).slice(0,2);
 const analysis=L6T3.fisher(D.nomAkkItems).slice(0,4),definite=L6T3.fisher(D.definiteItems).slice(0,3),indefinite=L6T3.fisher(D.indefiniteItems).slice(0,2),possessive=L6T3.fisher(D.possessiveItems).slice(0,2),dialogs=L6T3.fisher(D.imageDialogs).slice(0,2);
 const dialogAnswers=D.imageDialogs.map(x=>x.answer);q=[];
 nouns.forEach(w=>q.push({p:`Artikel: ___ ${w.word}`,a:w.article,opts:['der','die','das']}));
 compArticles.forEach(x=>q.push({p:`Artikel: ___ ${x.word}`,a:x.article,opts:['der','die','das']}));
 compBuild.forEach(x=>q.push({p:`Kompositum: ${x.left} + ${x.right}`,a:x.full,opts:distract(x.full,D.compoundBuild.map(c=>c.full))}));
 analysis.forEach((x,n)=>q.push(n%2===0?{p:`${x.sentence} · „${x.target}“ ist …`,a:x.case,opts:['Nominativ','Akkusativ']}:{p:`${x.sentence} · Warum steht „${x.target}“ so?`,a:x.reason,opts:L6T3.reasonOptions()}));
 definite.forEach(x=>q.push({p:x.q,a:x.answer,opts:['der','den','die','das']}));
 indefinite.forEach(x=>q.push({p:x.q,a:x.answer,opts:['ein','einen','eine']}));
 possessive.forEach(x=>q.push({p:`Person ${x.owner}: ${x.q}`,a:x.answer,opts:x.options}));
 dialogs.forEach(x=>q.push({p:x.dialog.join(' '),a:x.answer,opts:distract(x.answer,dialogAnswers)}));
 q=L6T3.fisher(q).slice(0,20);i=0;score=0;
}
function show(){if(!prereqDone()){area.innerHTML='<div class="finish-box"><div class="finish-icon">🔒</div><div class="question">Prüfung gesperrt</div><p class="small">Schließe zuerst alle freigegebenen Aufgaben mit 100% ab.</p><div class="actions"><a class="btn secondary" href="index.html?v=l6t3-score1">Zum Themenmenü</a></div></div>';return}if(!q.length)build();if(i>=q.length){done();return}answered=false;const it=q[i];area.innerHTML=`<div class="small">Aufgabe ${i+1} / ${q.length}</div><div class="progress"><div class="bar" style="width:${Math.round(i/q.length*100)}%"></div></div><div class="question">${it.p}</div><div class="choice-grid">${L6T3.fisher(it.opts).map(o=>`<button type="button" class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){if(answered)return;answered=true;const it=q[i],value=decodeURIComponent(raw);if(exact(value,it.a)){score++;btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>'}else{btn.classList.add('no');fb.innerHTML=`<div class="no">Richtige Lösung: ${it.a}</div>`}setTimeout(()=>{i++;show()},750)}
function done(){const percent=Math.round(score/q.length*100),stars=percent>=100?3:percent>=70?2:percent>=50?1:0,result={percent,score,maxScore:q.length,stars};if(window.L6T3ThemeScore&&typeof L6T3ThemeScore.recordExam==='function')L6T3ThemeScore.recordExam(result);else try{if(window.SPProgress&&SPProgress.recordExamResult)SPProgress.recordExamResult({module:'wortschatz',moduleTitle:'Wortschatz',level:'A1',lesson:6,theme:3,topicId:'wortschatz-a1-lektion-6-thema-3',title:'A1 Lektion 6 · Thema 3',percent,scorePercent:percent,score,maxScore:q.length,stars})}catch(e){}area.innerHTML=`<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Prüfung fertig</div><div class="big">${percent}%</div><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="hint">${score} / ${q.length} richtig</div><div class="actions"><button class="btn" onclick="build();show()">Neue zufällige Prüfung</button><a class="btn secondary" href="index.html?v=l6t3-score1">Zum Thema</a></div></div>`}
L6T3.refreshRelease(show);
</script></body></html>
