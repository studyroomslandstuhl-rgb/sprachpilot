<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bild oder Erklärung → Wort</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-abstract1"></script><script src="app.js?v=1"></script><script src="l6t3-abstract-words.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script>
header('Bild oder Erklärung → Wort');const FILE='bild-wort.html';let items=WORDS,i=0;
function show(){items=WORDS;if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);const w=items[i],sameKind=items.filter(x=>x.id!==w.id&&Boolean(x.meaning)===Boolean(w.meaning)),pool=sameKind.length>=3?sameKind:items.filter(x=>x.id!==w.id),opts=L6T3.fisher([w,...L6T3.fisher(pool).slice(0,3)]),question=w.meaning?'Welches Wort passt zur Erklärung?':'Welches Wort passt zum Bild?';area.innerHTML=`${progress(FILE,items.length)}<div class="question">${question}</div>${visual(w)}<div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${o.id}')">${full(o)}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,id){const w=items[i];if(id===w.id){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,650)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=t>=3?`<div class="no">Lösung: ${full(w)}</div>`:'<div class="no">Noch nicht richtig.</div>'}}
show();</script></body></html>
