<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nachrichten R/F</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('Nachrichten R/F');const FILE='nachrichten-rf.html';let flat=MESSAGES.flatMap(d=>d.qs.map(q=>({title:d.title,text:d.text,q:q[0],a:q[1]}))),items=flat,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'fehler-finden.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Lesen Sie die Nachricht. Richtig oder falsch?')}<h2>${it.title}</h2><div class="message-box">${it.text.replace(/\n/g,'<br>')}</div><div class="question">${it.q}</div><div class="choice-grid"><button class="choice" onclick="check(this,true)">Richtig</button><button class="choice" onclick="check(this,false)">Falsch</button></div><div id="fb" class="feedback"></div>`}
function check(btn,v){const it=items[i];if(v===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Lesen Sie die Nachricht noch einmal.',it.a?'Richtig':'Falsch')}}
show();</script></body></html>
