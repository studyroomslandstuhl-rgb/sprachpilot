<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akkusativpräpositionen</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-upgrade1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-progress-mode.js?v=1"></script><script>
const area=document.getElementById('area'),FILE='akkusativ-praepositionen.html';header('Akkusativpräpositionen');let items=[],i=0;
function acronym(active){return '<div class="fudgoeb">'+[...'FUDGOEB'].map(letter=>`<span class="fud-letter ${letter===active?'active':''}">${letter}</span>`).join('')+'</div>'}
function show(){if(!L6T3.apEnabled()){area.innerHTML='<div class="finish-box"><div class="finish-icon">🔒</div><div class="question">Nicht freigeschaltet</div><p class="small">Die Lehrkraft muss Akkusativpräpositionen zuerst freigeben.</p><div class="actions"><a class="btn secondary" href="index.html">Zum Themenmenü</a></div></div>';return}items=L6T3.fudgoebItems();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);const item=items[i];if(item.kind==='letter'){area.innerHTML=`${progress(FILE,items.length)}<div class="question">Ergänze die Akkusativpräposition zu diesem Buchstaben.</div>${acronym(item.letter)}<input id="ans" autocomplete="off" placeholder="Präposition schreiben"><div class="actions"><button class="btn" onclick="checkInput()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;ans.addEventListener('keydown',e=>{if(e.key==='Enter')checkInput()});ans.focus()}else{const opts=L6T3.fisher(['für','um','durch','gegen','ohne','entlang','bis']);area.innerHTML=`${progress(FILE,items.length)}<div class="question">Welche Akkusativpräposition passt?</div>${acronym('')}<div class="sentence-box">${item.q}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="checkChoice(this,'${o}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}}
function right(){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,650)}
function wrong(answer){const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries>=3?`<div class="no">Lösung: ${answer}</div>`:'<div class="no">Noch nicht richtig.</div>'}
function checkInput(){const item=items[i];exact(ans.value,item.answer)?right():wrong(item.answer)}
function checkChoice(btn,value){const item=items[i];if(value===item.answer){btn.classList.add('ok');right()}else{btn.classList.add('no');wrong(item.answer)}}
L6T3.refreshRelease(show);
</script></body></html>
