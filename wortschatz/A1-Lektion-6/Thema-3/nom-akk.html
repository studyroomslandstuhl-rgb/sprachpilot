<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nominativ oder Akkusativ?</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('Nominativ oder Akkusativ?');const FILE='nom-akk.html';let base=SVO.flatMap(x=>[{s:x.s,p:x.sub,a:'Nominativ'},{s:x.s,p:x.obj,a:'Akkusativ'}]),items=base,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'dialoge-planen.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Ist der markierte Teil Nominativ oder Akkusativ?')}<div class="sentence-box">${it.s.replace(it.p,'<mark>'+it.p+'</mark>')}</div><div class="choice-grid"><button class="choice" onclick="check(this,'Nominativ')">Nominativ</button><button class="choice" onclick="check(this,'Akkusativ')">Akkusativ</button></div><div class="hint">Wer? = Nominativ · Was? = Akkusativ</div><div id="fb" class="feedback"></div>`}
function check(btn,v){const it=items[i];if(v===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Fragen Sie: Wer? oder Was?',it.a)}}
show();</script></body></html>
