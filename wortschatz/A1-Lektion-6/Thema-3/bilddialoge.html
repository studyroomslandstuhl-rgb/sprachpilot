<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilddialoge · Artikel und Nomen</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=4"><style>.dialog-image-wrap{display:flex;align-items:center;justify-content:center;overflow:hidden}.dialog-image-wrap img{width:100%;height:100%;object-fit:contain}.dialog-image-fallback{font-size:48px;line-height:1}.dialog-image-fallback[hidden],.dialog-image-wrap img[hidden]{display:none}.saved-step{margin:8px 0 14px;text-align:center;color:#5f6f7d;font-weight:800;font-size:14px}</style></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-fix2"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-progress-mode.js?v=2"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=7"></script><script>
const area=document.getElementById('area'),FILE='bilddialoge.html';header('Bilddialoge · Artikel und Nomen');const items=L6T3Revision.data.imageDialogs;let i=0,stage=0,locked=false,draft='';
const IMAGE_ICONS={'salat.webp':'🥗','einladung.webp':'✉️','ausflug.webp':'🚌','speisekarte.webp':'📋','cola.webp':'🥤','kuehlschrank.webp':'🧊','lampe.webp':'💡','teppich.webp':'🧶','hamburger.webp':'🍔','getraenk.webp':'🥤','fenster.webp':'🪟','schrank.webp':'🗄️','termin.webp':'📅','brot.webp':'🍞','kaese.webp':'🧀','stuhl.webp':'🪑','party.webp':'🎉','wohnung.webp':'🏠','nachricht.webp':'💬','picknick.webp':'🧺'};
function esc(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[char]))}
function image(item){const icon=IMAGE_ICONS[item.image]||'🖼️';return `<div class="dialog-gap-card dialog-image-wrap" aria-label="Bildhinweis"><img src="${CDN+encodeURIComponent(item.image)}" alt="Bildhinweis" loading="eager" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="dialog-image-fallback" hidden aria-hidden="true">${icon}</div></div>`}
function context(item){return `<div class="dialog-scene">${item.dialog.map(line=>line.includes('___')?`<div class="dialog-gap-row"><div class="dialog-line dialog-gap-line">${line}</div>${image(item)}</div>`:`<div class="dialog-line">${line}</div>`).join('')}</div>`}
function state(){return loadTask(FILE,items.length)}
function savePartial(){const st=state();st.dialogStage=stage;st.dialogDraft=draft;st.dialogItem=st.current;saveTask(FILE,st)}
function clearPartial(){const st=state();delete st.dialogStage;delete st.dialogDraft;delete st.dialogItem;saveTask(FILE,st)}
function partialNote(){return `<div class="saved-step">Zwischenstand gespeichert: Schritt ${stage+1} von 4.</div>`}
function expected(){const item=items[i];return stage===1?item.articleType:stage===2?item.case:item.reason}
function hintText(){if(stage===0)return'Achte auf Bild und Dialog. Schreibe Artikel und Nomen.';if(stage===1)return'Ist der Artikel bestimmt, unbestimmt, negativ oder gibt es keinen Artikel?';if(stage===2)return'Frage: Wer? oder Wen/Was?';return'Ist die Ergänzung Subjekt, Objekt einer Aktion oder gibt es keine Aktion?'}
function savedHelp(item){const st=state(),tries=st.tries||0;if(!tries)return'';const answer=stage===0?item.answer:expected();if(tries===1)return'<div class="no">Noch nicht richtig. Versuche es noch einmal.</div>';if(tries===2)return `<div class="hint"><strong>Hinweis:</strong> ${hintText()}</div>`;return `<div class="no"><strong>Richtige Antwort:</strong> ${answer}<br>Wähle oder schreibe die Antwort selbst richtig.</div>`}
function show(){let st=state();if(st.done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);st=state();if(st.dialogItem===st.current){stage=Math.max(0,Math.min(3,Number(st.dialogStage)||0));draft=String(st.dialogDraft||'')}else{stage=0;draft='';savePartial()}locked=false;render()}
function render(){const item=items[i];if(stage===0){area.innerHTML=`${progress(FILE,items.length)}${partialNote()}<div class="task-step">1. Ergänze Artikel und Nomen.</div>${context(item)}<div class="dialog-answer-box"><input id="ans" autocomplete="off" placeholder="Artikel und Nomen schreiben" value="${esc(draft)}"><button type="button" class="btn" id="checkTextButton">Kontrollieren</button></div><div id="fb" class="feedback">${savedHelp(item)}</div>`;const input=document.getElementById('ans');input.addEventListener('input',()=>{draft=input.value;savePartial()});input.addEventListener('keydown',event=>{if(event.key==='Enter')checkText()});document.getElementById('checkTextButton').onclick=checkText;input.focus();return}const title=stage===1?'2. Welche Artikelart ist das?':stage===2?'3. Nominativ oder Akkusativ?':'4. Warum?';const opts=stage===1?L6T3.articleTypeOptions:(stage===2?['Nominativ','Akkusativ']:L6T3.reasonOptions());area.innerHTML=`${progress(FILE,items.length)}${partialNote()}<div class="task-step">${title}</div>${context(item)}<div class="hint">Deine Ergänzung: <b>${item.answer}</b></div><div class="choice-grid article-type-grid">${L6T3.fisher(opts).map(option=>`<button type="button" class="choice" data-choice="${encodeURIComponent(option)}">${option}</button>`).join('')}</div><div id="fb" class="feedback">${savedHelp(item)}</div>`;area.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>checkChoice(button,button.dataset.choice))}
function advance(){locked=true;if(stage<3){stage++;savePartial();setTimeout(()=>{locked=false;render()},450)}else{document.getElementById('fb').innerHTML='<div class="ok">Richtig!</div>';clearPartial();spMarkRight(FILE,items.length);setTimeout(show,650)}}
function wrong(answer){const tries=spMarkWrong(FILE,items.length);savePartial();const box=document.getElementById('fb');box.innerHTML=tries===1?'<div class="no">Noch nicht richtig. Versuche es noch einmal.</div>':tries===2?`<div class="hint"><strong>Hinweis:</strong> ${hintText()}</div>`:`<div class="no"><strong>Richtige Antwort:</strong> ${answer}<br>Wähle oder schreibe die Antwort selbst richtig. Der Dialog kommt am Ende erneut.</div>`}
function checkText(){if(locked)return;const item=items[i],input=document.getElementById('ans');draft=String(input?.value||'');savePartial();if(exact(draft,item.answer)){stage=1;draft=item.answer;savePartial();locked=true;setTimeout(()=>{locked=false;render()},450)}else wrong(item.answer)}
function checkChoice(button,raw){if(locked)return;const value=decodeURIComponent(raw),answer=expected();if(value===answer){button.classList.add('ok');advance()}else{button.classList.add('no');wrong(answer)}}
L6T3.refreshRelease(show);
</script></body></html>
