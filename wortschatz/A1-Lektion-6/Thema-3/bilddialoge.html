<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilddialoge · Artikel und Nomen</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-review1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-progress-mode.js?v=1"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=4"></script><script>
const area=document.getElementById('area'),FILE='bilddialoge.html';header('Bilddialoge · Artikel und Nomen');const items=L6T3Revision.data.imageDialogs;let i=0,stage=0,locked=false;
function image(item){return `<img class="dialog-gap-card" src="${CDN+item.image}" alt="Bildhinweis" loading="eager" onerror="this.outerHTML='<div class=&quot;dialog-gap-card image-error&quot;>Bild</div>'">`}
function context(item){return `<div class="dialog-scene">${item.dialog.map(line=>line.includes('___')?`<div class="dialog-gap-row"><div class="dialog-line dialog-gap-line">${line}</div>${image(item)}</div>`:`<div class="dialog-line">${line}</div>`).join('')}</div>`}
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);stage=0;locked=false;render()}
function render(){const item=items[i];if(stage===0){area.innerHTML=`${progress(FILE,items.length)}<div class="task-step">1. Ergänze Artikel und Nomen.</div>${context(item)}<div class="dialog-answer-box"><input id="ans" autocomplete="off" placeholder="Artikel und Nomen schreiben"><button type="button" class="btn" onclick="checkText()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;ans.addEventListener('keydown',e=>{if(e.key==='Enter')checkText()});ans.focus();return}const title=stage===1?'2. Welche Artikelart ist das?':stage===2?'3. Nominativ oder Akkusativ?':'4. Warum?';const opts=stage===1?L6T3.articleTypeOptions:(stage===2?['Nominativ','Akkusativ']:L6T3.reasonOptions());area.innerHTML=`${progress(FILE,items.length)}<div class="task-step">${title}</div>${context(item)}<div class="hint">Deine Ergänzung: <b>${item.answer}</b></div><div class="choice-grid article-type-grid">${L6T3.fisher(opts).map(o=>`<button type="button" class="choice" onclick="checkChoice(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function expected(){const item=items[i];return stage===1?item.articleType:stage===2?item.case:item.reason}
function advance(){locked=true;if(stage<3){stage++;setTimeout(()=>{locked=false;render()},450)}else{fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,650)}}
function wrong(answer){const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries>=3?`<div class="no">Richtige Antwort: ${answer}</div>`:'<div class="no">Noch nicht richtig. Der Dialog kommt am Ende erneut.</div>'}
function checkText(){if(locked)return;const item=items[i];if(exact(ans.value,item.answer)){stage=1;locked=true;setTimeout(()=>{locked=false;render()},450)}else wrong(item.answer)}
function checkChoice(btn,raw){if(locked)return;const value=decodeURIComponent(raw),answer=expected();if(value===answer){btn.classList.add('ok');advance()}else{btn.classList.add('no');wrong(answer)}}
show();
</script></body></html>
