<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subjekt · Verb · Objekt</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('Subjekt · Verb · Objekt');const FILE='svo.html';let items=SVO,i=0,step=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'nom-akk.html');return}i=spNextIndex(FILE,items.length);step=0;render()}
function render(){const it=items[i],qs=[['Wer?',it.sub,'Subjekt / Nominativ'],['Verb?',it.verb,'Verb'],['Was?',it.obj,'Objekt / Akkusativ']],q=qs[step],opts=shuffle([q[1],...shuffle([it.sub,it.verb,it.obj].filter(x=>x!==q[1]))]);area.innerHTML=`${progress(FILE,items.length)}${instruction('Erkennen Sie Subjekt, Verb und Objekt.')}<div class="sentence-box">${it.s}</div><div class="question">${q[0]}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div class="hint">${q[2]}</div><div id="fb" class="feedback"></div>`}
function check(btn,raw){const it=items[i],qs=[it.sub,it.verb,it.obj],val=decodeURIComponent(raw);if(val===qs[step]){btn.classList.add('ok');step++;if(step>=3){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else setTimeout(render,500)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Wer macht etwas? Was passiert? Was isst/trinkt/nimmt die Person?',qs[step])}}
show();</script></body></html>
