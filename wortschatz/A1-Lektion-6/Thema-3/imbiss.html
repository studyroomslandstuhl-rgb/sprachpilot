<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Im Imbiss</title>
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="l6t3-upgrade.css?v=1">
<link rel="stylesheet" href="l6t3-revision.css?v=2">
<style>
.imbiss-scene{max-width:820px;margin:18px auto;padding:18px;border:2px solid #bfe6ef;border-radius:24px;background:#f5fdff}.imbiss-row{display:flex;flex-direction:column;margin:14px 0}.imbiss-row.right{align-items:flex-end}.imbiss-name{margin:0 10px 5px;font-size:14px;font-weight:900;color:#52606d}.imbiss-bubble{max-width:90%;padding:15px 18px;border-radius:22px;background:#fff;border:2px solid #bfe6ef;box-shadow:0 7px 18px rgba(15,95,117,.08);font-size:19px;line-height:1.6}.imbiss-row.right .imbiss-bubble{background:#e8fbff}.food-visible-word{display:inline-block;margin-right:2px;font-weight:900;color:#0b5c73;vertical-align:middle}.food-chip{display:inline-flex;width:84px;height:84px;margin:5px 7px;vertical-align:middle;align-items:center;justify-content:center;border:2px solid #9fdce9;border-radius:18px;background:#fff;overflow:hidden}.food-chip img{width:100%;height:100%;object-fit:contain}.food-chip-fallback{font-size:42px;line-height:1}.food-chip-fallback[hidden],.food-chip img[hidden]{display:none}.speak-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px auto;max-width:760px}.speak-turn{padding:14px;border:2px solid #bfe6ef;border-radius:18px;background:#fff;text-align:center}.speak-turn.done{border-color:#22c55e;background:#effff4}.fallback-box{margin-top:12px;padding:12px;border:2px dashed #f0b429;border-radius:15px;background:#fffaf0}.fallback-box label{display:block;margin-bottom:7px;font-weight:900;color:#765000}.fallback-box textarea{width:100%;min-height:100px;resize:vertical}.fallback-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stage-done{color:#15803d;font-weight:900}.stage-open{color:#765000;font-weight:800}.mic-result{min-height:30px;margin:10px 0;text-align:center;font-weight:800}@media(max-width:640px){.imbiss-scene{padding:12px}.imbiss-bubble{max-width:96%;font-size:17px;padding:12px}.food-chip{width:70px;height:70px;margin:4px}.speak-checks{grid-template-columns:1fr}.fallback-box textarea{min-height:115px}}
</style>
</head>
<body>
<div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div>
<script type="module" src="/js/guard.js?v=l6t3-imbiss3"></script>
<script src="app.js?v=1"></script>
<script src="l6t3-upgrade.js?v=1"></script>
<script src="l6t3-revision-data.js?v=2"></script>
<script src="l6t3-revision.js?v=8"></script>
<script>
header('Im Imbiss');
const menuUrl='/wortschatz/A1-Lektion-6/Thema-3/index.html?v=l6t3-imbiss3';
const backButton=document.querySelector('.nav .btn.secondary');
if(backButton){backButton.href=menuUrl;backButton.addEventListener('click',event=>{event.preventDefault();location.replace(menuUrl)})}
const FILE='imbiss.html';
const IMAGE_BASES=[CDN,CDN+'Neu/'];
const FOOD={
 hamburger:{phrase:'einen Hamburger',image:'hamburger.webp',icon:'🍔'},
 salat:{phrase:'einen Salat',image:'salat.webp',icon:'🥗'},
 pommes:{phrase:'eine Portion Pommes',visible:'eine Portion',image:'pommes.webp',icon:'🍟'},
 brot:{phrase:'Brot',image:'brot.webp',icon:'🍞'},
 kaese:{phrase:'Käse',image:'kaese.webp',icon:'🧀'},
 cola:{phrase:'eine Cola',image:'cola.webp',icon:'🥤'},
 saft:{phrase:'einen Saft',image:'saft.webp',icon:'🧃'},
 getraenk:{phrase:'ein Getränk',image:'getraenk.webp',icon:'🥤'}
};
const raw=[
 ['Mila','Ben','hamburger','saft','salat',0],
 ['Sara','Tom','salat','getraenk','hamburger',1],
 ['Anna','Leo','pommes','saft','salat',2],
 ['Nina','Amir','brot','kaese','getraenk',3],
 ['Lea','Omar','hamburger','getraenk','salat',0],
 ['Paula','Daniel','salat','saft','pommes',1],
 ['Eva','Samir','pommes','cola','hamburger',2],
 ['Mila','Tom','brot','kaese','saft',3],
 ['Sara','Ben','hamburger','saft','pommes',0],
 ['Anna','Amir','salat','getraenk','hamburger',1],
 ['Nina','Leo','brot','kaese','salat',2],
 ['Lea','Samir','pommes','getraenk','hamburger',3]
];
const items=raw.map((x,n)=>({id:'imb'+String(n+1).padStart(2,'0'),aName:x[0],bName:x[1],first:FOOD[x[2]],second:FOOD[x[3]],third:FOOD[x[4]],template:x[5]}));
const total=items.length;
let index=0,doneRoles=new Set(),fallbackVisible=new Set(),fallbackValues={a:'',b:''},completedBy={},finishing=false;
function lines(item){
 const sets=[
  [`Ich hätte gern ${item.first.phrase} und ${item.second.phrase}. Was möchtest du?`,`Ich nehme nur ${item.third.phrase}. Ich habe heute keinen Hunger.`],
  [`Ich nehme ${item.first.phrase} und ${item.second.phrase}. Nimmst du auch etwas?`,`Ja, ich nehme nur ${item.third.phrase}. Mehr möchte ich nicht.`],
  [`Ich bestelle ${item.first.phrase} und ${item.second.phrase}. Was bestellst du?`,`Für mich bitte nur ${item.third.phrase}. Ich habe nicht viel Hunger.`],
  [`Ich möchte ${item.first.phrase} und ${item.second.phrase}. Und du?`,`Ich nehme nur ${item.third.phrase}. Das reicht mir.`]
 ];
 return sets[item.template];
}
function line(item,turn){return lines(item)[turn==='a'?0:1]}
function accepted(text){return [text,text.replace('hätte gern','hätte gerne')]}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function retryFoodImage(img){const step=Number(img.dataset.imageStep||0)+1,file=img.dataset.imageFile||'';if(step<IMAGE_BASES.length){img.dataset.imageStep=String(step);img.src=IMAGE_BASES[step]+encodeURIComponent(file);return}img.hidden=true;const fallback=img.nextElementSibling;if(fallback)fallback.hidden=false}
function food(item){const visible=item.visible?`<span class="food-visible-word">${esc(item.visible)}</span>`:'';return `${visible}<span class="food-chip"><img src="${IMAGE_BASES[0]+encodeURIComponent(item.image)}" data-image-file="${esc(item.image)}" data-image-step="0" alt="${esc(item.phrase)}" loading="eager" decoding="async" onerror="retryFoodImage(this)"><span class="food-chip-fallback" hidden aria-hidden="true">${item.icon||'🍽️'}</span></span>`}
function scaffold(item){
 const first=lines(item)[0],second=lines(item)[1];
 const replacements=[first.replace(item.first.phrase,food(item.first)).replace(item.second.phrase,food(item.second)),second.replace(item.third.phrase,food(item.third))];
 return `<div class="imbiss-scene"><div class="imbiss-row left"><div class="imbiss-name">${item.aName}</div><div class="imbiss-bubble">${replacements[0]}</div></div><div class="imbiss-row right"><div class="imbiss-name">${item.bName}</div><div class="imbiss-bubble">${replacements[1]}</div></div></div>`;
}
function roleStatus(turn){
 if(!doneRoles.has(turn))return turn==='a'?'Bestellung und Frage':'Antwort';
 return completedBy[turn]==='write'?'Richtig geschrieben ✓':'Richtig gesprochen ✓';
}
function fallbackBox(turn){
 if(!fallbackVisible.has(turn)||doneRoles.has(turn))return'';
 return `<div class="fallback-box"><label for="fallback-${turn}">Schreibe die vollständige Rolle:</label><textarea id="fallback-${turn}" autocomplete="off">${esc(fallbackValues[turn])}</textarea><div class="fallback-actions"><button class="btn" type="button" onclick="checkFallback('${turn}')">Kontrollieren</button></div></div>`;
}
function roleCard(item,turn){
 const name=turn==='a'?item.aName:item.bName;
 return `<section class="speak-turn ${doneRoles.has(turn)?'done':''}"><b>${name}</b><div class="${doneRoles.has(turn)?'stage-done':'stage-open'}">${roleStatus(turn)}</div><div class="fallback-actions"><button class="btn mic-btn" type="button" ${doneRoles.has(turn)?'disabled':''} onclick="speakTurn(this,'${turn}')">🎤 Sprechen</button><button class="btn secondary" type="button" ${doneRoles.has(turn)?'disabled':''} onclick="showWrite('${turn}')">✍️ Schreiben</button></div>${fallbackBox(turn)}</section>`;
}
function show(){
 if(loadTask(FILE,total).done.length>=total){complete(area,FILE,L6T3.nextFile(FILE));return}
 index=spNextIndex(FILE,total);doneRoles=new Set();fallbackVisible=new Set();fallbackValues={a:'',b:''};completedBy={};finishing=false;render('');
}
function render(message){
 const item=items[index];
 area.innerHTML=`${progress(FILE,total)}${instruction('Bearbeite beide Rollen: sprechen oder schreiben. Eine richtig gesprochene Rolle musst du nicht mehr schreiben.')} ${scaffold(item)}<div class="speak-checks">${roleCard(item,'a')}${roleCard(item,'b')}</div><div id="micStatus" class="mic-status"></div><div class="mic-result">${message}</div>`;
}
function showWrite(turn,message){
 fallbackVisible.add(turn);render(message||'<div class="hint">Schreibe die vollständige Rolle.</div>');
 setTimeout(()=>document.getElementById('fallback-'+turn)?.focus(),30);
}
function completeRole(turn,method){
 doneRoles.add(turn);completedBy[turn]=method;fallbackVisible.delete(turn);
 if(doneRoles.size===2&&!finishing){
  finishing=true;render('<div class="ok">Beide Rollen sind richtig. Der Dialog ist abgeschlossen.</div>');
  spMarkRight(FILE,total);setTimeout(show,850);
 }else render(`<div class="ok">Rolle richtig ${method==='write'?'geschrieben':'gesprochen'}.</div>`);
}
function speakTurn(button,turn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){showWrite(turn,'<div class="hint">Das Mikrofon ist nicht verfügbar. Bitte schreibe die Rolle.</div>');return}
 let recognition,resultReceived=false,failed=false;
 try{recognition=new SR()}catch(e){showWrite(turn,'<div class="hint">Das Mikrofon konnte nicht gestartet werden. Bitte schreibe die Rolle.</div>');return}
 recognition.lang='de-DE';recognition.interimResults=false;recognition.maxAlternatives=4;
 button.disabled=true;const old=button.textContent;button.textContent='Ich höre …';
 recognition.onresult=e=>{resultReceived=true;const alternatives=e.results&&e.results[0]?Array.from(e.results[0]).map(x=>x.transcript).filter(Boolean):[];checkSpeech(turn,alternatives)};
 recognition.onerror=()=>{failed=true;showWrite(turn,'<div class="hint">Das Mikrofon ist blockiert oder hat nicht funktioniert. Bitte schreibe die Rolle.</div>')};
 recognition.onnomatch=()=>{failed=true;showWrite(turn,'<div class="hint">Ich konnte nichts erkennen. Bitte schreibe die Rolle.</div>')};
 recognition.onend=()=>{button.disabled=false;button.textContent=old;if(!resultReceived&&!failed)showWrite(turn,'<div class="hint">Ich konnte nichts erkennen. Bitte schreibe die Rolle.</div>')};
 try{recognition.start()}catch(e){button.disabled=false;button.textContent=old;showWrite(turn,'<div class="hint">Das Mikrofon konnte nicht gestartet werden. Bitte schreibe die Rolle.</div>')}
}
function checkSpeech(turn,alternatives){
 const solution=line(items[index],turn);
 if((alternatives||[]).some(t=>exact(t,accepted(solution))))completeRole(turn,'speak');
 else{const tries=spMarkWrong(FILE,total);showWrite(turn,tries>=3?`<div class="no">Die Aufnahme war nicht vollständig richtig.<br>Lösung: ${solution}</div>`:'<div class="no">Noch nicht vollständig richtig. Sprich noch einmal oder schreibe die Rolle.</div>')}
}
function checkFallback(turn){
 const input=document.getElementById('fallback-'+turn);if(!input)return;
 fallbackValues[turn]=input.value;const solution=line(items[index],turn);
 if(exact(input.value,accepted(solution)))completeRole(turn,'write');
 else{const tries=spMarkWrong(FILE,total);render(tries>=3?`<div class="no">Lösung: ${solution}</div>`:'<div class="no">Noch nicht richtig. Prüfe Artikel und Wortstellung.</div>');setTimeout(()=>document.getElementById('fallback-'+turn)?.focus(),30)}
}
show();
</script>
</body>
</html>
