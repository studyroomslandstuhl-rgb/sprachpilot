<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komposita bauen</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-revision2"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-revision-data.js?v=1"></script><script src="l6t3-revision.js?v=1"></script><script>
header('Komposita bauen');const FILE='komposita-bauen.html',items=L6T3Revision.data.compoundBuild;let i=0;
function partCard(word,image){return `<div class="compound-part"><img class="compound-image" src="${CDN+image}" alt="" onerror="this.style.display='none'">${word}</div>`}
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Verbinde die zwei Wörter. Schreibe das Kompositum.')}<div class="compound-stage"><div class="compound-parts">${partCard(it.left,it.leftImage)}<div class="compound-plus">+</div>${partCard(it.right,it.rightImage)}</div><div class="compound-word">?</div></div><input id="ans" autocomplete="off" placeholder="Kompositum schreiben"><div class="actions"><button class="btn" type="button" onclick="check()">Kontrollieren</button></div><div class="revision-note">Das neue Wort wird zusammengeschrieben.</div><div id="fb" class="feedback"></div>`;ans.addEventListener('keydown',e=>{if(e.key==='Enter')check()});ans.focus()}
function check(){const it=items[i];if(exact(ans.value,[it.word,it.full])){fb.innerHTML=`<div class="ok">Richtig: ${it.full}</div>`;spMarkRight(FILE,items.length);setTimeout(show,650)}else{const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries>=3?`<div class="no">Lösung: ${it.word}</div>`:'<div class="no">Noch nicht richtig. Schreibe beide Wörter zusammen.</div>'}}
show();
</script></body></html>
