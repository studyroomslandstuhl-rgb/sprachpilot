<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komposita bauen</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="app.js?v=1"></script><script>
header('Komposita bauen');const FILE='komposita-bauen.html';let items=COMPOUNDS,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'komposita-artikel.html');return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Bauen Sie das Kompositum.')}<div class="question">${it.left} + ${it.right} = ?</div><input id="ans" placeholder="Kompositum schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div class="example-box">Regel: Artikel = letztes Wort. ${it.rule}</div><div id="fb" class="feedback"></div>`}
function check(){const it=items[i];if(exact(ans.value,[it.full,it.word])){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Schreiben Sie ein Wort zusammen.',it.full)}}
show();</script></body></html>
