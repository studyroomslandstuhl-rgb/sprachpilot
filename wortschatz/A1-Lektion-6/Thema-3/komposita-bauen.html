<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komposita bauen</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=4"><style>.compound-word-fallback{width:100%;min-height:76px;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:18px;font-weight:900;line-height:1.15;color:#0b5c73;overflow-wrap:anywhere}.compound-word-fallback[hidden],.compound-part img[hidden]{display:none}</style></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-fix3"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=7"></script><script>
header('Komposita bauen');const FILE='komposita-bauen.html',items=L6T3Revision.data.compoundBuild;let i=0;
function esc(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function partCard(image,word){const safeWord=esc(word);if(!image)return `<div class="compound-part" aria-label="${safeWord}"><div class="compound-word-fallback">${safeWord}</div></div>`;return `<div class="compound-part" aria-label="${safeWord}"><img class="compound-image" src="${CDN+encodeURIComponent(image)}" alt="${safeWord}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="compound-word-fallback" hidden>${safeWord}</div></div>`}
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Bilde aus den zwei Bildern oder Wörtern ein Kompositum.')}<div class="compound-stage"><div class="compound-parts">${partCard(it.leftImage,it.left)}<div class="compound-plus">+</div>${partCard(it.rightImage,it.right)}<div class="compound-equals">=</div><div class="compound-word">?</div></div></div><input id="ans" autocomplete="off" placeholder="Kompositum schreiben"><div class="actions"><button class="btn" type="button" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;ans.addEventListener('keydown',e=>{if(e.key==='Enter')check()});ans.focus()}
function check(){const it=items[i];if(exact(ans.value,[it.word,it.full])){fb.innerHTML=`<div class="ok">Richtig: ${it.full}</div>`;spMarkRight(FILE,items.length);setTimeout(show,650)}else{const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries===1?'<div class="no">Noch nicht richtig.</div>':tries===2?`<div class="hint">Das erste Wort ist „${it.left}“. Das zweite Wort ist „${it.right}“.</div>`:`<div class="no">Lösung: ${it.word}<br>Schreibe die Lösung selbst richtig.</div>`}}
show();
</script></body></html>
