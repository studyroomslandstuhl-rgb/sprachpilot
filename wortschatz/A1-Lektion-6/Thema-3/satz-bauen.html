<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sätze selbst bilden</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-review1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=4"></script><script>
header('Sätze selbst bilden');const FILE='satz-bauen.html',items=L6T3Revision.data.sentencePrompts;let i=0;
function imageCard(image,label){return `<div class="prompt-card"><img src="${CDN+image}" alt="${label}" onerror="this.style.display='none'"><span>${label}</span></div>`}
function show(){
 if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}
 i=spNextIndex(FILE,items.length);const it=items[i];
 area.innerHTML=`${progress(FILE,items.length)}${instruction('Bilde einen Satz oder eine Frage. Sprich oder schreibe.')}<div class="prompt-strip"><div class="prompt-card">${it.subject}</div>${imageCard(it.verbImage,it.verb)}${imageCard(it.objectImage,it.object)}<div class="prompt-card prompt-punct">${it.punct}</div></div><div class="speak-write-box"><input id="ans" autocomplete="off" placeholder="Satz oder Frage schreiben"><div class="actions"><button class="btn mic-btn" type="button" onclick="speakAnswer(this)">🎤 Sprechen</button><button class="btn" type="button" onclick="check(ans.value)">Kontrollieren</button></div><div id="micStatus" class="mic-status"></div><div id="fb" class="feedback"></div></div>`;
 ans.addEventListener('keydown',e=>{if(e.key==='Enter')check(ans.value)});ans.focus();
}
function speakAnswer(btn){startMic(btn,text=>{ans.value=text;check(text)})}
function check(value){
 const it=items[i];
 if(exact(value,it.solution)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,700)}
 else{const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries>=3?`<div class="no">Lösung: ${it.solution}</div>`:'<div class="no">Noch nicht richtig.</div>'}
}
show();
</script></body></html>
