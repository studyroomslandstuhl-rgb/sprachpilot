<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satz bauen</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-upgrade1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script>
header('Satz bauen');const FILE='satz-bauen.html';let items=L6T3.fisher(SENTENCES),i=0,chosen=[];
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);chosen=[];render()}
function render(){const it=items[i],pool=L6T3.fisher(it.parts.filter((p,idx)=>chosen.filter(x=>x===p).length<it.parts.filter(x=>x===p).length));area.innerHTML=`${progress(FILE,items.length)}<div class="sentence-box">${chosen.join(' ')||'—'}</div><div class="choice-grid">${pool.map(p=>`<button class="choice" onclick="pick('${encodeURIComponent(p)}')">${p}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button><button class="btn secondary" onclick="chosen=[];render()">Neu</button></div><div id="fb" class="feedback"></div>`}
function pick(raw){chosen.push(decodeURIComponent(raw));render()}
function check(){const it=items[i],val=chosen.join(' ');if(exact(val,it.sol)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,650)}else{const t=spMarkWrong(FILE,items.length);fb.innerHTML=t>=3?`<div class="no">Lösung: ${it.sol}</div>`:'<div class="no">Noch nicht richtig.</div>'}}
show();</script></body></html>
