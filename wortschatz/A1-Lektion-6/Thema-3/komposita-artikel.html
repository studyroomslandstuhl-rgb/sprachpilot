<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel von Komposita</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"><link rel="stylesheet" href="l6t3-revision.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-review1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script src="l6t3-revision-data.js?v=2"></script><script src="l6t3-revision.js?v=4"></script><script>
header('Artikel von Komposita');const FILE='komposita-artikel.html',items=L6T3Revision.data.compoundArticle;let i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}${instruction('Welcher Artikel gehört zum Kompositum?')}<div class="compound-stage"><div class="compound-word">___ ${it.word}</div></div><div class="choice-grid">${L6T3.fisher(['der','die','das']).map(o=>`<button class="choice" type="button" onclick="check(this,'${o}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,value){const it=items[i];if(value===it.article){btn.classList.add('ok');fb.innerHTML=`<div class="ok">Richtig: ${it.full}</div>`;spMarkRight(FILE,items.length);setTimeout(show,650)}else{btn.classList.add('no');const tries=spMarkWrong(FILE,items.length);fb.innerHTML=tries>=3?`<div class="no">Lösung: ${it.full}</div>`:'<div class="no">Noch nicht richtig.</div>'}}
show();
</script></body></html>
