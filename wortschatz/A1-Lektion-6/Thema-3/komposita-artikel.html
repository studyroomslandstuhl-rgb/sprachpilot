<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel von Komposita</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="l6t3-upgrade.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=l6t3-upgrade1"></script><script src="app.js?v=1"></script><script src="l6t3-upgrade.js?v=1"></script><script>
header('Artikel von Komposita');const FILE='komposita-artikel.html';let items=COMPOUNDS,i=0;
function show(){if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,L6T3.nextFile(FILE));return}i=spNextIndex(FILE,items.length);const it=items[i];area.innerHTML=`${progress(FILE,items.length)}<div class="question">___ ${it.word}</div><div class="choice-grid">${L6T3.fisher(['der','die','das']).map(o=>`<button class="choice" onclick="check(this,'${o}')">${o}</button>`).join('')}</div><div class="example-box">${it.rule}</div><div id="fb" class="feedback"></div>`}
function check(btn,v){const it=items[i];if(v===it.article){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,items.length);setTimeout(show,650)}else{btn.classList.add('no');const t=spMarkWrong(FILE,items.length);fb.innerHTML=t>=3?`<div class="no">Lösung: ${it.full}</div>`:'<div class="no">Noch nicht richtig.</div>'}}
show();</script></body></html>
