<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lektion 10 · Thema 1 · Aufgabe</title>
<script>
window.SP_L10T1_TASK=String(new URLSearchParams(location.search).get('task')||'karteikarten').toLowerCase();
if(window.SP_L10T1_TASK==='karteikarten')document.documentElement.setAttribute('data-sp-card-lesson','10');
</script>
<style>
#sp-auth-pending{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#FDF1F1;color:#A86464;font:800 18px/1.4 system-ui,sans-serif;text-align:center;padding:24px;visibility:visible!important}
html[data-sp-learning-auth="ok"] #sp-auth-pending{display:none!important}
</style>
<link rel="preconnect" href="https://sprachpilot.b-cdn.net">
<link rel="dns-prefetch" href="//sprachpilot.b-cdn.net">
<link rel="stylesheet" href="/css/sp-header.css?v=theme-standard4">
<link rel="stylesheet" href="l10t1-task.css?v=20260908-cardfix9">
<link rel="stylesheet" href="l10t1-drag.css?v=20260908-2">
</head>
<body data-theme="1" data-page="task">
<div id="sp-auth-pending">SprachPilot wird geladen …</div>
<main id="app"><div class="l8-wrap"><section class="l8-card">Aufgabe wird geladen …</section></div></main>
<script type="module" src="/js/guard.js?v=l10t1-cardfix9"></script>
<script src="l10t1-data.js?v=20260908-standard2"></script>
<script src="l10t1-drag-data.js?v=20260908-1"></script>
<script src="l10t1-bunny-media.js?v=20260908-2"></script>
<script src="l10t1-translations.js?v=1"></script>
<script src="/js/sp-karteikarten-standard-v1.js?v=20260908-cardfix9"></script>
<script src="/js/sp-task-runtime-standard.js?v=20260906-scrollfix3"></script>
<script src="/js/sp-task-autoscroll.js?v=20260906-scrollfix3"></script>
<script src="/js/sp-task-random-standard.js?v=20260902-3"></script>
<script src="l10t1-task-standard.js?v=20260908-standard5"></script>
<script src="l10t1-card-app.js?v=20260908-cardfix9"></script>
<script type="module">
if(window.SP_L10T1_TASK!=='karteikarten'){
 const id=window.SP_L10T1_TASK;
 const app=document.getElementById('app');
 const fail=(error)=>{console.error('L10T1 task load failed',error);if(app)app.innerHTML='<div class="l8-wrap"><section class="l8-card"><h2>Aufgabe konnte nicht geladen werden.</h2><p>Bitte lade die Seite neu.</p><p><a class="l8-btn" href="./">Zur Themenübersicht</a></p></section></div>'};
 try{
  const gate=await import('./l10t1-run-preflight.js?v=20260908-standard4');
  if(gate.allowed){
   if(id==='hoeren-bild'||id==='hoeren-schreiben')await import('./l10t1-audio-app.js?v=20260908-2');
   else if(id==='artikel-dialoge')await import('./l10t1-article-dialog.js?v=20260908-standard2');
   else if(id==='artikel-sortieren'||id==='gesicht-koerper')await import('./l10t1-drag-app.js?v=20260908-3');
   else await import('./l10t1-app.js?v=20260908-standard2');
  }
 }catch(error){fail(error)}
}
</script>
<script>
(function(){
 const pending=document.getElementById('sp-auth-pending');
 const hidePending=()=>{if(document.documentElement.dataset.spLearningAuth==='ok'&&pending)pending.style.display='none'};
 window.addEventListener('SP_SECURE_ACCESS_CONFIRMED',hidePending);
 new MutationObserver(hidePending).observe(document.documentElement,{attributes:true,attributeFilter:['data-sp-learning-auth']});
 hidePending();
 if(window.SP_L10T1_TASK==='karteikarten')setTimeout(()=>{
  if(window.L10T1_CARD_BOOT_OK||document.querySelector('.l8-flip-card'))return;
  const app=document.getElementById('app');
  if(app)app.innerHTML='<div class="l8-wrap"><section class="l8-card"><h2>Karteikarten konnten nicht gestartet werden.</h2><p>Bitte lade die Seite neu.</p><p><a class="l8-btn" href="./">Zur Themenübersicht</a></p></section></div>';
 },3500);
 setTimeout(()=>{if(pending&&document.documentElement.dataset.spLearningAuth!=='ok')pending.textContent='Anmeldung wird geprüft …';},3500);
})();
</script>
</body>
</html>
