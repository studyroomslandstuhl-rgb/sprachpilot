window.logout=logout;

function get(obj,path){let cur=obj;for(const p of path){if(!cur||typeof cur!=="object"||!(p in cur))return undefined;cur=cur[p]}return cur}
function valTrue(data,paths){return paths.some(p=>get(data,p)===true)}
function valFalse(data,paths){return paths.some(p=>get(data,p)===false)}
function themeRelease(data,themeId){const lesson="A1-Lektion-4";const moduleOff=valFalse(data,[["enabledModules","Wortschatz"],["enabledModules","wortschatz"],["releases","Wortschatz","enabled"],["releases","wortschatz","enabled"]]);if(moduleOff)return false;const lPaths=[["enabledLessons",lesson],["enabledLessons","Wortschatz/"+lesson],["enabledLessons","wortschatz/"+lesson],["releases","Wortschatz","lessons",lesson,"enabled"],["releases","wortschatz","lessons",lesson,"enabled"]];const tPaths=[["enabledThemes",themeId],["enabledThemes",lesson+"/"+themeId],["enabledThemes","Wortschatz/"+lesson+"/"+themeId],["enabledThemes","wortschatz/"+lesson+"/"+themeId],["releases","Wortschatz","lessons",lesson,"themes",themeId,"enabled"],["releases","wortschatz","lessons",lesson,"themes",themeId,"enabled"]];if(valFalse(data,lPaths)||valFalse(data,tPaths))return false;if(valTrue(data,lPaths)||valTrue(data,tPaths))return true;const taskPrefix=[themeId+"/",lesson+"/"+themeId+"/","Wortschatz/"+lesson+"/"+themeId+"/","wortschatz/"+lesson+"/"+themeId+"/"];return Object.keys(data.enabledTasks||{}).some(k=>data.enabledTasks[k]===true&&taskPrefix.some(p=>String(k).startsWith(p)))}
