<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prüfung Thema 3</title>
<link rel="stylesheet" href="style.css?v=l4t3-color-split3">
<link rel="stylesheet" href="l4t3-color-mode.css?v=2">
<style>.score-ledger-card{margin-top:14px;padding:14px 16px;border:2px solid #ffe28a;border-radius:18px;background:#fffdf2;display:grid;gap:8px}.score-ledger-total{font-size:22px;font-weight:900;color:#9a6700}</style>
</head>
<body>
<div class="container">
<header class="topbar"></header>
<section class="card"><div id="area"></div></section>
<footer>© SprachPilot</footer>
</div>
<script src="app.js?v=l4t3-recovery3"></script>
<script src="l4t3-theme-score.js?v=1"></script>
<script src="l4t3-safe-runtime.js?v=2"></script>
<script src="l4t3-color-mode.js?v=6"></script>
<script src="l4t3-bunny-images.js?v=2"></script>
<script>
header('Farben & Adjektive');
if(!examUnlocked()){
 area.innerHTML='<div class="finish-box"><div class="question">Prüfung gesperrt</div><p>Schließe zuerst alle Aufgaben mit 100% ab.</p><div class="actions"><a class="btn secondary" href="index.html?colors='+encodeURIComponent(L4T3ColorMode.mode())+'&v=l4t3-color-split3">Zurück zum Thema</a></div></div>';
}else{startExam()}
function colorFromFile(file){const raw=String(file||'').split('?')[0].split('#')[0].split('/').pop().replace(/\.(png|jpe?g|webp|gif|svg)$/i,'');return COLORS.find(c=>c.id===raw)||null}
function examImage(file,cls='task-img'){const color=colorFromFile(file);return color?L4T3ColorMode.visual(color,cls):img(file,cls)}
function pluralItemImage(fileName){return `<div class="plural-pair" aria-label="Pluralbild">${img(fileName,'task-img')}${img(fileName,'task-img')}</div>`}
function makeExamTasks(){const colors=shuffle(L4T3ColorMode.activeColors()).slice(0,5).map(color=>({type:'color',solution:color.word,color}));const adjectives=shuffle(ADJECTIVES).slice(0,5).map(adj=>({type:'adjective',solution:adj.word,adj}));const writing=shuffle(L4T3ColorMode.activeWritingTasks()).slice(0,4).map(task=>({type:'write',solution:task.text,...task}));const contrast=shuffle(CONTRAST_TASKS).slice(0,3).map(task=>({type:'contrast',solution:task.sentence,...task}));const gefallen=shuffle(L4T3ColorMode.activeGefallenTasks()).slice(0,3).map(task=>({type:'gefallen',solution:task.answer,...task}));return shuffle([...colors,...adjectives,...writing,...contrast,...gefallen])}
function colorBody(t){return `<div class="task-instruction">Schreibe die Farbe.</div>${L4T3ColorMode.visual(t.color,'exam-color-visual')}<input id="answer" autocomplete="off" placeholder="Farbe schreiben">`}
function adjectiveBody(t){return `<div class="task-instruction">Schreibe das passende Adjektiv.</div>${img(t.adj.img,'task-img')}<input id="answer" autocomplete="off" placeholder="Adjektiv schreiben">`}
function writingBody(t){return instruction('Schreibe einen ganzen Satz zu den Bildern.')+`<div class="imgrow">${t.imgs.map(x=>examImage(x,'task-img')).join('')}</div><input id="answer" autocomplete="off" placeholder="Satz schreiben">`}
function contrastBody(t){const furniture=furnitureById(t.item);const wrong=ADJECTIVES.find(x=>simple(x.word)===simple(t.wrong));const right=ADJECTIVES.find(x=>simple(x.word)===simple(t.right));return instruction('Schreibe zwei Sätze mit „nicht“ und „sehr“.')+`<div class="imgrow three-img">${wrong?img(wrong.img,'task-img'):''}${right?img(right.img,'task-img'):''}${img(furniture.img,'task-img')}</div><input id="answer" autocomplete="off" placeholder="Zwei Sätze schreiben">`}
function gefallenBody(t){const reaction=reactionById(t.reaction);const adjective=adjById(t.adj);const itemHtml=t.plural?pluralItemImage(t.itemImg):(t.itemImg?img(t.itemImg,'task-img'):img(furnitureById(t.item).img,'task-img'));return instruction('Beantworte die Frage passend zum Smiley und Bild.')+`<div class="question exam-subquestion">${safe(t.question)}</div><div class="imgrow three-img">${itemHtml}<div class="smile-card">${reaction.emoji}</div>${img(adjective.img,'task-img')}</div><input id="answer" autocomplete="off" placeholder="Antwort schreiben">`}
function taskBody(t){if(t.type==='color')return colorBody(t);if(t.type==='adjective')return adjectiveBody(t);if(t.type==='contrast')return contrastBody(t);if(t.type==='gefallen')return gefallenBody(t);return writingBody(t)}
function isCorrect(user,task){if(task.type==='color'||task.type==='adjective')return simple(user)===simple(task.solution);return isExactSentence(user,task.solution,false)}
function reasonFor(task,user){if(!String(user||'').trim())return 'Es wurde keine Antwort geschrieben.';if(task.type==='color')return 'Die Farbe wurde nicht richtig benannt.';if(task.type==='adjective')return 'Das Adjektiv passt nicht zum Bild.';if(task.type==='contrast')return '„nicht“, „sehr“ oder die Gegenteile stimmen nicht vollständig.';if(task.type==='gefallen')return 'Antwort, Pronomen oder Adjektiv passen nicht vollständig.';return 'Artikel, Wortstellung oder Adjektiv stimmen nicht vollständig.'}
function feedbackHtml(task,user){return `<div class="exam-feedback-compact"><div><b>Richtige Lösung:</b> ${safe(task.solution)}</div><div><b>Deine Lösung:</b> ${safe(String(user||'').trim()||'–')}</div><div><b>Warum falsch:</b> ${safe(reasonFor(task,user))}</div></div>`}
function startExam(){const tasks=makeExamTasks();let pos=0,score=0,answered=false;const max=tasks.length*10;function render(){if(pos>=tasks.length)return finish();answered=false;const task=tasks[pos];area.innerHTML=`<div class="small">${pos+1} / ${tasks.length} · ${L4T3ColorMode.label()}</div><div class="progress"><div class="bar" style="width:${Math.round(pos/tasks.length*100)}%"></div></div><div class="question">Prüfungsaufgabe</div>${taskBody(task)}<div class="actions"><button id="checkBtn" class="btn" onclick="window.checkExam()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;setTimeout(()=>{const input=$('answer');if(input){input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter')window.checkExam()})}},40)}window.checkExam=function(){if(answered)return;const task=tasks[pos],input=$('answer'),user=input?input.value:'';answered=true;const button=$('checkBtn');if(button)button.disabled=true;if(isCorrect(user,task)){score+=10;fb.innerHTML='<div class="ok">Richtig!</div><div class="actions"><button class="btn green" onclick="window.nextExam()">Weiter</button></div>'}else{fb.innerHTML=feedbackHtml(task,user)+'<div class="actions"><button class="btn green" onclick="window.nextExam()">Weiter</button></div>'}};window.nextExam=function(){pos++;render()};function finish(){const percent=Math.min(100,Math.round(score/max*100));const stars=starsForPercent(percent);const result={score,maxScore:max,percent,stars,date:new Date().toISOString(),colorMode:L4T3ColorMode.mode()};const history=examHistory();history.push(result);localStorage.setItem('SP_L4_T3_EXAM_HISTORY_V2_'+L4T3ColorMode.mode(),JSON.stringify(history));syncExam(result);const ledger=L4T3ThemeScore.summary();area.innerHTML=`<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Prüfung fertig!</div><div class="big">${percent}% erreicht.</div><div>${starsHtml(stars)}</div><div class="summary-row"><div class="summary-tile">Prüfungsergebnis<br>${score}/${max}</div><div class="summary-tile">Prüfungspunkte Runde ${ledger.currentRun}<br>${ledger.runExamPoints}/${L4T3ThemeScore.examMax(ledger.currentRun)}</div><div class="summary-tile">Gesamtpunkte Thema<br>${ledger.lifetimePoints}</div></div>${L4T3ThemeScore.summaryHtml()}<div class="actions finish-actions"><button class="btn" onclick="location.reload()">Nochmal prüfen</button><a class="btn secondary" href="index.html?colors=${encodeURIComponent(L4T3ColorMode.mode())}&v=l4t3-color-split3">Zurück zum Thema</a></div></div>`}render()}
</script>
</body>
</html>
