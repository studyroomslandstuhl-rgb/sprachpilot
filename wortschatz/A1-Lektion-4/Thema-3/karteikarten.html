<!DOCTYPE html>
<html lang="de" data-sp-card-lesson="4">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Karteikarten · L4T3</title>
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/style.css?v=l6t4-bunny-audio9">
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/l6t4-revision2.css?v=l6t4-bunny-audio9">
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/l6t4-user.css?v=l6t4-bunny-audio9">
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/l6t4-compact-v2.css?v=l6t4-bunny-audio9">
<link rel="stylesheet" href="/wortschatz/A1-Lektion-6/Thema-4/l6t4-card-image-standard.css?v=20260730-card300">
<link rel="stylesheet" href="/css/sp-card-standard-colors.css?v=1">
</head>
<body>
<div class="container">
<header class="topbar"></header>
<section class="card" id="area"><p>Die Aufgabe wird geladen …</p></section>
<footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/guard.js?v=card-standard1"></script>
<script src="app.js?v=l4-card-standard1"></script>
<script src="l4t3-color-mode.js?v=7"></script>
<script src="/js/sp-card-standard.js?v=1"></script>
<script>
(function(){
const FILE='karteikarten.html';
const LANG={en:'Englisch',ru:'Russisch',uk:'Ukrainisch',ar:'Arabisch',tr:'Türkisch',ro:'Rumänisch',ja:'Japanisch',pl:'Polnisch',ku:'Kurdisch'};
function cards(){return L4T3ColorMode.activeCards()}
function visualCard(item,opts){
 if(item.type==='reaction')return `<div class="visual ${opts.small?'small-visual':''} ${opts.pure?'pure-visual':''}"><div style="font-size:${opts.small?'58px':'110px'}">${item.emoji||'🙂'}</div></div>`;
 if(item.type==='color'&&window.L4T3ColorMode)return `<div class="visual ${opts.small?'small-visual':''} ${opts.pure?'pure-visual':''}">${L4T3ColorMode.visual(item,opts.small?'small-visual':'task-img')}</div>`;
 return '';
}
SPCardStandard.mount({
 area:'#area',words:cards,nextPage:'hoeren.html',full:w=>w.word,word:w=>w.word,plural:()=>'',example:()=>'',
 translation:w=>translate(w),languageName:()=>LANG[currentMotherLang()]||'Muttersprache',
 image:w=>w.img?'../bilder/'+w.img:'',visual:visualCard,normalize:v=>simple(v),audio:w=>speak(w.word),
 state:{progress(){const list=cards(),st=loadTask(FILE,list.length);return{total:list.length,done:st.done.length,tries:st.tries||0,hadWrong:!!st.hadWrong}},current(){const list=cards();return list[nextIndex(FILE,list.length)]},wrong(){return markWrong(FILE,cards().length)},right(){markRight(FILE,cards().length)},resetCurrent(){localStorage.removeItem(taskKey(FILE))}}
});
})();
</script>
</body>
</html>
