let current=0,revealed=false,solved=false,player=null,scoreScriptLoading=false;
function motherLang(){try{const p=JSON.parse(localStorage.getItem('SP_USER_PROFILE')||'null')||{};const raw=p.motherLanguageCode||p.muttersprache||p.motherLanguage||localStorage.getItem('motherLanguage')||'en';const n=String(raw).trim().toLowerCase();const map={russisch:'ru',russian:'ru',русский:'ru',ukrainisch:'uk',ukrainian:'uk',українська:'uk',englisch:'en',english:'en',arabisch:'ar',arabic:'ar',العربية:'ar',türkisch:'tr',tuerkisch:'tr',turkish:'tr',rumänisch:'ro',rumaenisch:'ro',romanian:'ro',japanisch:'ja',japanese:'ja',polnisch:'pl',polish:'pl',kurdisch:'ku',kurdish:'ku',deutsch:'de',german:'de'};const code=map[n]||n.split(/[-_]/)[0];return['en','ru','uk','ar','tr','ro','ja','pl','ku','de'].includes(code)?code:'en'}catch(e){return'en'}}
const lang=motherLang();
function colorTranslation(id){if(BASE_TR[id])return BASE_TR[id][lang]||BASE_TR[id].en;const dark=id.startsWith('dunkel'),baseId=id.replace(/^(dunkel|hell)/,''),base=BASE_TR[baseId]||{},baseText=base[lang]||base.en||baseId;const m=(dark?{en:'dark',ru:'тёмный',uk:'темний',ar:'داكن',tr:'koyu',ro:'închis',ja:'暗い',pl:'ciemny',ku:'tarî'}:{en:'light',ru:'светлый',uk:'світлий',ar:'فاتح',tr:'açık',ro:'deschis',ja:'明るい',pl:'jasny',ku:'ronahî'})[lang]||(dark?'dark':'light');if(lang==='ar')return baseText+' '+m;if(lang==='ja')return m+baseText;return m+' '+baseText}
function translationFor(w){if(lang==='de')return w.word;if(w.type==='color')return colorTranslation(w.id);const source=w.type==='adj'?ADJ_TR:REACTION_TR;const tr=source[w.id]||{};return tr[lang]||tr.en||w.word}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function simple(v){return String(v||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[.!?]/g,'').replace(/\s+/g,' ')}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function emptyState(){return{total:cards.length,queue:shuffle([...Array(cards.length).keys()]),done:[],current:null,tries:0,hadWrong:false}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.total===cards.length&&Array.isArray(s.queue)&&Array.isArray(s.done))return s}catch(e){}return emptyState()}
function isPreview(){try{return sessionStorage.getItem('SP_TEACHER_PREVIEW')==='1'||localStorage.getItem('SP_TEACHER_PREVIEW')==='1'}catch(e){return false}}
function loadScoreAndSync(s){if(isPreview())return;if(window.L4T3ThemeScore){L4T3ThemeScore.recordTask(FILE,s);return}if(scoreScriptLoading)return;scoreScriptLoading=true;const script=document.createElement('script');script.src='l4t3-theme-score.js?v=1';script.onload=()=>{scoreScriptLoading=false;try{L4T3ThemeScore.recordTask(FILE,loadState())}catch(e){}};script.onerror=()=>{scoreScriptLoading=false};document.head.appendChild(script)}
function saveState(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}loadScoreAndSync(s)}
function nextIndex(){const s=loadState();if(s.done.length>=s.total)return null;if(s.current===null||s.current===undefined){if(!s.queue.length)s.queue=[...Array(s.total).keys()].filter(i=>!s.done.includes(i));s.current=s.queue.shift();s.tries=0;s.hadWrong=false;saveState(s)}return s.current}
function markWrong(){const s=loadState();s.tries=(s.tries||0)+1;s.hadWrong=true;saveState(s);return s.tries}
function markRight(){const s=loadState(),cur=s.current;if(cur!==null&&cur!==undefined){if(s.hadWrong||s.tries>0){if(!s.done.includes(cur)&&!s.queue.includes(cur))s.queue.push(cur)}else if(!s.done.includes(cur))s.done.push(cur)}s.current=null;s.tries=0;s.hadWrong=false;saveState(s);return s.done.length>=s.total}
function progress(){const s=loadState(),p=Math.round(s.done.length/s.total*100)||0;return `<div class="mode-box">${modeLabel} · ${cards.length} Karten</div><div class="small">${s.done.length} richtig · ${s.total-s.done.length} übrig · ${p}%</div><div class="progress"><div class="bar" style="width:${p}%"></div></div>`}

function stopAudio(){if(!player)return;try{player.pause();player.currentTime=0}catch(e){}}

function playAudio(w,slow=false){stopAudio();if(!UPLOADED.has(w.id)){browserSpeak(w.word,slow);return}try{player=player||new Audio();player.preload='none';player.src=AUDIO+encodeURIComponent(w.id)+'.mp3';player.playbackRate=slow?.75:1;player.onerror=()=>browserSpeak(w.word,slow);const p=player.play();if(p&&p.catch)p.catch(()=>browserSpeak(w.word,slow))}catch(e){browserSpeak(w.word,slow)}}
function writeBox(){const box=document.getElementById('answerBox'),input=document.getElementById('answer');box.style.display='block';input.focus()}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('micStatus');if(!SR){status.textContent='Mikrofon geht hier nicht. Bitte schreibe.';writeBox();return}const rec=new SR();rec.lang='de-DE';rec.interimResults=false;status.textContent='Ich höre zu …';rec.onresult=e=>{const text=e.results[0][0].transcript;status.textContent='Gehört: '+text;writeBox();document.getElementById('answer').value=text;check(text)};rec.onerror=()=>status.textContent='Mikrofon hat nicht funktioniert. Bitte schreibe.';rec.start()}
function reveal(asHelp=true){if(solved)return;document.getElementById('flipCard').classList.add('flipped');if(asHelp&&!revealed){revealed=true;markWrong();document.getElementById('after').innerHTML='<button class="btn" id="helpNext">Weiter</button>';document.getElementById('helpNext').onclick=()=>{markRight();render()}}}
function check(value){const w=cards[current],fb=document.getElementById('feedback');if(simple(value)===simple(w.word)){solved=true;document.getElementById('flipCard').classList.add('flipped');fb.innerHTML='<div class="ok">Richtig!</div>';markRight();document.getElementById('after').innerHTML='<button class="btn" id="nextBtn">Weiter</button>';document.getElementById('nextBtn').onclick=render}else{const tries=markWrong();fb.innerHTML=tries>=3?`<div class="no">Lösung: ${esc(w.word)}</div>`:'<div class="no">Noch nicht richtig.</div>'}}
function finish(){area.innerHTML=`<div class="finish"><div class="finish-icon">✓</div><h1>Aufgabe geschafft!</h1><p>100% erreicht · ${modeLabel} · ${cards.length} Karten.</p><div class="actions"><button class="btn" id="again">Nochmal üben</button><a class="btn green" href="hoeren.html?colors=${mode}&done=1&v=l4t3-card-filter2">Weiter</a><a class="btn secondary" href="index.html?colors=${mode}&v=l4t3-card-filter2">Zum Thema</a></div></div>`;document.getElementById('again').onclick=()=>{localStorage.removeItem(KEY);render()}}
function render(){stopAudio();if(cards.length!==EXPECTED){area.innerHTML='<div class="error-box">Falscher Kartenumfang: '+cards.length+' statt '+EXPECTED+'. Bitte neu laden.</div>';return}const idx=nextIndex();if(idx===null){finish();return}current=idx;revealed=false;solved=false;const w=cards[current];area.innerHTML=progress()+`<div class="flip-wrap"><div class="flip-card" id="flipCard" tabindex="0"><div class="face">${visual(w)}</div><div class="face back"><div class="word">${esc(w.word)}</div><div class="note">Lösung</div><button class="btn secondary" id="listenBack" type="button">🔊 Anhören</button></div></div></div><div class="hint">Übersetzung: <b>${esc(translationFor(w))}</b></div><div class="actions"><button class="btn" id="speakBtn" type="button">Sprechen</button><button class="btn secondary" id="writeBtn" type="button">Schreiben</button></div><div id="micStatus" class="mic-status"></div><div class="answer-box" id="answerBox"><input id="answer" autocomplete="off" placeholder="Antwort schreiben"><div class="actions"><button class="btn" id="checkBtn" type="button">Kontrollieren</button></div></div><div id="feedback" class="feedback"></div><div id="after" class="actions"></div>`;const card=document.getElementById('flipCard');card.onclick=()=>reveal(true);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal(true)}};document.getElementById('listenBack').onclick=e=>{e.stopPropagation();playAudio(w,false)};document.getElementById('speakBtn').onclick=startMic;document.getElementById('writeBtn').onclick=writeBox;document.getElementById('checkBtn').onclick=()=>check(document.getElementById('answer').value);document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter')check(e.target.value)}}
function isProgressKey(key){key=String(key||'');return key.startsWith('SP_L4_T3_V2_')||key.startsWith('SP_L4_T3_EXAM')||key.startsWith('SP_L4_T3_PREVIEW_')||(key.startsWith('SP_TASK_STATE_')&&/L4[_-]?T3|L4.*THEMA.?3/i.test(key))||(key.startsWith('SP_TASK_PROGRESS_')&&/L4[_-]?T3|L4.*THEMA.?3/i.test(key))}
function clearStorage(storage){const keys=[];for(let i=0;i<storage.length;i++){const key=storage.key(i);if(isProgressKey(key))keys.push(key)}keys.forEach(key=>storage.removeItem(key))}
document.getElementById('resetAllBtn').onclick=()=>{if(!confirm('Alle sichtbaren Fortschritte in L4T3 löschen? Bereits verdiente Punkte bleiben erhalten.'))return;clearStorage(localStorage);clearStorage(sessionStorage);location.href='index.html?colors='+mode+'&v=l4t3-reset2&reset='+Date.now()};
window.addEventListener('error',e=>{console.error(e.error||e.message);if(area&&!area.querySelector('.flip-card')&&!area.querySelector('.finish'))area.innerHTML='<div class="error-box"><b>Die Karteikarten konnten nicht gestartet werden.</b><div class="actions"><button class="btn" onclick="location.reload()">Neu laden</button></div></div>'});
try{render();loadScoreAndSync(loadState())}catch(e){console.error(e);area.innerHTML='<div class="error-box"><b>Die Karteikarten konnten nicht gestartet werden.</b><br>'+esc(e.message)+'<div class="actions"><button class="btn" onclick="location.reload()">Neu laden</button></div></div>'}
})();
</script>
</body>
</html>
