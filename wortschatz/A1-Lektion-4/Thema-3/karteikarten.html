<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karteikarten · A1 Lektion 4 Thema 3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#442f00}body{background:linear-gradient(180deg,#ffd536,#ffeb8a);padding:18px}.container{width:min(940px,100%);margin:auto}.topbar,.panel{background:#fff;border-radius:28px;box-shadow:0 10px 28px rgba(121,80,0,.14)}.topbar{padding:15px 18px;margin-bottom:18px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#694700;text-decoration:none}.brand strong{font-size:23px}.subtitle{font-size:14px;color:#805d18;margin-top:3px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.panel{padding:22px;min-height:420px}.btn{border:0;border-radius:14px;padding:12px 17px;background:#d49400;color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#fff4c4;color:#704b00;border:2px solid #e9bd28}.btn.green{background:#228b4d}.btn:disabled{opacity:.55}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.small{text-align:center;font-size:14px;color:#76591c}.progress{height:14px;border-radius:99px;background:#f7e8aa;overflow:hidden;margin:8px 0 16px}.bar{height:100%;background:#d79a00;transition:width .25s}.flip-wrap{width:min(390px,100%);margin:18px auto;perspective:1100px}.flip-card{position:relative;width:100%;height:330px;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer;touch-action:manipulation}.flip-card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;border:3px solid #ffe28a;border-radius:26px;background:#fff;box-shadow:0 12px 28px rgba(0,0,0,.1);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}.back{transform:rotateY(180deg);background:#fff9dd}.word{font-size:31px;font-weight:900;color:#7a5100}.note{font-size:14px;color:#746956}.visual-img{display:block;width:100%;height:250px;object-fit:contain}.visual-emoji{display:flex;align-items:center;justify-content:center;width:100%;height:250px;font-size:104px}.visual-color{width:100%;height:250px;border-radius:18px;border:2px solid #d6a900}.hint{text-align:center;padding:11px;border-radius:14px;background:#fff7d4;margin:12px auto;max-width:560px}.answer-box{max-width:590px;margin:12px auto;display:none}.answer-box input{width:100%;padding:14px;border:2px solid #e8bf39;border-radius:14px;font-size:18px}.feedback{text-align:center;min-height:38px;font-weight:800;margin-top:10px}.ok{color:#176b39}.no{color:#a22922}.audio-status,.mic-status{text-align:center;min-height:24px;font-size:14px;color:#76591c}.finish{text-align:center;padding:40px 12px}.finish-icon{font-size:66px;color:#218a4c}.footer{text-align:center;color:#fff;margin:22px 0;font-size:18px}.error-box{padding:22px;border:2px solid #e35555;background:#fff2f2;border-radius:18px;text-align:center;color:#8c1f1f}@media(max-width:600px){body{padding:10px}.panel{padding:14px;border-radius:22px}.flip-card{height:295px}.face{padding:13px}.visual-img,.visual-emoji,.visual-color{height:215px}.word{font-size:25px}.brand strong{font-size:20px}}
</style>
</head>
<body>
<div class="container">
<header class="topbar">
  <a class="brand" href="/index.html"><div><strong>🚀 SprachPilot</strong><div class="subtitle">Farben & Adjektive · A1 Lektion 4 · Thema 3</div></div><span>🏠</span></a>
  <nav class="nav"><a class="btn secondary" href="index.html">← Zurück</a><a class="btn secondary" href="uebersicht.html">Übersicht</a><a class="btn secondary" href="statistik.html">Statistik</a><button class="btn secondary" id="resetBtn" type="button">Fortschritte löschen</button></nav>
</header>
<main class="panel" id="area"><div class="small">Karteikarten werden vorbereitet …</div></main>
<div class="footer">© SprachPilot</div>
</div>
<script>
(function(){
'use strict';
const area=document.getElementById('area');
const AUDIO='https://sprachpilot.b-cdn.net/audio/';
const IMAGE='https://sprachpilot.b-cdn.net/';
const MODE_KEY='SP_L4_T3_COLOR_MODE_V1';
const BASE_IDS=['rot','blau','gruen','gelb','orange','weiss','schwarz','grau','braun','rosa','lila','tuerkis'];
const UPLOADED=new Set([...BASE_IDS,'schoen','haesslich','hell','dunkel','gross','klein','breit','schmal','teuer','billig','neu','alt','modern','altmodisch','sauber','schmutzig','bequem','unbequem','sehr-gut','gut','ganz-gut','es-geht','nicht-so-gut']);
const COLORS=[
['rot','rot','#ef4444','red'],['dunkelrot','dunkelrot','#991b1b','dark red'],['hellrot','hellrot','#fca5a5','light red'],['blau','blau','#3b82f6','blue'],['dunkelblau','dunkelblau','#1e3a8a','dark blue'],['hellblau','hellblau','#93c5fd','light blue'],['gruen','grün','#22c55e','green'],['dunkelgruen','dunkelgrün','#166534','dark green'],['hellgruen','hellgrün','#86efac','light green'],['gelb','gelb','#facc15','yellow'],['dunkelgelb','dunkelgelb','#ca8a04','dark yellow'],['hellgelb','hellgelb','#fde68a','light yellow'],['orange','orange','#fb923c','orange'],['dunkelorange','dunkelorange','#c2410c','dark orange'],['hellorange','hellorange','#fdba74','light orange'],['weiss','weiß','#ffffff','white'],['schwarz','schwarz','#111827','black'],['grau','grau','#9ca3af','gray'],['dunkelgrau','dunkelgrau','#4b5563','dark gray'],['hellgrau','hellgrau','#d1d5db','light gray'],['braun','braun','#92400e','brown'],['dunkelbraun','dunkelbraun','#451a03','dark brown'],['hellbraun','hellbraun','#b45309','light brown'],['rosa','rosa','#f9a8d4','pink'],['dunkelrosa','dunkelrosa','#be185d','dark pink'],['hellrosa','hellrosa','#fbcfe8','light pink'],['lila','lila','#a855f7','purple'],['dunkellila','dunkellila','#6b21a8','dark purple'],['helllila','helllila','#d8b4fe','light purple'],['tuerkis','türkis','#14b8a6','turquoise'],['dunkeltuerkis','dunkeltürkis','#0f766e','dark turquoise'],['helltuerkis','helltürkis','#5eead4','light turquoise']
].map(x=>({id:x[0],word:x[1],hex:x[2],translation:x[3],type:'color'}));
const ADJECTIVES=[
['schoen','schön','beautiful'],['haesslich','hässlich','ugly'],['hell','hell','bright'],['dunkel','dunkel','dark'],['gross','groß','big'],['klein','klein','small'],['breit','breit','wide'],['schmal','schmal','narrow'],['teuer','teuer','expensive'],['billig','billig','cheap'],['neu','neu','new'],['alt','alt','old'],['modern','modern','modern'],['altmodisch','altmodisch','old-fashioned'],['sauber','sauber','clean'],['schmutzig','schmutzig','dirty'],['bequem','bequem','comfortable'],['unbequem','unbequem','uncomfortable']
].map(x=>({id:x[0],word:x[1],translation:x[2],type:'adj'}));
const REACTIONS=[
['sehr-gut','Sehr gut.','🤩'],['gut','Gut.','🙂'],['ganz-gut','Ganz gut.','🙂'],['es-geht','Es geht.','😐'],['nicht-so-gut','Nicht so gut.','🙁']
].map(x=>({id:x[0],word:x[1],translation:x[1],emoji:x[2],type:'reaction'}));
const mode=localStorage.getItem(MODE_KEY)==='advanced'?'advanced':'basis';
const cards=[...(mode==='advanced'?COLORS:COLORS.filter(x=>BASE_IDS.includes(x.id))),...ADJECTIVES,...REACTIONS];
const FILE='karteikarten.html';
const KEY='SP_L4_T3_V2_'+FILE+'_'+mode;
let current=0,revealed=false,solved=false,player=null;
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function simple(v){return String(v||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[.!?]/g,'').replace(/\s+/g,' ')}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function emptyState(){return{total:cards.length,queue:shuffle([...Array(cards.length).keys()]),done:[],current:null,tries:0,hadWrong:false}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.total===cards.length&&Array.isArray(s.queue)&&Array.isArray(s.done))return s}catch(e){}return emptyState()}
function saveState(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}syncProgress(s)}
function syncProgress(s){try{if(sessionStorage.getItem('SP_TEACHER_PREVIEW')==='1')return;const payload={module:'wortschatz',moduleTitle:'Wortschatz',level:'A1',lesson:'4',theme:'3',title:'A1 Lektion 4 · Thema 3',key:'SP_L4_T3_V2',file:FILE,taskKey:FILE,taskTitle:'Karteikarten',total:s.total,done:s.done.length,percent:Math.round(s.done.length/s.total*100)||0,completed:s.done.length>=s.total};if(window.SPProgress&&SPProgress.recordTaskProgress)SPProgress.recordTaskProgress(payload)}catch(e){}}
function nextIndex(){const s=loadState();if(s.done.length>=s.total)return null;if(s.current===null||s.current===undefined){if(!s.queue.length)s.queue=[...Array(s.total).keys()].filter(i=>!s.done.includes(i));s.current=s.queue.shift();s.tries=0;s.hadWrong=false;saveState(s)}return s.current}
function markWrong(){const s=loadState();s.tries=(s.tries||0)+1;s.hadWrong=true;saveState(s);return s.tries}
function markRight(){const s=loadState(),cur=s.current;if(cur!==null&&cur!==undefined){if(s.hadWrong||s.tries>0){if(!s.done.includes(cur)&&!s.queue.includes(cur))s.queue.push(cur)}else if(!s.done.includes(cur))s.done.push(cur)}s.current=null;s.tries=0;s.hadWrong=false;saveState(s);return s.done.length>=s.total}
function progress(){const s=loadState(),p=Math.round(s.done.length/s.total*100)||0;return `<div class="small">${s.done.length} richtig · ${s.total-s.done.length} übrig · ${p}% · ${mode==='advanced'?'Farben Fortgeschritten':'Farben Basis'}</div><div class="progress"><div class="bar" style="width:${p}%"></div></div>`}
function visual(w){if(w.type==='color')return `<div class="visual-color" style="background:${w.hex};${w.id==='weiss'?'border-color:#94a3b8':''}"></div>`;if(w.type==='reaction')return `<div class="visual-emoji">${w.emoji}</div>`;return `<img class="visual-img" src="${IMAGE+encodeURIComponent(w.id)+'.webp'}" alt="" loading="eager" onerror="this.outerHTML='<div class=&quot;visual-emoji&quot;>🖼️</div>'">`}
function stopAudio(){if(!player)return;try{player.pause();player.currentTime=0}catch(e){}}
function browserSpeak(text,slow){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=slow ? 0.65 : 0.92;speechSynthesis.speak(u)}catch(e){}}
function playAudio(w,slow=false){stopAudio();const status=document.getElementById('audioStatus');if(status)status.textContent='';if(!UPLOADED.has(w.id)){browserSpeak(w.word,slow);return}try{player=player||new Audio();player.preload='none';player.src=AUDIO+encodeURIComponent(w.id)+'.mp3';player.playbackRate=slow ? 0.75 : 1;player.onerror=()=>browserSpeak(w.word,slow);const p=player.play();if(p&&p.catch)p.catch(()=>browserSpeak(w.word,slow))}catch(e){browserSpeak(w.word,slow)}}
function writeBox(){const box=document.getElementById('answerBox'),input=document.getElementById('answer');box.style.display='block';input.focus()}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('micStatus');if(!SR){status.textContent='Mikrofon geht hier nicht. Bitte schreibe.';writeBox();return}const rec=new SR();rec.lang='de-DE';rec.interimResults=false;status.textContent='Ich höre zu …';rec.onresult=e=>{const text=e.results[0][0].transcript;status.textContent='Gehört: '+text;writeBox();document.getElementById('answer').value=text;check(text)};rec.onerror=()=>status.textContent='Mikrofon hat nicht funktioniert. Bitte schreibe.';rec.start()}
function reveal(asHelp=true){if(solved)return;document.getElementById('flipCard').classList.add('flipped');if(asHelp&&!revealed){revealed=true;markWrong();document.getElementById('after').innerHTML='<button class="btn" id="helpNext">Weiter</button>';document.getElementById('helpNext').onclick=()=>{markRight();render()}}}
function check(value){const w=cards[current],fb=document.getElementById('feedback');if(simple(value)===simple(w.word)){solved=true;document.getElementById('flipCard').classList.add('flipped');fb.innerHTML='<div class="ok">Richtig!</div>';markRight();document.getElementById('after').innerHTML='<button class="btn" id="nextBtn">Weiter</button>';document.getElementById('nextBtn').onclick=render}else{const tries=markWrong();fb.innerHTML=tries>=3?`<div class="no">Lösung: ${esc(w.word)}</div>`:'<div class="no">Noch nicht richtig.</div>'}}
function finish(){area.innerHTML='<div class="finish"><div class="finish-icon">✓</div><h1>Aufgabe geschafft!</h1><p>100% erreicht.</p><div class="actions"><button class="btn" id="again">Nochmal üben</button><a class="btn green" href="hoeren.html?done=1">Weiter</a><a class="btn secondary" href="index.html">Zum Thema</a></div></div>';document.getElementById('again').onclick=()=>{localStorage.removeItem(KEY);render()}}
function render(){stopAudio();const idx=nextIndex();if(idx===null){finish();return}current=idx;revealed=false;solved=false;const w=cards[current];area.innerHTML=progress()+`<div class="flip-wrap"><div class="flip-card" id="flipCard" tabindex="0"><div class="face">${visual(w)}</div><div class="face back"><div class="word">${esc(w.word)}</div><div class="note">Lösung</div><button class="btn secondary" id="listenBack" type="button">🔊 Anhören</button></div></div></div><div class="hint">Übersetzung: <b>${esc(w.translation)}</b></div><div class="actions"><button class="btn" id="speakBtn" type="button">Sprechen</button><button class="btn secondary" id="writeBtn" type="button">Schreiben</button></div><div id="audioStatus" class="audio-status"></div><div id="micStatus" class="mic-status"></div><div class="answer-box" id="answerBox"><input id="answer" autocomplete="off" placeholder="Antwort schreiben"><div class="actions"><button class="btn" id="checkBtn" type="button">Kontrollieren</button></div></div><div id="feedback" class="feedback"></div><div id="after" class="actions"></div>`;const card=document.getElementById('flipCard');card.onclick=()=>reveal(true);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal(true)}};document.getElementById('listenBack').onclick=e=>{e.stopPropagation();playAudio(w,false)};document.getElementById('speakBtn').onclick=startMic;document.getElementById('writeBtn').onclick=writeBox;document.getElementById('checkBtn').onclick=()=>check(document.getElementById('answer').value);document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter')check(e.target.value)}}
document.getElementById('resetBtn').onclick=()=>{if(confirm('Möchten Sie die Karteikarten-Fortschritte löschen?')){localStorage.removeItem(KEY);render()}};
window.addEventListener('error',e=>{console.error(e.error||e.message);if(area&&!area.querySelector('.flip-card')&&!area.querySelector('.finish'))area.innerHTML='<div class="error-box"><b>Die Karteikarten konnten nicht gestartet werden.</b><br>Bitte tippe auf Neu laden.<div class="actions"><button class="btn" onclick="location.reload()">Neu laden</button><a class="btn secondary" href="index.html">Zum Thema</a></div></div>'});
setTimeout(()=>{try{import('/js/progress.js?v=l4t3-cards-standalone').then(()=>syncProgress(loadState())).catch(()=>{})}catch(e){}},0);
try{render()}catch(e){console.error(e);area.innerHTML='<div class="error-box"><b>Die Karteikarten konnten nicht gestartet werden.</b><br>'+esc(e.message)+'<div class="actions"><button class="btn" onclick="location.reload()">Neu laden</button><a class="btn secondary" href="index.html">Zum Thema</a></div></div>'}
})();
</script>
</body>
</html>
