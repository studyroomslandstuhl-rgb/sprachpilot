<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gegenteile-Memory Thema 3</title><link rel="stylesheet" href="style.css?v=l4t3-memory-fix1"></head><body><div class="container"><header class="topbar"></header><section class="card"><div id="area"></div></section><footer>© SprachPilot</footer></div><script src="app.js?v=l4t3-memory-fix1"></script><script src="l4t3-safe-runtime.js?v=1"></script><script src="l4t3-audio.js?v=3"></script><script>
header('Farben & Adjektive');
const file='memory.html';
const MEMORY_VERSION=2;
const base=PAIRS.map(([a,b])=>({a:adjById(a).word,b:adjById(b).word,id:a+'-'+b}));
const allCards=base.flatMap(p=>[
 {id:p.id+':a',pair:p.id,word:p.a},
 {id:p.id+':b',pair:p.id,word:p.b}
]);
const cardById=new Map(allCards.map(card=>[card.id,card]));
const allCardIds=allCards.map(card=>card.id);
const total=allCards.length;
let cards=[];
let openCards=[];
let done=new Set();

function validOrder(order){
 if(!Array.isArray(order)||order.length!==total)return false;
 const unique=new Set(order);
 return unique.size===total&&allCardIds.every(id=>unique.has(id));
}
function loadMemory(){
 let st=loadTask(file,total);
 const oldDone=Array.isArray(st.done)?st.done:[];
 const wasComplete=oldDone.length>=total;
 if(st.memoryVersion!==MEMORY_VERSION||!validOrder(st.memoryOrder)){
  st.memoryVersion=MEMORY_VERSION;
  st.memoryOrder=shuffle(allCardIds);
  st.done=wasComplete?[...allCardIds]:[];
  st.queue=[];
  st.current=null;
  st.tries=0;
  st.hadWrong=false;
  saveTask(file,st);
 }
 cards=st.memoryOrder.map(id=>cardById.get(id)).filter(Boolean);
 done=new Set((Array.isArray(st.done)?st.done:[]).filter(id=>cardById.has(id)));
}
function saveMemory(){
 let st=loadTask(file,total);
 st.memoryVersion=MEMORY_VERSION;
 st.memoryOrder=cards.map(card=>card.id);
 st.done=[...done];
 st.queue=[];
 st.current=null;
 saveTask(file,st);
}
function visible(i){const card=cards[i];return !!card&&(done.has(card.id)||openCards.includes(i))}
function render(){
 loadMemory();
 if(done.size>=total)return complete(area,file,'gegenteile.html');
 area.innerHTML=progressHtml(file,total)+`<div class="question">Finde die Gegenteile.</div><div class="hint">Drehe zwei Karten um. Nur passende Paare bleiben offen.</div><div class="memory-grid word-memory">${cards.map((c,i)=>`<button class="memory-card ${done.has(c.id)?'done':''} ${openCards.includes(i)?'selected':''}" onclick="pick(${i})">${visible(i)?safe(c.word):'?'}</button>`).join('')}</div>`;
}
function currentTwoMatch(){if(openCards.length!==2)return true;return cards[openCards[0]].pair===cards[openCards[1]].pair}
function pick(i){
 const card=cards[i];
 if(!card||done.has(card.id)||openCards.includes(i))return;
 if(openCards.length===2){
  if(!currentTwoMatch())markWrong(file,total);
  openCards=[];
 }
 openCards.push(i);
 render();
 if(openCards.length===2){
  const[a,b]=openCards;
  if(cards[a].pair===cards[b].pair){
   done.add(cards[a].id);
   done.add(cards[b].id);
   saveMemory();
   openCards=[];
   setTimeout(render,250);
  }
 }
}
maybeStart(render,'memory.html');
</script></body></html>
