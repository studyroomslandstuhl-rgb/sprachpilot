<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SprachPilot Thema 3</title><link rel="stylesheet" href="style.css?v=l4t3-score-repair2"><link rel="stylesheet" href="l4t3-color-mode.css?v=2"><style>.score-ledger-card{margin-top:14px;padding:14px 16px;border:2px solid #ffe28a;border-radius:18px;background:#fffdf2;display:grid;gap:8px}.score-ledger-total{font-size:22px;font-weight:900;color:#9a6700}.reset-ok{margin:12px 0;padding:12px;border-radius:14px;background:#e9fff2;color:#176b39;font-weight:800;text-align:center}</style></head><body><div class="container"><header class="topbar"></header><div id="resetMessage"></div><div id="colorModeMount"></div><section class="card progress-card"><div class="circle" id="circle">0%</div><div class="progress-main"><h2>Dein Fortschritt</h2><div class="small" id="countText"></div><div class="progress"><div class="bar" id="mainBar"></div></div><p class="small">Ziel: Farben, Adjektive, Gegenteile und Gefallen üben.</p><div id="examSummary"></div><div id="scoreSummary"></div></div></section><section class="grid" id="tasksGrid"></section><footer>© SprachPilot</footer></div><script src="app.js?v=l4t3-recovery3"></script><script src="l4t3-theme-score.js?v=2"></script><script src="l4t3-reset.js?v=1"></script><script src="l4t3-safe-runtime.js?v=4"></script><script src="l4t3-color-mode.js?v=7"></script><script>
if(window.L4T3ThemeScore)L4T3ThemeScore.reconcile();header('Farben & Adjektive',true);colorModeMount.innerHTML=L4T3ColorMode.selectorHtml();
const resetButton=document.querySelector('.danger-btn');if(resetButton)resetButton.onclick=()=>L4T3Reset.resetAll();
const params=new URLSearchParams(location.search);if(params.has('reset'))resetMessage.innerHTML='<div class="reset-ok">Alle sichtbaren L4T3-Fortschritte wurden gelöscht.</div>';
const VERSION='l4t3-exam-visual2';
const cardCount=L4T3ColorMode.mode()==='basis'?35:55;
const TASK_INFO=[
 ['karteikarten.html','Karteikarten','🃏',cardCount+' Karten · '+L4T3ColorMode.label()+'.'],
 ['hoeren.html','Hören','🎧','Höre nur die Farben der gewählten Farbstufe.'],
 ['farben.html','Farben','🎨','Höre und wähle das passende Farbbild.'],
 ['memory.html','Gegenteile-Memory','🧠','Finde Gegenteile.'],
 ['gegenteile.html','Gegenteile','↔️','Schreibe mit drei Bildhinweisen.'],
 ['kein.html','nicht / kein','🚫','Wähle das Wort.'],
 ['reaktionen.html','Reaktionen','🙂','Wähle den Smiley.'],
 ['gefallen.html','Gefallen','💬','Nutze nur passende Farben der gewählten Stufe.'],
 ['saetze-bauen.html','Sätze bauen','🧩','Wähle ist oder sind.'],
 ['schreiben.html','Schreiben','✍️','Schreibe den Satz.']
];
if(L4T3ColorMode.mode()==='basis')TASK_INFO.splice(8,0,['farben-kombinieren.html','Farben kombinieren','☀️🌙','Sprechen getrennt oder zusammen; Schreiben als ein Wort.']);
function fresh(file){return file+'?colors='+encodeURIComponent(L4T3ColorMode.mode())+'&v='+VERSION}
function drawScore(){scoreSummary.innerHTML=window.L4T3ThemeScore?L4T3ThemeScore.summaryHtml():''}
function draw(){const total=TASK_INFO.length,done=taskDoneCount(),p=Math.round(done/total*100)||0;circle.textContent=p+'%';countText.textContent=done+' / '+total+' Aufgaben abgeschlossen · '+L4T3ColorMode.label();mainBar.style.width=p+'%';const best=bestExamResult();examSummary.innerHTML=best?'<div class="exam-done-box exam-summary-wide"><div class="exam-summary-title"><span class="exam-check">✓</span><span>Thema abgeschlossen!</span></div><div class="exam-summary-grid"><div class="exam-summary-item"><span>Prüfung</span><strong>'+best.percent+'% '+starsHtml(starsForPercent(best.percent))+'</strong></div><div class="exam-summary-item"><span>Punkte</span><strong>'+best.score+'/'+best.maxScore+'</strong></div><div class="exam-summary-item"><span>Versuche</span><strong>'+examHistory().length+'</strong></div></div></div>':'';drawScore();tasksGrid.innerHTML=TASK_INFO.map(function(t,index){const file=t[0],pp=pct(file,getTotal(file));return '<a class="module" href="'+fresh(file)+'"><div class="num">'+(index+1)+'. '+t[1]+'</div><div class="icon">'+t[2]+'</div><p>'+t[3]+'</p><div class="progress"><div class="bar" style="width:'+pp+'%"></div></div><div class="small">'+pp+'%</div><div class="start">'+(pp>=100?'Fertig':'Starten')+'</div></a>'}).join('')+examTile(TASK_INFO.length+1)}
function examTile(number){const open=examUnlocked(),best=bestExamResult(),p=best?best.percent:0;if(!open)return '<div class="module exam-locked"><div class="num">'+number+'. Prüfung</div><div class="icon exam-icon">⭐</div><p>Prüfung wird erst freigeschaltet, wenn alle Aufgaben 100% erreicht haben.</p><div class="progress"><div class="bar" style="width:0%"></div></div><div class="small">Prüfung gesperrt</div><div class="start">Prüfung gesperrt</div></div>';return '<a class="module" href="'+fresh('pruefung.html')+'"><div class="num">'+number+'. Prüfung</div><div class="icon exam-icon">⭐</div><p>Teste dein Wissen · '+L4T3ColorMode.label()+'. Alle '+L4T3ColorMode.activeColors().length+' aktiven Farben kommen vor.</p><div class="progress"><div class="bar" style="width:'+p+'%"></div></div><div class="small">'+(best?best.percent+'%':'offen')+'</div><div class="start">Starten</div></a>'}
window.addEventListener('l4t3-score-change',drawScore);draw();
</script></body></html>
