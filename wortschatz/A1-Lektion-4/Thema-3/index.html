<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SprachPilot Thema 3</title><link rel="stylesheet" href="style.css?v=320"></head><body><div class="container"><header class="topbar"></header><section class="card progress-card"><div class="circle" id="circle">0%</div><div class="progress-main"><h2>Dein Fortschritt</h2><div class="small" id="countText"></div><div class="progress"><div class="bar" id="mainBar"></div></div><p class="small">Ziel: Farben, Adjektive, Gegenteile und Gefallen üben.</p><div id="examSummary"></div></div></section><section class="grid" id="tasksGrid"></section><footer>© SprachPilot</footer></div><script src="app.js?v=319"></script><script>header('Farben & Adjektive', true);const TASK_INFO=[['karteikarten.html','1. Karteikarten','🃏','Lerne die Wörter.'],['hoeren.html','2. Hören','🎧','Wähle Farbe und Bild.'],['farben.html','3. Farben','🎨','Wähle die Farbe.'],['memory.html','4. Gegenteile-Memory','🧠','Finde Gegenteile.'],['gegenteile.html','5. Gegenteile','↔️','Beschreibe mit nicht/sehr.'],['kein.html','6. nicht / kein','🚫','Wähle das Wort.'],['reaktionen.html','7. Reaktionen','🙂','Wähle den Smiley.'],['gefallen.html','8. Gefallen','💬','Sprich oder schreibe.'],['saetze-bauen.html','9. Sätze bauen','🧩','Wähle ist oder sind.'],['schreiben.html','10. Schreiben','✍️','Schreibe den Satz.']];function draw(){let done=taskDoneCount(),total=TASK_FILES.length,p=Math.round(done/total*100)||0;circle.textContent=p+'%';countText.textContent=done+' / '+total+' Aufgaben abgeschlossen';mainBar.style.width=p+'%';let best=bestExamResult();examSummary.innerHTML=best?'<div class="exam-done-box exam-summary-wide"><div class="exam-summary-title"><span class="exam-check">✓</span><span>Thema abgeschlossen!</span></div><div class="exam-summary-grid"><div class="exam-summary-item"><span>Prüfung</span><strong>'+best.percent+'% '+starsHtml(starsForPercent(best.percent))+'</strong></div><div class="exam-summary-item"><span>Punkte</span><strong>'+best.score+'/'+best.maxScore+'</strong></div><div class="exam-summary-item"><span>Versuche</span><strong>'+examHistory().length+'</strong></div></div></div>':'';tasksGrid.innerHTML=TASK_INFO.map(function(t){let file=t[0],title=t[1],icon=t[2],sub=t[3],pp=pct(file,getTotal(file));return '<a class="module" href="'+file+'"><div class="num">'+title+'</div><div class="icon">'+icon+'</div><p>'+sub+'</p><div class="progress"><div class="bar" style="width:'+pp+'%"></div></div><div class="small">'+pp+'%</div><div class="start">Starten</div></a>'}).join('')+examTile()}function examTile(){let open=examUnlocked(),best=bestExamResult(),p=best?best.percent:0;if(!open)return '<div class="module exam-locked"><div class="num">11. Prüfung</div><div class="icon exam-icon">⭐</div><p>Prüfung wird erst freigeschaltet, wenn alle anderen Aufgaben 100% erreicht haben.</p><div class="progress"><div class="bar" style="width:0%"></div></div><div class="small">Prüfung gesperrt</div><div class="start">Prüfung gesperrt</div></div>';return '<a class="module" href="pruefung.html"><div class="num">11. Prüfung</div><div class="icon exam-icon">⭐</div><p>Teste dein Wissen.</p><div class="progress"><div class="bar" style="width:'+p+'%"></div></div><div class="small">'+(best?best.percent+'%':'offen')+'</div><div class="start">Starten</div></a>'}draw();</script></body></html>
