<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farben kombinieren</title><link rel="stylesheet" href="style.css?v=l4t3-basis-combine1"><link rel="stylesheet" href="l4t3-color-mode.css?v=2"><style>.combine-row{display:grid;grid-template-columns:minmax(150px,230px) 54px minmax(180px,290px);gap:18px;align-items:center;justify-content:center;margin:24px auto;max-width:760px}.combine-modifier{width:100%;height:200px;object-fit:contain;border:2px solid #ffe28a;border-radius:20px;background:#fff}.combine-plus{font-size:48px;font-weight:900;color:#c98a00;text-align:center}.combine-base{width:100%;height:200px;margin:0}.combine-actions{justify-content:center}.combine-answer-box{max-width:620px;margin:14px auto 0}.combine-answer-box .btn{margin-top:10px}@media(max-width:700px){.combine-row{grid-template-columns:1fr;gap:10px}.combine-plus{font-size:36px}.combine-modifier,.combine-base{height:170px;max-width:300px;margin:0 auto}}</style></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script src="app.js?v=l4t3-recovery3"></script><script src="l4t3-safe-runtime.js?v=1"></script><script src="l4t3-color-mode.js?v=7"></script><script src="l4t3-bunny-images.js?v=2"></script><script>
const area=document.getElementById('area');header('Farben kombinieren');const FILE='farben-kombinieren.html';let items=[],i=0,solved=false;
function render(){if(L4T3ColorMode.mode()!=='basis'){area.innerHTML='<div class="question">Nur für Farben Basis</div><p class="small" style="text-align:center">Diese Aufgabe erscheint nur, wenn im Themenmenü „Farben Basis“ gewählt ist.</p><div class="actions"><a class="btn secondary" href="index.html?v=l4t3-combine-speech1">Zum Themenmenü</a></div>';return}items=L4T3ColorMode.activeCombinationTasks();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'saetze-bauen.html');return}i=nextIndex(FILE,items.length);solved=false;const task=items[i];if(!task){area.innerHTML='<div class="no">Die Aufgabe konnte nicht geladen werden.</div>';return}area.innerHTML=`${progressHtml(FILE,items.length)}<div class="small" style="text-align:center">Farben Basis</div>${instruction('Verbinde die beiden Bilder. Beim Sprechen darfst du zum Beispiel „hell orange“ oder „hellorange“ sagen. Beim Schreiben schreibst du die Farbe zusammen: „hellorange“.')}<div class="combine-row"><div>${img(task.modifierItem.img,'combine-modifier')}</div><div class="combine-plus">+</div>${L4T3ColorMode.visual(task.base,'combine-base')}</div><div class="actions combine-actions"><button id="micBtn" type="button" class="btn mic-btn">Sprechen</button><button id="writeBtn" type="button" class="btn secondary">Schreiben</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="combine-answer-box" style="display:none"><input id="ans" autocomplete="off" placeholder="Neue Farbe zusammenschreiben"><button id="checkBtn" type="button" class="btn">Kontrollieren</button></div><div id="fb" class="feedback"></div><div id="after" class="actions combine-actions"></div>`;document.getElementById('micBtn').addEventListener('click',speakAnswer);document.getElementById('writeBtn').addEventListener('click',writeBox);document.getElementById('checkBtn').addEventListener('click',()=>check(document.getElementById('ans').value,false));document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check(e.target.value,false)})}
function writeBox(){const box=document.getElementById('box'),ans=document.getElementById('ans');if(box)box.style.display='block';if(ans)ans.focus()}
function speakAnswer(){startMic(document.getElementById('micBtn'),value=>{writeBox();const ans=document.getElementById('ans');ans.value=value;check(value,true)})}
function normalizedSpokenColor(value){return simple(value).replace(/\s+/g,'')}
function check(value,fromSpeech=false){if(solved)return;const task=items[i],feedback=document.getElementById('fb');const correct=fromSpeech?normalizedSpokenColor(value)===normalizedSpokenColor(task.answer):simple(value)===simple(task.answer);if(correct){solved=true;feedback.innerHTML=`<div class="ok">Richtig: ${safe(task.answer)}</div>`;markRight(FILE,items.length);document.getElementById('after').innerHTML='<button type="button" class="btn" id="nextBtn">Weiter</button>';document.getElementById('nextBtn').addEventListener('click',render);return}const tries=markWrong(FILE,items.length,task.answer);const hint=fromSpeech?'Du kannst die Wörter getrennt oder zusammen sprechen.':'Schreibe hell/dunkel und die Farbe als ein Wort zusammen.';feedback.innerHTML=tries>=3?`<div class="no">Lösung: ${safe(task.answer)}</div>`:`<div class="no">Noch nicht richtig.${tries===2?' '+hint:''}</div>`}
maybeStart(render,FILE);
</script></body></html>
