<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farben kombinieren</title><link rel="stylesheet" href="style.css?v=324"><link rel="stylesheet" href="l4t3-color-mode.css?v=1"><style>.combine-row{display:grid;grid-template-columns:minmax(140px,220px) 54px minmax(180px,280px);gap:18px;align-items:center;justify-content:center;margin:22px auto;max-width:720px}.combine-modifier{width:100%;height:190px;object-fit:contain;border:2px solid #ffe28a;border-radius:20px;background:#fff}.combine-plus{font-size:48px;font-weight:900;color:#c98a00;text-align:center}.combine-base{width:100%;height:190px;margin:0}.combine-actions{justify-content:center}.combine-answer-box{max-width:620px;margin:14px auto 0}.combine-answer-box .btn{margin-top:10px}.combine-result{font-size:30px;font-weight:900;color:#6b4700;margin-top:12px}.component-audio-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;margin:0 auto 14px}.component-audio-box{text-align:center;padding:10px;border:1px solid #ffe28a;border-radius:16px;background:#fff9dd}@media(max-width:700px){.combine-row,.component-audio-grid{grid-template-columns:1fr;gap:10px}.combine-plus{font-size:36px}.combine-modifier,.combine-base{height:170px;max-width:300px;margin:0 auto}}</style></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script src="/js/sp-progress-guard.js?v=points-safe"></script><script src="app.js?v=319"></script><script src="l4t3-color-mode.js?v=2"></script><script src="l4t3-bunny-images.js?v=1"></script><script src="l4t3-audio.js?v=2"></script><script>
const area=document.getElementById('area');header('Farben kombinieren');const FILE='farben-kombinieren.html';let items=[],i=0,solved=false;function render(){L4T3Audio.stop();if(L4T3ColorMode.mode()!=='advanced'){area.innerHTML='<div class="question">Nur für Farben Fortgeschritten</div><p class="small" style="text-align:center">Wechsle im Themenmenü zu „Farben Fortgeschritten“.</p><div class="actions"><a class="btn secondary" href="index.html">Zum Themenmenü</a></div>';return}items=L4T3ColorMode.activeCombinationTasks();if(loadTask(FILE,items.length).done.length>=items.length){complete(area,FILE,'memory.html');return}i=nextIndex(FILE,items.length);solved=false;const task=items[i];if(!task){area.innerHTML='<div class="no">Die Aufgabe konnte nicht geladen werden.</div>';return}area.innerHTML=`${progressHtml(FILE,items.length)}<div class="small" style="text-align:center">Farben Fortgeschritten</div><div class="question">Bilde die neue Farbe.</div><div class="combine-row"><div>${img(task.modifierItem.img,'combine-modifier')}</div><div class="combine-plus">+</div>${L4T3ColorMode.visual(task.base,'combine-base')}</div><div class="component-audio-grid"><div class="component-audio-box"><b>${safe(task.modifierItem.word)}</b>${L4T3Audio.buttons(task.modifierItem,'audioStatusModifier')}<div id="audioStatusModifier" class="audio-status"></div></div><div class="component-audio-box"><b>${safe(task.base.word)}</b>${L4T3Audio.buttons(task.base,'audioStatusBase')}<div id="audioStatusBase" class="audio-status"></div></div></div><div class="actions combine-actions"><button id="micBtn" type="button" class="btn mic-btn">Sprechen</button><button id="writeBtn" type="button" class="btn secondary">Schreiben</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="combine-answer-box" style="display:none"><input id="ans" autocomplete="off" placeholder="Neue Farbe schreiben"><button id="checkBtn" type="button" class="btn">Kontrollieren</button></div><div id="fb" class="feedback"></div><div id="audioStatus" class="audio-status"></div><div id="after" class="actions combine-actions"></div>`;document.getElementById('micBtn').addEventListener('click',speakAnswer);document.getElementById('writeBtn').addEventListener('click',writeBox);document.getElementById('checkBtn').addEventListener('click',()=>check(document.getElementById('ans').value));document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check(e.target.value)})}function writeBox(){const box=document.getElementById('box'),ans=document.getElementById('ans');if(box)box.style.display='block';if(ans)ans.focus()}function speakAnswer(){startMic(document.getElementById('micBtn'),value=>{writeBox();const ans=document.getElementById('ans');ans.value=value;check(value)})}function check(value){if(solved)return;const task=items[i],feedback=document.getElementById('fb');if(simple(value)===simple(task.answer)){solved=true;feedback.innerHTML=`<div class="ok">Richtig: ${safe(task.answer)}</div>`;markRight(FILE,items.length);document.getElementById('after').innerHTML='<button type="button" class="btn secondary" id="listenBtn">🔊 Neue Farbe anhören</button><button type="button" class="btn" id="nextBtn">Weiter</button>';document.getElementById('listenBtn').addEventListener('click',()=>L4T3Audio.playItem(task.result,false,'audioStatus'));document.getElementById('nextBtn').addEventListener('click',render);return}const tries=markWrong(FILE,items.length,task.answer);feedback.innerHTML=tries>=3?`<div class="no">Lösung: ${safe(task.answer)}</div>`:'<div class="no">Noch nicht richtig.</div>'}maybeStart(render,FILE);
</script></body></html>
