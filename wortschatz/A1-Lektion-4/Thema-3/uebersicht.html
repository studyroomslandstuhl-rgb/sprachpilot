<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Übersicht Thema 3</title><link rel="stylesheet" href="style.css?v=321"><link rel="stylesheet" href="l4t3-color-mode.css?v=1"></head><body><div class="container"><header class="topbar"></header><section class="card"><h2>Übersicht – Thema 3</h2><p class="small">Farben, Adjektive und Reaktionen · <span id="modeLabel"></span></p></section><section id="overview"></section><footer>© SprachPilot</footer></div><script src="/js/sp-progress-guard.js?v=points-safe"></script><script src="app.js?v=319"></script><script src="l4t3-color-mode.js?v=1"></script><script src="l4t3-bunny-images.js?v=1"></script><script>
header('Farben & Adjektive');
modeLabel.textContent=L4T3ColorMode.label();
function cardWord(x){let content=x.type==='color'?L4T3ColorMode.visual(x,'task-img'):img(x.img||x.id+'.png','task-img');return `<div class="module"><div>${content}</div><h3>${safe(x.full||x.word)}</h3><p>${safe(translate(x))}</p></div>`}
const colors=L4T3ColorMode.activeColors();
overview.innerHTML=`<section class="card"><h2>Farben <span class="small">${colors.length}</span></h2><div class="grid">${colors.map(x=>cardWord({...x,type:'color'})).join('')}</div></section><section class="card"><h2>Adjektive <span class="small">${ADJECTIVES.length}</span></h2><div class="grid">${ADJECTIVES.map(x=>cardWord({...x,type:'adj'})).join('')}</div></section><section class="card"><h2>Reaktionen <span class="small">${REACTIONS.length}</span></h2><div class="grid">${REACTIONS.map(x=>`<div class="module"><div class="smile-card" style="margin:0 auto 12px">${x.emoji}</div><h3>${x.word}</h3></div>`).join('')}</div></section>`;
</script></body></html>
