<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gefallen Thema 3</title><link rel="stylesheet" href="style.css?v=312"><style>.gefallen-audio-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;margin:12px auto}.gefallen-audio-box{text-align:center;padding:10px;border:1px solid #ffe28a;border-radius:16px;background:#fff9dd}@media(max-width:600px){.gefallen-audio-row{grid-template-columns:1fr}}</style></head><body><div class="container"><header class="topbar"></header><section class="card"><div id="area"></div></section><footer>© SprachPilot</footer></div><script src="/js/sp-progress-guard.js?v=points-safe"></script><script src="app.js?v=311"></script><script src="l4t3-bunny-images.js?v=1"></script><script src="../shared/l4-t2-audio.js?v=3"></script><script src="l4t3-audio.js?v=1"></script><script>
header('Farben & Adjektive');
const file='gefallen.html',total=GEFAELLEN_TASKS.length;let phase='question';
function taskItemImg(t){const src=t.itemImg||furnitureById(t.item).img;if(t.plural)return `<div class="plural-visual" aria-label="Plural: zwei gleiche Bilder">${img(src,'task-img small-copy')}${img(src,'task-img small-copy')}</div>`;return img(src,'task-img')}
function visualWord(id){const c=COLORS.find(x=>x.id===id);if(c)return colorImg(c,'task-img');const item=ADJECTIVES.find(x=>x.id===id);return img((item&&item.img)||id+'.png','task-img')}
function audioWord(id){return COLORS.find(x=>x.id===id)||ADJECTIVES.find(x=>x.id===id)||null}
function normalizeGefallenAnswer(txt){let low=simple(txt).replace(/^ganz gut\b/,'gut');low=low.replace(/\ber ist sehr\b/g,'er ist').replace(/\bsie ist sehr\b/g,'sie ist').replace(/\bes ist sehr\b/g,'es ist').replace(/\bsie sind sehr\b/g,'sie sind');return low.trim()}
function gefallenSolutionText(t){const ans=String(t.answer||'');const m=ans.match(/^(Gut|Ganz gut)\.\s*(.+)$/);if(!m)return ans;return 'Gut. '+m[2]+'<br>oder: Ganz gut. '+m[2]}
function render(){
 L4T3Audio.stop();let i=nextIndex(file,total);if(i===null)return complete(area,file,'saetze-bauen.html');let t=GEFAELLEN_TASKS[i],r=reactionById(t.reaction),audioItem=audioWord(t.adj);
 if(phase==='question'){
  area.innerHTML=progressHtml(file,total)+instruction('Bilde zuerst die Frage mit „gefällt“ oder „gefallen“.')+exampleBox('Ein Bild = Singular: Wie gefällt dir der Sessel?<br>Zwei gleiche Bilder = Plural: Wie gefallen dir die Stühle?')+`<div class="imgrow">${taskItemImg(t)}</div><input id="q" placeholder="Schreiben Sie die Frage hier"><div class="actions"><button class="btn mic-btn" onclick="startMic(this,v=>{document.getElementById('q').value=v;checkQuestion(true)})">🎤 Deutsch sprechen</button><button class="btn" onclick="checkQuestion(false)">Kontrollieren</button></div><div id="micStatus" class="mic-status"></div><div id="fb" class="feedback"></div>`;
 }else{
  area.innerHTML=progressHtml(file,total)+instruction('Antworte mit der Reaktion und einem ganzen Satz.')+exampleBox('Frage: Wie gefällt dir der Sessel?<br>Antwort: Gut. Er ist bequem.<br>oder: Ganz gut. Er ist bequem.')+`<div class="imgrow three-img">${taskItemImg(t)}<div class="smile-card">${r.emoji}</div>${visualWord(t.adj)}</div><div class="gefallen-audio-row"><div class="gefallen-audio-box"><b>${safe(r.word)}</b>${L4T3Audio.buttons(r,'audioStatusReaction')}<div id="audioStatusReaction" class="audio-status"></div></div><div class="gefallen-audio-box"><b>${safe(audioItem?audioItem.word:t.adj)}</b>${audioItem?L4T3Audio.buttons(audioItem,'audioStatusAdjective'):''}<div id="audioStatusAdjective" class="audio-status"></div></div></div><input id="a" placeholder="Schreiben Sie die Antwort hier"><div class="actions"><button class="btn mic-btn" onclick="startMic(this,v=>{document.getElementById('a').value=v;checkAnswer(true)})">🎤 Deutsch sprechen</button><button class="btn" onclick="checkAnswer(false)">Kontrollieren</button></div><div id="micStatus" class="mic-status"></div><div id="fb" class="feedback"></div>`;
 }
}
function checkQuestion(fromSpeech=false){let st=loadTask(file,total),t=GEFAELLEN_TASKS[st.current],input=document.getElementById('q');if(input&&isExactSentence(input.value,t.question,fromSpeech)){fb.innerHTML='<div class="ok">Richtig. Jetzt die Antwort.</div>';phase='answer';setTimeout(render,350)}else{let tr=markWrong(file,total,t.question);fb.innerHTML='<div class="no">'+feedbackForTry(tr,t.question,'gefällt/gefallen und Artikel')+'</div>'}}
function checkAnswer(fromSpeech=false){let st=loadTask(file,total),t=GEFAELLEN_TASKS[st.current],input=document.getElementById('a');const expected=normalizeGefallenAnswer(t.answer),actual=normalizeGefallenAnswer(input?input.value:'');if(actual===expected){fb.innerHTML='<div class="ok">Richtig!</div>';phase='question';setTimeout(()=>{markRight(file,total)?complete(area,file,'saetze-bauen.html'):render()},420)}else{let sol=gefallenSolutionText(t),tr=markWrong(file,total,sol);fb.innerHTML='<div class="no">'+feedbackForTry(tr,sol,'Reaktion, Pronomen und ist/sind')+'</div>'}}
maybeStart(render,'gefallen.html');
</script></body></html>
