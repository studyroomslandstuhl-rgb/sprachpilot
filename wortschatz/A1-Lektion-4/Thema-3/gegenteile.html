<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gegenteile Thema 3</title><link rel="stylesheet" href="style.css?v=311"><style>.opposite-audio-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;margin:0 auto}.opposite-audio-box{text-align:center;padding:10px;border:1px solid #ffe28a;border-radius:16px;background:#fff9dd}@media(max-width:600px){.opposite-audio-grid{grid-template-columns:1fr}}</style></head><body><div class="container"><header class="topbar"></header><section class="card"><div id="area"></div></section><footer>© SprachPilot</footer></div><script src="/js/sp-progress-guard.js?v=points-safe"></script><script src="app.js?v=310"></script><script src="l4t3-bunny-images.js?v=1"></script><script src="../shared/l4-t2-audio.js?v=3"></script><script src="l4t3-audio.js?v=1"></script><script>
header('Farben & Adjektive');
const file='gegenteile.html',total=CONTRAST_TASKS.length;
function adjItem(word){return ADJECTIVES.find(x=>simple(x.word)===simple(word))||null}
function adjImage(word){let a=adjItem(word);return a?img(a.img,'task-img'):iconCard(`<b>${safe(word)}</b>`)}
function render(){
 L4T3Audio.stop();let i=nextIndex(file,total);if(i===null)return complete(area,file,'kein.html');let t=CONTRAST_TASKS[i],f=furnitureById(t.item),wrong=adjItem(t.wrong),right=adjItem(t.right);
 area.innerHTML=progressHtml(file,total)+instruction('Schreibe zwei Sätze mit „nicht“ und „sehr“.')+exampleBox('Das Sofa ist nicht hell. Es ist sehr dunkel.')+`<div class="imgrow three-img">${adjImage(t.wrong)}${adjImage(t.right)}${img(f.img,'task-img')}</div><div class="opposite-audio-grid"><div class="opposite-audio-box"><b>${safe(t.wrong)}</b>${wrong?L4T3Audio.buttons(wrong,'audioStatusWrong'):''}<div id="audioStatusWrong" class="audio-status"></div></div><div class="opposite-audio-box"><b>${safe(t.right)}</b>${right?L4T3Audio.buttons(right,'audioStatusRight'):''}<div id="audioStatusRight" class="audio-status"></div></div></div><input id="answer" placeholder="Schreiben Sie die Antwort hier"><div class="actions"><button class="btn mic-btn" onclick="startMic(this,(v)=>{answer.value=v;check(v,true)})">🎤 Sprechen</button><button class="btn" onclick="check(answer.value,false)">Kontrollieren</button></div><div id="micStatus" class="mic-status"></div><div id="fb" class="feedback"></div>`;
}
function check(val,fromSpeech=false){let st=loadTask(file,total),t=CONTRAST_TASKS[st.current];if(isExactSentence(val,t.sentence,fromSpeech)){fb.innerHTML='<div class="ok">Richtig!</div>';setTimeout(()=>{markRight(file,total)?complete(area,file,'kein.html'):render()},500)}else{let tr=markWrong(file,total,t.sentence);fb.innerHTML='<div class="no">'+feedbackForTry(tr,t.sentence,'Artikel, Pronomen und Punkt')+'</div>'}}
maybeStart(render,'gegenteile.html');
</script></body></html>
