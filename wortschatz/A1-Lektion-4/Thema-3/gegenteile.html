<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gegenteile Thema 3</title><link rel="stylesheet" href="style.css?v=l4t3-ledger1"></head><body><div class="container"><header class="topbar"></header><section class="card"><div id="area"></div></section><footer>© SprachPilot</footer></div><script src="app.js?v=l4t3-recovery3"></script><script src="l4t3-safe-runtime.js?v=2"></script><script src="l4t3-bunny-images.js?v=2"></script><script>
header('Farben & Adjektive');const file='gegenteile.html',total=CONTRAST_TASKS.length;
function adjItem(word){return ADJECTIVES.find(x=>simple(x.word)===simple(word))||null}
function adjImage(word){const item=adjItem(word);return item?img(item.img,'task-img'):''}
function render(){let i=nextIndex(file,total);if(i===null)return complete(area,file,'kein.html');const t=CONTRAST_TASKS[i],f=furnitureById(t.item);area.innerHTML=progressHtml(file,total)+instruction('Schreibe zwei passende Sätze mit „nicht“ und „sehr“.')+`<div class="imgrow three-img">${adjImage(t.wrong)}${adjImage(t.right)}${img(f.img,'task-img')}</div><input id="answer" placeholder="Schreiben Sie die Antwort hier"><div class="actions"><button class="btn mic-btn" onclick="startMic(this,(v)=>{answer.value=v;check(v,true)})">🎤 Sprechen</button><button class="btn" onclick="check(answer.value,false)">Kontrollieren</button></div><div id="micStatus" class="mic-status"></div><div id="fb" class="feedback"></div>`}
function check(val,fromSpeech=false){let st=loadTask(file,total),t=CONTRAST_TASKS[st.current];if(isExactSentence(val,t.sentence,fromSpeech)){fb.innerHTML='<div class="ok">Richtig!</div>';setTimeout(()=>{markRight(file,total)?complete(area,file,'kein.html'):render()},500)}else{let tr=markWrong(file,total,t.sentence);fb.innerHTML='<div class="no">'+feedbackForTry(tr,t.sentence,'Artikel, Pronomen und Punkt')+'</div>'}}
maybeStart(render,'gegenteile.html');
</script></body></html>
