<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaktionen Thema 3</title><link rel="stylesheet" href="style.css?v=l4t3-reactions3"><style>.reaction-options{max-width:620px;margin:18px auto}.smile-opt span{font-size:72px;line-height:1}.reaction-audio-hint{text-align:center;font-weight:800;color:#765000;margin:8px 0}</style></head><body><div class="container"><header class="topbar"></header><section class="card"><div id="area"></div></section><footer>© SprachPilot</footer></div><script src="app.js?v=l4t3-recovery3"></script><script src="l4t3-safe-runtime.js?v=4"></script><script src="l4t3-audio.js?v=5"></script><script>
header('Farben & Adjektive');const file='reaktionen.html',total=REACTIONS.length;
const OPTION_IDS=['sehr-gut','gut','es-geht','nicht-so-gut'];
function reactionGroup(id){return id==='ganz-gut'?'gut':id}
function optionItems(){return shuffle(OPTION_IDS.map(id=>reactionById(id)))}
function render(){L4T3Audio.stop();let i=nextIndex(file,total);if(i===null)return complete(area,file,'gefallen.html');const r=REACTIONS[i],opts=optionItems();area.innerHTML=progressHtml(file,total)+instruction('Höre die Reaktion. Wähle den passenden Smiley.')+`<div class="reaction-audio-hint">🔊 Höre genau.</div>${L4T3Audio.buttons(r)}<div id="audioStatus" class="audio-status" aria-live="polite"></div><div class="options reaction-options">${opts.map(o=>`<button class="opt smile-opt" type="button" aria-label="Smiley auswählen" onclick="check('${o.id}')"><span>${o.emoji}</span></button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(id){const st=loadTask(file,total),r=REACTIONS[st.current],correctGroup=reactionGroup(r.id);if(reactionGroup(id)===correctGroup){fb.innerHTML='<div class="ok">Richtig!</div>';setTimeout(()=>{markRight(file,total)?complete(area,file,'gefallen.html'):render()},500)}else{const tries=markWrong(file,total,r.emoji);const text=tries===1?'Dieser Smiley passt nicht.':tries===2?'Höre noch einmal genau.':'Richtiger Smiley: '+r.emoji;fb.innerHTML='<div class="no">'+text+'</div>'}}
maybeStart(render,'reaktionen.html');
</script></body></html>
