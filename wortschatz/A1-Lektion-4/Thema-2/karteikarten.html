<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karteikarten</title>
<link rel="stylesheet" href="style.css?v=246">
<link rel="stylesheet" href="../shared/lektion4-standard.css?v=246">
<style>
.flip-wrap{width:min(390px,100%);margin:18px auto;perspective:1100px}
.flip-card{position:relative;width:100%;height:330px;transform-style:preserve-3d;transition:transform .55s ease;cursor:pointer;touch-action:manipulation}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;border:3px solid #ffe28a;border-radius:26px;background:#fff;box-shadow:0 12px 28px rgba(0,0,0,.1);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.flip-front .task-img{width:100%;height:250px;object-fit:contain;margin:0}
.flip-back{transform:rotateY(180deg);background:#fff9dd}
.flip-word{font-size:30px;font-weight:900;color:#7a5100;line-height:1.35}
.flip-note{font-size:14px;color:#667085}
.card-actions{justify-content:center}
.card-answer-box{max-width:620px;margin:14px auto 0}
.card-answer-box .btn{margin-top:10px}
.card-listen-btn{position:relative;z-index:5;margin-top:8px}
.audio-status{min-height:24px;margin:8px 0;text-align:center;font-weight:800;color:#7a5100}
.audio-status.error{color:#9b1c1c}
@media(max-width:600px){.flip-card{height:300px}.flip-word{font-size:24px}.flip-face{padding:14px}.flip-front .task-img{height:220px}}
</style>
</head>
<body>
<div class="container">
  <header class="topbar"></header>
  <section class="card" id="area"><div class="question">Aufgabe wird geladen …</div></section>
  <footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/progress.js?v=246"></script>
<script src="app.js?v=236"></script>
<script src="../shared/l4-bunny-direct.js?v=3"></script>
<script src="../shared/l4-t2-audio.js?v=3"></script>
<script>
header("Karteikarten");
const area=document.getElementById("area");
const FILE="karteikarten.html";
let i=null,revealed=false,solved=false;

function backHtml(w){
 return `<div class="flip-word">${esc(full(w))}</div><div class="flip-note">Lösung</div><button type="button" class="btn secondary card-listen-btn" id="cardListenBtn">🔊 Anhören</button>`;
}
function playBackAudio(w){L4T2Audio.play(w,false,"audioStatus",full(w))}
function show(){
 L4T2Audio.stop();
 if(loadTask(FILE,WORDS.length).done.length>=WORDS.length){complete(area,FILE,"hoeren.html");return}
 i=nextIndex(FILE,WORDS.length);
 if(i===undefined||i===null){localStorage.removeItem(taskKey(FILE));i=nextIndex(FILE,WORDS.length)}
 const w=WORDS[i];
 if(!w){area.innerHTML='<div class="no">Die Aufgabe konnte nicht geladen werden.</div><div class="actions"><a class="btn secondary" href="index.html">Zurück</a></div>';return}
 revealed=false;solved=false;
 area.innerHTML=`${progressHtml(FILE,WORDS.length)}
  <div class="flip-wrap">
   <div id="fcard" class="flip-card" role="button" tabindex="0" aria-label="Karte umdrehen">
    <div class="flip-face flip-front"><img class="task-img" src="${w.image}" onerror="fixImg(this)" alt=""></div>
    <div class="flip-face flip-back">${backHtml(w)}</div>
   </div>
  </div>
  <div class="hint">Übersetzung: <b>${translateWord(w)}</b></div>
  <div class="actions card-actions"><button id="micBtn" type="button" class="btn mic-btn">Sprechen</button><button id="writeBtn" type="button" class="btn secondary">Schreiben</button></div>
  <div id="audioStatus" class="audio-status" aria-live="polite"></div>
  <div id="micStatus" class="mic-status"></div>
  <div id="box" class="card-answer-box" style="display:none"><input id="ans" autocomplete="off" placeholder="Antwort schreiben"><button id="checkBtn" type="button" class="btn">Kontrollieren</button></div>
  <div id="fb" class="feedback"></div><div id="after" class="actions card-actions"></div>`;
 const card=document.getElementById("fcard");
 card.addEventListener("click",()=>reveal(true));
 card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal(true)}});
 document.getElementById("cardListenBtn").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();playBackAudio(w)});
 document.getElementById("micBtn").addEventListener("click",say);
 document.getElementById("writeBtn").addEventListener("click",writeBox);
 document.getElementById("checkBtn").addEventListener("click",()=>check(document.getElementById("ans").value));
 document.getElementById("ans").addEventListener("keydown",e=>{if(e.key==="Enter")check(e.target.value)});
}
function writeBox(){const box=document.getElementById("box"),ans=document.getElementById("ans");if(box)box.style.display="block";if(ans)ans.focus()}
function reveal(help){if(solved)return;const card=document.getElementById("fcard");if(card)card.classList.add("flipped");if(help&&!revealed){revealed=true;markWrong(FILE,WORDS.length);const after=document.getElementById("after");if(after){after.innerHTML='<button type="button" class="btn" id="nextHelpBtn">Weiter</button>';document.getElementById("nextHelpBtn").addEventListener("click",nextAfterHelp)}}}
function nextAfterHelp(){markRight(FILE,WORDS.length);show()}
function say(){const micBtn=document.getElementById("micBtn");startMic(micBtn,txt=>{writeBox();const ans=document.getElementById("ans");if(ans)ans.value=txt;check(txt)})}
function check(txt){const w=WORDS[i],fb=document.getElementById("fb");if(!w||!fb)return;if(simple(txt)===simple(full(w))){solved=true;const card=document.getElementById("fcard");if(card)card.classList.add("flipped");fb.innerHTML='<div class="ok">Richtig!</div>';markRight(FILE,WORDS.length);const after=document.getElementById("after");if(after){after.innerHTML='<button type="button" class="btn" id="nextBtn">Weiter</button>';document.getElementById("nextBtn").addEventListener("click",show)}return}const tries=markWrong(FILE,WORDS.length);fb.innerHTML=tries>=3?`<div class="no">Lösung: ${esc(full(w))}</div>`:'<div class="no">Noch nicht richtig.</div>'}
show();
</script>
</body>
</html>
