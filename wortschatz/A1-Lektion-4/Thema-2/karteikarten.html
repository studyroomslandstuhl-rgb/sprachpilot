<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karteikarten</title>
<link rel="stylesheet" href="style.css?v=241">
<link rel="stylesheet" href="../shared/lektion4-standard.css?v=241">
<style>
.audio-status{min-height:24px;margin:8px 0;text-align:center;font-weight:800;color:#7a5100}
.audio-status.error{color:#9b1c1c}
</style>
</head>
<body>
<div class="container">
  <header class="topbar"></header>
  <section class="card" id="area">
    <div class="question">Aufgabe wird geladen …</div>
  </section>
  <footer>© SprachPilot</footer>
</div>

<script type="module" src="/js/progress.js?v=241"></script>
<script src="app.js?v=236"></script>
<script src="../shared/l4-bunny-direct.js?v=3"></script>
<script>
header("Karteikarten");

const area=document.getElementById("area");
const FILE="karteikarten.html";
const AUDIO_CDN="https://sprachpilot.b-cdn.net/audio/";
let i=null;
let currentAudio=null;

function wordGroup(w){
  return typeof spT2Group==="function"
    ?spT2Group(w)
    :(w?.releaseGroup||w?.wordGroup||w?.group||(w?.set==="plus"?"extra":"book"));
}
function hasUploadedAudio(w){return !!(w&&w.id&&(wordGroup(w)==="book"||w.category==="Möbel"))}
function audioUrl(w){return hasUploadedAudio(w)?AUDIO_CDN+encodeURIComponent(w.id)+".mp3":""}

function stopAudio(){
  if(!currentAudio)return;
  try{currentAudio.pause();currentAudio.currentTime=0}catch(e){}
  currentAudio=null;
}
function setAudioStatus(text,isError=false){
  const el=document.getElementById("audioStatus");
  if(!el)return;
  el.textContent=text||"";
  el.classList.toggle("error",!!isError);
}
function playCardAudio(slow=false){
  const w=WORDS[i];
  const src=audioUrl(w);
  if(!src)return;
  stopAudio();
  const audio=new Audio(src);
  audio.preload="auto";
  audio.playbackRate=slow?0.75:1;
  audio.onplay=()=>setAudioStatus(slow?"Langsame Wiedergabe läuft …":"Wiedergabe läuft …");
  audio.onended=()=>{setAudioStatus("");currentAudio=null};
  audio.onerror=()=>{setAudioStatus("Audio konnte nicht geladen werden.",true);currentAudio=null};
  currentAudio=audio;
  const promise=audio.play();
  if(promise&&typeof promise.catch==="function"){
    promise.catch(()=>{setAudioStatus("Audio konnte nicht abgespielt werden.",true);currentAudio=null});
  }
}

function show(){
  stopAudio();
  if(loadTask(FILE,WORDS.length).done.length>=WORDS.length){
    complete(area,FILE,"hoeren.html");
    return;
  }

  i=nextIndex(FILE,WORDS.length);
  if(i===undefined||i===null){
    localStorage.removeItem(taskKey(FILE));
    i=nextIndex(FILE,WORDS.length);
  }

  const w=WORDS[i];
  if(!w){
    area.innerHTML='<div class="no">Die Aufgabe konnte nicht geladen werden.</div><div class="actions"><a class="btn secondary" href="index.html">Zurück</a></div>';
    return;
  }

  const audioButtons=hasUploadedAudio(w)
    ?`<button type="button" class="btn" onclick="playCardAudio(false)">🔊 Hören</button>
      <button type="button" class="btn secondary" onclick="playCardAudio(true)">Langsam</button>`
    :"";

  area.innerHTML=`${progressHtml(FILE,WORDS.length)}
    <div class="question">Sage das deutsche Wort mit Artikel.</div>
    <div class="hint">Muttersprache: <b>${translateWord(w)}</b></div>
    <img class="task-img" src="${w.image}" onerror="fixImg(this)" alt="">
    <div class="actions">
      ${audioButtons}
      <button id="micBtn" type="button" class="btn mic-btn" onclick="say()">🎤 Sprechen</button>
      <button type="button" class="btn secondary" onclick="writeBox()">Ich kann nicht sprechen</button>
      <button type="button" class="btn secondary" onclick="flip()">Karte umdrehen</button>
    </div>
    <div id="audioStatus" class="audio-status" aria-live="polite"></div>
    <div id="micStatus" class="mic-status"></div>
    <div id="box" class="hidden">
      <input id="ans" autocomplete="off" placeholder="Schreiben Sie die Antwort hier">
      <button type="button" class="btn" onclick="check(document.getElementById('ans').value)">Kontrollieren</button>
    </div>
    <div id="fb" class="feedback"></div>`;
}

function writeBox(){
  const box=document.getElementById("box");
  if(box)box.classList.remove("hidden");
}

function flip(){
  const w=WORDS[i];
  const fb=document.getElementById("fb");
  const box=document.getElementById("box");
  const ans=document.getElementById("ans");
  if(!w||!fb||!box||!ans)return;
  const tries=markWrong(FILE,WORDS.length);
  fb.innerHTML=feedbackForCard(tries,full(w),"Artikel und Wort");
  box.classList.remove("hidden");
  ans.value=full(w);
}

function say(){
  const micBtn=document.getElementById("micBtn");
  startMic(micBtn,txt=>{
    writeBox();
    const ans=document.getElementById("ans");
    if(ans)ans.value=txt;
    check(txt);
  });
}

function check(txt){
  const w=WORDS[i];
  const fb=document.getElementById("fb");
  if(!w||!fb)return;
  if(simple(txt)===simple(full(w))){
    fb.textContent="Richtig!";
    markRight(FILE,WORDS.length);
    setTimeout(show,700);
  }else{
    const tries=markWrong(FILE,WORDS.length);
    fb.innerHTML=feedbackForCard(tries,full(w),"Artikel und Wort");
  }
}

function feedbackForCard(tries,solution,type){
  if(tries===1)return"Da ist noch ein Fehler.";
  if(tries===2)return"Tipp: Prüfe "+type+".";
  return"Lösung: "+solution;
}

show();
</script>
</body>
</html>
