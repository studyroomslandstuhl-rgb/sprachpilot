<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kategorien</title><link rel="stylesheet" href="style.css?v=244"><link rel="stylesheet" href="../shared/lektion4-standard.css?v=244">
<style>
.click-opt{cursor:pointer;pointer-events:auto}
.click-opt.wrong{background:#ffe1e1!important;border-color:#e74c3c!important;color:#9b1c1c!important}
.click-opt.correct{background:#d9f7e8!important;border-color:#2e9e4f!important;color:#145a32!important}
.click-opt.selected{outline:4px solid #2e9e4f}
.image-fallback{display:flex;align-items:center;justify-content:center;min-height:180px;margin:14px auto;border:2px solid #ffe28a;border-radius:18px;background:#fff9dd;color:#7a5100;font-weight:900;text-align:center}
</style></head><body><div class="container"><header class="topbar"></header><main id="area" class="card"><div class="question">Aufgabe wird geladen …</div></main><footer>© SprachPilot</footer></div><script type="module" src="/js/progress.js?v=244"></script><script src="app.js?v=236"></script><script src="../shared/l4-t2-audio.js?v=2"></script><script>
header("Kategorien");
const area=document.getElementById("area");
const FILE="kategorien.html";
const SP_BUNNY_CDN="https://sprachpilot.b-cdn.net/";
const CATEGORY_ALLOWED=["Möbel","Elektrogeräte","Bad"];
const CATEGORY_EXCLUDE_IDS=["spuele","dach","tuer","wand","boden","fenster","bild"];
const CATEGORY_WORDS=WORDS.filter(w=>CATEGORY_ALLOWED.includes(w.category)&&!CATEGORY_EXCLUDE_IDS.includes(w.id));
let i=0,locked=false,selectedCat="",selectedBtn=null;
function imageName(value){const raw=String(value||"").split("?")[0].split("#")[0].split("/").pop();return raw.replace(/\.(png|jpe?g|webp|gif|svg)$/i,"")}
function bunnyUrl(value){const name=imageName(value);return name?SP_BUNNY_CDN+encodeURIComponent(name)+".webp":""}
function wordImage(w){const primary=bunnyUrl(w&&w.id),fallback=bunnyUrl(w&&w.image);return `<img class="task-img" src="${primary}" data-fallback="${fallback}" loading="eager" decoding="async" onerror="nextImage(this)" alt="">`}
function nextImage(img){const fallback=img.dataset.fallback||"";if(img.dataset.fallbackTried!=="1"&&fallback&&fallback!==img.src){img.dataset.fallbackTried="1";img.src=fallback;return}img.outerHTML='<div class="image-fallback">Das Bild konnte nicht geladen werden. Die Kategorie kann trotzdem gewählt werden.</div>'}
function feedback(){return document.getElementById("fb")}
function show(){
 L4T2Audio.stop();locked=false;selectedCat="";selectedBtn=null;
 if(!CATEGORY_WORDS.length){area.innerHTML='<div class="no">Für diese Wortschatzfreigabe sind keine Kategorie-Aufgaben verfügbar.</div><div class="actions"><a class="btn secondary" href="index.html">Zurück</a></div>';return}
 if(loadTask(FILE,CATEGORY_WORDS.length).done.length>=CATEGORY_WORDS.length){complete(area,FILE,"dialoge.html");return}
 i=nextIndex(FILE,CATEGORY_WORDS.length);const w=CATEGORY_WORDS[i];
 if(!w){area.innerHTML='<div class="no">Die Aufgabe konnte nicht geladen werden.</div><div class="actions"><button type="button" class="btn" onclick="show()">Neu laden</button><a class="btn secondary" href="index.html">Zurück</a></div>';return}
 area.innerHTML=`${progressHtml(FILE,CATEGORY_WORDS.length)}<div class="question">Welche Kategorie passt?</div>${wordImage(w)}<div class="big">${esc(w.full)}</div>${L4T2Audio.buttons(w)}<div id="audioStatus" class="audio-status" aria-live="polite"></div><div class="options">${CATEGORY_ALLOWED.map(c=>`<button type="button" class="opt click-opt" data-category="${c}" onclick="choose(this.dataset.category,this)">${c}</button>`).join("")}</div><div class="actions"><button type="button" class="btn" onclick="checkCategory()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;
}
function choose(cat,el){if(locked)return;selectedCat=cat;selectedBtn=el;document.querySelectorAll(".click-opt").forEach(x=>x.classList.remove("selected","wrong","correct"));el.classList.add("selected");const fb=feedback();if(fb)fb.textContent=""}
function checkCategory(){if(locked)return;const w=CATEGORY_WORDS[i],fb=feedback();if(!w||!fb)return;if(!selectedCat){fb.innerHTML='<div class="no">Wähle zuerst eine Kategorie.</div>';return}if(selectedCat===w.category){locked=true;if(selectedBtn)selectedBtn.classList.add("correct");fb.innerHTML='<div class="ok">Richtig!</div>';markRight(FILE,CATEGORY_WORDS.length);setTimeout(show,700)}else{if(selectedBtn)selectedBtn.classList.add("wrong");const tries=markWrong(FILE,CATEGORY_WORDS.length);fb.innerHTML=feedbackForTry(tries,w.category,"Kategorie")}}
show();
</script></body></html>
