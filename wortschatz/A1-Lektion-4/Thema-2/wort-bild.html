<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wort → Bild</title><link rel="stylesheet" href="style.css?v=242"><link rel="stylesheet" href="../shared/lektion4-standard.css?v=242">
<style>
.click-card{cursor:pointer;pointer-events:auto;transition:.15s;touch-action:manipulation}
@media(hover:hover){.click-card:hover{transform:scale(1.03);border-color:#f7c600}}
.click-card.wrong{border-color:#e74c3c!important;background:#ffe1e1!important}
.click-card.correct{border-color:#2e9e4f!important;background:#d9f7e8!important}
</style></head><body><div class="container"><header class="topbar"></header><main id="area" class="card"><div class="question">Aufgabe wird geladen …</div></main><footer>© SprachPilot</footer></div><script type="module" src="/js/progress.js?v=242"></script><script src="app.js?v=236"></script><script src="../shared/l4-bunny-direct.js?v=3"></script><script src="../shared/l4-t2-audio.js?v=1"></script><script>
header("Wort → Bild");
const area=document.getElementById("area");
const FILE="wort-bild.html";
let i=0;
let locked=false;
function shuffle(list){const out=list.slice();for(let n=out.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1)),temp=out[n];out[n]=out[j];out[j]=temp}return out}
function opts(w){return shuffle([w].concat(shuffle(WORDS.filter(x=>x.id!==w.id)).slice(0,3)))}
function show(){
 L4T2Audio.stop();locked=false;
 if(loadTask(FILE,WORDS.length).done.length>=WORDS.length){complete(area,FILE,"kategorien.html");return}
 i=nextIndex(FILE,WORDS.length);const w=WORDS[i];
 if(!w){area.innerHTML='<div class="no">Die Aufgabe konnte nicht geladen werden.</div><div class="actions"><a class="btn secondary" href="index.html">Zurück</a></div>';return}
 const o=opts(w);
 area.innerHTML=`${progressHtml(FILE,WORDS.length)}<div class="question">Wähle das passende Bild.</div><div class="big">${esc(w.full)}</div>${L4T2Audio.buttons(w)}<div id="audioStatus" class="audio-status" aria-live="polite"></div><div class="imgrow">${o.map(x=>`<button type="button" class="imgbox click-card" data-id="${esc(x.id)}" onclick="choose(this.dataset.id,this)"><img src="${x.image}" onerror="fixImg(this)" alt=""></button>`).join("")}</div><div id="fb" class="feedback"></div>`;
}
function choose(id,el){if(locked)return;const w=WORDS[i],fb=document.getElementById("fb");if(!w||!fb||!el)return;if(id===w.id){locked=true;el.classList.add("correct");fb.textContent="Richtig!";markRight(FILE,WORDS.length);setTimeout(show,700)}else{el.classList.add("wrong");el.disabled=true;const tries=markWrong(FILE,WORDS.length);fb.innerHTML=feedbackForTry(tries,w.full,"Wort und Bild")}}
show();
</script></body></html>
