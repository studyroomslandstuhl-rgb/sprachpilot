<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel klicken</title><link rel="stylesheet" href="style.css?v=237"><link rel="stylesheet" href="../shared/lektion4-standard.css?v=237">
<style>
.click-opt{cursor:pointer;pointer-events:auto}
.click-opt.wrong{background:#ffe1e1!important;border-color:#e74c3c!important;color:#9b1c1c!important}
.click-opt.correct{background:#d9f7e8!important;border-color:#2e9e4f!important;color:#145a32!important}
.image-fallback{display:flex;align-items:center;justify-content:center;min-height:180px;margin:14px auto;border:2px solid #ffe28a;border-radius:18px;background:#fff9dd;color:#7a5100;font-weight:900;text-align:center}
</style></head><body><div class="container"><header class="topbar"></header><main id="area" class="card"><div class="question">Aufgabe wird geladen …</div></main><footer>© SprachPilot</footer></div><script type="module" src="/js/progress.js?v=237"></script><script src="app.js?v=236"></script><script>
header("Artikel klicken");
const FILE="artikel-klick.html";
const SP_BUNNY_CDN="https://sprachpilot.b-cdn.net/";
let i=0;
let locked=false;

function imageName(value){
 const raw=String(value||"").split("?")[0].split("#")[0].split("/").pop();
 return raw.replace(/\.(png|jpe?g|webp|gif|svg)$/i,"");
}
function bunnyUrl(value){
 const name=imageName(value);
 return name?SP_BUNNY_CDN+encodeURIComponent(name)+".webp":"";
}
function wordImage(w){
 const primary=bunnyUrl(w&&w.id);
 const fallback=bunnyUrl(w&&w.image);
 return `<img class="task-img" src="${primary}" data-fallback="${fallback}" loading="eager" decoding="async" onerror="nextImage(this)" alt="">`;
}
function nextImage(img){
 const fallback=img.dataset.fallback||"";
 if(img.dataset.fallbackTried!=="1"&&fallback&&fallback!==img.src){img.dataset.fallbackTried="1";img.src=fallback;return}
 img.outerHTML='<div class="image-fallback">Das Bild konnte nicht geladen werden. Die Aufgabe kann trotzdem bearbeitet werden.</div>';
}
function feedback(){return document.getElementById("fb")}

function show(){
 locked=false;
 if(loadTask(FILE,WORDS.length).done.length>=WORDS.length){complete(area,FILE,"artikel.html");return}
 i=nextIndex(FILE,WORDS.length);
 const w=WORDS[i];
 if(!w){area.innerHTML='<div class="no">Die Aufgabe konnte nicht geladen werden.</div><div class="actions"><a class="btn secondary" href="index.html">Zurück</a></div>';return}
 area.innerHTML=`${progressHtml(FILE,WORDS.length)}
   <div class="question">Wähle den richtigen Artikel.</div>
   ${wordImage(w)}
   <div class="big">___ ${w.word}</div>
   <div class="options">${["der","die","das"].map(a=>`<button type="button" class="opt click-opt" onclick="choose('${a}',this)">${a}</button>`).join("")}</div>
   <div id="fb" class="feedback"></div>`;
}

function choose(article,el){
 if(locked)return;
 const w=WORDS[i];
 const fb=feedback();
 if(!w||!fb)return;
 if(article===w.article){
  locked=true;el.classList.add("correct");fb.textContent="Richtig!";markRight(FILE,WORDS.length);setTimeout(show,700);
 }else{
  el.classList.add("wrong");const tries=markWrong(FILE,WORDS.length);fb.innerHTML=feedbackForTry(tries,w.full,"Artikel");
 }
}
show();
</script></body></html>
