<body>
<div class="container">
<header class="topbar"></header>
<section class="card" id="area"><p>Die Aufgabe wird geladen …</p></section>
<footer>© SprachPilot</footer>
</div>
<script type="module" src="/js/guard.js?v=card-standard1"></script>
<script src="../shared/lektion4-standard.js?v=thema4-v9"></script>
<script src="l4t4-theme-score.js?v=1"></script>
<script src="app.js?v=thema4-content-v3"></script>
<script src="../shared/l4-bunny-direct.js?v=3"></script>
<script src="../shared/l4-t2-audio.js?v=3"></script>
<script src="/js/sp-card-standard.js?v=1"></script>
<script>
(function(){
const FILE='karteikarten.html';
function expected(w){return w.full||w.word}
function visualCard(w,opts){if(w.image&&typeof imgTag==='function')return `<div class="visual ${opts.small?'small-visual':''} ${opts.pure?'pure-visual':''}">${imgTag(w,'task-img')}</div>`;return ''}
SPCardStandard.mount({
 area:'#area',words:()=>FLASHCARD_WORDS,nextPage:'hoeren.html',full:expected,word:w=>w.word,
 plural:w=>w.plural||'',example:w=>w.sentence||'',translation:w=>translateWord(w),languageName:'Muttersprache',
 image:w=>w.image||'',visual:visualCard,normalize:v=>simple(v),audio:w=>window.L4T2Audio?L4T2Audio.play(w,false,'tech',expected(w)):null,
 accept:(w,value)=>eq(value,expected(w)),
 state:{progress(){const st=loadTask(FILE,FLASHCARD_WORDS.length);return{total:FLASHCARD_WORDS.length,done:st.done.length,tries:st.tries||0,hadWrong:!!st.hadWrong}},current(){return FLASHCARD_WORDS[nextIndex(FILE,FLASHCARD_WORDS.length)]},wrong(){return markWrong(FILE,FLASHCARD_WORDS.length)},right(){markRight(FILE,FLASHCARD_WORDS.length)},resetCurrent(){localStorage.removeItem(taskKey(FILE))}}
});
})();
</script>
</body>
</html>
