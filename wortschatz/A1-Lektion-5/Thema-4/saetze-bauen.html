<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sätze bauen</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="../data/wortschatz.js?v=7"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=2"></script><script src="../Thema-1/points-hook.js?v=5"></script><script>
header('Sätze bauen');
const FILE='saetze-bauen.html';
const ITEMS=[
{cue:'Nora – jeden Morgen – um 6:15 Uhr – aufstehen',ans:['Nora steht jeden Morgen um 6:15 Uhr auf.','Nora steht jeden Morgen um 6.15 Uhr auf.']},
{cue:'Nora – Emil – um 7:30 Uhr – in die Kita – bringen',ans:['Nora bringt Emil um 7:30 Uhr in die Kita.','Nora bringt Emil um 7.30 Uhr in die Kita.']},
{cue:'die Kita – von Montag bis Freitag – geöffnet sein',ans:['Die Kita ist von Montag bis Freitag geöffnet.']},
{cue:'das Geschäft – am Mittwoch – um 13:00 Uhr – schließen',ans:['Das Geschäft schließt am Mittwoch um 13:00 Uhr.','Das Geschäft schließt am Mittwoch um 13 Uhr.']},
{cue:'Nora – in der Bibliothek – ein Buch – ausleihen',ans:['Nora leiht in der Bibliothek ein Buch aus.']},
{cue:'ich – einen Termin – vereinbaren',ans:['Ich vereinbare einen Termin.']},
{cue:'die Bibliothek – an Feiertagen – geschlossen sein',ans:['Die Bibliothek ist an Feiertagen geschlossen.']},
{cue:'Nora – am Abend – fertig sein',ans:['Nora ist am Abend fertig.']}
];
let i=0;
function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'dialoge.html');return}i=spNextSequentialIndex(FILE,ITEMS.length);const it=ITEMS[i];area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Bauen Sie einen ganzen Satz. Achten Sie auf Verbposition und trennbare Verben.')}<div class="sentence-box">${it.cue}</div><textarea id="ans" rows="3" placeholder="Schreiben Sie den Satz."></textarea><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function check(){const it=ITEMS[i],a=ans.value;if(!a.trim()){fb.innerHTML='<div class="no">Bitte schreiben Sie einen ganzen Satz.</div>';return}if(it.ans.some(x=>simple(x)===simple(a))){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,ITEMS.length);setTimeout(show,900)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,ITEMS.length);fb.innerHTML=help3(t,'Der Satz ist noch nicht richtig.','Tipp: Das Verb steht auf Position 2. Bei trennbaren Verben steht der Präfix am Ende.',it.ans[0])}}
show();
</script></body></html>
