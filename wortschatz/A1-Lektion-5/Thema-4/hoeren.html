<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="../data/wortschatz.js?v=7"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=2"></script><script src="../Thema-1/points-hook.js?v=5"></script><script>header('Hören');const FILE='hoeren.html';const ITEMS=[{q:'Wann fängt der Film an?',audio:'/assets/audio/a1-l5-t4-hoeren-01-kino.mp3',a:'18:30 Uhr',opts:['16:30 Uhr','18:30 Uhr','20:00 Uhr']},{q:'Wann öffnet die Bibliothek?',audio:'/assets/audio/a1-l5-t4-hoeren-02-bibliothek.mp3',a:'am Dienstag um 9:00 Uhr',opts:['am Montag um 9:00 Uhr','am Dienstag um 9:00 Uhr','am Freitag um 9:00 Uhr']},{q:'Bis wann ist das Geschäft am Samstag geöffnet?',audio:'/assets/audio/a1-l5-t4-hoeren-03-geschaeft.mp3',a:'bis 14:00 Uhr',opts:['bis 12:00 Uhr','bis 14:00 Uhr','bis 18:00 Uhr']},{q:'Wann ist die Kita geöffnet?',audio:'/assets/audio/a1-l5-t4-hoeren-04-kita.mp3',a:'von 7:30 Uhr bis 17:00 Uhr',opts:['von 7:30 Uhr bis 17:00 Uhr','von 8:30 Uhr bis 16:00 Uhr','von 9:00 Uhr bis 17:00 Uhr']},{q:'Wann kann man einen Termin vereinbaren?',audio:'/assets/audio/a1-l5-t4-hoeren-05-praxis.mp3',a:'am Vormittag',opts:['am Morgen','am Vormittag','am Abend']},{q:'Wann ist die Bibliothek geschlossen?',audio:'/assets/audio/a1-l5-t4-hoeren-06-feiertag.mp3',a:'am Sonntag und an Feiertagen',opts:['am Freitag','am Samstag','am Sonntag und an Feiertagen']}];let i=0;function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'lesen.html');return}i=spNextIndex(FILE,ITEMS.length);const it=ITEMS[i];const opts=shuffle(it.opts);area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Hören Sie die Ansage. Wählen Sie die richtige Antwort.')}<div class="audio-box"><audio controls preload="metadata"><source src="${it.audio}" type="audio/mpeg"></audio></div><div class="question">${it.q}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}function check(btn,raw){const val=decodeURIComponent(raw),it=ITEMS[i];if(val===it.a){btn.classList.add('ok');fb.textContent='Richtig!';spMarkRight(FILE,ITEMS.length);setTimeout(show,800)}else{btn.classList.add('no');const t=spMarkWrong(FILE,ITEMS.length);fb.innerHTML=help3(t,'Hören Sie noch einmal.','Tipp: Achten Sie auf die Zeit und den Tag.',it.a)}}show();</script></body></html>
