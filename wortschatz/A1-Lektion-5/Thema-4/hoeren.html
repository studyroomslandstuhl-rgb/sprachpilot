<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="../data/wortschatz.js?v=7"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=2"></script><script src="../Thema-1/points-hook.js?v=5"></script><script>header('Hören');const FILE='hoeren.html';const ITEMS=[
{q:'Wann öffnet die Kita Regenbogen?',audio:'/assets/audio/a1-l5-t4-hoeren-01-kita.mp3',a:'um 7:30 Uhr',opts:['um 7:00 Uhr','um 7:30 Uhr','um 8:30 Uhr'],text:'Guten Morgen. Hier ist die Kita Regenbogen. Unsere Kita ist von Montag bis Freitag geöffnet. Wir öffnen um halb acht und schließen um siebzehn Uhr. Am Samstag und am Sonntag ist die Kita geschlossen.'},
{q:'Wann ist die Krippe geschlossen?',audio:'/assets/audio/a1-l5-t4-hoeren-02-krippe.mp3',a:'am Freitag ab 13:00 Uhr',opts:['am Montag ab 13:00 Uhr','am Freitag ab 13:00 Uhr','jeden Tag ab 13:00 Uhr'],text:'Sie hören die Krippe Sonnenblume. Die Krippe ist von Montag bis Donnerstag von sieben Uhr bis sechzehn Uhr geöffnet. Am Freitag ist die Krippe nur bis dreizehn Uhr geöffnet. Danach ist sie geschlossen.'},
{q:'Wann kann man in der Praxis einen Termin vereinbaren?',audio:'/assets/audio/a1-l5-t4-hoeren-03-praxis.mp3',a:'von 8:00 bis 12:00 Uhr',opts:['von 8:00 bis 12:00 Uhr','von 12:00 bis 14:00 Uhr','von 18:00 bis 20:00 Uhr'],text:'Praxis Dr. Weber, guten Tag. Wir sind heute von acht bis zwölf Uhr und von vierzehn bis sechzehn Uhr dreißig geöffnet. Einen Termin können Sie am Vormittag von acht bis zwölf Uhr vereinbaren.'},
{q:'Bis wann ist das Geschäft am Samstag geöffnet?',audio:'/assets/audio/a1-l5-t4-hoeren-04-geschaeft.mp3',a:'bis 13:00 Uhr',opts:['bis 12:00 Uhr','bis 13:00 Uhr','bis 18:30 Uhr'],text:'Willkommen bei Elektro Müller. Unser Geschäft ist Montag, Dienstag, Donnerstag und Freitag bis achtzehn Uhr dreißig geöffnet. Am Mittwoch und am Samstag schließen wir schon um dreizehn Uhr.'},
{q:'Wann ist die Bibliothek an Feiertagen geöffnet?',audio:'/assets/audio/a1-l5-t4-hoeren-05-bibliothek.mp3',a:'sie ist geschlossen',opts:['von 10:00 bis 16:00 Uhr','von 13:00 bis 19:00 Uhr','sie ist geschlossen'],text:'Stadtbibliothek, guten Tag. Wir sind von Montag bis Freitag von dreizehn bis neunzehn Uhr geöffnet. Am Samstag öffnen wir von zehn bis sechzehn Uhr. Am Sonntag und an Feiertagen ist die Bibliothek geschlossen.'},
{q:'Wann fängt der Film „Schönes Leben“ an?',audio:'/assets/audio/a1-l5-t4-hoeren-06-kino.mp3',a:'um 18:30 Uhr',opts:['um 17:30 Uhr','um 18:30 Uhr','um 20:15 Uhr'],text:'Sie hören das Kinoprogramm für heute. Der Kinderfilm beginnt um siebzehn Uhr dreißig. Der Film „Schönes Leben“ fängt um achtzehn Uhr dreißig an. Der Actionfilm beginnt um zwanzig Uhr fünfzehn.'},
{q:'Wann bringt Nora Emil in die Kita?',audio:'/assets/audio/a1-l5-t4-hoeren-07-nora.mp3',a:'um 7:30 Uhr',opts:['um 6:15 Uhr','um 7:30 Uhr','um 9:00 Uhr'],text:'Nora wohnt in Mainz und hat einen Sohn. Er heißt Emil und ist drei Jahre alt. Nora steht jeden Morgen um sechs Uhr fünfzehn auf. Um halb acht bringt sie Emil in die Kita. Danach fährt sie zur Arbeit.'},
{q:'Wann holt Nora Emil am Mittwoch ab?',audio:'/assets/audio/a1-l5-t4-hoeren-08-nora-abholen.mp3',a:'um 15:00 Uhr',opts:['um 13:00 Uhr','um 15:00 Uhr','um 18:30 Uhr'],text:'Nora arbeitet in einem Geschäft. Am Mittwoch ist das Geschäft nur bis dreizehn Uhr geöffnet. Danach geht Nora kurz in die Bibliothek. Um fünfzehn Uhr holt sie Emil von der Kita ab.'},
{q:'Warum hat Nora heute keine Zeit?',audio:'/assets/audio/a1-l5-t4-hoeren-09-nora-fertig.mp3',a:'sie ist fertig',opts:['sie ist fertig','sie geht ins Kino','sie arbeitet die ganze Nacht'],text:'Am Abend ruft eine Freundin an. Sie fragt: Nora, hast du heute Zeit? Nora antwortet: Heute nicht. Ich bin fertig. Ich möchte nur noch lesen und schlafen.'},
{q:'Wann ist der Jugendtreff geöffnet?',audio:'/assets/audio/a1-l5-t4-hoeren-10-jugend.mp3',a:'am Freitag von 16:00 bis 20:00 Uhr',opts:['am Montag von 8:00 bis 12:00 Uhr','am Freitag von 16:00 bis 20:00 Uhr','am Sonntag den ganzen Tag'],text:'Der Jugendtreff Nord ist diese Woche nur am Freitag geöffnet. Jugendliche können von sechzehn bis zwanzig Uhr kommen. Am Samstag ist ein Feiertag, deshalb ist der Jugendtreff geschlossen.'}
];let i=0;function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'schilder.html');return}i=spNextIndex(FILE,ITEMS.length);const it=ITEMS[i];const opts=shuffle(it.opts);area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Hören Sie die Ansage. Wählen Sie die richtige Antwort.')}<div class="audio-box"><audio controls preload="metadata"><source src="${it.audio}" type="audio/mpeg"></audio></div><div class="question">${it.q}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${encodeURIComponent(o)}')">${o}</button>`).join('')}</div><details class="small-help"><summary>Transkript für die Lehrkraft</summary><p>${it.text}</p></details><div id="fb" class="feedback"></div>`}function check(btn,raw){const val=decodeURIComponent(raw),it=ITEMS[i];if(val===it.a){btn.classList.add('ok');fb.textContent='Richtig!';spMarkRight(FILE,ITEMS.length);setTimeout(show,800)}else{btn.classList.add('no');const t=spMarkWrong(FILE,ITEMS.length);fb.innerHTML=help3(t,'Hören Sie noch einmal.','Tipp: Achten Sie auf Zeit, Tag und Ort.',it.a)}}show();</script></body></html>
