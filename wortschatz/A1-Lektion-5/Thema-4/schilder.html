{title:'Krippe Sonnenblume',lines:['Mo–Do: 07:00–16:00 Uhr','Fr: 07:00–13:00 Uhr'],q:'Wann ist die Krippe am Freitag geöffnet?',good:['Die Krippe ist am Freitag von 7:00 bis 13:00 Uhr geöffnet.','Die Krippe ist am Freitag von 7.00 bis 13.00 Uhr geöffnet.'],must:['krippe','freitag','7','13','geoffnet'],tip:'Die Krippe ist am Freitag von 7:00 bis 13:00 Uhr geöffnet.'},
{title:'Stadtbibliothek',lines:['Mo–Fr: 13:00–19:00 Uhr','Sa: 10:00–16:00 Uhr','Feiertag: geschlossen'],q:'Wann ist die Bibliothek am Samstag geöffnet?',good:['Die Bibliothek ist am Samstag von 10:00 bis 16:00 Uhr geöffnet.','Die Bibliothek ist am Samstag von 10 bis 16 Uhr geöffnet.'],must:['bibliothek','samstag','10','16','geoffnet'],tip:'Die Bibliothek ist am Samstag von 10:00 bis 16:00 Uhr geöffnet.'},

function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'lesen.html');return}i=spNextSequentialIndex(FILE,ITEMS.length);const it=ITEMS[i];area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Lesen Sie das Schild. Schreiben Sie einen ganzen Satz und antworten Sie auf die Frage.')}<div class="open-text"><h2>${it.title}</h2>${it.lines.map(l=>`<p><b>${l}</b></p>`).join('')}</div><div class="question">${it.q}</div><textarea id="ans" rows="3" placeholder="Schreiben Sie einen ganzen Satz."></textarea><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
