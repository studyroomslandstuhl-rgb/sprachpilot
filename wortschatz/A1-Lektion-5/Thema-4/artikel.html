<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel üben</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="../data/wortschatz.js?v=7"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=2"></script><script src="l5t4-patch.js?v=5"></script><script src="../Thema-1/points-hook.js?v=5"></script><script>
header('Artikel üben');
const FILE='artikel.html';
const ITEMS=[
{w:'Kita',a:'die',opts:['der','die','das']},
{w:'Kindergarten',a:'der',opts:['der','die','das']},
{w:'Krippe',a:'die',opts:['der','die','das']},
{w:'Geschäft',a:'das',opts:['der','die','das']},
{w:'Bibliothek',a:'die',opts:['der','die','das']},
{w:'Praxis',a:'die',opts:['der','die','das']},
{w:'Kino',a:'das',opts:['der','die','das']},
{w:'Termin',a:'der',opts:['der','die','das']},
{w:'Feiertag',a:'der',opts:['der','die','das']},
{w:'Öffnungszeiten',a:'die',opts:['der','die','das']},
{w:'Schild',a:'das',opts:['der','die','das']},
{w:'Jugend',a:'die',opts:['der','die','das']}
];
let i=0;
function wrongLater(){let st=loadTask(FILE,ITEMS.length),c=st.current;if(c!==null&&c!==undefined&&!st.done.includes(c)&&!st.queue.includes(c))st.queue.push(c);st.current=null;saveTask(FILE,st)}
function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'hoeren-schreiben.html');return}i=spNextIndex(FILE,ITEMS.length);const it=ITEMS[i];const opts=shuffle(it.opts);area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Wählen Sie den richtigen Artikel.')}<div class="question">___ ${it.w}</div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(this,'${o}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}
function check(btn,val){const it=ITEMS[i];if(val===it.a){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,ITEMS.length);setTimeout(show,700)}else{btn.classList.add('no');fb.innerHTML='<div class="no">Noch nicht richtig. Die Frage kommt später wieder.</div>';wrongLater();setTimeout(show,1000)}}
show();
</script></body></html>
