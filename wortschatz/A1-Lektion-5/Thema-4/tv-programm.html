<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV-Programm</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="../data/wortschatz.js?v=7"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=2"></script><script src="../Thema-1/points-hook.js?v=5"></script><script>
header('TV-Programm');
const FILE='tv-programm.html';
const PROGRAM=[['Das Erste','18:30','Nachrichten für Kinder'],['Das Erste','19:05','Lotto am Samstag'],['Das Erste','20:00','Tagesschau'],['ZDF','19:25','Herzensbrecher'],['ZDF','20:15','Fußball live'],['ZDF','22:00','Heute Journal'],['RTL','19:05','Boulevardmagazin'],['RTL','20:15','Film: Schönes Leben'],['RTL','22:30','Actionfilm']];
const ITEMS=[
{wrong:'Die Tagesschau fängt um halb neun an.',right:'Die Tagesschau fängt um zwanzig Uhr an.',must:['tagesschau','zwanzig','uhr']},
{wrong:'Der Film „Schönes Leben“ fängt um 18:30 Uhr an.',right:'Der Film „Schönes Leben“ fängt um 20:15 Uhr an.',must:['film','schones leben','20','15']},
{wrong:'Lotto am Samstag kommt um kurz nach acht.',right:'Lotto am Samstag kommt um kurz nach sieben.',must:['lotto','kurz nach sieben']},
{wrong:'Fußball live kommt im ZDF um 19:25 Uhr.',right:'Fußball live kommt im ZDF um 20:15 Uhr.',must:['fussball','zdf','20','15']},
{wrong:'Der Actionfilm fängt um 22:00 Uhr an.',right:'Der Actionfilm fängt um 22:30 Uhr an.',must:['actionfilm','22','30']},
{wrong:'Herzensbrecher kommt auf RTL.',right:'Herzensbrecher kommt im ZDF.',must:['herzensbrecher','zdf']}
];
let i=0;
function prog(){return '<table class="plan-table"><tr><th>Sender</th><th>Uhrzeit</th><th>Sendung</th></tr>'+PROGRAM.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')+'</table>'}
function norm(x){return simple(x).replace(/ß/g,'ss').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ä/g,'a')}
function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'zuordnen.html');return}i=spNextSequentialIndex(FILE,ITEMS.length);const it=ITEMS[i];area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Lesen Sie das TV-Programm. Der Satz ist falsch. Schreiben Sie den Satz richtig.')}<div class="open-text"><h2>TV-Programm heute</h2>${prog()}</div><div class="sentence-box">${it.wrong}</div><textarea id="ans" rows="3" placeholder="Schreiben Sie den Satz richtig."></textarea><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function check(){const it=ITEMS[i],a=norm(ans.value);if(!a){fb.innerHTML='<div class="no">Bitte schreiben Sie den Satz richtig.</div>';return}const ok=norm(it.right)===a||it.must.every(m=>a.includes(norm(m)));if(ok){ans.classList.add('is-ok');fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,ITEMS.length);setTimeout(show,900)}else{ans.classList.add('is-no');const t=spMarkWrong(FILE,ITEMS.length);fb.innerHTML=help3(t,'Prüfen Sie Sender und Uhrzeit im Programm.','Tipp: Schreiben Sie einen ganzen Satz.',it.right)}}
show();
</script></body></html>
