<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Zuordnen</title><link rel="stylesheet" href="style.css?v=20260825-task10-final1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=20260825-task10-final1"></script><script src="../data/wortschatz.js?v=8"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=4"></script><script src="l5t4-task10-progress-scope.js?v=20260825-2"></script><script src="../Thema-1/points-hook.js?v=5"></script><script>
header('Zuordnen');
const FILE='zuordnen.html';
const REV='20260825-task10-hard-v4';
const ITEMS=[
{w:'das Kino',a:'Hier kann man Filme sehen.',opts:['Hier kann man Filme sehen.','Hier sind Kinder am Tag.','Hier kauft man Brot.']},
{w:'die Krippe',a:'Hier sind sehr kleine Kinder.',opts:['Hier sind sehr kleine Kinder.','Hier kann man Filme sehen.','Hier arbeitet ein Arzt.']},
{w:'die Bibliothek',a:'Hier kann man Bücher ausleihen.',opts:['Hier kann man Bücher ausleihen.','Hier bringt man Kinder am Morgen.','Hier kauft man Schuhe.']},
{w:'das Geschäft',a:'Hier kann man etwas kaufen.',opts:['Hier kann man etwas kaufen.','Hier schlafen Kinder.','Hier liest man einen Fahrplan.']},
{w:'die Öffnungszeiten',a:'Diese Zeiten zeigen: wann ist geöffnet und wann ist geschlossen.',opts:['Diese Zeiten zeigen: wann ist geöffnet und wann ist geschlossen.','Das ist ein freier Tag.','Das ist eine Person.']},
{w:'der Feiertag',a:'An diesem Tag arbeiten viele Menschen nicht.',opts:['An diesem Tag arbeiten viele Menschen nicht.','Das ist ein Telefon.','Das ist eine Uhrzeit am Abend.']},
{w:'das Schild',a:'Darauf stehen Informationen.',opts:['Darauf stehen Informationen.','Damit kocht man Essen.','Damit hört man Musik.']},
{w:'einen Termin vereinbaren',a:'Man macht eine Zeit aus.',opts:['Man macht eine Zeit aus.','Man sieht einen Film.','Man räumt das Zimmer auf.']},
{w:'etwas ausleihen',a:'Man nimmt etwas und bringt es später zurück.',opts:['Man nimmt etwas und bringt es später wieder.','Man bleibt den ganzen Tag zu Hause.','Man öffnet ein Geschäft.']},
{w:'z.B.',a:'Das bedeutet: zum Beispiel.',opts:['Das bedeutet: zum Beispiel.','Das ist ein freier Tag.','Das ist eine Uhrzeit.']}
];
const TOTAL=ITEMS.length;
const KEY=window.SP_L5T4_TASK10_KEY?window.SP_L5T4_TASK10_KEY():taskKey(FILE);
function mix(values){const out=[...values];for(let n=out.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[out[n],out[j]]=[out[j],out[n]]}return out}
function fresh(){return{rev:REV,total:TOTAL,done:[],queue:mix([...Array(TOTAL).keys()]),current:null,tries:0,hadWrong:false}}
function cleanState(value){if(!value||value.rev!==REV||Number(value.total)!==TOTAL||!Array.isArray(value.done)||!Array.isArray(value.queue))return fresh();const done=[...new Set(value.done.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<TOTAL))];const current=Number(value.current);return{rev:REV,total:TOTAL,done,queue:[...new Set(value.queue.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<TOTAL&&!done.includes(n)))],current:Number.isInteger(current)&&current>=0&&current<TOTAL&&!done.includes(current)?current:null,tries:Math.max(0,Number(value.tries)||0),hadWrong:value.hadWrong===true}}
function load(){try{return cleanState(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return fresh()}}
function save(state){state=cleanState(state);localStorage.setItem(KEY,JSON.stringify(state));try{if(typeof window.saveTask==='function')window.saveTask(FILE,state)}catch(e){console.warn('Task 10 Punkte-Sync',e)}return state}
function ensureCurrent(state){if(state.current!==null)return state;if(!state.queue.length&&state.done.length<TOTAL)state.queue=mix([...Array(TOTAL).keys()].filter(n=>!state.done.includes(n)));while(state.queue.length&&state.done.includes(state.queue[0]))state.queue.shift();state.current=state.queue.length?state.queue.shift():null;state.tries=0;state.hadWrong=false;return save(state)}
function progressHtml(state){const done=state.done.length,pct=Math.round(done/TOTAL*100);return`<div class="small">${done} richtig · ${TOTAL-done} übrig · ${pct}%</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>`}
function finish(){document.getElementById('area').innerHTML='<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Geschafft!</div><div class="hint">Diese Aufgabe ist abgeschlossen.</div><div class="actions"><a class="btn" href="saetze-bauen.html">Weiter →</a><a class="btn secondary" href="index.html">Zum Menü</a></div></div>'}
function show(){let state=load();if(state.done.length>=TOTAL){finish();return}state=ensureCurrent(state);if(state.current===null){finish();return}const index=state.current,it=ITEMS[index],opts=mix(it.opts);const area=document.getElementById('area');area.innerHTML=`${progressHtml(state)}${instruction('Was passt zusammen? Wählen Sie die richtige Bedeutung.')}<div class="sentence-box">${it.w}</div><div class="choice-grid" id="answerGrid">${opts.map((text,n)=>`<button class="choice" type="button" data-answer="${n}"></button>`).join('')}</div><div id="fb" class="feedback"></div>`;const buttons=[...document.querySelectorAll('#answerGrid [data-answer]')];buttons.forEach((button,n)=>{button.textContent=opts[n];button.onclick=()=>check(button,opts[n],index)});if(buttons.length!==3)console.error('Task 10: falsche Anzahl Antwortbuttons',buttons.length)}
function check(button,value,index){let state=load();if(state.current!==index)return show();const item=ITEMS[index],feedback=document.getElementById('fb');if(value===item.a){button.classList.add('ok');if(feedback)feedback.innerHTML='<div class="ok">Richtig!</div>';if(state.hadWrong||state.tries>0){if(!state.queue.includes(index))state.queue.push(index)}else if(!state.done.includes(index))state.done.push(index);state.current=null;state.tries=0;state.hadWrong=false;save(state);setTimeout(show,700);return}button.classList.add('no');state.tries=(state.tries||0)+1;state.hadWrong=true;save(state);if(!feedback)return;if(state.tries===1)feedback.innerHTML='<div class="no">Das passt noch nicht. Versuche es noch einmal.</div>';else if(state.tries===2)feedback.innerHTML='<div class="hint">Tipp: Denken Sie an den Ort oder die Situation.</div>';else feedback.innerHTML='<div class="no">Richtige Antwort: <strong>'+item.a+'</strong><br>Wähle die richtige Antwort selbst aus.</div>'}
show();
</script></body></html>
