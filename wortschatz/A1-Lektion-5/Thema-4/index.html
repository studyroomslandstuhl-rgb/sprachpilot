<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lektion 5 · Thema 4</title><link rel="stylesheet" href="style.css?v=2"></head><body><div class="container"><header class="topbar"></header><section class="card progress-card"><div class="circle" id="totalCircle">0%</div><div class="progress-main"><h2>Dein Fortschritt</h2><p class="small" id="totalText">0 Aufgaben abgeschlossen</p><div class="progress"><div class="bar" id="totalBar"></div></div><p class="small">Ziel: Öffnungszeiten, Kino-Programm, Schilder und Zeitangaben verstehen.</p><div id="topicExamSummary"></div></div></section><section class="grid" id="taskGrid"><div class="card">Aufgaben werden geladen …</div></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="../data/wortschatz.js?v=7"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=1"></script><script>try{header(CFG.title,true);const grid=document.getElementById('taskGrid');const circle=document.getElementById('totalCircle');const totalBar=document.getElementById('totalBar');const totalText=document.getElementById('totalText');const tasks=[['karteikarten.html',WORDS.length,'Karteikarten','🃏','Wörter lernen.'],['hoeren.html',6,'Hören: A1-Prüfung','🎧','Höre kurze Ansagen und wähle die Zeit.'],['text-fehler.html',5,'Text lesen: Fehler finden','🔎','Lies Texte und finde den Fehler.'],['jede-zeit.html',10,'jeden / jede / jedes','🧩','Übe jede mit Zeitwörtern.']];function card(t,n){const p=pctFor(t[0],t[1]);return`<a class="module" href="${t[0]}"><div class="num">${n}. ${t[2]}</div><div class="icon">${t[3]}</div><p>${t[4]}</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small">${p}%</div><div class="start">${p>=100?'Fertig':'Starten'}</div></a>`}function simpleCard(file,title,icon,text,n){return`<a class="module" href="${file}"><div class="num">${n}. ${title}</div><div class="icon">${icon}</div><p>${text}</p><div class="start">Öffnen</div></a>`}function exam(n){const p=pctFor('pruefung.html',12);return`<a class="module" href="pruefung.html"><div class="num">${n}. Prüfung</div><div class="icon exam-icon">★</div><p>Prüfe Öffnungszeiten, Hören, Lesen und jede.</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small">${p}%</div><div class="start">${p>=100?'Fertig':'Starten'}</div></a>`}let n=1;grid.innerHTML=simpleCard('uebersicht.html','Übersicht','📋','Alle Wörter nach Wortart sehen.',n++);grid.innerHTML+=simpleCard('statistik.html','Statistik','📊','Sieh deinen Karteikarten-Fortschritt.',n++);grid.innerHTML+=tasks.map(t=>card(t,n++)).join('');grid.innerHTML+=exam(n);const allTasks=[...tasks,['pruefung.html',12]];const avg=Math.round(allTasks.reduce((s,t)=>s+pctFor(t[0],t[1]),0)/allTasks.length)||0;const done=allTasks.filter(t=>pctFor(t[0],t[1])>=100).length;circle.textContent=avg+'%';totalBar.style.width=avg+'%';totalText.textContent=done+' / '+allTasks.length+' Aufgaben abgeschlossen';setTimeout(()=>{const s=document.createElement('script');s.src='../Thema-1/points-hook.js?v=5';document.body.appendChild(s)},1400)}catch(e){console.error(e);const grid=document.getElementById('taskGrid');if(grid)grid.innerHTML='<div class="card"><b>Fehler beim Laden.</b><br>Bitte Seite neu laden.</div>'}</script></body></html>
