<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js?v=20260826-l5t4-central2"></script><script src="../data/wortschatz.js?v=8"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=5"></script><script src="l5t4-progress.js?v=20260826-central2"></script><script src="l5t4-patch.js?v=20260825-12"></script><script src="/wortschatz/A1-Lektion-5/l5-bunny-words.js?v=l5-bunny-all3"></script><script>
header('Hören und schreiben');
const FILE='hoeren-schreiben.html';
const ITEMS=[{say:'anfangen',ans:'anfangen'},{say:'enden',ans:'enden'},{say:'vereinbaren',ans:'vereinbaren'},{say:'ausleihen',ans:'ausleihen'},{say:'Kita',ans:'die Kita'},{say:'Kindergarten',ans:'der Kindergarten'},{say:'Bibliothek',ans:'die Bibliothek'},{say:'Praxis',ans:'die Praxis'},{say:'Öffnungszeiten',ans:'die Öffnungszeiten'},{say:'zum Beispiel',ans:'zum Beispiel'},{say:'total',ans:'total'},{say:'geschlossen',ans:'geschlossen'},{say:'Ich bin total fertig',ans:'Ich bin total fertig'}];
let i=0;
function speak(t){if(typeof window.spL5PlayWord==='function'){window.spL5PlayWord(t,null,{noSpeech:true});return}const box=document.getElementById('fb');if(box)box.innerHTML='<div class="hint">Bunny-Audio konnte nicht geladen werden.</div>'}
function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'hoeren-bild.html');return}i=spNextIndex(FILE,ITEMS.length);const it=ITEMS[i];area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Hören Sie das Wort. Schreiben Sie es richtig. Nomen schreiben Sie mit Artikel.')}<div class="actions"><button class="btn" type="button" id="listenWord">🔊 Hören</button></div><input id="ans" placeholder="Antwort schreiben"><div class="actions"><button class="btn" type="button" id="checkAnswer">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;document.getElementById('listenWord').onclick=()=>speak(it.say);document.getElementById('checkAnswer').onclick=check;document.getElementById('ans').onkeydown=e=>{if(e.key==='Enter')check()}}
function check(){const it=ITEMS[i],input=document.getElementById('ans');if(simple(input.value)===simple(it.ans)){document.getElementById('fb').innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,ITEMS.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,ITEMS.length);document.getElementById('fb').innerHTML=help3(t,'Noch nicht richtig.','Tipp: Bei Nomen muss der Artikel mitgeschrieben werden.',it.ans)}}
show();
</script></body></html>
