<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="../data/wortschatz.js?v=7"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=2"></script><script src="l5t4-patch.js?v=7"></script><script src="../Thema-1/points-hook.js?v=5"></script><script>
header('Hören und schreiben');
const FILE='hoeren-schreiben.html';
const ITEMS=[
{say:'anfangen',ans:'anfangen'},
{say:'enden',ans:'enden'},
{say:'vereinbaren',ans:'vereinbaren'},
{say:'ausleihen',ans:'ausleihen'},
{say:'Kita',ans:'die Kita'},
{say:'Kindergarten',ans:'der Kindergarten'},
{say:'Bibliothek',ans:'die Bibliothek'},
{say:'Praxis',ans:'die Praxis'},
{say:'Öffnungszeiten',ans:'die Öffnungszeiten'},
{say:'zum Beispiel',ans:'zum Beispiel'},
{say:'total',ans:'total'},
{say:'geschlossen',ans:'geschlossen'},
{say:'Ich bin total fertig',ans:'Ich bin total fertig'}
];
let i=0;
function speak(t){if(!('speechSynthesis'in window)){fb.innerHTML='<div class="hint">Audio wird hier nicht unterstützt.</div>';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;speechSynthesis.speak(u)}
function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'hoeren-bild.html');return}i=spNextIndex(FILE,ITEMS.length);const it=ITEMS[i];area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Hören Sie das Wort. Schreiben Sie es richtig. Nomen schreiben Sie mit Artikel.')}<div class="actions"><button class="btn" onclick="speak(ITEMS[i].say)">Hören</button></div><input id="ans" placeholder="Antwort schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function check(){const it=ITEMS[i];if(simple(ans.value)===simple(it.ans)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,ITEMS.length);setTimeout(show,700)}else{const t=spMarkWrong(FILE,ITEMS.length);fb.innerHTML=help3(t,'Noch nicht richtig.','Tipp: Bei Nomen muss der Artikel mitgeschrieben werden.',it.ans)}}
show();
</script></body></html>
