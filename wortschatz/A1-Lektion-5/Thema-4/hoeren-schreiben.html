<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script type="module" src="/js/guard.js"></script><script src="../data/wortschatz.js?v=7"></script><script>window.SP_L5_THEME={id:'Thema-4',title:'Öffnungszeiten und Freizeit',sub:'A1 Lektion 5 · Thema 4',key:'SP_L5_T4_V1'};</script><script src="app.js?v=2"></script><script src="l5t4-patch.js?v=5"></script><script src="../Thema-1/points-hook.js?v=5"></script><script>
header('Hören und schreiben');
const FILE='hoeren-schreiben.html';
const ITEMS=['anfangen','enden','vereinbaren','ausleihen','Kita','Kindergarten','Bibliothek','Praxis','Öffnungszeiten','zum Beispiel','total','geschlossen'];
let i=0;
function speak(t){if(!('speechSynthesis'in window)){fb.innerHTML='<div class="hint">Audio wird hier nicht unterstützt.</div>';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;speechSynthesis.speak(u)}
function wrongLater(){let st=loadTask(FILE,ITEMS.length),c=st.current;if(c!==null&&c!==undefined&&!st.done.includes(c)&&!st.queue.includes(c))st.queue.push(c);st.current=null;saveTask(FILE,st)}
function show(){if(loadTask(FILE,ITEMS.length).done.length>=ITEMS.length){complete(area,FILE,'hoeren-bild.html');return}i=spNextIndex(FILE,ITEMS.length);const w=ITEMS[i];area.innerHTML=`${spProgressHtml(FILE,ITEMS.length)}${instruction('Hören Sie das Wort. Schreiben Sie das Wort richtig.')}<div class="actions"><button class="btn" onclick="speak(ITEMS[i])">Hören</button></div><input id="ans" placeholder="Wort schreiben"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}
function check(){const w=ITEMS[i];if(simple(ans.value)===simple(w)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,ITEMS.length);setTimeout(show,700)}else{fb.innerHTML='<div class="no">Noch nicht richtig. Das Wort kommt später wieder.</div>';wrongLater();setTimeout(show,1000)}}
show();
</script></body></html>
