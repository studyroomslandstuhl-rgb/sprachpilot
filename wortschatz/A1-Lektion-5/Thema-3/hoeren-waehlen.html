<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Hören und schreiben');const FILE='hoeren-waehlen.html';const TOTAL=6;const STORY='Ich heiße Peter. Jeden Morgen stehe ich um sieben Uhr auf und frühstücke. Am Vormittag lerne ich Deutsch im Kurs. Am Mittag esse ich mit Anna. Am Nachmittag räume ich die Wohnung auf und kaufe ein. Am Abend sehe ich fern und rufe meinen Freund an. In der Nacht schlafe ich.';const SENT=[{start:'Am Morgen',answers:['Am Morgen steht Peter um sieben Uhr auf und frühstückt.','Am Morgen steht er um sieben Uhr auf und frühstückt.','Am Morgen steht Peter auf und frühstückt.','Am Morgen steht er auf und frühstückt.']},{start:'Am Vormittag',answers:['Am Vormittag lernt Peter Deutsch im Kurs.','Am Vormittag lernt er Deutsch im Kurs.','Am Vormittag lernt Peter Deutsch.','Am Vormittag lernt er Deutsch.']},{start:'Am Mittag',answers:['Am Mittag isst Peter mit Anna.','Am Mittag isst er mit Anna.']},{start:'Am Nachmittag',answers:['Am Nachmittag räumt Peter die Wohnung auf und kauft ein.','Am Nachmittag räumt er die Wohnung auf und kauft ein.','Am Nachmittag räumt Peter auf und kauft ein.','Am Nachmittag räumt er auf und kauft ein.']},{start:'Am Abend',answers:['Am Abend sieht Peter fern und ruft seinen Freund an.','Am Abend sieht er fern und ruft seinen Freund an.']},{start:'In der Nacht',answers:['In der Nacht schläft Peter.','In der Nacht schläft er.']}];function norm(s){return simple(String(s||'').replace(/\s+/g,' ').trim())}function good(v,arr){const raw=String(v||'').trim();if(!/^[A-ZÄÖÜ]/.test(raw)||!/\.$/.test(raw))return false;const n=norm(raw);return arr.some(a=>n===norm(a))}function show(){const st=loadTask(FILE,TOTAL);if(st.done.length>=TOTAL){complete(area,FILE,'plan-lesen.html');return}area.innerHTML=`${spProgressHtml(FILE,TOTAL)}<div class="question">Hören Sie Peters Erzählung. Schreiben Sie die Sätze fertig.</div><div class="actions"><button class="btn" onclick="sayGerman(STORY)">▶ Erzählung hören</button></div><div class="dialog-box"><b>Peter erzählt:</b><br>${STORY}</div><div class="answer-row">${SENT.map((s,i)=>`<label><b>${s.start} ...</b><input id="a${i}" class="input-line" placeholder="${s.start} ..."></label>`).join('')}</div><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){let st=loadTask(FILE,TOTAL);let wrong=[];SENT.forEach((s,i)=>{if(good(document.getElementById('a'+i).value,s.answers)){if(!st.done.includes(i))st.done.push(i)}else wrong.push(i+1)});saveTask(FILE,st);if(!wrong.length){fb.innerHTML='<div class="ok">Richtig! Alle Sätze sind vollständig.</div>';setTimeout(show,700)}else{fb.innerHTML='<div class="no">Noch nicht richtig: Satz '+wrong.join(', ')+'. Achte auf Großschreibung, Punkt und Verbform.</div>'}}show();</script></body></html>
