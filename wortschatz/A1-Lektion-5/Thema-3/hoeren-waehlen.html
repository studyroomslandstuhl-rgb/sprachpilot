<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Hören und schreiben');const FILE='hoeren-waehlen.html';const TOTAL=6;const AUDIO='/assets/audio/a1-l5-t3/a1-l5-t3-hoeren-schreiben-01-peter.mp3';const STORY='Ich heiße Peter. Jeden Morgen stehe ich um sieben Uhr auf und frühstücke. Am Vormittag lerne ich Deutsch im Kurs. Am Mittag esse ich mit Anna. Am Nachmittag räume ich die Wohnung auf und kaufe ein. Am Abend sehe ich fern und rufe meinen Freund an. In der Nacht schlafe ich.';const SENT=[{answers:['Jeden Morgen steht Peter um sieben Uhr auf und frühstückt.','Am Morgen steht Peter um sieben Uhr auf und frühstückt.','Peter steht jeden Morgen um sieben Uhr auf und frühstückt.']},{answers:['Am Vormittag lernt Peter Deutsch im Kurs.','Peter lernt am Vormittag Deutsch im Kurs.','Am Vormittag lernt er Deutsch im Kurs.']},{answers:['Am Mittag isst Peter mit Anna.','Peter isst am Mittag mit Anna.','Am Mittag isst er mit Anna.']},{answers:['Am Nachmittag räumt Peter die Wohnung auf und kauft ein.','Peter räumt am Nachmittag die Wohnung auf und kauft ein.','Am Nachmittag räumt er die Wohnung auf und kauft ein.']},{answers:['Am Abend sieht Peter fern und ruft seinen Freund an.','Peter sieht am Abend fern und ruft seinen Freund an.','Am Abend sieht er fern und ruft seinen Freund an.']},{answers:['In der Nacht schläft Peter.','Peter schläft in der Nacht.','In der Nacht schläft er.']}];function norm(s){return simple(String(s||'').replace(/\s+/g,' ').trim())}function good(v,arr){const raw=String(v||'').trim();if(!/^[A-ZÄÖÜ]/.test(raw)||!/\.$/.test(raw))return false;const n=norm(raw);return arr.some(a=>n===norm(a))}function playFallback(){sayGerman(STORY)}function audioBox(){return `<div class="actions"><audio id="aud" controls preload="none" src="${AUDIO}"></audio><button class="btn secondary" onclick="playFallback()">Browser-Stimme</button></div><div class="small">Falls die Datei nicht lädt, prüfe den Dateinamen im Ordner /assets/audio/a1-l5-t3/.</div>`}function show(){const st=loadTask(FILE,TOTAL);if(st.done.length>=TOTAL){complete(area,FILE,'plan-lesen.html');return}area.innerHTML=`${spProgressHtml(FILE,TOTAL)}<div class="question">Hören Sie Peters Erzählung. Schreiben Sie die Sätze.</div>${audioBox()}<div class="answer-row">${SENT.map((s,i)=>`<label><b>Satz ${i+1}</b><input id="a${i}" class="input-line" placeholder="Schreiben Sie Satz ${i+1}"></label>`).join('')}</div><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){let st=loadTask(FILE,TOTAL);let wrong=[];SENT.forEach((s,i)=>{if(good(document.getElementById('a'+i).value,s.answers)){if(!st.done.includes(i))st.done.push(i)}else wrong.push(i+1)});saveTask(FILE,st);if(!wrong.length){fb.innerHTML='<div class="ok">Richtig! Alle Sätze sind vollständig.</div>';setTimeout(show,700)}else{fb.innerHTML='<div class="no">Noch nicht richtig: Satz '+wrong.join(', ')+'. Hören Sie noch einmal. Achten Sie auf Großschreibung und Punkt.</div>'}}show();</script></body></html>
