<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Hören und schreiben');const FILE='hoeren-waehlen.html';const TOTAL=6;const AUDIO='/assets/audio/a1-l5-t3-hoeren-schreiben-01-wochenende-peter.mp3';const SENT=[{answers:['Peter steht am Samstag um sieben Uhr auf.','Am Samstag steht Peter um sieben Uhr auf.','Peter steht am Samstag um 7 Uhr auf.','Am Samstag steht Peter um 7 Uhr auf.']},{answers:['Peter frühstückt am Samstag.','Am Samstag frühstückt Peter.','Peter frühstückt am Samstag am Morgen.','Am Samstag am Morgen frühstückt Peter.']},{answers:['Peter räumt am Samstag die Wohnung auf.','Am Samstag räumt Peter die Wohnung auf.','Peter räumt am Morgen die Wohnung auf.','Am Morgen räumt Peter die Wohnung auf.']},{answers:['Peter kauft am Nachmittag ein.','Am Nachmittag kauft Peter ein.','Peter kauft am Samstag am Nachmittag ein.','Am Samstag am Nachmittag kauft Peter ein.']},{answers:['Peter isst mit Anna.','Peter isst am Nachmittag mit Anna.','Am Nachmittag isst Peter mit Anna.','Peter isst danach mit Anna.']},{answers:['Peter schläft am Sonntag lange.','Am Sonntag schläft Peter lange.','Peter lernt am Sonntag am Nachmittag Deutsch.','Am Sonntag am Nachmittag lernt Peter Deutsch.','Peter lernt am Nachmittag Deutsch.','Am Nachmittag lernt Peter Deutsch.']}];function norm(s){return simple(String(s||'').replace(/\s+/g,' ').trim())}function good(v,arr){const raw=String(v||'').trim();if(!/^[A-ZÄÖÜ]/.test(raw)||!/\.$/.test(raw))return false;const n=norm(raw);return arr.some(a=>n===norm(a))}function audioBox(){return `<div class="actions"><audio id="aud" controls preload="none" src="${AUDIO}"></audio></div><div class="small">Dateiname: a1-l5-t3-hoeren-schreiben-01-wochenende-peter.mp3</div>`}function show(){const st=loadTask(FILE,TOTAL);if(st.done.length>=TOTAL){complete(area,FILE,'plan-lesen.html');return}area.innerHTML=`${spProgressHtml(FILE,TOTAL)}<div class="question">Hören Sie den Dialog. Schreiben Sie 6 Sätze über Peter.</div>${audioBox()}<div class="answer-row">${SENT.map((s,i)=>`<label><b>Satz ${i+1}</b><input id="a${i}" class="input-line" placeholder="Schreiben Sie Satz ${i+1}"></label>`).join('')}</div><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){let st=loadTask(FILE,TOTAL);let wrong=[];SENT.forEach((s,i)=>{if(good(document.getElementById('a'+i).value,s.answers)){if(!st.done.includes(i))st.done.push(i)}else wrong.push(i+1)});saveTask(FILE,st);if(!wrong.length){fb.innerHTML='<div class="ok">Richtig! Alle Sätze sind vollständig.</div>';setTimeout(show,700)}else{fb.innerHTML='<div class="no">Noch nicht richtig: Satz '+wrong.join(', ')+'. Hören Sie noch einmal. Schreiben Sie ganze Sätze über Peter.</div>'}}show();</script></body></html>
