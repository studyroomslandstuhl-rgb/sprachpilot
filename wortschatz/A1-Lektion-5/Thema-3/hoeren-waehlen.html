<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=6"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Hören und schreiben');const FILE='hoeren-waehlen.html';const TOTAL=6;const AUDIO='/assets/audio/a1-l5-t3-hoeren-schreiben-01-wochenende-peter.mp3';const SENT=[{q:'Wann steht Peter am Samstag auf?',answers:['Peter steht am Samstag um sieben Uhr auf.','Am Samstag steht Peter um sieben Uhr auf.','Peter steht am Samstag um 7 Uhr auf.','Am Samstag steht Peter um 7 Uhr auf.']},{q:'Was macht Peter am Samstag am Morgen?',answers:['Peter frühstückt am Samstag am Morgen.','Am Samstag am Morgen frühstückt Peter.','Peter frühstückt am Morgen.','Am Morgen frühstückt Peter.','Peter frühstückt am Samstag.','Am Samstag frühstückt Peter.']},{q:'Was räumt Peter auf?',answers:['Peter räumt die Wohnung auf.','Peter räumt am Samstag die Wohnung auf.','Am Samstag räumt Peter die Wohnung auf.','Peter räumt am Morgen die Wohnung auf.','Am Morgen räumt Peter die Wohnung auf.']},{q:'Was macht Peter am Nachmittag?',answers:['Peter kauft am Nachmittag ein.','Am Nachmittag kauft Peter ein.','Peter kauft am Samstag am Nachmittag ein.','Am Samstag am Nachmittag kauft Peter ein.']},{q:'Mit wem isst Peter?',answers:['Peter isst mit Anna.','Peter isst am Nachmittag mit Anna.','Am Nachmittag isst Peter mit Anna.','Peter isst danach mit Anna.']},{q:'Was macht Peter am Sonntag am Nachmittag?',answers:['Peter lernt am Sonntag am Nachmittag Deutsch.','Am Sonntag am Nachmittag lernt Peter Deutsch.','Peter lernt am Nachmittag Deutsch.','Am Nachmittag lernt Peter Deutsch.','Peter lernt ein bisschen Deutsch.','Am Sonntag lernt Peter ein bisschen Deutsch.']}];function norm(s){return simple(String(s||'').replace(/\s+/g,' ').trim())}function good(v,arr){const raw=String(v||'').trim();if(!/^[A-ZÄÖÜ]/.test(raw)||!/\.$/.test(raw))return false;const n=norm(raw);return arr.some(a=>n===norm(a))}function audioBox(){return `<div class="audio-panel"><audio id="aud" controls preload="none" src="${AUDIO}"></audio></div>`}function show(){const st=loadTask(FILE,TOTAL);if(st.done.length>=TOTAL){complete(area,FILE,'plan-lesen.html');return}area.innerHTML=`${spProgressHtml(FILE,TOTAL)}<div class="listen-card"><div class="listen-title">Hören Sie den Dialog. Antworten Sie in ganzen Sätzen.</div>${audioBox()}<div class="listen-list">${SENT.map((s,i)=>`<div class="listen-item"><div class="listen-q">${i+1}. ${s.q}</div><input id="a${i}" class="input-line" placeholder="Antwort als ganzer Satz"></div>`).join('')}</div><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div></div>`}function check(){let st=loadTask(FILE,TOTAL);let wrong=[];SENT.forEach((s,i)=>{if(good(document.getElementById('a'+i).value,s.answers)){if(!st.done.includes(i))st.done.push(i)}else wrong.push(i+1)});saveTask(FILE,st);if(!wrong.length){fb.innerHTML='<div class="ok">Richtig! Alle Sätze sind vollständig.</div>';setTimeout(show,700)}else{fb.innerHTML='<div class="no">Noch nicht richtig: Aufgabe '+wrong.join(', ')+'. Hören Sie noch einmal und antworten Sie genau auf die Frage.</div>'}}show();</script></body></html>
