<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören auswählen</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Hören → auswählen');const FILE='hoeren-waehlen.html',LIST=HEAR;let i=0;function sh(a){return a.sort(()=>Math.random()-.5)}function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'plan-lesen.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i],opts=sh([...x[2]]);area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Höre und wähle die richtige Zeitangabe.</div><div class="actions"><button class="btn" onclick="sayGerman(LIST[i][0])">▶ Hören</button></div><div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}function check(v){const x=LIST[i];if(simple(v)===simple(x[1])){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Noch einmal hören.</div>':'<div class="no">Lösung: '+x[1]+'</div>'}}show();</script></body></html>
