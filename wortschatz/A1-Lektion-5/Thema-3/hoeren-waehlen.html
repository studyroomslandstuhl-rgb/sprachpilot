<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=9"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Hören und schreiben');const FILE='hoeren-waehlen.html';const TOTAL=6;const AUDIO='/assets/audio/a1-l5-t3-hoeren-schreiben-01-wochenende-peter.mp3';const SENT=[{q:'Wann steht Peter am Samstag auf?',help:'Nenne Person und Zeit. Erlaubt: Peter/er, sieben/7, Subjekt am Anfang oder nach der Zeit.',example:'Peter steht am Samstag um sieben Uhr auf.'},{q:'Was macht Peter am Samstag am Morgen?',help:'Nenne Person und Tätigkeit: frühstücken. Peter oder er ist möglich.',example:'Er frühstückt am Morgen.'},{q:'Was räumt Peter auf?',help:'Nenne Person, Tätigkeit und Objekt: die Wohnung aufräumen.',example:'Peter räumt die Wohnung auf.'},{q:'Was macht Peter am Nachmittag?',help:'Achte auf das trennbare Verb: einkaufen → Peter kauft ... ein.',example:'Am Nachmittag kauft er ein.'},{q:'Mit wem isst Peter?',help:'Nenne Person und mit wem: mit Anna.',example:'Peter isst mit Anna.'},{q:'Was macht Peter am Sonntag am Nachmittag?',help:'Nenne Person und Tätigkeit: Deutsch lernen. Peter oder er ist möglich.',example:'Am Sonntag am Nachmittag lernt er Deutsch.'}];function nrm(s){return simple(String(s||'').toLowerCase()).replace(/\./g,'').replace(/\s+/g,' ').trim().replace(/sieben/g,'7').replace(/peter/g,'er').replace(/fruehstueckt/g,'fruhstuckt').replace(/frühstückt/g,'fruhstuckt').replace(/raeumt/g,'raumt').replace(/räumt/g,'raumt')}function has(n,...xs){return xs.every(x=>n.includes(x))}function fullSentence(raw){return /^[A-ZÄÖÜ]/.test(String(raw||'').trim())&&/\.$/.test(String(raw||'').trim())}function goodByIndex(i,raw){if(!fullSentence(raw))return false;const n=nrm(raw);if(!/\ber\b/.test(n))return false;if(i===0)return has(n,'steht','auf','um 7 uhr');if(i===1)return n.includes('fruhstuckt');if(i===2)return has(n,'raumt','wohnung','auf');if(i===3)return has(n,'kauft','ein');if(i===4)return has(n,'isst','anna');if(i===5)return has(n,'lernt','deutsch');return false}function audioBox(){return `<div class="audio-panel"><audio controls preload="none" src="${AUDIO}"></audio></div>`}function show(){const st=loadTask(FILE,TOTAL);if(st.done.length>=TOTAL){complete(area,FILE,'plan-lesen.html');return}area.innerHTML=`${spProgressHtml(FILE,TOTAL)}<div class="listen-card"><div class="listen-title">Hören Sie den Dialog. Antworten Sie in ganzen Sätzen.</div>${audioBox()}<div class="listen-list">${SENT.map((s,i)=>`<div class="listen-item" id="item${i}"><div class="listen-q">${i+1}. ${s.q}</div><input id="a${i}" class="input-line" placeholder="Antwort als ganzer Satz"><div id="r${i}" style="margin-top:10px;font-weight:900"></div><div id="h${i}" style="display:none;margin-top:10px;border:2px solid #fecaca;background:#fff1f2;color:#991b1b;border-radius:14px;padding:12px;font-weight:800;line-height:1.35"></div></div>`).join('')}</div><button class="btn" onclick="check()">Kontrollieren</button><button id="nextBtn" class="btn secondary hidden" onclick="show()">Weiter</button><div id="fb" class="feedback"></div></div>`}function mark(i,okState,msg,answer){const item=document.getElementById('item'+i);const input=document.getElementById('a'+i);const res=document.getElementById('r'+i);const help=document.getElementById('h'+i);if(okState){item.style.borderColor='#16a34a';item.style.background='#f0fdf4';input.style.borderColor='#16a34a';input.style.background='#f0fdf4';res.style.color='#166534';res.innerHTML='✓ Satz '+(i+1)+' ist richtig.';help.style.display='none';help.innerHTML=''}else{item.style.borderColor='#dc2626';item.style.background='#fff1f2';input.style.borderColor='#dc2626';input.style.background='#fff1f2';res.style.color='#991b1b';res.innerHTML='✗ Satz '+(i+1)+' ist falsch.';help.style.display='block';help.innerHTML='<b>Hilfe zu Satz '+(i+1)+':</b> '+msg+'<br><b>Mögliche richtige Antwort:</b> '+answer}}function check(){let st=loadTask(FILE,TOTAL);let wrong=[];let right=[];SENT.forEach((s,i)=>{const val=document.getElementById('a'+i).value;if(goodByIndex(i,val)){if(!st.done.includes(i))st.done.push(i);right.push(i+1);mark(i,true,'','')}else{wrong.push(i+1);mark(i,false,s.help,s.example)}});saveTask(FILE,st);if(!wrong.length){fb.innerHTML='<div class="ok">Alle Sätze sind richtig. Grün: Aufgabe '+right.join(', ')+'.</div>';document.getElementById('nextBtn').classList.remove('hidden')}else{fb.innerHTML='<div class="no">Rot: Aufgabe '+wrong.join(', ')+'. Grün: '+(right.length?'Aufgabe '+right.join(', '):'keine Aufgabe')+'. Hilfe und richtige Antwort stehen nur bei den roten Aufgaben.</div>'}}show();</script></body></html>
