<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören und schreiben</title><link rel="stylesheet" href="style.css?v=11"></head><body><script type="module" src="/js/guard.js?v=perf3"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=4"></script><script src="../l5-bunny-words.js?v=l5-bunny-all3"></script><script src="../l5-points.js?v=2"></script><script>header('Hören und schreiben');const FILE='hoeren-waehlen.html';const TOTAL=6;const AUDIO='/assets/audio/a1-l5-t3-hoeren-schreiben-01-wochenende-peter.mp3?v=3';let TRIES=Array(TOTAL).fill(0);const SENT=[{q:'Wann steht Peter am Samstag auf?',tip:'Nenne Person, Uhrzeit und das trennbare Verb „aufstehen“. Peter oder er ist möglich. Sieben oder 7 ist möglich.',example:'Peter steht am Samstag um sieben Uhr auf.'},{q:'Was macht Peter am Samstagmorgen?',tip:'Achte auf die Tätigkeit „frühstücken“. Richtig ist „am Samstagmorgen“, nicht „am Samstag am Morgen“.',example:'Peter frühstückt am Samstagmorgen.'},{q:'Was räumt Peter auf?',tip:'Achte auf das Objekt: die Wohnung. Das Verb ist trennbar: aufräumen.',example:'Peter räumt die Wohnung auf.'},{q:'Was macht Peter am Nachmittag?',tip:'Achte auf das trennbare Verb: einkaufen → Peter kauft ... ein.',example:'Am Nachmittag kauft er ein.'},{q:'Mit wem isst Peter?',tip:'Achte auf die Person: mit Anna.',example:'Peter isst mit Anna.'},{q:'Was macht Peter am Sonntagnachmittag?',tip:'Achte auf die Tätigkeit: Deutsch lernen. Richtig ist „am Sonntagnachmittag“, nicht „am Sonntag am Nachmittag“.',example:'Am Sonntagnachmittag lernt er Deutsch.'}];function nrm(s){let x=String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');const map={sieben:'7',zwolf:'12',zwoelf:'12'};Object.keys(map).forEach(k=>{x=x.replace(new RegExp('\\b'+k+'\\b','g'),map[k])});return x.replace(/\b(\d{1,2})\s*:\s*00\s*uhr\b/g,'$1 uhr').replace(/\b(\d{1,2})\s*:\s*00\b/g,'$1 uhr').replace(/[!?;:]/g,'').replace(/\.$/,'').replace(/peter/g,'er').replace(/fruehstueckt/g,'fruhstuckt').replace(/raeumt/g,'raumt').replace(/sonntag nachmittag/g,'sonntagnachmittag').replace(/samstag morgen/g,'samstagmorgen').replace(/\s+/g,' ').trim()}function badTimePhrase(n){return n.includes('samstag am morgen')||n.includes('sonntag am nachmittag')}function has(n,...xs){return xs.every(x=>n.includes(x))}function fullSentence(raw){return /^[A-ZÄÖÜ]/.test(String(raw||'').trim())&&/\.$/.test(String(raw||'').trim())}function goodByIndex(i,raw){if(!fullSentence(raw))return false;const n=nrm(raw);if(badTimePhrase(n))return false;if(!/\ber\b/.test(n))return false;if(i===0)return has(n,'steht','auf','um 7 uhr');if(i===1)return n.includes('fruhstuckt');if(i===2)return has(n,'raumt','wohnung','auf');if(i===3)return /\bkauft\b.*\bein\b/.test(n)||/\beinkauft\b/.test(n);if(i===4)return has(n,'isst','anna');if(i===5)return has(n,'lernt','deutsch');return false}function audioBox(){return `<div class="audio-panel"><audio controls preload="none" src="${AUDIO}"></audio></div>`}function show(){const st=loadTask(FILE,TOTAL);if(st.done.length>=TOTAL){complete(area,FILE,'plan-lesen.html');return}area.innerHTML=`${spProgressHtml(FILE,TOTAL)}<div class="listen-card"><div class="listen-title">Hören Sie den Dialog. Antworten Sie in ganzen Sätzen.</div>${audioBox()}<div class="listen-list">${SENT.map((s,i)=>`<div class="listen-item" id="item${i}"><div class="listen-q">${i+1}. ${s.q}</div><input id="a${i}" class="input-line" placeholder="Antwort als ganzer Satz"><div id="r${i}" style="margin-top:10px;font-weight:900"></div><div id="h${i}" style="display:none;margin-top:10px;border:2px solid #fecaca;background:#fff1f2;color:#991b1b;border-radius:14px;padding:12px;font-weight:800;line-height:1.35"></div></div>`).join('')}</div><button class="btn" onclick="check()">Kontrollieren</button><button id="nextBtn" class="btn secondary hidden" onclick="show()">Weiter</button><div id="fb" class="feedback"></div></div>`}function markOk(i){const item=document.getElementById('item'+i),input=document.getElementById('a'+i),res=document.getElementById('r'+i),help=document.getElementById('h'+i);item.style.borderColor='#16a34a';item.style.background='#f0fdf4';input.style.borderColor='#16a34a';input.style.background='#f0fdf4';res.style.color='#166534';res.innerHTML='✓ Satz '+(i+1)+' ist richtig.';help.style.display='none';help.innerHTML=''}function markNo(i,html){const item=document.getElementById('item'+i),input=document.getElementById('a'+i),res=document.getElementById('r'+i),help=document.getElementById('h'+i);item.style.borderColor='#dc2626';item.style.background='#fff1f2';input.style.borderColor='#dc2626';input.style.background='#fff1f2';res.style.color='#991b1b';res.innerHTML='✗ Satz '+(i+1)+' ist falsch.';help.style.display='block';help.innerHTML=html}function feedbackFor(i,raw){const s=SENT[i];if(!String(raw||'').trim())return '<b>Hilfe zu Satz '+(i+1)+':</b> Antworte bitte mit einem ganzen Satz.';TRIES[i]++;if(TRIES[i]===1)return '<b>Hilfe zu Satz '+(i+1)+':</b> Achte bitte darauf: '+s.tip;if(TRIES[i]===2)return '<b>Hilfe zu Satz '+(i+1)+':</b> Noch nicht richtig. '+s.tip+'<br><b>Mögliche richtige Antwort:</b> '+s.example;return '<b>Lösung zu Satz '+(i+1)+':</b> '+s.example}function check(){let st=loadTask(FILE,TOTAL);let wrong=[];let right=[];SENT.forEach((s,i)=>{const val=document.getElementById('a'+i).value;if(goodByIndex(i,val)){if(!st.done.includes(i))st.done.push(i);right.push(i+1);markOk(i)}else{wrong.push(i+1);markNo(i,feedbackFor(i,val))}});saveTask(FILE,st);if(!wrong.length){fb.innerHTML='<div class="ok">Alle Sätze sind richtig. Grün: Aufgabe '+right.join(', ')+'.</div>';document.getElementById('nextBtn').classList.remove('hidden')}else{fb.innerHTML='<div class="no">Rot: Aufgabe '+wrong.join(', ')+'. Grün: '+(right.length?'Aufgabe '+right.join(', '):'keine Aufgabe')+'. Hilfe steht nur bei den roten Aufgaben.</div>'}}show();</script></body></html>
