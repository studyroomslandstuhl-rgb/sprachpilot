<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volle Sätze</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Volle Sätze');const FILE='sprechen.html',LIST=SPEAK;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'dialoge.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Antworten Sie mit einem ganzen Satz.</div><div class="sentence-box">${x[0]}</div><div class="actions"><button id="micBtn" class="btn" onclick="rec()">🎤 Sprechen</button><button class="btn secondary" onclick="box.classList.remove('hidden')">Ich kann nicht sprechen</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="hidden"><input id="ans" class="input-line" placeholder="Ganzer Satz"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function rec(){startMic(micBtn,v=>{box.classList.remove('hidden');ans.value=v;check(v)})}function check(v){const x=LIST[i];if(ok(v,x[1])){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,700)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Das passt noch nicht. Bitte als ganzen Satz antworten.</div>':'<div class="no">Möglich: '+x[1][0]+'</div>'}}show();</script></body></html>
