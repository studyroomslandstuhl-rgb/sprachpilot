<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volle Sätze</title><link rel="stylesheet" href="style.css?v=5"></head><body><script type="module" src="/js/guard.js?v=perf3"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=4"></script><script src="../l5-points.js?v=2"></script><script>header('Volle Sätze');const FILE='sprechen.html';const LIST=[['Wann lernen Sie Deutsch?','Vormittag',['Ich lerne am Vormittag Deutsch.','Am Vormittag lerne ich Deutsch.','Deutsch lerne ich am Vormittag.']],['Wann räumen Sie auf?','Samstag',['Ich räume am Samstag auf.','Am Samstag räume ich auf.']],['Wann sehen Sie fern?','Abend',['Ich sehe am Abend fern.','Am Abend sehe ich fern.']],['Wann stehen Sie auf?','7 Uhr',['Ich stehe um 7 Uhr auf.','Um 7 Uhr stehe ich auf.','Ich stehe um sieben Uhr auf.','Um sieben Uhr stehe ich auf.']],['Wann arbeiten Sie?','Montag bis Freitag',['Ich arbeite von Montag bis Freitag.','Von Montag bis Freitag arbeite ich.']],['Wann rufen Sie an?','12 Uhr',['Ich rufe um 12 Uhr an.','Um 12 Uhr rufe ich an.','Ich rufe um zwölf Uhr an.','Um zwölf Uhr rufe ich an.']],['Wann schlafen Sie?','Nacht',['Ich schlafe in der Nacht.','In der Nacht schlafe ich.']],['Wann ist der Kurs?','Montag, 9-12 Uhr',['Der Kurs ist am Montag von 9 bis 12 Uhr.','Am Montag ist der Kurs von 9 bis 12 Uhr.','Ich habe am Montag von 9 bis 12 Uhr Kurs.']]];let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'satzvarianten.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="speaking-card"><div class="question">Antworten Sie mit einem ganzen Satz.</div><div class="speaking-question">${x[0]}</div><div class="speaking-cue">${x[1]}</div><div class="speaking-actions"><button id="micBtn" class="btn" onclick="rec()">🎤 Sprechen</button><button class="btn secondary" onclick="box.classList.remove('hidden')">Ich kann nicht sprechen</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="hidden"><input id="ans" class="input-line" placeholder="Ganzer Satz"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div></div>`}function rec(){startMic(micBtn,v=>{box.classList.remove('hidden');ans.value=v;check(v)})}function check(v){const x=LIST[i];if(ok(v,x[2])){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,700)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Das passt noch nicht. Antworten Sie mit einem ganzen Satz.</div>':'<div class="no">Möglich: '+x[2][0]+' / '+x[2][1]+'</div>'}}show();</script></body></html>
