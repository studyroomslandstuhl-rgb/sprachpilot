<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan lesen</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Plan lesen');const FILE='plan-lesen.html';const PLAN2=[['Mo','9-12 Uhr','Deutschkurs'],['Di','15 Uhr','Termin'],['Mi','18-19 Uhr','Training'],['Do','15-16 Uhr','aufräumen'],['Fr','20 Uhr','fernsehen'],['Sa','22-7 Uhr','schlafen']];const LIST=[['Wann ist der Deutschkurs?',['Der Deutschkurs ist am Montag von 9 bis 12 Uhr.','Am Montag ist der Deutschkurs von 9 bis 12 Uhr.']],['Wann ist der Termin?',['Der Termin ist am Dienstag um 15 Uhr.','Am Dienstag ist der Termin um 15 Uhr.']],['Wann ist das Training?',['Das Training ist am Mittwoch von 18 bis 19 Uhr.','Am Mittwoch ist das Training von 18 bis 19 Uhr.']],['Wann räumt die Person auf?',['Die Person räumt am Donnerstag von 15 bis 16 Uhr auf.','Am Donnerstag räumt die Person von 15 bis 16 Uhr auf.','Von 15 bis 16 Uhr räumt die Person am Donnerstag auf.','Die Person räumt am Donnerstagnachmittag auf.','Am Donnerstagnachmittag räumt die Person auf.']],['Wann sieht die Person fern?',['Die Person sieht am Freitag um 20 Uhr fern.','Am Freitag sieht die Person um 20 Uhr fern.','Um 20 Uhr sieht die Person am Freitag fern.','Die Person sieht am Freitagabend fern.','Am Freitagabend sieht die Person fern.']],['Wann schläft die Person?',['Die Person schläft am Samstag von 22 bis 7 Uhr.','Am Samstag schläft die Person von 22 bis 7 Uhr.','Von 22 bis 7 Uhr schläft die Person am Samstag.','Die Person schläft in der Nacht.','In der Nacht schläft die Person.']]];let i=0;function table(){return `<table class="plan-table"><tr><th>Tag</th><th>Zeit</th><th>Aktivität</th></tr>${PLAN2.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`}function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'sprechen.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Lies den Plan. Antworte mit einem ganzen Satz.</div>${table()}<div class="sentence-box">${x[0]}</div><input id="ans" class="input-line" placeholder="Ganzer Satz"><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const x=LIST[i];const raw=String(ans.value||'').trim();if(!/^[A-ZÄÖÜ]/.test(raw)||!/\.$/.test(raw)){spMarkWrong(FILE,LIST.length);fb.innerHTML='<div class="no">Schreibe bitte einen ganzen Satz: groß anfangen und mit Punkt enden.</div>';return}if(ok(raw,x[1])){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Noch einmal. Schreibe den Tag aus und entscheide: um, am oder von ... bis?</div>':'<div class="no">Möglich: '+x[1][0]+'</div>'}}show();</script></body></html>
