<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan lesen</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Plan lesen');const FILE='plan-lesen.html',LIST=PLAN_Q;let i=0;function table(){return `<table class="plan-table"><tr><th>Tag</th><th>Zeit</th><th>Aktivität</th></tr>${PLAN.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`}function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'sprechen.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Lies den Plan und antworte. Kurze Antwort oder ganzer Satz.</div>${table()}<div class="sentence-box">${x[0]}</div><input id="ans" class="input-line" placeholder="Antwort"><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const x=LIST[i];if(ok(ans.value,x[1])){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Noch einmal.</div>':'<div class="no">Möglich: '+x[1][0]+'</div>'}}show();</script></body></html>
