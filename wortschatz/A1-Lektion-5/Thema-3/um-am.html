<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Präpositionen</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js?v=perf3"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=2"></script><script>header('Präpositionen');const FILE='um-am.html',LIST=PREP;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'hoeren-waehlen.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Wähle die richtige Präposition.</div><div class="sentence-box">${x[0]}</div><div class="choice-grid"><button class="choice" onclick="check('um')">um</button><button class="choice" onclick="check('am')">am</button><button class="choice" onclick="check('in der')">in der</button><button class="choice" onclick="check('von bis')">von ... bis</button><button class="choice" onclick="check('am um')">am ... um</button></div><div id="fb" class="feedback"></div>`}function check(v){const x=LIST[i];if(v===x[1]){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,500)}else{spMarkWrong(FILE,LIST.length);fb.innerHTML='<div class="no">Falsch.</div>'}}show();</script></body></html>
