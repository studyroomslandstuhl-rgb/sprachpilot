<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialoge</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Dialoge');const FILE='dialoge.html',LIST=DIALOGS;let i=0;function makeInputs(n){let s='';for(let k=0;k<n;k++)s+=`<input id="a${k}" class="input-line" placeholder="Antwort ${k+1}">`;return s}function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'schreiben.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Ergänzen Sie die fehlenden Wörter.</div><div class="dialog-task">${x.lines.map(l=>`<p>${l.replace(/___/g,'_____')}</p>`).join('')}</div><div class="answer-row">${makeInputs(x.answers.length)}</div><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const x=LIST[i];let good=true;for(let k=0;k<x.answers.length;k++){if(simple(document.getElementById('a'+k).value)!==simple(x.answers[k]))good=false}if(good){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Noch einmal.</div>':'<div class="no">Lösung: '+x.answers.join(' / ')+'</div>'}}show();</script></body></html>
