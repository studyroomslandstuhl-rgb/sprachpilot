<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialoge</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Dialoge');const FILE='dialoge.html',LIST=DIALOGS;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'schreiben.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Antworte im Dialog.</div><div class="dialog-box"><p><b>A:</b> ${x[0]}</p><p><b>B:</b> ________</p></div><input id="ans" placeholder="Antwort"><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const x=LIST[i];if(ok(ans.value,variants(x[1]))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Noch einmal.</div>':'<div class="no">Lösung: '+x[1]+'</div>'}}show();</script></body></html>
