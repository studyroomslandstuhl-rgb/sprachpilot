<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören: Lüge markieren</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js?v=perf3"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=2"></script><script>header('Hören: Lüge markieren');const FILE='schreiben.html';const AUDIO_BASE='/assets/audio/';const TASKS=[{audio:AUDIO_BASE+'a1-l5-t3-luege-01-melanie.mp3',items:[['Melanie frühstückt um 8 Uhr.',false],['Melanie fährt um 9 Uhr mit dem Bus zum Deutschkurs.',false],['Melanie geht am Nachmittag ins Fitnessstudio.',false],['Melanie geht um 22 Uhr schlafen.',true]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-02-peter.mp3',items:[['Peter hat am Montag von 9 bis 12 Uhr Deutschkurs.',false],['Peter isst um halb eins zu Mittag.',false],['Peter räumt am Nachmittag die Küche auf.',false],['Peter ruft am Morgen seine Mutter an.',true]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-03-sara.mp3',items:[['Sara lernt am Vormittag Deutsch.',false],['Sara hat am Dienstag um 14 Uhr einen Termin.',true],['Sara kauft von 16 bis 17 Uhr ein.',false],['Sara sieht am Abend fern.',false]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-04-ali.mp3',items:[['Ali macht am Nachmittag Hausaufgaben.',false],['Ali trainiert von 17 bis 18 Uhr.',true],['Ali isst nach dem Training zu Abend.',false],['Ali schläft in der Nacht.',false]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-05-anna.mp3',items:[['Anna räumt am Samstag um 10 Uhr ihr Zimmer auf.',false],['Anna kauft um 12 Uhr ein.',false],['Anna lernt am Nachmittag Deutsch.',false],['Anna sieht um 21 Uhr fern.',true]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-06-omar.mp3',items:[['Omar fährt am Morgen um halb acht mit dem Bus.',false],['Omar hat von 8 bis 12 Uhr Deutschkurs.',false],['Omar arbeitet von 13 bis 18 Uhr.',true],['Omar telefoniert am Abend mit seinem Bruder.',false]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-07-elena.mp3',items:[['Elena hat am Sonntag keinen Kurs.',false],['Elena ruft um 10 Uhr ihre Freundin an.',true],['Elena lernt am Nachmittag Deutsch zu Hause.',false],['Elena kocht am Abend und sieht fern.',false]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-08-marko.mp3',items:[['Marko arbeitet am Freitag von 8 bis 16 Uhr.',false],['Marko sieht um 20 Uhr fern.',false],['Marko telefoniert um 21 Uhr mit einem Freund.',false],['Marko geht um 22 Uhr schlafen.',true]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-09-jana.mp3',items:[['Jana räumt am Donnerstag von 15 bis 16 Uhr auf.',false],['Jana geht um 17 Uhr ins Fitnessstudio.',false],['Jana lernt am Morgen Deutsch.',true],['Jana geht um 22 Uhr schlafen.',false]]},{audio:AUDIO_BASE+'a1-l5-t3-luege-10-niko.mp3',items:[['Niko frühstückt um 7 Uhr.',false],['Nikos Bus fährt um Viertel vor acht.',false],['Niko arbeitet von 8 bis 12 Uhr.',false],['Niko macht um 11 Uhr eine Pause.',true]]}];let i=0;function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function audioBox(t){return `<div class="actions"><audio id="aud" controls preload="none" src="${t.audio}"></audio></div><div class="small">Hören Sie zuerst die Datei. Dann markieren Sie die falsche Aussage.</div>`}function show(){if(loadTask(FILE,TASKS.length).done.length>=TASKS.length){complete(area,FILE,'pruefung.html');return}i=spNextIndex(FILE,TASKS.length);const t=TASKS[i];const opts=shuffle(t.items);area.innerHTML=`${spProgressHtml(FILE,TASKS.length)}<div class="question">Hören Sie die Person. Markieren Sie die Lüge.</div>${audioBox(t)}<div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check(${o[1]},this)">${o[0]}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}function check(isLie,btn){if(isLie){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig! Das ist die Lüge.</div>';spMarkRight(FILE,TASKS.length);setTimeout(show,700)}else{btn.classList.add('no');const n=spMarkWrong(FILE,TASKS.length);fb.innerHTML=n<3?'<div class="no">Das stimmt im Hörtext. Suchen Sie die Lüge.</div>':'<div class="no">Hören Sie noch einmal und markieren Sie die falsche Aussage.</div>'}}show();</script></body></html>
