<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören: Lüge markieren</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Hören: Lüge markieren');const FILE='schreiben.html';const AUDIO_BASE='/assets/audio/';const TASKS=[{name:'Melanie',audio:AUDIO_BASE+'a1-l5-t3-luege-01-melanie.mp3',text:'Ich heiße Melanie. Am Morgen stehe ich um acht Uhr auf und frühstücke schnell. Um neun Uhr kommt mein Bus und ich fahre zum Deutschkurs. Am Nachmittag gehe ich ins Fitnessstudio und mache Sport. Am Abend sehe ich fern oder telefoniere mit meiner Freundin. Um dreiundzwanzig Uhr gehe ich schlafen.',items:[['Melanie frühstückt um 8 Uhr.',false],['Melanie geht am Nachmittag ins Fitnessstudio.',false],['Sie fährt mit dem Auto zum Deutschkurs.',true],['Melanie geht um 23 Uhr schlafen.',false]]},{name:'Peter',audio:AUDIO_BASE+'a1-l5-t3-luege-02-peter.mp3',text:'Ich heiße Peter. Am Montag habe ich von neun bis zwölf Uhr Deutschkurs. Um halb eins esse ich zu Mittag. Am Nachmittag räume ich die Küche auf. Am Abend rufe ich meine Mutter an.',items:[['Peter hat am Montag Deutschkurs.',false],['Der Deutschkurs ist von 9 bis 12 Uhr.',false],['Peter arbeitet von 9 bis 12 Uhr.',true],['Peter ruft am Abend seine Mutter an.',false]]},{name:'Sara',audio:AUDIO_BASE+'a1-l5-t3-luege-03-sara.mp3',text:'Ich heiße Sara. Am Dienstag habe ich um fünfzehn Uhr einen Termin. Am Vormittag lerne ich Deutsch. Von sechzehn bis siebzehn Uhr kaufe ich ein. Am Abend sehe ich fern.',items:[['Sara hat am Dienstag einen Termin.',false],['Der Termin ist um 15 Uhr.',false],['Sara kauft von 16 bis 17 Uhr ein.',false],['Sara hat am Montag einen Termin.',true]]},{name:'Ali',audio:AUDIO_BASE+'a1-l5-t3-luege-04-ali.mp3',text:'Ich heiße Ali. Am Mittwoch habe ich von achtzehn bis neunzehn Uhr Training. Am Nachmittag mache ich Hausaufgaben. Nach dem Training esse ich zu Abend. In der Nacht schlafe ich.',items:[['Ali hat am Mittwoch Training.',false],['Das Training ist von 18 bis 19 Uhr.',false],['Ali isst nach dem Training.',false],['Das Training ist um 20 Uhr.',true]]},{name:'Anna',audio:AUDIO_BASE+'a1-l5-t3-luege-05-anna.mp3',text:'Ich heiße Anna. Am Samstag räume ich um zehn Uhr mein Zimmer auf. Um zwölf Uhr kaufe ich ein. Am Nachmittag lerne ich Deutsch. Am Abend sehe ich um zwanzig Uhr fern.',items:[['Anna räumt am Samstag auf.',false],['Anna kauft um 12 Uhr ein.',false],['Anna sieht um 20 Uhr fern.',false],['Anna räumt am Sonntag auf.',true]]},{name:'Omar',audio:AUDIO_BASE+'a1-l5-t3-luege-06-omar.mp3',text:'Ich heiße Omar. Am Morgen fahre ich um halb acht mit dem Bus. Der Deutschkurs ist von acht bis zwölf Uhr. Am Nachmittag arbeite ich von vierzehn bis achtzehn Uhr. Am Abend telefoniere ich mit meinem Bruder.',items:[['Omar fährt am Morgen mit dem Bus.',false],['Der Deutschkurs ist von 8 bis 12 Uhr.',false],['Omar arbeitet von 14 bis 18 Uhr.',false],['Omar arbeitet von 12 bis 14 Uhr.',true]]},{name:'Elena',audio:AUDIO_BASE+'a1-l5-t3-luege-07-elena.mp3',text:'Ich heiße Elena. Am Sonntag habe ich keinen Kurs. Um elf Uhr rufe ich meine Freundin an. Am Nachmittag lerne ich Deutsch zu Hause. Am Abend koche ich und sehe fern.',items:[['Elena hat am Sonntag keinen Kurs.',false],['Elena ruft um 11 Uhr ihre Freundin an.',false],['Elena lernt am Nachmittag Deutsch.',false],['Elena hat am Sonntag Deutschkurs.',true]]},{name:'Marko',audio:AUDIO_BASE+'a1-l5-t3-luege-08-marko.mp3',text:'Ich heiße Marko. Am Freitag arbeite ich von acht bis sechzehn Uhr. Um zwanzig Uhr sehe ich fern. Um einundzwanzig Uhr telefoniere ich mit einem Freund. Um halb zwölf gehe ich schlafen.',items:[['Marko arbeitet am Freitag von 8 bis 16 Uhr.',false],['Marko sieht um 20 Uhr fern.',false],['Marko telefoniert um 21 Uhr.',false],['Marko geht um 22 Uhr schlafen.',true]]},{name:'Jana',audio:AUDIO_BASE+'a1-l5-t3-luege-09-jana.mp3',text:'Ich heiße Jana. Am Donnerstag räume ich von fünfzehn bis sechzehn Uhr auf. Um siebzehn Uhr gehe ich ins Fitnessstudio. Am Abend lerne ich Deutsch. Um zweiundzwanzig Uhr gehe ich schlafen.',items:[['Jana räumt am Donnerstag auf.',false],['Jana räumt von 15 bis 16 Uhr auf.',false],['Jana geht um 17 Uhr ins Fitnessstudio.',false],['Jana räumt um 14 Uhr auf.',true]]},{name:'Niko',audio:AUDIO_BASE+'a1-l5-t3-luege-10-niko.mp3',text:'Ich heiße Niko. Ich frühstücke um sieben Uhr. Um Viertel vor acht fährt mein Bus. Ich arbeite von acht bis zwölf Uhr. Um zehn Uhr mache ich eine Pause.',items:[['Niko frühstückt um 7 Uhr.',false],['Der Bus fährt um Viertel vor acht.',false],['Niko arbeitet von 8 bis 12 Uhr.',false],['Niko macht um 12 Uhr Pause.',true]]}];let i=0;function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function playFallback(){sayGerman(TASKS[i].text)}function audioBox(t){return `<div class="actions"><audio id="aud" controls preload="none" src="${t.audio}"></audio><button class="btn secondary" onclick="playFallback()">Browser-Stimme</button></div><div class="small">Falls die Datei nicht lädt, prüfe den Dateinamen im Ordner /assets/audio/.</div>`}function show(){if(loadTask(FILE,TASKS.length).done.length>=TASKS.length){complete(area,FILE,'pruefung.html');return}i=spNextIndex(FILE,TASKS.length);const t=TASKS[i];const opts=shuffle(t.items);area.innerHTML=`${spProgressHtml(FILE,TASKS.length)}<div class="question">Hören Sie die Person. Markieren Sie die Lüge.</div>${audioBox(t)}<div class="choice-grid">${opts.map((o,n)=>`<button class="choice" onclick="check(${o[1]},this)">${o[0]}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}function check(isLie,btn){if(isLie){btn.classList.add('ok');fb.innerHTML='<div class="ok">Richtig! Das ist die Lüge.</div>';spMarkRight(FILE,TASKS.length);setTimeout(show,700)}else{btn.classList.add('no');const n=spMarkWrong(FILE,TASKS.length);fb.innerHTML=n<3?'<div class="no">Das stimmt im Hörtext. Suchen Sie die Lüge.</div>':'<div class="no">Hören Sie noch einmal und markieren Sie die falsche Aussage.</div>'}}show();</script></body></html>
