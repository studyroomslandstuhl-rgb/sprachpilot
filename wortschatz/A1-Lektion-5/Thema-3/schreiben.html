<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Interview');const FILE='schreiben.html',LIST=INTERVIEW;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'pruefung.html');return}i=spNextIndex(FILE,LIST.length);const q=LIST[i][0];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="interview-card"><div class="question">${q}</div><p class="small">Antworten Sie über sich. Jede passende Zeitangabe ist erlaubt. Die Grammatik vom Satz wird kontrolliert.</p><input id="ans" class="input-line" placeholder="Ich stehe um 7 Uhr auf."><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div></div>`}function check(){const v=ans.value.trim();if(!sentenceLooksRight(v)){fb.innerHTML='<div class="no">Der Satz muss groß beginnen und mit Punkt enden.</div>';spMarkWrong(FILE,LIST.length);return}if(!hasTime(v)){fb.innerHTML='<div class="no">Eine Zeitangabe fehlt: um, am, von ... bis oder in der Nacht.</div>';spMarkWrong(FILE,LIST.length);return}if(!verbSecond(v)){fb.innerHTML='<div class="no">Achte auf die Satzstellung: Verb auf Position 2.</div>';spMarkWrong(FILE,LIST.length);return}fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,700)}show();</script></body></html>
