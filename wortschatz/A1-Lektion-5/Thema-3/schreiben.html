<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Interview');const FILE='schreiben.html',LIST=INTERVIEW;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'pruefung.html');return}i=spNextIndex(FILE,LIST.length);const q=LIST[i][0];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="interview-card"><div class="question">${q}</div><p class="small">Antworten Sie frei. Möglich sind Tage, Tageszeiten, Uhrzeiten oder Kombinationen.</p><div class="word-bank"><span class="word-chip">Am Samstag ...</span><span class="word-chip">Um 12 Uhr ...</span><span class="word-chip">Am Samstag um 12 Uhr ...</span><span class="word-chip">Von ... bis ...</span></div><input id="ans" class="input-line" placeholder="Am Samstag räume ich auf."><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div></div>`}function hasTimeLoose(s){return /\bum\b|\bam\b|\bin der nacht\b|\bvon\b.*\bbis\b/.test(s)}function hasVerbLoose(s){return /\b(stehe|steh|frühstücke|fruehstuecke|habe|arbeite|räume|raume|sehe|rufe|schlafe|lerne|kaufe|gehe|komme|fange|faengt|beginnt|ist|dauert)\b/.test(s)}function orderLooksOk(s){return /^(ich|wir|der|die|das|es|am|um|von|in der nacht)\b/.test(s)}function check(){const raw=ans.value.trim();const s=simple(raw);if(!/^[A-ZÄÖÜ]/.test(raw)||!/\.$/.test(raw)){fb.innerHTML='<div class="no">Der Satz muss groß beginnen und mit Punkt enden.</div>';spMarkWrong(FILE,LIST.length);return}if(!hasTimeLoose(s)){fb.innerHTML='<div class="no">Eine Zeitangabe fehlt: am, um, von ... bis oder in der Nacht.</div>';spMarkWrong(FILE,LIST.length);return}if(!hasVerbLoose(s)||!orderLooksOk(s)){fb.innerHTML='<div class="no">Schreibe einen einfachen ganzen Satz, z. B. „Am Samstag räume ich auf.“</div>';spMarkWrong(FILE,LIST.length);return}fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,700)}show();</script></body></html>
