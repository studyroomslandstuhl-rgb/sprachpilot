<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schreiben</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Schreiben');const FILE='schreiben.html';const TOTAL=5;function done(){let st=loadTask(FILE,TOTAL);return st.done.length}function show(){if(done()>=TOTAL){complete(area,FILE,'pruefung.html');return}area.innerHTML=`${spProgressHtml(FILE,TOTAL)}<div class="question">Schreibe 5 Sätze über deinen Tag.</div><div class="rule-box">Benutze: <b>um</b>, <b>am</b>, <b>von ... bis</b> und <b>in der Nacht</b>.</div><textarea id="txt" rows="8" placeholder="Ich stehe um ... Uhr auf.\nAm ... habe ich Kurs.\nDer Kurs geht von ... bis ... Uhr.\nAm Abend ...\nIn der Nacht ..."></textarea><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const s=simple(txt.value);const good=s.includes('um')&&s.includes('am')&&s.includes('von')&&s.includes('bis')&&s.includes('in der nacht');if(good){let st=loadTask(FILE,TOTAL);st.done=[0,1,2,3,4];st.queue=[];saveTask(FILE,st);fb.innerHTML='<div class="ok">Richtig! Alle Strukturen sind da.</div>';setTimeout(show,700)}else{fb.innerHTML='<div class="no">Es fehlt noch etwas: um, am, von ... bis oder in der Nacht.</div>'}}show();</script></body></html>
