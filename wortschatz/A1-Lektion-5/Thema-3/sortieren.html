<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drag & Drop</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Drag & Drop');const FILE='sortieren.html',GROUPS=['Uhrzeit','Tageszeit','Tag','Zeitraum'];let placed={};function render(){const done=Object.keys(placed).length;if(done>=SORT_ITEMS.length){let st=loadTask(FILE,SORT_ITEMS.length);st.done=[...Array(SORT_ITEMS.length).keys()];st.queue=[];saveTask(FILE,st);complete(area,FILE,'um-am.html');return}const bank=SORT_ITEMS.map((x,i)=>({i,text:x[0],group:x[1]})).filter(x=>placed[x.i]===undefined).sort(()=>Math.random()-.5);area.innerHTML=`${spProgressHtml(FILE,SORT_ITEMS.length)}<div class="question">Ordnen Sie die Zeitangaben zu.</div><div class="drag-bank">${bank.map(x=>`<div class="drag-item" draggable="true" data-i="${x.i}">${x.text}</div>`).join('')}</div><div class="drop-layout">${GROUPS.map(g=>`<div class="drop-zone" data-group="${g}"><h3>${g}</h3>${Object.entries(placed).filter(([i,v])=>v===g).map(([i])=>`<div class="drag-item">${SORT_ITEMS[i][0]}</div>`).join('')}</div>`).join('')}</div><div id="fb" class="feedback"></div>`;document.querySelectorAll('.drag-item[draggable=true]').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.i)));document.querySelectorAll('.drop-zone').forEach(z=>{z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',e=>{e.preventDefault();const i=e.dataTransfer.getData('text/plain');check(Number(i),z.dataset.group)})})}function check(i,g){if(SORT_ITEMS[i][1]===g){placed[i]=g;spMarkRight(FILE,SORT_ITEMS.length);render()}else{spMarkWrong(FILE,SORT_ITEMS.length);fb.innerHTML='<div class="no">Noch einmal. Die Gruppe passt nicht.</div>'}}render();</script></body></html>
