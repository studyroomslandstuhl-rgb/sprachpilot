<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drag & Drop</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Drag & Drop');const FILE='sortieren.html';const GROUPS=['Uhrzeit','Tageszeit','Tag','Zeitraum'];let selected=null;function show(){if(loadTask(FILE,SORT_ITEMS.length).done.length>=SORT_ITEMS.length){complete(area,FILE,'um-am.html');return}area.innerHTML=`${spProgressHtml(FILE,SORT_ITEMS.length)}<p>Tippe eine Zeitangabe an und dann die richtige Tabelle.</p><div id="chips" class="drag-bank"></div><div class="drop-grid">${GROUPS.map(g=>`<div class="dropzone" data-a="${g}"><h2>${g}</h2></div>`).join('')}</div><button class="btn" onclick="control()">Kontrollieren</button><div id="fb" class="feedback"></div>`;chips.innerHTML=SORT_ITEMS.map((x,i)=>`<span class="chip" data-id="${i}">${x[0]}</span>`).join('');document.querySelectorAll('.dropzone').forEach(z=>z.onclick=()=>{if(!selected)return;selected.classList.remove('selected','no');let n=selected.nextElementSibling;if(n&&n.classList.contains('correction'))n.remove();z.appendChild(selected);selected=null;bind()});bind()}function bind(){document.querySelectorAll('.chip').forEach(c=>c.onclick=e=>{e.stopPropagation();if(c.classList.contains('ok'))return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));selected=c;c.classList.add('selected')})}function control(){document.querySelectorAll('.correction').forEach(x=>x.remove());let ok=0;document.querySelectorAll('.dropzone .chip').forEach(c=>{let i=Number(c.dataset.id),z=c.closest('.dropzone');c.classList.remove('ok','no','selected');if(z.dataset.a===SORT_ITEMS[i][1]){c.classList.add('ok');ok++}else{c.classList.add('no');let note=document.createElement('span');note.className='correction';note.textContent='richtig: '+SORT_ITEMS[i][1];c.after(note)}});bind();if(ok===SORT_ITEMS.length){let st=loadTask(FILE,SORT_ITEMS.length);st.done=[...Array(SORT_ITEMS.length).keys()];st.queue=[];st.current=null;st.tries=0;st.hadWrong=false;saveTask(FILE,st);complete(area,FILE,'um-am.html')}else{fb.innerHTML='<div class="no">Korrigiere die roten Zeitangaben.</div>';spMarkWrong(FILE,SORT_ITEMS.length)}}show();</script></body></html>
