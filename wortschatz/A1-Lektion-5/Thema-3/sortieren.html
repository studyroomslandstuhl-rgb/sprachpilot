<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sortieren</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Sortieren');const FILE='sortieren.html',LIST=SORT_ITEMS;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'um-am.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Wohin gehört die Zeitangabe?</div><div class="sentence-box">${x[0]}</div><div class="choice-grid"><button class="choice" onclick="check('um')">um<br><span class="small">genaue Uhrzeit</span></button><button class="choice" onclick="check('am')">am<br><span class="small">Tag / Tageszeit</span></button><button class="choice" onclick="check('nacht')">in der Nacht<br><span class="small">Sonderfall</span></button><button class="choice" onclick="check('vonbis')">von ... bis<br><span class="small">Zeitraum</span></button></div><div id="fb" class="feedback"></div>`}function check(v){const x=LIST[i];if(v===x[1]){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Noch einmal.</div>':'<div class="no">Lösung: '+x[1]+'</div>'}}show();</script></body></html>
