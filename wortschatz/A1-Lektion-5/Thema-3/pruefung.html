<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüfung</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Prüfung');const FILE='pruefung.html';const prereq=[['karteikarten.html',WORDS.length],['sortieren.html',SORT_ITEMS.length],['um-am.html',UM_AM.length],['von-bis.html',MIX.length],['saetze-bauen.html',BUILD.length],['hoeren-waehlen.html',HEAR.length],['plan-lesen.html',PLAN_Q.length],['sprechen.html',SPEAK.length],['dialoge.html',DIALOGS.length],['schreiben.html',5]];function unlocked(){return prereq.every(t=>pctFor(t[0],t[1])>=100)}let tasks=[],pos=0,score=0;function makeTasks(){let a=[];UM_AM.forEach(x=>a.push({type:'gap',q:x[0],a:x[1]}));MIX.forEach(x=>a.push({type:'gap',q:x[0],a:x[1]}));BUILD.slice(0,5).forEach(x=>a.push({type:'sentence',q:x[0],a:x[1]}));PLAN_Q.slice(0,4).forEach(x=>a.push({type:'plan',q:x[0],a:x[1]}));DIALOGS.slice(0,4).forEach(x=>a.push({type:'dialog',q:x[0],a:x[1]}));return a.sort(()=>Math.random()-.5).slice(0,20)}function table(){return `<table class="plan-table"><tr><th>Tag</th><th>Zeit</th><th>Aktivität</th></tr>${PLAN.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`}function render(){if(!unlocked()){area.innerHTML='<div class="finish-box"><div class="question">Prüfung gesperrt</div><p>Schließe zuerst alle Aufgaben mit 100% ab.</p><div class="actions"><a class="btn secondary" href="index.html">Zurück</a></div></div>';return}if(!tasks.length)tasks=makeTasks();if(pos>=tasks.length){finish();return}const q=tasks[pos];let body='';if(q.type==='gap')body=`<div class="question">Ergänze die richtige Form.</div><div class="sentence-box">${q.q}</div><input id="ans" placeholder="um / am / von bis / in der">`;if(q.type==='sentence')body=`<div class="question">Schreibe den Satz.</div><div class="sentence-box">${q.q}</div><input id="ans" placeholder="Satz">`;if(q.type==='plan')body=`<div class="question">Antworte zum Plan.</div>${table()}<div class="sentence-box">${q.q}</div><input id="ans" placeholder="Antwort">`;if(q.type==='dialog')body=`<div class="question">Antworte im Dialog.</div><div class="dialog-box"><p><b>A:</b> ${q.q}</p><p><b>B:</b> ________</p></div><input id="ans" placeholder="Antwort">`;area.innerHTML=`<div class="small">${pos+1} / ${tasks.length}</div><div class="progress"><div class="bar" style="width:${Math.round(pos/tasks.length*100)}%"></div></div>${body}<button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function good(q,v){if(q.type==='gap')return simple(v)===simple(q.a);return ok(v,variants(q.a))}function check(){const q=tasks[pos];if(good(q,ans.value))score++;else fb.innerHTML='<div class="no">Lösung: '+q.a+'</div>';pos++;setTimeout(render,500)}function finish(){let st=loadTask(FILE,tasks.length);const best=Math.max(st.done.length||0,score);st.done=[...Array(best).keys()];st.queue=[];st.current=null;saveTask(FILE,st);const pct=Math.round(score/tasks.length*100);if(window.syncExam)syncExam({score,maxScore:tasks.length,percent:pct,stars:pct>=100?3:pct>=70?2:pct>=50?1:0});area.innerHTML=`<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Prüfung fertig</div><div class="hint">Ergebnis: ${score} / ${tasks.length} = ${pct}%</div><div class="actions"><a class="btn" href="index.html">Zum Thema</a></div></div>`}render();</script></body></html>
