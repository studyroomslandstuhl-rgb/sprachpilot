<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Lektion 5 · Thema 3 · Prüfung</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<script type="module" src="/js/guard.js?v=l5t3-exam-real1"></script>
<div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div>
<script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 Thema 3',key:'SP_L5_T3_V2'};</script>
<script src="app.js?v=5"></script>
<script src="l5t3-translations.js?v=4"></script>
<script src="l5t3-word-filter.js?v=1"></script>
<script src="/wortschatz/A1-Lektion-5/l5-bunny-words.js?v=l5-bunny-all3"></script>
<script src="../l5-points.js?v=6"></script>
<script>
header('Prüfung');
const FILE='pruefung.html';
const PR=[['karteikarten.html',WORDS.length],['sortieren.html',SORT_ITEMS.length],['um-am.html',PREP.length],['hoeren-waehlen.html',6],['saetze-bauen.html',BUILD.length],['plan-lesen.html',6],['sprechen.html',8],['satzvarianten.html',8],['dialoge.html',15],['schreiben.html',10]];
const unlocked=()=>PR.every(t=>pctFor(t[0],t[1])>=100);
const mix=a=>{const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out};
let exam=[],pos=0,score=0;
function makeExam(){
 const items=[];
 mix(PREP.map((x,i)=>({type:'prep',prompt:x[0],answer:x[1],solution:x[1],label:'Ergänze die passende Zeit-Präposition.'}))).slice(0,5).forEach(x=>items.push(x));
 mix(BUILD.map(x=>({type:'build',prompt:x.parts,answers:x.answers,solution:x.answers[0],label:'Schreibe einen vollständigen richtigen Satz.'}))).slice(0,5).forEach(x=>items.push(x));
 mix(PLAN_Q.map(x=>({type:'plan',prompt:x[0],answers:x[1],solution:x[1][0],label:'Antworte mit einem vollständigen Satz.'}))).slice(0,4).forEach(x=>items.push(x));
 mix(SORT_ITEMS.map(x=>({type:'group',prompt:x[0],answer:x[1],solution:x[1],label:'Welche Gruppe passt?',choices:['Uhrzeit','Tageszeit','Tag','Zeitraum']}))).slice(0,3).forEach(x=>items.push(x));
 mix(DIALOGS.map(x=>({type:'dialog',lines:x.lines,answer:x.answers.join(' '),solution:x.answers.join(' '),label:'Ergänze die fehlende Präposition bzw. die fehlenden Präpositionen.'}))).slice(0,3).forEach(x=>items.push(x));
 return mix(items).slice(0,20)
}
function correct(q,value){
 if(q.type==='build'||q.type==='plan')return ok(value,q.answers);
 if(q.type==='prep'||q.type==='group'||q.type==='dialog')return simple(value)===simple(q.answer);
 return false
}
function render(){
 if(!unlocked()){
  area.innerHTML='<div class="finish-box"><div class="question">Prüfung gesperrt</div><p>Schließe zuerst alle Aufgaben mit 100% ab.</p><div class="actions"><a class="btn secondary" href="index.html">Zurück</a></div></div>';return
 }
 if(!exam.length)exam=makeExam();
 if(pos>=exam.length)return finish();
 const q=exam[pos],pct=Math.round(pos/exam.length*100);let body='';
 if(q.type==='dialog')body=`<div class="dialog-box">${q.lines.map(x=>'<p>'+x+'</p>').join('')}</div><input id="ans" autocomplete="off" placeholder="z. B. am / von bis">`;
 else if(q.type==='group')body=`<div class="sentence-box">${q.prompt}</div><div class="exam-choice-row">${mix(q.choices).map(x=>`<button type="button" class="btn secondary" data-choice="${x}">${x}</button>`).join('')}</div><input id="ans" autocomplete="off" type="hidden">`;
 else body=`<div class="sentence-box">${q.prompt}</div><input id="ans" autocomplete="off" placeholder="Antwort schreiben">`;
 area.innerHTML=`<div class="small">${pos+1} / ${exam.length}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="question">${q.label}</div>${body}<div class="actions"><button class="btn" id="checkBtn" type="button">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');ans.value=b.dataset.choice});
 document.getElementById('ans')?.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
}
function check(){
 const q=exam[pos],value=String(document.getElementById('ans')?.value||'').trim();if(!value)return;
 if(correct(q,value)){score++;fb.innerHTML='<div class="ok">Richtig.</div>'}else fb.innerHTML='<div class="no">Nicht richtig. Lösung: <strong>'+q.solution+'</strong></div>';
 document.querySelectorAll('button,input').forEach(x=>x.disabled=true);pos++;setTimeout(render,520)
}
function finish(){
 let st=loadTask(FILE,exam.length);const best=Math.max(st.done.length||0,score);st.done=[...Array(best).keys()];st.queue=[];st.current=null;saveTask(FILE,st);
 const percent=Math.round(score/exam.length*100),stars=percent>=100?3:percent>=70?2:percent>=50?1:0;
 if(window.syncExam)syncExam({score,maxScore:exam.length,percent,stars});
 area.innerHTML=`<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Prüfung fertig</div><div class="hint">Ergebnis: ${score} / ${exam.length} = ${percent}%</div><div class="actions"><a class="btn" href="index.html">Zum Thema</a></div></div>`
}
render();
</script>
</body>
</html>
