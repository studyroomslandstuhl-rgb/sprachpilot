<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pruefung</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="l5t3-translations.js?v=4"></script><script src="l5t3-word-filter.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Pruefung');const FILE='pruefung.html';const prereq=[['karteikarten.html',WORDS.length],['sortieren.html',SORT_ITEMS.length],['um-am.html',PREP.length],['hoeren-waehlen.html',6],['saetze-bauen.html',BUILD.length],['plan-lesen.html',6],['sprechen.html',8],['dialoge.html',15],['schreiben.html',INTERVIEW.length]];function unlocked(){return prereq.every(t=>pctFor(t[0],t[1])>=100)}let tasks=[],pos=0,score=0;const EXAM=[['Ich komme ___ acht Uhr.','um'],['Der Kurs ist ___ Montag.','am'],['Ich schlafe ___ Nacht.','in der'],['Der Kurs geht ___ neun ___ zwölf Uhr.','von bis'],['Ich sehe ___ Abend fern.','am'],['Ich arbeite ___ Montag ___ Freitag.','von bis']];function makeTasks(){let a=[];EXAM.forEach(x=>a.push({type:'gap',q:x[0],a:x[1]}));BUILD.slice(0,8).forEach(x=>a.push({type:'sentence',q:x.parts,a:x.answers}));return a.sort(()=>Math.random()-.5).slice(0,14)}function render(){if(!unlocked()){area.innerHTML='<div class="finish-box"><div class="question">Pruefung gesperrt</div><p>Schliesse zuerst alle Aufgaben mit 100% ab.</p><div class="actions"><a class="btn secondary" href="index.html">Zurueck</a></div></div>';return}if(!tasks.length)tasks=makeTasks();if(pos>=tasks.length){finish();return}const q=tasks[pos];let body=q.type==='gap'?`<div class="question">Ergaenze die richtige Form.</div><div class="sentence-box">${q.q}</div><input id="ans" class="input-line" placeholder="um / am / von bis / in der">`:`<div class="question">Schreibe den Satz.</div><div class="sentence-box">${q.q}</div><input id="ans" class="input-line" placeholder="Satz">`;area.innerHTML=`<div class="small">${pos+1} / ${tasks.length}</div><div class="progress"><div class="bar" style="width:${Math.round(pos/tasks.length*100)}%"></div></div>${body}<button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function good(q,v){if(q.type==='gap')return simple(v)===simple(q.a);return ok(v,q.a)}function check(){const q=tasks[pos];if(good(q,ans.value))score++;else fb.innerHTML='<div class="no">Loesung: '+(Array.isArray(q.a)?q.a[0]:q.a)+'</div>';pos++;setTimeout(render,500)}function finish(){let st=loadTask(FILE,20);st.done=[...Array(Math.round(score/tasks.length*20)).keys()];st.queue=[];st.current=null;saveTask(FILE,st);const pct=Math.round(score/tasks.length*100);area.innerHTML='<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Pruefung fertig</div><div class="hint">Ergebnis: '+score+' / '+tasks.length+' = '+pct+'%</div><div class="actions"><a class="btn" href="index.html">Zum Thema</a></div></div>'}render();</script></body></html>
