<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sätze bauen</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js?v=perf3"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=2"></script><script>header('Sätze bauen');const FILE='saetze-bauen.html',LIST=BUILD;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'plan-lesen.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Baue einen richtigen Satz.</div><div class="sentence-box">${x.parts}</div><div class="small-check">Wichtig: Großschreibung am Satzanfang und Punkt am Ende.</div><input id="ans" class="input-line" placeholder="Schreibe den Satz"><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const x=LIST[i],v=ans.value;if(!sentenceLooksRight(v)){fb.innerHTML='<div class="no">Achte auf Großschreibung am Anfang und Punkt am Ende.</div>';spMarkWrong(FILE,LIST.length);return}if(ok(v,x.answers)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Das ist noch nicht richtig. Achte auf Position 2 und trennbare Verben.</div>':'<div class="no">Möglich: '+x.answers[0]+'</div>'}}show();</script></body></html>
