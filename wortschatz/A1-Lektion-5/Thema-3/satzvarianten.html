/ Musik / hören / Jana / .',a:['Jana hört in der Nacht Musik.','Jana hört Musik in der Nacht.','In der Nacht hört Jana Musik.','Musik hört Jana in der Nacht.']}];let i=0;function allGood(vals,answers){const used=new Set();for(const v of vals){let found=-1;for(let j=0;j<answers.length;j++){if(!used.has(j)&&simple(v)===simple(answers[j])){found=j;break}}if(found<0)return false;used.add(found)}return used.size===answers.length}function inputs(n){let html='';for(let k=0;k<n;k++)html+=`<input id="a${k}" class="input-line" placeholder="${k+1}. Satz">`;return html}function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'dialoge.html');return}i=spNextIndex(FILE,LIST.length);const x=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Bilden Sie alle möglichen Sätze. Das Subjekt steht einmal auf Platz 1 und sonst nach dem Verb.</div><div class="sentence-box">${x.cue}</div><div class="small">Schreiben Sie ${x.a.length} Varianten.</div><div class="answer-row">${inputs(x.a.length)}</div><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const x=LIST[i];const vals=x.a.map((_,k)=>String(document.getElementById('a'+k).value||'').trim());if(vals.some(v=>!v)){spMarkWrong(FILE,LIST.length);fb.innerHTML='<div class="no">Schreiben Sie alle Varianten.</div>';return}if(vals.some(v=>!/^[A-ZÄÖÜ]/.test(v)||!/\.$/.test(v))){spMarkWrong(FILE,LIST.length);fb.innerHTML='<div class="no">Jeder Satz beginnt groß und endet mit Punkt.</div>';return}if(allGood(vals,x.a)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,700)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=n<3?'<div class="no">Noch nicht. Schreiben Sie jede mögliche Variante nur einmal.</div>':'<div class="no">Möglich:<br>'+x.a.join('<br>')+'</div>'}}show();</script></body></html>
