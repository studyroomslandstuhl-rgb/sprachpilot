<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lektion 5 · Thema 3</title><link rel="stylesheet" href="style.css?v=4"></head><body><script type="module" src="/js/guard.js?v=perf3"></script><div class="container"><header class="topbar"></header><section class="card progress-card"><div class="circle" id="totalCircle">0%</div><div class="progress-main"><h2>Dein Fortschritt</h2><p class="small" id="totalText">0 Aufgaben abgeschlossen</p><div class="progress"><div class="bar" id="totalBar"></div></div><p class="small">Ziel: Tage, Tageszeiten, um, am und von ... bis sicher benutzen.</p></div></section><section class="grid" id="taskGrid"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="l5t3-translations.js?v=4"></script><script src="l5t3-word-filter.js?v=1"></script><script src="../l5-points.js?v=2"></script><script>header(CFG.title,true);const SPEAK_TOTAL=8,VARIANT_TOTAL=8,DIALOG_TOTAL=15,LIE_TOTAL=10;const tasks=[['karteikarten.html',WORDS.length,'Karteikarten','🃏','Wörter mit Bild, Rückseite, Hören, Sprechen oder Schreiben.'],['sortieren.html',SORT_ITEMS.length,'Drag & Drop: Gruppen','📦','Tippe eine Zeitangabe an und ordne sie einer Gruppe zu.'],['um-am.html',PREP.length,'Präpositionen','🧩','Wähle die richtige Präposition.'],['hoeren-waehlen.html',6,'Hören → schreiben','🎧','Höre Peters Tagesablauf und schreibe die Sätze.'],['saetze-bauen.html',BUILD.length,'Sätze bauen','✍️','Baue Sätze mit Infinitiv-Vorgaben. Großschreibung und Punkt zählen.'],['plan-lesen.html',6,'Plan lesen','📅','Schreibe ganze Sätze mit um, am oder von ... bis.'],['sprechen.html',SPEAK_TOTAL,'Volle Sätze','🎤','Subjekt auf Platz 1 oder nach dem Verb.'],['satzvarianten.html',VARIANT_TOTAL,'Satzvarianten','🔀','Bilde denselben Satz in drei Satzstellungen.'],['dialoge.html',DIALOG_TOTAL,'Dialoge ergänzen','💬','Ergänze Lücken in kleinen Dialogen.'],['schreiben.html',LIE_TOTAL,'Hören: Lüge markieren','🕵️','Höre eine Person und markiere die falsche Aussage.']];function card(t,n){const p=pctFor(t[0],t[1]);return`<a class="module" href="${t[0]}"><div class="num">${n}. ${t[2]}</div><div class="icon">${t[3]}</div><p>${t[4]}</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small">${p}%</div><div class="start">${p>=100?'Fertig':'Starten'}</div></a>`}function examTile(n,open){const p=pctFor('pruefung.html',20);return open?`<a class="module" href="pruefung.html"><div class="num">${n}. Prüfung</div><div class="icon exam-icon">★</div><p>Gemischte Prüfung.</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small">${p?p+'%':'offen'}</div><div class="start">Starten</div></a>`:`<div class="module locked exam-locked"><div class="num">${n}. Prüfung</div><div class="icon exam-icon">★</div><p>Prüfung wird erst freigeschaltet, wenn alle Aufgaben 100% erreicht haben.</p><div class="small">gesperrt</div><div class="start">Prüfung gesperrt</div></div>`}let n=1;taskGrid.innerHTML=tasks.map(t=>card(t,n++)).join('');const open=tasks.every(t=>pctFor(t[0],t[1])>=100);taskGrid.innerHTML+=examTile(n,open);const all=[...tasks,['pruefung.html',20]];const avg=Math.round(all.reduce((s,t)=>s+pctFor(t[0],t[1]),0)/all.length)||0;const done=all.filter(t=>pctFor(t[0],t[1])>=100).length;totalCircle.textContent=avg+'%';totalBar.style.width=avg+'%';totalText.textContent=done+' / '+all.length+' Aufgaben abgeschlossen';</script></body></html>
