<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"><div class="question">Aufgabe wird geladen …</div></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V2'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Karteikarten');const FILE='karteikarten.html';let i=0,revealed=false,solved=false;function back(w){return `<div class="flip-word">${full(w)}</div>${w.plural?'<div class="flip-plural">Plural: <b>'+w.plural+'</b></div>':''}<button class="btn secondary" onclick="sayGerman(full(WORDS[i]));return false">Hören</button>`}function show(){if(loadTask(FILE,WORDS.length).done.length>=WORDS.length){complete(area,FILE,'sortieren.html');return}i=spNextIndex(FILE,WORDS.length);revealed=false;solved=false;const w=WORDS[i];area.innerHTML=`${spProgressHtml(FILE,WORDS.length)}<div class="question">${cardPrompt(w)}</div><div class="hint"><b>Muttersprache:</b> ${tr(w)}</div><div class="flip-wrap"><div id="fcard" class="flip-card" onclick="reveal(true)"><div class="flip-face flip-front">${bigImgHtml(w)}<div class="small">Klicken: Karte umdrehen</div></div><div class="flip-face flip-back">${back(w)}</div></div></div><div class="actions"><button id="micBtn" class="btn" onclick="say()">🎤 Sprechen</button><button class="btn secondary" onclick="writeBox()">Ich kann nicht sprechen</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="hidden"><input id="ans" placeholder="Schreiben Sie die Antwort hier"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div><div id="after" class="actions"></div>`}function writeBox(){box.classList.remove('hidden')}function reveal(help){if(solved)return;fcard.classList.add('flipped');if(help&&!revealed){revealed=true;const t=spMarkWrong(FILE,WORDS.length);fb.innerHTML=t<3?'Die Karte wurde umgedreht. Dieses Wort kommt später noch einmal.':'Lösung: '+full(WORDS[i]);after.innerHTML='<button class="btn" onclick="nextAfterHelp()">Weiter</button>'}}function nextAfterHelp(){spMarkRight(FILE,WORDS.length);show()}function say(){startMic(micBtn,txt=>{writeBox();ans.value=txt;check(txt)})}function correct(v,w){return w.article?simple(v)===simple(full(w)):(simple(v)===simple(full(w))||simple(v)===simple(w.word))}function check(v){const w=WORDS[i];if(correct(v,w)){solved=true;fcard.classList.add('flipped');fb.innerHTML='<div class="ok">Richtig!</div><div class="hint">Lies das Wort noch einmal und höre es bei Bedarf.</div>';spMarkRight(FILE,WORDS.length);after.innerHTML='<button class="btn" onclick="show()">Weiter</button>'}else{const t=spMarkWrong(FILE,WORDS.length);fb.innerHTML=t<3?'<div class="no">Da ist noch ein Fehler.</div>':'<div class="no">Lösung: '+full(w)+'</div>'}}show();</script></body></html>
