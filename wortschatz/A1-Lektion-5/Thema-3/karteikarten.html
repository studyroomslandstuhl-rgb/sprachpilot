<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"><div class="question">Aufgabe wird geladen …</div></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-3',title:'Wann? Termine und Tageszeiten',sub:'A1 Lektion 5 · Thema 3',key:'SP_L5_T3_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Karteikarten');const FILE='karteikarten.html';let i=null;function show(){if(loadTask(FILE,WORDS.length).done.length>=WORDS.length){complete(area,FILE,'sortieren.html');return}i=spNextIndex(FILE,WORDS.length);const w=WORDS[i];area.innerHTML=`${spProgressHtml(FILE,WORDS.length)}<div class="question">${cardPrompt(w)}</div><div class="hint">Muttersprache: <b>${tr(w)}</b></div>${bigImgHtml(w)}<div class="actions"><button id="micBtn" class="btn" onclick="say()">🎤 Sprechen</button><button class="btn secondary" onclick="writeBox()">Ich kann nicht sprechen</button><button class="btn secondary" onclick="flip()">Karte umdrehen</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="hidden"><input id="ans" placeholder="Schreiben Sie die Antwort hier"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function writeBox(){box.classList.remove('hidden')}function flip(){const w=WORDS[i];const tries=spMarkWrong(FILE,WORDS.length);fb.innerHTML=tries<3?'Tipp: '+cardTip(w):'Lösung: '+full(w);box.classList.remove('hidden');ans.value=full(w)}function say(){startMic(micBtn,txt=>{writeBox();ans.value=txt;check(txt)})}function correct(txt,w){return w.article?simple(txt)===simple(full(w)):(simple(txt)===simple(full(w))||simple(txt)===simple(w.word))}function check(txt){const w=WORDS[i];if(correct(txt,w)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,WORDS.length);setTimeout(show,700)}else{const tries=spMarkWrong(FILE,WORDS.length);fb.innerHTML=tries<3?'<div class="no">Da ist noch ein Fehler.</div>':'<div class="no">Lösung: '+full(w)+'</div>'}}show();</script></body></html>
