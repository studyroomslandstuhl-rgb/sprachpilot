<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören → Schreiben</title><link rel="stylesheet" href="style.css?v=1"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Hören → Schreiben');const FILE='hoeren-schreiben.html';let i=0;function audioText(t){return Math.random()<.5?t.formal[0]:t.informal[0]}let spoken='';function show(){if(loadTask(FILE,TIMES.length).done.length>=TIMES.length){complete(area,FILE,'sprechen.html');return}i=spNextIndex(FILE,TIMES.length);const t=TIMES[i];spoken=audioText(t);area.innerHTML=`${spProgressHtml(FILE,TIMES.length)}<div class="question">Höre und schreibe die Uhrzeit.</div><div class="actions"><button class="btn" onclick="sayGerman(spoken)">▶ Audio hören</button></div><input id="ans" placeholder="Schreiben Sie die Uhrzeit hier"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function check(){const t=TIMES[i];if(ok(ans.value,allAnswers(t))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,TIMES.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,TIMES.length);fb.innerHTML=help3(n,'Höre noch einmal.','Tipp: Formelle und informelle Antworten sind möglich.',spoken)}}show();</script></body></html>
