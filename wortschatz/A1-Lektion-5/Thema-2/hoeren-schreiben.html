<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören → Schreiben</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=2"></script><script src="../l5-points.js?v=1"></script><script>header('Hören → Schreiben');const FILE='hoeren-schreiben.html';let i=0,spoken='';function audioText(t){const time=t.informal[0];return 'Entschuldigung, wie spät ist es? Es ist '+time+'. Ah, schon so spät, danke!'}function show(){if(loadTask(FILE,TIMES.length).done.length>=TIMES.length){complete(area,FILE,'sprechen.html');return}i=spNextIndex(FILE,TIMES.length);const t=TIMES[i];spoken=audioText(t);area.innerHTML=`${spProgressHtml(FILE,TIMES.length)}<div class="question">Höre den Dialog und schreibe die Zeit formell.</div><div class="actions"><button class="btn" onclick="sayGerman(spoken)">▶ Dialog hören</button></div><input id="ans" placeholder="z. B. 17:15 oder fünf Uhr fünfzehn"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;setTimeout(()=>sayGerman(spoken),300)}function check(){const t=TIMES[i];if(ok(ans.value,formalLooseAnswers(t))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,TIMES.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,TIMES.length);fb.innerHTML=help3(n,'Höre noch einmal.','Tipp: Schreibe die Zeit formell oder als Zahl.',t.formal[0]+' / '+t.label)}}show();</script></body></html>
