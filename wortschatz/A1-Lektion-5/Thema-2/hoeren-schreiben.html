<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören → Schreiben</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=3"></script><script src="l5t2-extra-times.js?v=1"></script><script src="../l5-bunny-words.js?v=l5-bunny-all3"></script><script src="../l5-points.js?v=1"></script><script>header('Hören → Schreiben');const FILE='hoeren-schreiben.html';const LIST=TIMES_HOEREN;let i=0;function playCurrent(){const t=LIST[i];spL5PlayDialog(t,()=>speakDialog(t.dialog))}function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'sprechen.html');return}i=spNextIndex(FILE,LIST.length);const t=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Höre den Dialog und schreibe die Zeit formell oder digital.</div><div class="actions"><button class="btn" onclick="playCurrent()">▶ Dialog hören</button></div><input id="ans" placeholder="z. B. 17:15 Uhr oder fünf Uhr fünfzehn"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`;setTimeout(playCurrent,300)}function check(){const t=LIST[i];if(ok(ans.value,formalLooseAnswers(t))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=help3(n,'Höre noch einmal.','Tipp: Schreibe die Zeit formell oder als Zahl. Bei kurz vor / gleich zählen mehrere Minuten vor der vollen Stunde.',t.formal[0]+' / '+t.label+' Uhr')}}show();</script></body></html>
