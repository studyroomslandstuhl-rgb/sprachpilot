<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frage Antwort</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=2"></script><script src="../l5-points.js?v=1"></script><script>header('Frage / Antwort');const FILE='frage-antwort.html';let i=0;const QUESTIONS=['wie spät ist es','wie spät ist es jetzt','wie viel uhr ist es','wieviel uhr ist es'];function validQuestion(v){return QUESTIONS.some(q=>simple(v)===simple(q))}function show(){if(loadTask(FILE,TIMES.length).done.length>=TIMES.length){complete(area,FILE,'schon-erst.html');return}i=spNextIndex(FILE,TIMES.length);const t=TIMES[i];area.innerHTML=`${spProgressHtml(FILE,TIMES.length)}<div class="question">Schreibe zuerst die Frage und dann die Antwort.</div>${analogClock(t)}<div class="two-inputs"><div><b>Frage</b><input id="frage" placeholder="Wie spät ist es?"></div><div><b>Antwort</b><input id="antwort" placeholder="Es ist ..."></div></div><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const t=TIMES[i];const q=validQuestion(frage.value),a=ok(antwort.value,looseAnswers(t));if(q&&a){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,TIMES.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,TIMES.length);fb.innerHTML=help3(n,'Da ist noch ein Fehler.','Tipp: Frage: Wie spät ist es? / Wie viel Uhr ist es? Antwort mit oder ohne Es ist.',t.informal[0])}}show();</script></body></html>
