<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frage / Antwort</title><link rel="stylesheet" href="style.css?v=1"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Frage / Antwort');const FILE='frage-antwort.html';let i=0;function show(){if(loadTask(FILE,TIMES.length).done.length>=TIMES.length){complete(area,FILE,'schon-erst.html');return}i=spNextIndex(FILE,TIMES.length);const t=TIMES[i];area.innerHTML=`${spProgressHtml(FILE,TIMES.length)}<div class="question">Wie spät ist es jetzt?</div>${clock(t)}<input id="ans" placeholder="Es ist ..."><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const t=TIMES[i];const answers=[...t.formal,...t.informal].map(x=>'Es ist '+x);if(ok(ans.value,answers)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,TIMES.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,TIMES.length);fb.innerHTML=help3(n,'Da ist noch ein Fehler.','Tipp: Beginne mit „Es ist …“.','Es ist '+t.informal[0]+'.')}}show();</script></body></html>
