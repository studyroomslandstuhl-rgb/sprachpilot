<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frage / Antwort</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Frage / Antwort');const FILE='frage-antwort.html';const LIST=TIMES_FRAGE;let i=0,step=0;const QUESTIONS=['wie spät ist es','wie spät ist es jetzt','wie viel uhr ist es','wieviel uhr ist es'];function validQuestion(v){return ok(v,QUESTIONS)}function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'schon-erst.html');return}i=spNextIndex(FILE,LIST.length);step=0;render()}function render(){const t=LIST[i];let body='';if(step===0)body=`<div class="step-pill">1 / 3</div><div class="question">Fragen Sie nach der Zeit.</div><div class="hint">Sprechen Sie: Wie spät ist es? / Wie viel Uhr ist es?</div>`;if(step===1)body=`<div class="step-pill">2 / 3</div><div class="question">Sprechen Sie die Zeit formell.</div><div class="digital-time">${t.label}</div><div class="hint">Beispiel: Es ist acht Uhr dreißig.</div>`;if(step===2)body=`<div class="step-pill">3 / 3</div><div class="question">Sprechen Sie die Zeit informell.</div><div class="digital-time">${t.label}</div><div class="hint">Beispiel: Es ist halb neun.</div>`;area.innerHTML=`${spProgressHtml(FILE,LIST.length)}${body}<div class="actions"><button id="micBtn" class="btn" onclick="rec()">🎤 Sprechen</button><button class="btn secondary" onclick="box.classList.remove('hidden')">Ich kann nicht sprechen</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="hidden"><input id="ans" placeholder="Antwort"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function rec(){startMic(micBtn,v=>{box.classList.remove('hidden');ans.value=v;check(v)})}function good(v){const t=LIST[i];if(step===0)return validQuestion(v);if(step===1)return ok(v,formalLooseAnswers(t));if(step===2)return ok(v,informalSpeechAnswers(t));return false}function check(v){const t=LIST[i];if(good(v)){if(step<2){step++;render();return}fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,700)}else{const n=spMarkWrong(FILE,LIST.length);const tip=step===0?'Frage nach der Zeit.':step===1?'Sprich die formelle Zeit mit Uhr.':'Sprich die informelle Zeit.';const sol=step===0?'Wie spät ist es?':step===1?'Es ist '+t.formal[0]+'.':'Es ist '+t.informal[0]+'.';fb.innerHTML=help3(n,'Das passt noch nicht.',tip,sol)}}show();</script></body></html>
