<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=1"></script><script src="l5t2-timewords.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Artikel der Zeitwörter');const FILE='artikel.html';let i=0;function show(){if(loadTask(FILE,TIME_NOUNS.length).done.length>=TIME_NOUNS.length){complete(area,FILE,'plural.html');return}i=spNextIndex(FILE,TIME_NOUNS.length);const w=TIME_NOUNS[i];area.innerHTML=`${spProgressHtml(FILE,TIME_NOUNS.length)}<div class="question">Welcher Artikel passt?</div><div class="sentence-box">___ ${w.word}</div>${bigImgHtml(w)}<div class="choice-grid"><button class="choice" onclick="check('der')"><b>der</b></button><button class="choice" onclick="check('die')"><b>die</b></button><button class="choice" onclick="check('das')"><b>das</b></button></div><div id="fb" class="feedback"></div>`}function check(a){const w=TIME_NOUNS[i];if(a===w.article){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,TIME_NOUNS.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,TIME_NOUNS.length);fb.innerHTML=help3(n,'Da ist noch ein Fehler.','Tipp: Lerne Artikel immer mit dem Wort.',w.full)}}show();</script></body></html>
