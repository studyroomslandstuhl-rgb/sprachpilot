<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formell ↔ informell</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Formell ↔ informell');const FILE='formell-informell.html';const LIST=TIMES_FORMEN;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'frage-antwort.html');return}i=spNextIndex(FILE,LIST.length);const t=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Schreibe beide Formen.</div>${analogClock(t)}<div class="two-inputs"><div><b>Formell</b><input id="formal" placeholder="z. B. fünf Uhr fünfzehn"></div><div><b>Informell</b><input id="informal" placeholder="z. B. Viertel nach fünf"></div></div><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const t=LIST[i];const a=ok(formal.value,formalLooseAnswers(t)),b=ok(informal.value,informalLooseAnswers(t));if(a&&b){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=help3(n,'Da ist noch ein Fehler.','Tipp: Formell steht Uhr dabei. Informell ist Alltagssprache.',t.formal[0]+' / '+t.informal[0])}}show();</script></body></html>
