<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lektion 5 · Thema 2</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card progress-card"><div class="circle" id="totalCircle">0%</div><div class="progress-main"><h2>Dein Fortschritt</h2><p class="small" id="totalText">0 Aufgaben abgeschlossen</p><div class="progress"><div class="bar" id="totalBar"></div></div><p class="small">Ziel: Uhrzeiten, Zeitwörter, Artikel und Plural intensiv üben.</p><div id="topicExamSummary"></div></div></section><section class="grid" id="taskGrid"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=1"></script><script src="l5t2-timewords.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header(CFG.title,true);const tasks=[['karteikarten.html',WORDS.length,'Karteikarten','🃏','Wortschatz und Zeitwörter.'],['artikel.html',TIME_NOUNS.length,'Artikel der Zeitwörter','🧩','der, die oder das?'],['plural.html',TIME_NOUNS.length,'Plural der Zeitwörter','🔤','Schreibe die Pluralform.'],['sehen-schreiben.html',TIMES.length,'Sehen → Schreiben','🕒','Schreibe die Uhrzeit.'],['hoeren-schreiben.html',TIMES.length,'Hören → Schreiben','🎧','Höre und schreibe.'],['sprechen.html',TIMES.length,'Sprechen','🎤','Sprich die Uhrzeit.'],['formell-informell.html',TIMES.length,'Formell ↔ informell','🔁','Schreibe beide Formen.'],['frage-antwort.html',TIMES.length,'Frage / Antwort','💬','Wie spät ist es jetzt?'],['schon-erst.html',SCHON_ERST.length,'schon / erst','⏳','Übe schon und erst.']];function card(t,n){const p=pctFor(t[0],t[1]);return`<a class="module" href="${t[0]}"><div class="num">${n}. ${t[2]}</div><div class="icon">${t[3]}</div><p>${t[4]}</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small">${p}%</div><div class="start">${p>=100?'Fertig':'Starten'}</div></a>`}function examTile(n){const p=pctFor('pruefung.html',20);return`<a class="module" href="pruefung.html"><div class="num">${n}. Prüfung</div><div class="icon">★</div><p>Gemischte Prüfung. Aktuell frei zugänglich.</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small">${p?p+'%':'offen'}</div><div class="start">Starten</div></a>`}let n=1;taskGrid.innerHTML=tasks.map(t=>card(t,n++)).join('');taskGrid.innerHTML+=examTile(n);const all=[...tasks,['pruefung.html',20]];const avg=Math.round(all.reduce((s,t)=>s+pctFor(t[0],t[1]),0)/all.length)||0;const done=all.filter(t=>pctFor(t[0],t[1])>=100).length;totalCircle.textContent=avg+'%';totalBar.style.width=avg+'%';totalText.textContent=done+' / '+all.length+' Aufgaben abgeschlossen';</script></body></html>
