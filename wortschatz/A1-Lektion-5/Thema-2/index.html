<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lektion 5 · Thema 2</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js?v=theme-standard2"></script><div class="container"><header class="topbar"></header><section class="card progress-card"><div class="circle" id="totalCircle">0%</div><div class="progress-main"><h2>Dein Fortschritt</h2><p class="small" id="totalText">0 Aufgaben abgeschlossen</p><div class="progress"><div class="bar" id="totalBar"></div></div><p class="small">Ziel: Uhrzeiten verstehen, fragen, formell und informell sagen.</p><div id="topicExamSummary"></div></div></section><section class="grid" id="taskGrid"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=4"></script><script src="l5t2-extra-times.js?v=1"></script><script src="l5t2-timewords.js?v=1"></script><script src="../l5-points.js?v=3"></script><script src="l5t2-reset.js?v=1"></script><script>header(CFG.title,true);const CHOICE_LIST=[...TIMES_SEHEN,...TIMES_FORMEN];const tasks=[['karteikarten.html',WORDS.length,'Karteikarten','🃏','Wortschatz mit Flip-Karten.'],['artikel.html',TIME_NOUNS.length,'Artikel der Zeitwörter','🧩','der, die oder das?'],['plural.html',TIME_NOUNS.length,'Plural der Zeitwörter','🔤','Schreibe die Pluralform.'],['sehen-schreiben.html',TIMES_SEHEN.length,'Sehen → Schreiben','🕒','Schreibe einen ganzen Satz in Alltagssprache.'],['hoeren-schreiben.html',TIMES_HOEREN.length,'Hören → Schreiben','🎧','Höre den Dialog und schreibe formell oder digital.'],['sprechen.html',TIMES_SPRECHEN.length,'Sprechen','🎤','Sprich die Uhrzeit. Zahlen werden tolerant akzeptiert.'],['formell-informell.html',TIMES_FORMEN.length,'Formell ↔ informell','🔁','Sprich oder schreibe beide Formen.'],['frage-antwort.html',TIMES_FRAGE.length,'Frage / Antwort','💬','Frage, formelle Antwort und informelle Antwort sprechen.'],['uhrzeit-waehlen.html',CHOICE_LIST.length,'Uhrzeit wählen','✅','Sieh die Uhr und wähle die richtige Antwort.'],['schon-erst.html',SCHON_ERST.length,'schon / erst','⏳','A1-Dialoge mit Lücke.']];function card(t,n){const p=pctFor(t[0],t[1]);return`<a class="module" href="${t[0]}"><div class="num">${n}. ${t[2]}</div><div class="icon">${t[3]}</div><p>${t[4]}</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small">${p}%</div><div class="start">${p>=100?'Fertig':'Starten'}</div></a>`}function examTile(n,open){const p=pctFor('pruefung.html',20);return open?`<a class="module" href="pruefung.html"><div class="num">${n}. Prüfung</div><div class="icon exam-icon">⭐</div><p>Gemischte Prüfung.</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small">${p?p+'%':'offen'}</div><div class="start">Starten</div></a>`:`<div class="module locked exam-locked"><div class="num">${n}. Prüfung</div><div class="icon exam-icon">⭐</div><p>Prüfung wird erst freigeschaltet, wenn alle Aufgaben 100% erreicht haben.</p><div class="progress"><div class="bar" style="width:0%"></div></div><div class="small">gesperrt</div><div class="start">Prüfung gesperrt</div></div>`}let n=1;taskGrid.innerHTML=tasks.map(t=>card(t,n++)).join('');const open=tasks.every(t=>pctFor(t[0],t[1])>=100);taskGrid.innerHTML+=examTile(n,open);const all=[...tasks,['pruefung.html',20]];const avg=Math.round(all.reduce((s,t)=>s+pctFor(t[0],t[1]),0)/all.length)||0;const done=all.filter(t=>pctFor(t[0],t[1])>=100).length;totalCircle.textContent=avg+'%';totalBar.style.width=avg+'%';totalText.textContent=done+' / '+all.length+' Aufgaben abgeschlossen';</script></body></html>
