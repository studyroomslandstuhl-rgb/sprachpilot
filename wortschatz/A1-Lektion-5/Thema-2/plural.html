<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plural</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=1"></script><script src="l5t2-timewords.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Plural der Zeitwörter');const FILE='plural.html';let i=0;function show(){if(loadTask(FILE,TIME_NOUNS.length).done.length>=TIME_NOUNS.length){complete(area,FILE,'sehen-schreiben.html');return}i=spNextIndex(FILE,TIME_NOUNS.length);const w=TIME_NOUNS[i];area.innerHTML=`${spProgressHtml(FILE,TIME_NOUNS.length)}<div class="question">Schreibe den Plural mit Artikel.</div>${bigImgHtml(w)}<input id="ans" placeholder="Plural mit Artikel"><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function check(){const w=TIME_NOUNS[i];if(simple(ans.value)===simple(w.plural)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,TIME_NOUNS.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,TIME_NOUNS.length);fb.innerHTML=help3(n,'Da ist noch ein Fehler.','Tipp: Plural immer mit Artikel „die“ schreiben.',w.plural)}}show();</script></body></html>
