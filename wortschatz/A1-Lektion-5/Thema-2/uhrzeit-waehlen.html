<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uhrzeit wählen</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=3"></script><script src="l5t2-extra-times.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Uhrzeit wählen');const FILE='uhrzeit-waehlen.html';const LIST=[...TIMES_SEHEN,...TIMES_FORMEN];let i=0;function label(t){return 'Es ist '+t.informal[0]+'.'}function shuffle(a){return a.sort(()=>Math.random()-.5)}function options(t){const wrong=shuffle(LIST.filter(x=>x.id!==t.id)).slice(0,3).map(label);return shuffle([label(t),...wrong])}function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'schon-erst.html');return}i=spNextIndex(FILE,LIST.length);const t=LIST[i],opts=options(t);area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">Wie spät ist es?</div>${analogClock(t)}<div class="choice-grid">${opts.map(o=>`<button class="choice" onclick="check('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div>`}function check(v){const t=LIST[i];if(simple(v)===simple(label(t))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=help3(n,'Das passt noch nicht.','Sieh dir die Zeiger noch einmal genau an.',label(t))}}show();</script></body></html>
