<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüfung</title><link rel="stylesheet" href="style.css?v=1"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Prüfung');const FILE='pruefung.html';const prereq=[['karteikarten.html',WORDS.length],['sehen-schreiben.html',TIMES.length],['hoeren-schreiben.html',TIMES.length],['sprechen.html',TIMES.length],['formell-informell.html',TIMES.length],['frage-antwort.html',TIMES.length],['schon-erst.html',SCHON_ERST.length]];function unlocked(){return prereq.every(t=>pctFor(t[0],t[1])>=100)}let tasks=[],pos=0,score=0;function makeTasks(){let a=[];TIMES.slice(0,8).forEach((t,idx)=>a.push({type:idx%2?'time':'sentence',t,solution:(idx%2?t.informal[0]:'Es ist '+t.informal[0])}));TIMES.slice(0,6).forEach(t=>a.push({type:'formal',t,solution:t.formal[0]}));SCHON_ERST.slice(0,6).forEach(x=>a.push({type:'schon',s:x,solution:x.solution}));return a.sort(()=>Math.random()-.5).slice(0,20)}function render(){if(!unlocked()){area.innerHTML='<div class="finish-box"><div class="question">Prüfung gesperrt</div><p>Schließe zuerst alle Aufgaben mit 100% ab.</p><div class="actions"><a class="btn secondary" href="index.html">Zurück</a></div></div>';return}if(!tasks.length)tasks=makeTasks();if(pos>=tasks.length){finish();return}const q=tasks[pos];let body='';if(q.type==='time')body=`<div class="question">Schreibe die Uhrzeit.</div>${clock(q.t)}<input id="ans" placeholder="Uhrzeit">`;if(q.type==='sentence')body=`<div class="question">Wie spät ist es jetzt?</div>${clock(q.t)}<input id="ans" placeholder="Es ist ...">`;if(q.type==='formal')body=`<div class="question">Schreibe die formelle Uhrzeit.</div>${clock(q.t)}<input id="ans" placeholder="... Uhr ...">`;if(q.type==='schon')body=`<div class="question">Schreibe mit schon oder erst.</div><div class="task-instruction">Erwartete Zeit: <b>${q.s.expected}</b><br>Jetzt: <b>${q.s.time}</b></div>${clock(q.s)}<input id="ans" placeholder="Es ist ...">`;area.innerHTML=`<div class="small">${pos+1} / ${tasks.length}</div><div class="progress"><div class="bar" style="width:${Math.round(pos/tasks.length*100)}%"></div></div>${body}<button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function good(q,v){if(q.type==='time')return ok(v,allAnswers(q.t));if(q.type==='sentence')return ok(v,[...q.t.formal,...q.t.informal].map(x=>'Es ist '+x));if(q.type==='formal')return ok(v,formalAnswers(q.t));if(q.type==='schon')return simple(v)===simple(q.solution);return false}function check(){const q=tasks[pos];if(good(q,ans.value))score++;else fb.innerHTML='<div class="no">Lösung: '+q.solution+'</div>';pos++;setTimeout(render,450)}function finish(){let st=loadTask(FILE,tasks.length);const best=Math.max(st.done.length||0,score);st.done=[...Array(best).keys()];st.queue=[];st.current=null;saveTask(FILE,st);const pct=Math.round(score/tasks.length*100);if(window.syncExam)syncExam({score,maxScore:tasks.length,percent:pct,stars:pct>=100?3:pct>=70?2:pct>=50?1:0});area.innerHTML=`<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Prüfung fertig</div><div class="hint">Ergebnis: ${score} / ${tasks.length} = ${pct}%</div><div class="actions"><a class="btn" href="index.html">Zum Thema</a></div></div>`}render();</script></body></html>
