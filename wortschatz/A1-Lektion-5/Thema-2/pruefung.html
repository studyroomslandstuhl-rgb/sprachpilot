<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pruefung</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=3"></script><script src="l5t2-extra-times.js?v=1"></script><script src="l5t2-timewords.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Pruefung');const FILE='pruefung.html';const CHOICE_LIST=[...TIMES_SEHEN,...TIMES_FORMEN];const prereq=[['karteikarten.html',WORDS.length],['artikel.html',TIME_NOUNS.length],['plural.html',TIME_NOUNS.length],['sehen-schreiben.html',TIMES_SEHEN.length],['hoeren-schreiben.html',TIMES_HOEREN.length],['sprechen.html',TIMES_SPRECHEN.length],['formell-informell.html',TIMES_FORMEN.length],['frage-antwort.html',TIMES_FRAGE.length],['uhrzeit-waehlen.html',CHOICE_LIST.length],['schon-erst.html',SCHON_ERST.length]];function unlocked(){return prereq.every(t=>pctFor(t[0],t[1])>=100)}let tasks=[],pos=0,score=0;function makeTasks(){let a=[];TIMES_SEHEN.slice(0,5).forEach(t=>a.push({type:'time',t,solution:'Es ist '+t.informal[0]}));TIMES_FORMEN.slice(0,4).forEach(t=>a.push({type:'formal',t,solution:t.formal[0]}));TIME_NOUNS.forEach(w=>a.push({type:'article',w,solution:w.article}));TIME_NOUNS.forEach(w=>a.push({type:'plural',w,solution:w.plural}));SCHON_ERST.slice(0,4).forEach(x=>a.push({type:'schon',s:x,solution:x.word}));return a.sort(()=>Math.random()-.5).slice(0,20)}function render(){if(!unlocked()){area.innerHTML='<div class="finish-box"><div class="question">Pruefung gesperrt</div><p>Schliesse zuerst alle Aufgaben mit 100% ab.</p><div class="actions"><a class="btn secondary" href="index.html">Zurueck</a></div></div>';return}if(!tasks.length)tasks=makeTasks();if(pos>=tasks.length){finish();return}const q=tasks[pos];let body='';if(q.type==='time')body=`<div class="question">Schreibe die Uhrzeit informell als ganzen Satz.</div>${analogClock(q.t)}<input id="ans" placeholder="Es ist ...">`;if(q.type==='formal')body=`<div class="question">Schreibe die formelle Uhrzeit.</div>${analogClock(q.t)}<input id="ans" placeholder="... Uhr ...">`;if(q.type==='article')body=`<div class="question">Welcher Artikel passt?</div><div class="sentence-box">___ ${q.w.word}</div>${bigImgHtml(q.w)}<input id="ans" placeholder="der / die / das">`;if(q.type==='plural')body=`<div class="question">Schreibe den Plural mit Artikel.</div>${bigImgHtml(q.w)}<input id="ans" placeholder="die ...">`;if(q.type==='schon')body=`<div class="question">Waehle schon oder erst.</div><div class="dialog-box">${q.s.dialog.map(x=>'<p>'+x+'</p>').join('')}</div><input id="ans" placeholder="schon / erst">`;area.innerHTML=`<div class="small">${pos+1} / ${tasks.length}</div><div class="progress"><div class="bar" style="width:${Math.round(pos/tasks.length*100)}%"></div></div>${body}<button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function good(q,v){if(q.type==='time')return ok(v,informalSentenceAnswers(q.t));if(q.type==='formal')return ok(v,formalLooseAnswers(q.t));if(q.type==='article')return simple(v)===simple(q.solution);if(q.type==='plural')return simple(v)===simple(q.solution);if(q.type==='schon')return simple(v)===simple(q.solution);return false}function check(){const q=tasks[pos];if(good(q,ans.value))score++;else fb.innerHTML='<div class="no">Loesung: '+q.solution+'</div>';pos++;setTimeout(render,450)}function finish(){let st=loadTask(FILE,tasks.length);const best=Math.max(st.done.length||0,score);st.done=[...Array(best).keys()];st.queue=[];st.current=null;saveTask(FILE,st);const pct=Math.round(score/tasks.length*100);if(window.syncExam)syncExam({score,maxScore:tasks.length,percent:pct,stars:pct>=100?3:pct>=70?2:pct>=50?1:0});area.innerHTML=`<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Pruefung fertig</div><div class="hint">Ergebnis: ${score} / ${tasks.length} = ${pct}%</div><div class="actions"><a class="btn" href="index.html">Zum Thema</a></div></div>`}render();</script></body></html>
