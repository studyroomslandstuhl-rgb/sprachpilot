<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>schon / erst</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=2"></script><script src="../l5-points.js?v=1"></script><script>header('schon / erst');const FILE='schon-erst.html';let i=0;function show(){if(loadTask(FILE,SCHON_ERST.length).done.length>=SCHON_ERST.length){complete(area,FILE,'index.html');return}i=spNextIndex(FILE,SCHON_ERST.length);const t=SCHON_ERST[i];area.innerHTML=`${spProgressHtml(FILE,SCHON_ERST.length)}<div class="question">Wähle: schon oder erst?</div><div class="dialog-box">${t.dialog.map(x=>'<p>'+x+'</p>').join('')}</div><div class="choice-grid"><button class="choice" onclick="check('schon')"><b>schon</b></button><button class="choice" onclick="check('erst')"><b>erst</b></button></div><div id="fb" class="feedback"></div>`}function check(v){const t=SCHON_ERST[i];if(v===t.word){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,SCHON_ERST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,SCHON_ERST.length);fb.innerHTML=help3(n,'Das passt noch nicht.','Tipp: Früher als erwartet = erst. Später als erwartet = schon.',t.word)}}show();</script></body></html>
