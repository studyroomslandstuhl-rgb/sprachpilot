<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>schon / erst</title><link rel="stylesheet" href="style.css?v=1"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('schon / erst');const FILE='schon-erst.html';let i=0;function show(){if(loadTask(FILE,SCHON_ERST.length).done.length>=SCHON_ERST.length){complete(area,FILE,'index.html');return}i=spNextIndex(FILE,SCHON_ERST.length);const t=SCHON_ERST[i];area.innerHTML=`${spProgressHtml(FILE,SCHON_ERST.length)}<div class="question">Schreibe den Satz mit „schon“ oder „erst“.</div><div class="task-instruction">Erwartete Zeit: <b>${t.expected}</b><br>Jetzt: <b>${t.time}</b></div>${clock(t)}<div class="choice-grid"><button class="choice" onclick="choose('schon')"><b>schon</b></button><button class="choice" onclick="choose('erst')"><b>erst</b></button></div><input id="ans" placeholder="Es ist ..."><button class="btn" onclick="check()">Kontrollieren</button><div id="fb" class="feedback"></div>`}function choose(w){ans.value='Es ist '+w+' '}function check(){const t=SCHON_ERST[i];if(simple(ans.value)===simple(t.solution)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,SCHON_ERST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,SCHON_ERST.length);fb.innerHTML=help3(n,'Da ist noch ein Fehler.','Tipp: Erwartete Zeit und jetzige Zeit vergleichen. Früher = erst, später = schon.',t.solution)}}show();</script></body></html>
