<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uhrzeit sprechen</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=2"></script><script src="../l5-points.js?v=1"></script><script>header('Uhrzeit sprechen');const FILE='sprechen.html';let i=0;function show(){if(loadTask(FILE,TIMES.length).done.length>=TIMES.length){complete(area,FILE,'formell-informell.html');return}i=spNextIndex(FILE,TIMES.length);const t=TIMES[i];area.innerHTML=`${spProgressHtml(FILE,TIMES.length)}<div class="question">Sage die Uhrzeit.</div>${analogClock(t)}<div class="actions"><button id="micBtn" class="btn" onclick="rec()">🎤 Sprechen</button><button class="btn secondary" onclick="box.classList.remove('hidden')">Antwort tippen</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="hidden"><input id="ans" placeholder="Uhrzeit"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function rec(){startMic(micBtn,v=>{box.classList.remove('hidden');ans.value=v;check(v)})}function check(v){const t=TIMES[i];if(ok(v,looseAnswers(t))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,TIMES.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,TIMES.length);fb.innerHTML=help3(n,'Das passt noch nicht.','Tipp: Sage die Uhrzeit formell oder informell.',t.informal[0])}}show();</script></body></html>
