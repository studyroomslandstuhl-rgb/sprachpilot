<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=1"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=1"></script><script src="../l5-points.js?v=1"></script><script>header('Karteikarten');const FILE='karteikarten.html';let i=0;function show(){if(loadTask(FILE,WORDS.length).done.length>=WORDS.length){complete(area,FILE,'sehen-schreiben.html');return}i=spNextIndex(FILE,WORDS.length);const w=WORDS[i];area.innerHTML=`${spProgressHtml(FILE,WORDS.length)}<div class="question">${cardPrompt(w)}</div><div class="hint"><b>Muttersprache:</b> ${tr(w)}</div>${bigImgHtml(w)}<div class="actions"><button id="micBtn" class="btn" onclick="say()">🎤 Sprechen</button><button class="btn secondary" onclick="writeBox()">Ich kann nicht sprechen</button><button class="btn secondary" onclick="flip()">Karte umdrehen</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="hidden"><input id="ans" placeholder="Schreiben Sie die Antwort hier"><button class="btn" onclick="check(ans.value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function writeBox(){box.classList.remove('hidden')}function flip(){const w=WORDS[i];const t=spMarkWrong(FILE,WORDS.length);fb.innerHTML=help3(t,'Da ist noch ein Fehler.','Tipp: '+cardTip(w)+' prüfen.',full(w));writeBox();ans.value=full(w)}function say(){startMic(micBtn,txt=>{writeBox();ans.value=txt;check(txt)})}function check(v){const w=WORDS[i];if(simple(v)===simple(full(w))||simple(v)===simple(w.word)){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,WORDS.length);setTimeout(show,600)}else{const t=spMarkWrong(FILE,WORDS.length);fb.innerHTML=help3(t,'Da ist noch ein Fehler.','Tipp: '+cardTip(w)+' prüfen.',full(w))}}show();</script></body></html>
