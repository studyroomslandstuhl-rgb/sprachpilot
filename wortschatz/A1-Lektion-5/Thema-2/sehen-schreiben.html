<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sehen Schreiben</title><link rel="stylesheet" href="style.css?v=3"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=3"></script><script src="../l5-points.js?v=1"></script><script>header('Sehen → Schreiben');const FILE='sehen-schreiben.html';const LIST=TIMES_SEHEN;let i=0;function show(){if(loadTask(FILE,LIST.length).done.length>=LIST.length){complete(area,FILE,'hoeren-schreiben.html');return}i=spNextIndex(FILE,LIST.length);const t=LIST[i];area.innerHTML=`${spProgressHtml(FILE,LIST.length)}<div class="question">${timeQuestion(i)}</div><div class="hint">Schreibe einen ganzen Satz in Alltagssprache: <b>Es ist ...</b></div>${analogClock(t)}<input id="ans" placeholder="z. B. Es ist Viertel nach fünf."><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function check(){const t=LIST[i];if(ok(ans.value,informalSentenceAnswers(t))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,LIST.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,LIST.length);fb.innerHTML=help3(n,'Da ist noch ein Fehler.','Tipp: Beginne mit Es ist und schreibe die informelle Zeit.',sentenceOnly([t.informal[0]])[0])}}show();</script></body></html>
