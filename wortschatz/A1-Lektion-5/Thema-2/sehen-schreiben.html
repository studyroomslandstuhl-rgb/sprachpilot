<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sehen → Schreiben</title><link rel="stylesheet" href="style.css?v=2"></head><body><script type="module" src="/js/guard.js"></script><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script>window.SP_L5_THEME={id:'Thema-2',title:'Uhrzeit',sub:'A1 Lektion 5 · Thema 2',key:'SP_L5_T2_V1'};</script><script src="app.js?v=2"></script><script src="../l5-points.js?v=1"></script><script>header('Sehen → Schreiben');const FILE='sehen-schreiben.html';let i=0;function show(){if(loadTask(FILE,TIMES.length).done.length>=TIMES.length){complete(area,FILE,'hoeren-schreiben.html');return}i=spNextIndex(FILE,TIMES.length);const t=TIMES[i];area.innerHTML=`${spProgressHtml(FILE,TIMES.length)}<div class="question">Schreibe die Uhrzeit informell.</div>${clock(t)}<input id="ans" placeholder="z. B. Viertel nach fünf"><div class="actions"><button class="btn" onclick="check()">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function check(){const t=TIMES[i];if(ok(ans.value,informalLooseAnswers(t))){fb.innerHTML='<div class="ok">Richtig!</div>';spMarkRight(FILE,TIMES.length);setTimeout(show,600)}else{const n=spMarkWrong(FILE,TIMES.length);fb.innerHTML=help3(n,'Da ist noch ein Fehler.','Tipp: Hier zählt nur die informelle Zeit.',t.informal[0])}}show();</script></body></html>
