<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karteikarten · Lektion 5 · Thema 1</title>
<link rel="stylesheet" href="style.css?v=l5t1-card-standard1">
<style>
.sp-l5-card-note{max-width:760px;margin:10px auto 16px;text-align:center}
.sp-l5-flip-wrap{width:min(760px,100%);margin:0 auto;perspective:1300px}
.sp-l5-flip-card{position:relative;width:100%;height:510px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s ease;border-radius:26px;outline:none}
.sp-l5-flip-card.flipped{transform:rotateY(180deg)}
.sp-l5-flip-card:focus-visible{outline:5px solid rgba(41,184,179,.28);outline-offset:5px}
.sp-l5-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;border:3px solid var(--lesson-line);border-radius:26px;background:#fff;box-shadow:var(--lesson-shadow);backface-visibility:hidden;overflow:auto}
.sp-l5-back{transform:rotateY(180deg);justify-content:flex-start}
.sp-l5-front .task-img,.sp-l5-back .task-img{width:min(300px,100%);height:220px;margin:0;flex:0 0 auto}
.sp-l5-front .placeholder-img,.sp-l5-back .placeholder-img{height:220px;margin:0}
.sp-l5-front-translation{width:100%;max-width:560px;padding:14px 18px;border:2px solid var(--lesson-line);border-radius:16px;background:var(--lesson-soft);font-size:20px;font-weight:900;text-align:center}
.sp-l5-flip-label{font-size:14px;font-weight:900;color:#52706e}
.sp-l5-back-grid{width:100%;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}
.sp-l5-back-grid .task-img,.sp-l5-back-grid .placeholder-img{width:100%;height:180px}
.sp-l5-back-info{display:grid;gap:10px;min-width:0;text-align:left}
.sp-l5-card-word{font-size:34px;line-height:1.15;font-weight:1000;color:var(--lesson-main-dark);overflow-wrap:anywhere}
.sp-l5-card-type{display:inline-flex;width:max-content;max-width:100%;padding:6px 10px;border:1px solid var(--lesson-line);border-radius:999px;background:var(--lesson-soft);font-size:13px;font-weight:900}
.sp-l5-card-detail{padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0}
.sp-l5-card-detail span{display:block;font-size:13px;color:#64748b;font-weight:800}
.sp-l5-card-detail strong{display:block;margin-top:3px;font-size:17px;line-height:1.35;color:#243b3a}
.sp-l5-answer-hint{max-width:760px;margin:12px auto 0;text-align:center}
.sp-l5-answer-box{max-width:760px;margin:0 auto}
.sp-l5-answer-box.hidden{display:none}
.sp-l5-feedback{min-height:32px}
@media(max-width:700px){
 .sp-l5-flip-card{height:590px}
 .sp-l5-face{padding:16px}
 .sp-l5-back-grid{grid-template-columns:1fr;gap:10px}
 .sp-l5-back-grid .task-img,.sp-l5-back-grid .placeholder-img{width:130px;height:110px;margin:0 auto}
 .sp-l5-card-word{font-size:29px;text-align:center}
 .sp-l5-card-type{margin:0 auto}
}
</style>
</head>
<body>
<div class="container">
<header class="topbar"></header>
<section class="card" id="area"><div class="question">Aufgabe wird geladen …</div></section>
<footer>© SprachPilot</footer>
</div>
<script src="../data/wortschatz.js?v=6"></script>
<script>window.SP_L5_THEME={id:'Thema-1',title:'Alltag und trennbare Verben',sub:'A1 Lektion 5 · Thema 1',key:'SP_L5_T1_V1'};</script>
<script src="app.js?v=l5t1-card-standard1"></script>
<script src="l5-theme1-assets.js?v=3"></script>
<script src="/wortschatz/A1-Lektion-5/l5-bunny-words.js?v=l5-bunny-all3"></script>
<script src="points-hook.js?v=5"></script>
<script>
header('Karteikarten');
const FILE='karteikarten.html';
const areaEl=document.getElementById('area');
let i=null;
let revealed=false;
let solved=false;

function safe(value){
 return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function answerFor(word){return full(word)}
function accepted(text,word){
 return word.article
  ? simple(text)===simple(full(word))
  : simple(text)===simple(full(word))||simple(text)===simple(word.word);
}

function backDetails(word){
 const plural=word.plural?`<div class="sp-l5-card-detail"><span>Plural</span><strong>${safe(word.plural)}</strong></div>`:'';
 const example=word.sentence?`<div class="sp-l5-card-detail"><span>Beispiel</span><strong>${safe(word.sentence)}</strong></div>`:'';
 return `<div class="sp-l5-back-grid">
  <div>${bigImgHtml(word)}</div>
  <div class="sp-l5-back-info">
   <div class="sp-l5-card-word">${safe(full(word))}</div>
   <div class="sp-l5-card-type">${safe(typeLabel(word.type))}</div>
   <div class="sp-l5-card-detail"><span>Bedeutung</span><strong>${safe(tr(word)||'—')}</strong></div>
   ${plural}
   ${example}
   <button type="button" class="btn secondary" onclick="spL5PlayWord(WORDS[i],this)">🔊 Anhören</button>
  </div>
 </div>`;
}

function show(){
 const state=loadTask(FILE,WORDS.length);
 if(state.done.length>=WORDS.length){complete(areaEl,FILE,'bild-wort.html');return}
 i=spNextIndex(FILE,WORDS.length);
 if(i===undefined||i===null)i=0;
 revealed=false;
 solved=false;
 const word=WORDS[i];
 areaEl.innerHTML=`
  ${spProgressHtml(FILE,WORDS.length)}
  <div class="question">${cardPrompt(word)}</div>
  <div class="hint sp-l5-card-note">Klicke auf die Karte oder drücke Enter bzw. die Leertaste. Das Umdrehen zählt nicht als Antwort.</div>
  <div class="sp-l5-flip-wrap">
   <div id="flashCard" class="sp-l5-flip-card" role="button" tabindex="0" aria-label="Karte umdrehen" aria-pressed="false" onclick="toggleCard(event)" onkeydown="cardKey(event)">
    <div class="sp-l5-face sp-l5-front">
     ${bigImgHtml(word)}
     <div class="sp-l5-front-translation">${safe(tr(word)||'—')}</div>
     <div class="sp-l5-flip-label">Karte umdrehen</div>
    </div>
    <div class="sp-l5-face sp-l5-back">
     ${backDetails(word)}
    </div>
   </div>
  </div>
  <div id="answerHint" class="hint sp-l5-answer-hint hidden">Sprich das Wort oder schreibe es. Erst eine richtige Antwort geht weiter.</div>
  <div class="actions">
   <button id="micBtn" type="button" class="btn mic-btn" onclick="say()">🎤 Sprechen</button>
   <button type="button" class="btn secondary" onclick="writeBox()">✍️ Schreiben</button>
  </div>
  <div id="micStatus" class="mic-status"></div>
  <div id="answerBox" class="sp-l5-answer-box hidden">
   <input id="ans" autocomplete="off" placeholder="Schreibe die Antwort hier" onkeydown="if(event.key==='Enter'){event.preventDefault();check(this.value)}">
   <div class="actions"><button id="checkBtn" type="button" class="btn" onclick="check(document.getElementById('ans').value)">Kontrollieren</button></div>
  </div>
  <div id="fb" class="feedback sp-l5-feedback"></div>`;
}

function toggleCard(event){
 if(solved)return;
 if(event?.target?.closest('button,input,textarea,audio,a'))return;
 const card=document.getElementById('flashCard');
 revealed=!revealed;
 card.classList.toggle('flipped',revealed);
 card.setAttribute('aria-pressed',String(revealed));
 document.getElementById('answerHint').classList.toggle('hidden',!revealed);
}

function cardKey(event){
 if(event.key!=='Enter'&&event.key!==' ')return;
 if(event.target.closest('button,input,textarea,audio,a'))return;
 event.preventDefault();
 toggleCard(event);
}

function writeBox(){
 if(solved)return;
 const box=document.getElementById('answerBox');
 box.classList.remove('hidden');
 requestAnimationFrame(()=>document.getElementById('ans')?.focus());
}

function say(){
 if(solved)return;
 const mic=document.getElementById('micBtn');
 startMic(mic,text=>{
  writeBox();
  const input=document.getElementById('ans');
  input.value=text;
  check(text);
 });
}

function feedback(tries,word){
 if(tries===1)return'<div class="no">Noch nicht richtig. Versuche es noch einmal.</div>';
 if(tries===2)return`<div class="hint">Tipp: Prüfe ${safe(cardTip(word))}. Das Wort beginnt mit „${safe(answerFor(word).trim().charAt(0))}“.</div>`;
 return`<div class="no">Lösung: <strong>${safe(answerFor(word))}</strong><br>Sprich oder schreibe die richtige Antwort jetzt selbst.</div>`;
}

function check(text){
 if(solved||!String(text||'').trim())return;
 const word=WORDS[i];
 const box=document.getElementById('fb');
 if(accepted(text,word)){
  solved=true;
  revealed=true;
  document.getElementById('flashCard').classList.add('flipped');
  document.getElementById('flashCard').setAttribute('aria-pressed','true');
  document.getElementById('answerHint').classList.remove('hidden');
  box.innerHTML='<div class="ok">Richtig!</div>';
  document.getElementById('micBtn').disabled=true;
  const input=document.getElementById('ans');
  const checkButton=document.getElementById('checkBtn');
  if(input)input.disabled=true;
  if(checkButton)checkButton.disabled=true;
  spMarkRight(FILE,WORDS.length);
  setTimeout(show,900);
  return;
 }
 const tries=spMarkWrong(FILE,WORDS.length);
 box.innerHTML=feedback(tries,word);
 if(tries>=3){
  revealed=true;
  document.getElementById('flashCard').classList.add('flipped');
  document.getElementById('flashCard').setAttribute('aria-pressed','true');
  document.getElementById('answerHint').classList.remove('hidden');
 }
 writeBox();
}

show();
</script>
</body>
</html>
