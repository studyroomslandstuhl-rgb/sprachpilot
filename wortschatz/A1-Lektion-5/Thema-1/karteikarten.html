<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karteikarten</title><link rel="stylesheet" href="style.css?v=l5t1-drive-standard1"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"><div class="question">Aufgabe wird geladen …</div></section><footer>© SprachPilot</footer></div><script src="../data/wortschatz.js?v=6"></script><script>window.SP_L5_THEME={id:'Thema-1',title:'Alltag und trennbare Verben',sub:'A1 Lektion 5 · Thema 1',key:'SP_L5_T1_V1'};</script><script src="app.js?v=l5t1-drive-standard1"></script><script src="l5-theme1-assets.js?v=3"></script><script src="points-hook.js?v=5"></script><script>header('Karteikarten');const FILE='karteikarten.html';const areaEl=document.getElementById('area');let i=null,revealed=false,solved=false;function accepted(txt,w){return w.article?simple(txt)===simple(full(w)):(simple(txt)===simple(full(w))||simple(txt)===simple(w.word))}function finishBox(){areaEl.innerHTML='<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Aufgabe geschafft!</div><div class="hint">100% erreicht.</div><div class="progress"><div class="bar" style="width:100%"></div></div><div class="actions"><button class="btn" onclick="restartTask()">Nochmal üben</button><a class="btn" href="bild-wort.html">Weiter</a><a class="btn secondary" href="index.html">Zurück zum Thema</a></div></div>'}function restartTask(){localStorage.removeItem(taskKey(FILE));location.reload()}function show(){if(loadTask(FILE,WORDS.length).done.length>=WORDS.length){finishBox();return}i=spNextIndex(FILE,WORDS.length);if(i===undefined||i===null)i=0;revealed=false;solved=false;const w=WORDS[i];areaEl.innerHTML=`${spProgressHtml(FILE,WORDS.length)}<div class="question">${cardPrompt(w)}</div><div class="hint">Muttersprache: <b>${tr(w)}</b></div>${bigImgHtml(w)}<div class="actions"><button id="micBtn" class="btn mic-btn" onclick="say()">🎤 Sprechen</button><button class="btn secondary" onclick="writeBox()">Ich kann nicht sprechen</button><button id="flipBtn" class="btn secondary" onclick="flip()">Karte umdrehen</button></div><div id="micStatus" class="mic-status"></div><div id="box" class="hidden"><input id="ans" placeholder="Schreiben Sie die Antwort hier"><button class="btn" onclick="check(document.getElementById('ans').value)">Kontrollieren</button></div><div id="fb" class="feedback"></div>`}function writeBox(){document.getElementById('box').classList.remove('hidden');document.getElementById('ans')?.focus()}function flip(){if(solved||revealed)return;revealed=true;const w=WORDS[i];spMarkWrong(FILE,WORDS.length);document.getElementById('fb').innerHTML='Lösung: '+full(w);document.getElementById('flipBtn').disabled=true;writeBox()}function say(){if(solved)return;const mic=document.getElementById('micBtn');startMic(mic,txt=>{writeBox();document.getElementById('ans').value=txt;check(txt)})}function feedbackForCard(tries,w){if(tries===1)return'Da ist noch ein Fehler.';if(tries===2)return'Tipp: Prüfe '+cardTip(w)+'.';return'Lösung: '+full(w)}function check(txt){if(solved||!String(txt||'').trim())return;const w=WORDS[i];const fb=document.getElementById('fb');if(accepted(txt,w)){solved=true;fb.textContent='Richtig!';spMarkRight(FILE,WORDS.length);setTimeout(show,700)}else{const tries=spMarkWrong(FILE,WORDS.length);fb.innerHTML=feedbackForCard(tries,w)}}show();</script></body></html>
