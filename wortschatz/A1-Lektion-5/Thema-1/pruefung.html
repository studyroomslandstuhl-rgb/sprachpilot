<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prüfung Thema 1</title><link rel="stylesheet" href="style.css?v=8"></head><body><div class="container"><header class="topbar"></header><section class="card" id="area"></section><footer>© SprachPilot</footer></div><script src="../data/wortschatz.js?v=6"></script><script>window.SP_L5_THEME={id:'Thema-1',title:'Alltag und trennbare Verben',sub:'A1 Lektion 5 · Thema 1',key:'SP_L5_T1_V1'};</script><script src="app.js?v=13"></script><script src="/wortschatz/A1-Lektion-5/l5-bunny-words.js?v=l5-bunny-all3"></script><script src="points-hook.js?v=6"></script><script>
header('Prüfung');
const FILE='pruefung.html';
const REQUIRED_TASKS=[['karteikarten.html',()=>WORDS.length],['bild-wort.html',()=>WORDS.filter(w=>hasGoodImage(w)).length],['wort-bild.html',()=>WORDS.filter(w=>hasGoodImage(w)).length],['hoeren-schreiben.html',()=>WORDS.length],['trennbare-verben.html',()=>WORDS.filter(w=>w.type==='verb').length],['trennbare-verben-im-satz.html',()=>12],['marias-tag.html',()=>11],['was-machst-du-gern.html',()=>9],['ja-nein-fragen.html',()=>10],['verb-passt.html',()=>8]];
function unlocked(){return REQUIRED_TASKS.every(t=>pctFor(t[0],Number(t[1]())||0)>=100)}
if(!unlocked()){area.innerHTML='<div class="finish-box"><div class="finish-icon">★</div><div class="question">Prüfung gesperrt</div><div class="hint">Die Prüfung wird freigeschaltet, wenn alle Aufgaben in diesem Thema 100% erreicht haben.</div><div class="actions"><a class="btn secondary" href="index.html">Zurück zum Thema</a></div></div>';throw new Error('L5T1 Prüfung gesperrt');}

const BASE_EXAM=[
 ['Schreibe das deutsche Wort.','kochen','kochen'],
 ['Schreibe das deutsche Wort.','aufstehen','aufstehen'],
 ['Schreibe das deutsche Wort.','müde','muede'],
 ['Schreibe das deutsche Wort mit Artikel.','der Supermarkt','supermarkt'],
 ['Ist aufstehen trennbar? ja/nein','ja'],
 ['Ist kochen trennbar? ja/nein','nein'],
 ['Ist anrufen trennbar? ja/nein','ja'],
 ['Ist schlafen trennbar? ja/nein','nein'],
 ['Ich ___ früh ___.','stehe auf'],
 ['Maria ___ die Küche ___.','räumt auf'],
 ['Ich ___ die Familie ___.','rufe an'],
 ['Ich ___ gern ___.','sehe fern'],
 ['Block: steht früh auf. Satz mit Maria.','Maria steht früh auf'],
 ['Block: kauft im Supermarkt ein. Satz mit Sie.','Sie kauft im Supermarkt ein'],
 ['Block: sieht am Abend fern. Satz mit Sie.','Sie sieht am Abend fern'],
 ['Frage: Was machst du gern? Antwort mit kochen.','Ich koche gern'],
 ['Bilde die Frage zu kochen gern.','Kochst du gern'],
 ['Positive Antwort: Kochst du gern?','Ja, ich koche gern']
];
const AUDIO_WORD_IDS=['kochen','aufstehen','einkaufen','aufraeumen','anrufen','fernsehen','arbeiten','spielen','essen','schlafen','gehen','hoeren','machen'];
const TEXT_REPLACEMENTS=[
 ['Schreibe einen Satz mit „einkaufen“ und „ich“.','Ich kaufe ein'],
 ['Schreibe einen Satz mit „aufräumen“ und „Maria“.','Maria räumt auf']
];
let EXAM=[];
let pos=0,score=0,activeExamAudio=null;

function bunnyAudioUrl(id){return'https://sprachpilot.b-cdn.net/audio/'+encodeURIComponent(id)+'.mp3'}
function audioExists(url){return new Promise(resolve=>{let settled=false;const a=new Audio();const done=ok=>{if(settled)return;settled=true;clearTimeout(timer);a.onloadedmetadata=null;a.oncanplay=null;a.onerror=null;try{a.pause()}catch(e){}resolve(ok)};const timer=setTimeout(()=>done(false),3500);a.preload='metadata';a.onloadedmetadata=()=>done(true);a.oncanplay=()=>done(true);a.onerror=()=>done(false);a.src=url;try{a.load()}catch(e){done(false)}})}
async function getRealBunnyAudioQuestions(){const out=[];for(const id of AUDIO_WORD_IDS){if(out.length>=2)break;const word=WORDS.find(w=>w.id===id);if(!word)continue;const url=bunnyAudioUrl(id);if(await audioExists(url))out.push(['Höre und schreibe das Wort.',word.word||id,null,url]);}return out}
function playExamAudio(url){if(!url)return;if(activeExamAudio){try{activeExamAudio.pause()}catch(e){}}activeExamAudio=new Audio(url);activeExamAudio.preload='auto';activeExamAudio.play().catch(()=>{})}

function render(){if(pos>=EXAM.length){finish();return}const q=EXAM[pos];const audioUrl=q[3]||'';const imageId=q[2]||'';const imageWord=imageId?WORDS.find(w=>w.id===imageId):null;const image=imageWord?bigImgHtml(imageWord):'';area.innerHTML=`<div class="small">Frage ${pos+1} / ${EXAM.length}</div><div class="progress"><div class="bar" style="width:${Math.round(pos/EXAM.length*100)}%"></div></div><div class="question">${q[0]}</div>${image?`<div class="exam-image">${image}</div>`:''}${audioUrl?`<div class="actions"><button class="btn" onclick="playExamAudio('${audioUrl}')">▶ Audio hören</button></div>`:''}<input id="ans" placeholder="Antwort"><button class="btn" onclick="check()">Weiter</button><div id="fb" class="feedback"></div>`}
function check(){const q=EXAM[pos];if(simple(ans.value)===simple(q[1]))score++;pos++;render()}
function finish(){let st=loadTask(FILE,EXAM.length);const best=Math.max(st.done.length||0,score);st.done=[...Array(best).keys()];st.current=null;saveTask(FILE,st);const percent=Math.round(score/EXAM.length*100);const bestPct=Math.round(best/EXAM.length*100);const stars=percent>=100?3:percent>=70?2:percent>=50?1:0;if(window.syncExam)syncExam({score,maxScore:EXAM.length,percent,stars});area.innerHTML=`<div class="finish-box"><div class="finish-icon">✓</div><div class="question">Prüfung fertig</div><div class="hint">Ergebnis: ${score} / ${EXAM.length} = ${percent}%<br>Beste Leistung gespeichert: ${bestPct}%</div><div class="point-note">Prüfungspunkte: pro Run zählt die beste Leistung, Verbesserungen ergänzen nur die Differenz.</div><div class="actions"><a class="btn" href="index.html">Zum Thema</a></div></div>`}

(async function initExam(){area.innerHTML='<div class="question">Prüfung wird geladen …</div><div class="hint">Bunny-Audios werden geprüft.</div>';const audioQuestions=await getRealBunnyAudioQuestions();const missing=Math.max(0,2-audioQuestions.length);EXAM=[...BASE_EXAM,...audioQuestions,...TEXT_REPLACEMENTS.slice(0,missing)];render()})();
</script></body></html>
