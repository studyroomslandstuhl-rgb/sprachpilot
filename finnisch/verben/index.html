<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finnische Verben · SprachPilot</title>
<link rel="preconnect" href="https://sprachpilot.b-cdn.net" crossorigin>
<link rel="dns-prefetch" href="//sprachpilot.b-cdn.net">
<link rel="stylesheet" href="/style.css?v=fi-verben-standard2">
<style>
:root{--fi-blue:#47abc6;--fi-blue-dark:#2f7f96;--fi-soft:#eefaff;--fi-line:#d9eef7;--fi-dark:#123047;--fi-muted:#5f7180;--fi-green:#2e9e4f;--fi-green-soft:#e8f9f0;--fi-red:#e74c3c;--fi-red-soft:#ffe1e1}
body{padding:12px}.fi-shell{max-width:980px;margin:0 auto}.fi-top{background:#fff;border:1px solid var(--fi-line);border-radius:28px;padding:20px;box-shadow:0 14px 34px rgba(18,48,71,.12);margin-bottom:18px}.fi-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.fi-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.fi-brand img{width:66px;height:66px;object-fit:contain;border-radius:16px}.fi-brand h1{font-size:30px;margin:0}.fi-brand p{margin:3px 0 0;color:var(--fi-muted);font-weight:700}.fi-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.fi-nav button,.fi-nav a{margin:0}.fi-card{background:#fff;border:1px solid var(--fi-line);border-radius:24px;padding:20px;box-shadow:0 10px 24px rgba(18,48,71,.10);margin-bottom:16px}.fi-section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.fi-section-head h2{margin:0}.fi-pill{display:inline-block;border-radius:999px;padding:6px 10px;background:var(--fi-soft);border:2px solid #84e3ff;color:#24576a;font-size:13px;font-weight:900}.fi-small{font-size:14px;color:var(--fi-muted);line-height:1.45}.fi-groups{display:grid;gap:12px}.fi-group{border:2px solid var(--fi-line);border-radius:20px;overflow:hidden;background:#fff}.fi-group summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(90px,1fr) minmax(90px,1fr) minmax(120px,auto);gap:10px;align-items:center;padding:15px 16px;font-weight:900}.fi-group summary::-webkit-details-marker{display:none}.fi-group[open] summary{background:#f6fdff;border-bottom:1px solid var(--fi-line)}.fi-group-meta{color:var(--fi-muted);font-size:13px;text-align:right}.fi-group-body{padding:14px}.fi-task-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.fi-task{width:100%;min-height:120px;margin:0;padding:14px;border-radius:18px;background:#fff;color:var(--fi-dark);border:2px solid var(--fi-line);box-shadow:none;text-align:left}.fi-task.ready{border-color:#84e3ff;background:#f6fdff}.fi-task:disabled{opacity:.44;cursor:not-allowed}.fi-task-icon{font-size:24px;display:block}.fi-task strong{display:block;font-size:16px;margin:7px 0}.fi-task span:last-child{font-size:12px;color:var(--fi-muted)}.fi-progress{height:12px;background:#effaff;border-radius:999px;overflow:hidden;margin:10px 0}.fi-progress span{display:block;height:100%;background:linear-gradient(135deg,#47abc6,#84e3ff)}.fi-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.fi-word{border:2px solid var(--fi-line);border-radius:18px;overflow:hidden;background:#fff}.fi-word img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f6fdff;display:block}.fi-word-body{padding:12px}.fi-word h3{margin:0 0 3px;font-size:21px}.fi-word p{margin:0 0 8px;color:var(--fi-muted)}.fi-word .btn{margin:0;padding:8px 10px;font-size:13px}.sp-card-task{max-width:680px;margin:0 auto}.sp-task-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}.sp-task-head h2{margin:0;color:var(--fi-blue-dark)}.sp-task-progress{font-weight:900;color:var(--fi-blue-dark);background:var(--fi-soft);border:2px solid #84e3ff;border-radius:999px;padding:7px 11px}.sp-card-progress{height:12px;background:#effaff;border-radius:999px;overflow:hidden;margin-bottom:16px}.sp-card-progress span{display:block;height:100%;background:linear-gradient(135deg,#47abc6,#84e3ff)}.sp-flip-card{position:relative;min-height:470px;border:2px solid var(--fi-line);border-radius:26px;background:#fff;overflow:hidden;cursor:pointer;box-shadow:0 12px 28px rgba(18,48,71,.10);outline:none}.sp-flip-card:focus{box-shadow:0 0 0 4px rgba(71,171,198,.2),0 12px 28px rgba(18,48,71,.10)}.sp-flip-face{min-height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.sp-flip-front img{width:100%;height:470px;object-fit:cover;display:block}.sp-flip-front .sp-img-fallback{padding:30px;font-weight:900;color:var(--fi-muted)}.sp-flip-back{display:none;padding:18px}.sp-flip-card.is-flipped .sp-flip-front{display:none}.sp-flip-card.is-flipped .sp-flip-back{display:flex}.sp-back-image{width:min(100%,360px);aspect-ratio:1/1;object-fit:cover;border-radius:20px;border:2px solid var(--fi-line);margin-bottom:14px}.sp-word{font-size:40px;font-weight:900;color:var(--fi-dark);line-height:1.1}.sp-meaning{font-size:18px;color:var(--fi-muted);margin-top:6px}.sp-flip-note{font-size:13px;color:var(--fi-muted);margin-top:10px}.sp-card-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.sp-card-actions button{margin:0}.sp-write-box{margin-top:14px;background:#f6fdff;border:2px solid var(--fi-line);border-radius:18px;padding:14px}.sp-write-row{display:flex;gap:8px;align-items:center}.sp-write-row input{margin:0;flex:1}.sp-write-row button{margin:0}.sp-feedback{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:800}.sp-feedback.ok{background:var(--fi-green-soft);border-left:5px solid var(--fi-green);color:#1d6b36}.sp-feedback.no{background:var(--fi-red-soft);border-left:5px solid var(--fi-red);color:#8a1f11}.sp-feedback.hint{background:#fff7dd;border-left:5px solid #d59b00;color:#715300}.sp-after{display:flex;justify-content:center;margin-top:14px}.sp-after button{margin:0}.sp-finish-box{text-align:center;padding:28px 10px}.sp-finish-icon{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--fi-green-soft);color:var(--fi-green);font-size:38px;font-weight:900}.hidden{display:none!important}
@media(max-width:600px){.fi-brand h1{font-size:26px}.fi-brand img{width:56px;height:56px}.fi-group summary{grid-template-columns:1fr auto}.fi-group summary .fi-group-meta{grid-column:1/-1;text-align:left}.sp-flip-card,.sp-flip-face{min-height:390px}.sp-flip-front img{height:390px}.sp-word{font-size:34px}.sp-write-row{align-items:stretch;flex-direction:column}.sp-write-row button{width:100%}}
</style>
</head>
<body>
<div id="accountStrip" class="account-strip"></div>
<div class="fi-shell">
<header class="fi-top">
  <div class="fi-head">
    <a class="fi-brand" href="/finnisch/">
      <img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo">
      <div><h1>Finnische Verben</h1><p id="verbCountText">Verben werden geladen …</p></div>
    </a>
    <span class="fi-pill">🇫🇮 A1</span>
  </div>
  <nav class="fi-nav">
    <a class="btn secondary" href="/finnisch/">← Startseite</a>
    <button class="btn secondary" id="homeBtn">Gruppen</button>
    <button class="btn secondary" id="overviewBtn">Übersicht</button>
  </nav>
</header>
<main id="app"><section class="fi-card">Verben werden geladen …</section></main>
<footer>© SprachPilot</footer>
</div>

<script src="/finnisch/verben/data.js?v=fi-verben-groups1"></script>
<script type="module">
import { getActiveProfile, getActiveRole, loginUrlForCurrent, renderAccountStrip } from "/js/auth.js?v=login-main-4";

const role=getActiveRole();
const profile=getActiveProfile();
if(!profile && role!=="teacher") location.href=loginUrlForCurrent();
try{renderAccountStrip()}catch(e){}

const VERBS=Array.isArray(window.SP_FI_VERBS)?window.SP_FI_VERBS:[];
const GROUP_SIZE=Number(window.SP_FI_VERB_GROUP_SIZE)||20;
const GROUPS=[];
for(let i=0;i<VERBS.length;i+=GROUP_SIZE) GROUPS.push({id:GROUPS.length+1,verbs:VERBS.slice(i,i+GROUP_SIZE)});

document.querySelector("#verbCountText").textContent=`${VERBS.length} Verben · ${GROUPS.length} Gruppen`;

const TASKS=[
  ["cards","Aa","Karteikarten"],
  ["meaning-to-verb","B→V","Bedeutung → Verb"],
  ["verb-to-meaning","V→B","Verb → Bedeutung"],
  ["listen","🔊","Hören → Verb"],
  ["image-to-verb","▣","Bild → Verb"],
  ["verb-to-image","V→▣","Verb → Bild"],
  ["read-sentence","📖","Lesen → Verb"],
  ["change","↔","Verbgruppe"],
  ["choose-form","du","Form auswählen"],
  ["write-form","✎","Form schreiben"],
  ["speak","🎙","Form sprechen"],
  ["sentence","…","Satz ergänzen"],
  ["exam","★","Gruppenprüfung"]
];

const app=document.querySelector("#app");
const bunny="https://sprachpilot.b-cdn.net/";
let activeGroup=1;
let recognition=null;
let current=null;
let flipped=false;
let solved=false;
let tries=0;

function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function norm(value){return String(value??"").normalize("NFC").trim().toLocaleLowerCase("fi-FI").replace(/[.!?,;:]+$/g,"").replace(/\s+/g," ")}
function imageUrl(item){return bunny+encodeURIComponent(item.img+".webp")}
function progressKey(groupId){return `SP_FI_VERB_CARDS_${userKey()}_G${groupId}`}
function userKey(){const p=profile||{};return [p.email,p.kurs,p.courseCode,p.kursnummer,p.vorname,p.nachname].filter(Boolean).join("_").toLowerCase().replace(/[^a-z0-9äöü]+/gi,"_")||"teacher"}
function loadDone(groupId){try{return JSON.parse(localStorage.getItem(progressKey(groupId))||"[]").filter(Boolean)}catch(e){return[]}}
function saveDone(groupId,done){if(role==="teacher") return;localStorage.setItem(progressKey(groupId),JSON.stringify([...new Set(done)]))}
function groupProgress(groupId){const g=GROUPS.find(x=>x.id===groupId);if(!g)return 0;const done=new Set(loadDone(groupId));return Math.round(g.verbs.filter(v=>done.has(v.de)).length*100/g.verbs.length)}
function speak(text,slow=false){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="fi-FI";u.rate=slow?0.62:0.9;speechSynthesis.speak(u)}
function stopRecognition(){if(recognition)try{recognition.abort()}catch(e){} recognition=null}

function renderGroups(){
  stopRecognition();
  const html=GROUPS.map(g=>{const p=groupProgress(g.id);return `<details class="fi-group" ${g.id===activeGroup?"open":""}><summary data-group="${g.id}"><span>Gruppe ${g.id}</span><span>${g.verbs.length} Verben</span><span class="fi-group-meta">Karteikarten ${p}%</span></summary><div class="fi-group-body"><div class="fi-progress"><span style="width:${p}%"></span></div><div class="fi-task-grid">${TASKS.map((task,index)=>`<button class="fi-task ${index===0?"ready":""}" data-task="${task[0]}" data-group="${g.id}" ${index===0?"":"disabled"}><span class="fi-task-icon">${task[1]}</span><strong>${task[2]}</strong><span>${index===0?(p>=100?"Fertig":p?`${p}%`:"Starten"):"Wird danach aufgebaut"}</span></button>`).join("")}</div></div></details>`}).join("");
  app.innerHTML=`<section class="fi-card"><div class="fi-section-head"><div><h2>Gruppen</h2><p class="fi-small">Dieselben Verben und dieselben 20er-Gruppen wie im deutschen Verbenbereich.</p></div><span class="fi-pill">${VERBS.length} Verben</span></div><div class="fi-groups">${html}</div></section>`;
  app.querySelectorAll("summary[data-group]").forEach(s=>s.addEventListener("click",()=>{activeGroup=Number(s.dataset.group)||1}));
  app.querySelectorAll('[data-task="cards"]').forEach(b=>b.addEventListener("click",()=>startCards(Number(b.dataset.group))));
}

function renderOverview(){
  stopRecognition();
  const cards=VERBS.map((v,i)=>`<article class="fi-word"><img src="${imageUrl(v)}" alt="Bild zu ${esc(v.de)}" onerror="this.style.display='none'"><div class="fi-word-body"><span class="fi-pill">Gruppe ${Math.floor(i/GROUP_SIZE)+1}</span><h3>${esc(v.fi)}</h3><p>${esc(v.de)}</p><button class="btn secondary" data-speak="${esc(v.fi)}">🔊 Anhören</button></div></article>`).join("");
  app.innerHTML=`<section class="fi-card"><div class="fi-section-head"><div><h2>Übersicht</h2><p class="fi-small">Alle finnischen Verben in derselben Reihenfolge wie Deutsch.</p></div><span class="fi-pill">${VERBS.length} Verben</span></div><div class="fi-overview">${cards}</div></section>`;
  app.querySelectorAll("[data-speak]").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.speak)));
}

function startCards(groupId){activeGroup=groupId;renderFlashcard()}
function renderFlashcard(){
  stopRecognition();
  const group=GROUPS.find(x=>x.id===activeGroup);if(!group)return renderGroups();
  const done=loadDone(activeGroup);const unfinished=group.verbs.filter(v=>!done.includes(v.de));if(!unfinished.length)return renderFinish(group);
  current=unfinished[0];const completed=group.verbs.length-unfinished.length;const percent=Math.round(completed*100/group.verbs.length);flipped=false;solved=false;tries=0;
  app.innerHTML=`<section id="flashcardTask" class="fi-card sp-card-task"><div class="sp-task-head"><div><p class="fi-small">Gruppe ${activeGroup}</p><h2>1. Karteikarten</h2><p class="fi-small">Sieh das Bild an. Sprich oder schreibe das finnische Verb.</p></div><div class="sp-task-progress">${completed+1} / ${group.verbs.length}</div></div><div class="sp-card-progress"><span style="width:${percent}%"></span></div><div id="spFlipCard" class="sp-flip-card" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="sp-flip-face sp-flip-front"><img src="${imageUrl(current)}" alt="Bild zu ${esc(current.de)}" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"><div class="sp-img-fallback hidden">Bild: ${esc(current.de)}</div></div><div class="sp-flip-face sp-flip-back"><img class="sp-back-image" src="${imageUrl(current)}" alt="Bild zu ${esc(current.de)}" onerror="this.style.display='none'"><div class="sp-word">${esc(current.fi)}</div><div class="sp-meaning">${esc(current.de)}</div><button type="button" class="btn secondary" id="listenBtn">🔊 Anhören</button><div class="sp-flip-note">Das Umdrehen zählt nicht als Antwort.</div></div></div><div class="sp-card-actions"><button type="button" class="btn" id="speakBtn">🎤 Sprechen</button><button type="button" class="btn secondary" id="writeBtn">✍️ Schreiben</button></div><div id="micStatus" class="fi-small" style="text-align:center;margin-top:8px"></div><div id="writeBox" class="sp-write-box hidden"><div class="sp-write-row"><input id="answerInput" autocomplete="off" autocapitalize="none" placeholder="Finnisches Verb schreiben"><button class="btn" id="checkBtn">Kontrollieren</button></div></div><div id="feedback"></div><div id="after" class="sp-after"></div></section>`;
  const card=document.querySelector("#spFlipCard");card.addEventListener("click",flipCard);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flipCard()}});
  document.querySelector("#listenBtn").addEventListener("click",e=>{e.stopPropagation();speak(current.fi)});
  document.querySelector("#speakBtn").addEventListener("click",startSpeech);document.querySelector("#writeBtn").addEventListener("click",()=>openWrite());document.querySelector("#checkBtn").addEventListener("click",checkWritten);document.querySelector("#answerInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkWritten()});
}
function flipCard(){const card=document.querySelector("#spFlipCard");if(!card)return;flipped=!flipped;card.classList.toggle("is-flipped",flipped)}
function openWrite(message=""){document.querySelector("#writeBox")?.classList.remove("hidden");if(message)document.querySelector("#micStatus").textContent=message;setTimeout(()=>document.querySelector("#answerInput")?.focus(),30)}
function showFeedback(kind,html){const box=document.querySelector("#feedback");if(!box)return;box.className="sp-feedback "+kind;box.innerHTML=html}
function wrongAnswer(){tries++;if(tries===1){showFeedback("no","Noch nicht richtig. Versuch es noch einmal.");return}if(tries===2){const first=current.fi.trim().charAt(0).toLocaleUpperCase("fi-FI");showFeedback("hint",`Tipp: Das finnische Verb beginnt mit <strong>${esc(first)}</strong>.`);return}document.querySelector("#spFlipCard")?.classList.add("is-flipped");flipped=true;showFeedback("hint",`Lösung: <strong>${esc(current.fi)}</strong>. Sprich oder schreibe das Wort jetzt richtig.`)}
function correctAnswer(){if(solved)return;solved=true;document.querySelector("#spFlipCard")?.classList.add("is-flipped");flipped=true;const done=loadDone(activeGroup);done.push(current.de);saveDone(activeGroup,done);showFeedback("ok","Richtig!");const after=document.querySelector("#after");after.innerHTML='<button type="button" class="btn" id="nextCardBtn">Weiter</button>';document.querySelector("#nextCardBtn").addEventListener("click",renderFlashcard)}
function checkValue(value){if(solved||!current)return;if(norm(value)===norm(current.fi))correctAnswer();else wrongAnswer()}
function checkWritten(){checkValue(document.querySelector("#answerInput")?.value||"")}
function startSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){openWrite("Mikrofon wird hier nicht unterstützt. Bitte schreibe das Verb.");return}try{stopRecognition();recognition=new SR();recognition.lang="fi-FI";recognition.interimResults=false;recognition.continuous=false;document.querySelector("#micStatus").textContent="Ich höre zu …";recognition.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||"";document.querySelector("#micStatus").textContent=text?`Erkannt: ${text}`:"Nichts erkannt.";checkValue(text)};recognition.onerror=()=>openWrite("Mikrofon hat nicht funktioniert. Bitte schreibe das Verb.");recognition.onnomatch=()=>openWrite("Nichts erkannt. Bitte schreibe das Verb.");recognition.onend=()=>{recognition=null};recognition.start()}catch(e){openWrite("Mikrofon konnte nicht gestartet werden. Bitte schreibe das Verb.")}}
function renderFinish(group){app.innerHTML=`<section class="fi-card sp-card-task"><div class="sp-finish-box"><div class="sp-finish-icon">✓</div><h2>Gut gemacht!</h2><p>Du hast alle ${group.verbs.length} Karteikarten in Gruppe ${group.id} richtig gesprochen oder geschrieben.</p><div class="sp-card-actions"><button class="btn" id="backGroups">Zu den Aufgaben</button><button class="btn secondary" id="repeatCards">Karteikarten wiederholen</button></div></div></section>`;document.querySelector("#backGroups").addEventListener("click",renderGroups);document.querySelector("#repeatCards").addEventListener("click",()=>{if(role!=="teacher")localStorage.removeItem(progressKey(group.id));startCards(group.id)})}

document.querySelector("#homeBtn").addEventListener("click",renderGroups);document.querySelector("#overviewBtn").addEventListener("click",renderOverview);renderGroups();
</script>
<script src="/js/sp-language-switch.js?v=finnisch-basis-1"></script>
<script defer src="/js/performance-boot.js?v=20260709b"></script>
<script src="/shared/sprachpilot-design-system.js"></script>
</body>
</html>
