<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verben · SprachPilot</title>
<link rel="stylesheet" href="/style.css?v=verben-bereich2">
<style>
  .verb-hub-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .verb-hub-head .actions{margin:0}
  .verb-hub-note{margin:8px 0 0;color:#5f7180}
  .modules{margin-top:18px}
  .module-title{font-size:22px}
  .module .module-icon{font-size:42px;line-height:1;margin-bottom:12px}
</style>
</head>
<body>
<div id="accountStrip" class="account-strip"></div>
<div class="container">
  <section class="hero">
    <a class="brand-logo" href="/index.html">
      <img src="/assets/logo/sprachpilot-logo.png" alt="SprachPilot Logo">
      <h1>SprachPilot</h1>
    </a>
    <p class="subtitle">Verben lernen, Formen trainieren und das Perfekt sicher bilden.</p>
  </section>

  <section class="card">
    <div class="verb-hub-head">
      <div>
        <h2>Verben</h2>
        <p class="verb-hub-note">Wähle den passenden Lernbereich.</p>
      </div>
      <div class="actions">
        <a class="btn secondary" href="/index.html">← Startseite</a>
        <a class="btn secondary" id="dashboardLink" href="/student-dashboard/">Dashboard</a>
      </div>
    </div>
    <div class="modules" id="verbModules"></div>
  </section>
  <footer>© SprachPilot</footer>
</div>

<script type="module" src="/js/guard.js?v=verben-bereich2"></script>
<script type="module">
import { getActiveProfile, getActiveRole, dashboardHref, safeText, renderAccountStrip } from '/js/auth.js?v=login-main-4';
import { loadCourseRelease, moduleOpen } from '/js/course-releases.js?v=perfekt-start2';

const target=document.querySelector('#verbModules');
const dashboard=document.querySelector('#dashboardLink');
const role=String(getActiveRole()||'').toLowerCase();
const profile=getActiveProfile();
dashboard.href=dashboardHref();

function card(title,icon,href,description,open){
 return `<a class="module ${open?'':'locked'}" href="${open?href:'#'}" ${open?'':'onclick="return false" aria-disabled="true"'}>
   <div class="module-icon" aria-hidden="true">${safeText(icon)}</div>
   <div class="module-title">${safeText(title)}</div>
   <p>${safeText(open?description:'Für deinen Kurs noch nicht freigeschaltet.')}</p>
   <span class="badge">${open?'Öffnen':'Gesperrt'}</span>
 </a>`;
}

function render(assignments={}){
 const teacher=role==='teacher';
 const verbs=teacher||moduleOpen(assignments,'Verben');
 const irregular=teacher||moduleOpen(assignments,'Irreguläre Verben');
 const perfect=verbs;
 target.innerHTML=[
  card('Verben','Aa','/verben/','Freigegebene Verben in Gruppen lernen, konjugieren, hören, schreiben und sprechen.',verbs),
  card('Irreguläre Verben','↔','/irregulaere-verben/','Unregelmäßige Präsensformen systematisch lernen und wiederholen.',irregular),
  card('Perfekt','hat / ist','/perfekt/start.html','Perfektformen mit Partizip II sowie haben oder sein trainieren.',perfect)
 ].join('');
}

async function init(){
 if(!profile&&role!=='teacher'){
  location.href='/login/';
  return;
 }
 render(profile?.assignments||{});
 if(profile&&role!=='teacher'){
  try{render(await loadCourseRelease(profile)||profile.assignments||{})}
  catch(error){console.warn('Kursfreigaben konnten nicht geladen werden',error)}
 }
 try{renderAccountStrip()}catch(error){}
}
init();
</script>
<script src="/shared/sprachpilot-design-system.js"></script>
</body>
</html>
